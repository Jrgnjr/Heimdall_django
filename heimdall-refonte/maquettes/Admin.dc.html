<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Heimdall — Administration du stock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.app{font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45;background:var(--bg);color:var(--ink)}
.t-dark{--bg:#0c0e12;--surface:#12161c;--raised:#1a1f28;--line:#232a36;--ink:#f2f4f8;--soft:#c4c9d1;--muted:#8d94a0;--gold:#c29a62;--gold-ink:#0c0e12;--gold-soft:rgba(194,154,98,.14);--ok:#5cc595;--ok-bg:rgba(92,197,149,.12);--warn:#e8ac45;--warn-bg:rgba(232,172,69,.13);--danger:#f07575;--danger-bg:rgba(240,117,117,.12);--info:#9db3d4;--info-bg:rgba(157,179,212,.12)}
.t-light{--bg:#f5f6f8;--surface:#ffffff;--raised:#eef1f5;--line:#e1e5eb;--ink:#1a1f28;--soft:#3e4653;--muted:#646b78;--gold:#8a6638;--gold-ink:#ffffff;--gold-soft:rgba(138,102,56,.10);--ok:#1c7d52;--ok-bg:rgba(28,125,82,.10);--warn:#985b06;--warn-bg:rgba(152,91,6,.10);--danger:#b83232;--danger-bg:rgba(184,50,50,.09);--info:#44608a;--info-bg:rgba(68,96,138,.10)}
a{color:var(--gold)}a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--soft);font:inherit;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;box-sizing:border-box}
.btn:hover{background:var(--raised);color:var(--ink)}
.btn-primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:600}
.btn-primary:hover{background:var(--gold);color:var(--gold-ink);filter:brightness(1.08)}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-danger:hover{color:var(--danger);background:var(--danger-bg)}
.btn-icon{width:32px;height:32px;padding:0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tab{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;color:var(--muted);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--gold)}
.tab .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border-radius:12px;border:1px solid var(--line)}
.over{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px}
.num{font-variant-numeric:tabular-nums}
.row{display:grid;align-items:center;column-gap:16px;padding:9px 20px;border-top:1px solid var(--line)}
.row:hover{background:var(--raised)}
.row .acts{opacity:0;transition:opacity .12s}
.row:hover .acts,.row:focus-within .acts{opacity:1}
.field{position:relative;display:flex;align-items:center}
.field svg{position:absolute;left:12px;color:var(--muted);pointer-events:none}
.input{height:38px;width:100%;box-sizing:border-box;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px 0 38px;font:inherit;font-size:13.5px}
.input::placeholder{color:var(--muted)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</helmet>
<div class="app {{themeClass}}" style="display: flex; flex-wrap: wrap; min-height: 1060px">
  <div style="flex: 1 1 232px; max-width: 260px; background: var(--surface); border-right: 1px solid var(--line)">
    <dc-import name="Sidebar" active="admin" theme="{{theme}}" hint-size="100%,1060px"></dc-import>
  </div>

  <main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px 40px; box-sizing: border-box">
    <div style="max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">

      <header>
        <h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.015em">Administration du stock</h1>
        <p style="margin: 4px 0 0; color: var(--muted); font-size: 13.5px">Ajout et suppression des références, articles, modèles et comptes</p>
      </header>

      <div class="tabs" role="tablist" aria-label="Rubriques">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
          <button class="{{t.cls}}" role="tab" type="button" onClick="{{t.pick}}">{{t.name}} <span class="n">{{t.n}}</span></button>
        </sc-for>
      </div>

      <section class="card" aria-label="Téléphones" style="overflow: hidden">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 20px">
          <div style="flex: 1 1 240px">
            <h2 style="margin: 0; font-size: 15px; font-weight: 700">Téléphones</h2>
            <p style="margin: 2px 0 0; font-size: 12.5px; color: var(--muted)">Réceptionner ou supprimer une référence et ses variantes</p>
          </div>
          <button class="btn" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg>Importer XLSX</button>
          <button class="btn btn-primary" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Ajouter une référence</button>
        </div>
        <div style="padding: 0 20px 14px">
          <label class="field">
            <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rechercher</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input class="input" type="search" placeholder="Téléphone, marque ou référence…">
          </label>
        </div>
        <div style="overflow-x: auto">
          <div style="min-width: 560px">
            <div class="row over" style="grid-template-columns: minmax(0,1fr) 140px 80px 120px; padding-top: 12px; padding-bottom: 10px">
              <span>Modèle</span><span>Référence</span><span style="text-align: right">En stock</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Actions</span>
            </div>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="20">
              <div class="row" style="grid-template-columns: minmax(0,1fr) 140px 80px 120px">
                <div style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="color: var(--muted)">{{r.brand}}</span> <strong style="font-weight: 600">{{r.name}}</strong></div>
                <span class="mono" style="color: var(--soft)">{{r.ref}}</span>
                <span class="num" style="text-align: right; font-weight: 600">{{r.qty}} u.</span>
                <div class="acts" style="display: flex; justify-content: flex-end; gap: 4px">
                  <button class="btn btn-icon btn-ghost" type="button" aria-label="Modifier"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16Z"/><path d="m13.5 6.5 4 4"/></svg></button>
                  <button class="btn btn-icon btn-ghost btn-danger" type="button" aria-label="Supprimer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></svg></button>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px">
          <span style="flex: 1">20 sur 45 téléphones · page 1 sur 3</span>
          <button class="btn btn-sm" type="button">Précédent</button>
          <button class="btn btn-sm" type="button">Suivant</button>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Sombre","Clair"],"default":"Sombre"},"$preview":{"width":1440,"height":1060}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'Téléphones' };
  }
  renderVals() {
    const theme = this.props.theme ?? 'Sombre';
    const tabs = [['Téléphones', 45], ['Matériel', 47], ['Consommables', ''], ['Missions', 6], ['Modèles', ''], ['Comptes', 3]].map(([name, n]) => ({
      name, n, cls: this.state.tab === name ? 'tab on' : 'tab', pick: () => this.setState({ tab: name })
    }));
    const rows = [
      ['Apple', 'iPhone 16 Pro Max', 'A3287', 6],
      ['Apple', 'iPhone 16 Pro', 'A3286', 10],
      ['Apple', 'iPhone 16', 'A3283', 14],
      ['Apple', 'iPhone 15 Pro', 'A3212', 8],
      ['Apple', 'iPhone 15', 'A3090', 18],
      ['Apple', 'iPhone 14', 'A2882', 12],
      ['Apple', 'iPhone SE (2022)', 'A2783', 20],
      ['Samsung', 'Galaxy S24 Ultra', 'SM-S928B', 5],
      ['Samsung', 'Galaxy S24', 'SM-S921B', 11],
      ['Samsung', 'Galaxy S23', 'SM-S911B', 9],
      ['Samsung', 'Galaxy A55 5G', 'SM-A556B', 24],
      ['Samsung', 'Galaxy A35 5G', 'SM-A356B', 30],
      ['Samsung', 'Galaxy A15 5G', 'SM-A156B', 42],
      ['Samsung', 'Galaxy Tab S9 FE', 'SM-X510', 7],
      ['Samsung', 'Galaxy Z Fold5', 'SM-F946B', 3],
      ['Google', 'Pixel 9 Pro', 'GA05577', 4],
      ['Google', 'Pixel 9', 'GA05556', 8],
      ['Google', 'Pixel 8a', 'GA04528', 15],
      ['Google', 'Pixel 7a', 'GA03697', 10],
      ['Xiaomi', '14 Ultra', '23127PN0CG', 2]
    ].map(([brand, name, ref, qty]) => ({ brand, name, ref, qty }));
    return { theme, themeClass: theme === 'Clair' ? 't-light' : 't-dark', tabs, rows };
  }
}
</script>
</body>
</html>
