<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Heimdall — barre latérale</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-dark{--bg:#0c0e12;--surface:#12161c;--raised:#1a1f28;--line:#232a36;--ink:#f2f4f8;--soft:#c4c9d1;--muted:#8d94a0;--gold:#c29a62;--gold-ink:#0c0e12;--gold-soft:rgba(194,154,98,.14);--warn:#e8ac45;--warn-bg:rgba(232,172,69,.14)}
.t-light{--bg:#f5f6f8;--surface:#ffffff;--raised:#eef1f5;--line:#e1e5eb;--ink:#1a1f28;--soft:#3e4653;--muted:#646b78;--gold:#8a6638;--gold-ink:#ffffff;--gold-soft:rgba(138,102,56,.10);--warn:#985b06;--warn-bg:rgba(152,91,6,.10)}
.sb{font-family:Inter,system-ui,sans-serif}
.sb a.nav{display:flex;align-items:center;gap:12px;min-height:38px;padding:0 12px;border-radius:8px;color:var(--soft);text-decoration:none;font-size:13.5px}
.sb a.nav:hover{background:var(--raised);color:var(--ink)}
.sb a.nav svg{flex-shrink:0;color:var(--muted)}
.sb a.nav.on{background:var(--raised);color:var(--ink);font-weight:600}
.sb a.nav.on svg{color:var(--ink)}
.sb .grp{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:18px 12px 6px}
.sb .ibtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.sb .ibtn:hover{background:var(--raised);color:var(--ink)}
.sb :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</helmet>
<div class="sb {{themeClass}}" style="box-sizing: border-box; width: 100%; min-width: 220px; height: 100%; min-height: 100%; padding: 20px 12px 16px; display: flex; flex-direction: column; color: var(--ink); background: var(--surface)">
  <div style="display: flex; align-items: center; gap: 12px; padding: 0 8px 8px">
    <div role="img" aria-label="Emplacement du logo Heimdall" style="width: 38px; height: 38px; border-radius: 10px; background: var(--gold-soft); border: 1px dashed var(--gold); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--gold); flex-shrink: 0">LOGO</div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 16px; font-weight: 700; letter-spacing: -0.01em">Heimdall</span>
      <span style="font-size: 10.5px; font-weight: 500; letter-spacing: .16em; color: var(--muted)">GESTION DE STOCK</span>
    </div>
  </div>

  <nav aria-label="Navigation principale" style="display: flex; flex-direction: column; gap: 2px">
    <div class="grp">Inventaire</div>
    <a class="{{c.stock}}" href="Main.dc.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3.5H6.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2H9"/><rect x="10" y="5.5" width="9.5" height="15" rx="2"/><path style="stroke:var(--gold)" d="M13.5 17.5h2.5"/></svg><span>Stock de téléphone</span></a>
    <a class="{{c.plan}}" href="Plan.dc.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="16.5" rx="2"/><path d="M12 3v16.5M4 9h16M4 14h16M6.5 19.5V21M17.5 19.5V21"/><rect style="stroke:var(--gold);fill:var(--gold)" x="14.25" y="10.75" width="3.5" height="1.5" rx=".5"/></svg><span>Plan de l'armoire</span></a>
    <a class="{{c.materiel}}" href="Materiel.dc.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3v18M20 3v18M4 12h16M4 20h16"/><rect x="6.5" y="6" width="5" height="6" rx=".75"/><rect style="stroke:var(--gold)" x="13" y="15" width="5" height="5" rx=".75"/><rect x="6.5" y="15.5" width="4.5" height="4.5" rx=".75"/></svg><span>Stock de matériel</span></a>
    <a class="nav" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.1 10.3a1.5 1.5 0 0 0 1.5 1.2h8.5a1.5 1.5 0 0 0 1.5-1.2L20.5 8H5.8"/><circle cx="9" cy="19.5" r="1.25"/><circle cx="17" cy="19.5" r="1.25"/><path style="stroke:var(--gold)" d="M13 9.5v3.5M11.25 11.25h3.5"/></svg><span style="flex: 1">À recommander</span><span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: var(--warn-bg); color: var(--warn); font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">1</span></a>

    <div class="grp">Activité</div>
    <a class="{{c.missions}}" href="Missions.dc.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2"/><path d="M8 18h6.5a3 3 0 0 0 0-6h-5a3 3 0 0 1 0-6H13"/><path style="stroke:var(--gold)" d="M18 10.5S15 7.8 15 5.5a3 3 0 0 1 6 0c0 2.3-3 5-3 5Z"/><circle style="fill:var(--gold);stroke:none" cx="18" cy="5.5" r="1"/></svg><span>Missions en cours</span></a>
    <a class="nav" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle style="stroke:var(--gold)" cx="12" cy="8" r="3"/><path style="stroke:var(--gold)" d="M6.5 19.5a5.5 5.5 0 0 1 11 0"/><circle cx="5.5" cy="9.5" r="2.25"/><path d="M2.5 18a3.5 3.5 0 0 1 3.75-3.5"/><circle cx="18.5" cy="9.5" r="2.25"/><path d="M21.5 18a3.5 3.5 0 0 0-3.75-3.5"/></svg><span>Mon groupe</span></a>
    <a class="{{c.journal}}" href="Journal.dc.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 3v18"/><path style="stroke:var(--gold)" d="M11.5 8h4.5M11.5 11.5h4.5"/><path d="M11.5 15h3"/></svg><span>Journal</span></a>

    <div class="grp">Moi</div>
    <a class="{{c.profil}}" href="Profil.dc.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle style="stroke:var(--gold)" cx="12" cy="10" r="3"/><path style="stroke:var(--gold)" d="M6.6 18.2a6 6 0 0 1 10.8 0"/></svg><span>Mon profil</span></a>
    <a class="nav" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6V4.5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1V6"/><rect x="5" y="6" width="14" height="15" rx="3"/><path d="M5 11h14"/><rect style="stroke:var(--gold)" x="8.5" y="14" width="7" height="4" rx="1"/></svg><span>Mon matériel</span></a>

    <div class="grp">Gestion</div>
    <a class="{{c.admin}}" href="Admin.dc.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.9 10.31 20.9 10.66 20.9 13.34 18.9 13.69 18.07 15.68 19.24 17.34 17.34 19.24 15.68 18.07 13.69 18.9 13.34 20.9 10.66 20.9 10.31 18.9 8.32 18.07 6.66 19.24 4.76 17.34 5.93 15.68 5.1 13.69 3.1 13.34 3.1 10.66 5.1 10.31 5.93 8.32 4.76 6.66 6.66 4.76 8.32 5.93 10.31 5.1 10.66 3.1 13.34 3.1 13.69 5.1 15.68 5.93 17.34 4.76 19.24 6.66 18.07 8.32Z"/><circle style="stroke:var(--gold)" cx="12" cy="12" r="3"/></svg><span>Administration</span></a>
  </nav>

  <div style="margin-top: auto; padding-top: 24px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; background: var(--raised)">
      <div style="position: relative; flex-shrink: 0">
        <div style="width: 34px; height: 34px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">AD</div>
        <span aria-label="1 notification" style="position: absolute; top: -3px; right: -3px; width: 16px; height: 16px; border-radius: 999px; background: var(--warn); color: var(--gold-ink); font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid var(--raised)">1</span>
      </div>
      <div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
        <span style="font-size: 13px; font-weight: 600">Admin</span>
        <span style="font-size: 11.5px; color: var(--muted)">Administrateur</span>
      </div>
      <button class="ibtn" type="button" aria-label="Se déconnecter" title="Se déconnecter"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5H6.5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2H10"/><path style="stroke:var(--gold)" d="M15 8l4 4-4 4M19 12H9.5"/></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["stock","plan","materiel","missions","journal","profil","admin"],"default":"stock"},"theme":{"editor":"enum","options":["Sombre","Clair"],"default":"Sombre"},"$preview":{"width":240,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'stock';
    const keys = ['stock', 'plan', 'materiel', 'missions', 'journal', 'profil', 'admin'];
    const c = {};
    keys.forEach((k) => { c[k] = k === active ? 'nav on' : 'nav'; });
    return { c, themeClass: (this.props.theme ?? 'Sombre') === 'Clair' ? 't-light' : 't-dark' };
  }
}
</script>
</body>
</html>
