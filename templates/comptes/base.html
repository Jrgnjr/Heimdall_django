{% load static %}<!doctype html>
<html lang="fr" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<script>(function(){var h=document.documentElement;if(h.dataset.theme==="auto"){h.dataset.theme=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";}})();</script>
<title>{% block titre %}Heimdall{% endblock %}</title>
<link rel="icon" href="{% static 'stock/heimdall.ico' %}">
<link rel="stylesheet" href="{% static 'stock/fonts/polices.css' %}">
<link rel="stylesheet" href="{% static 'stock/charte.css' %}">
<style>
/* Mêmes jetons, même typographie que l'application (charte.css) : arriver sur l'écran de
   connexion ne doit pas donner l'impression de changer de logiciel. */
*{ box-sizing:border-box }
body{ margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      background:var(--bg); color:var(--ink);
      font:400 14px/1.45 Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased }
a{ color:var(--gold); text-decoration:none } a:hover{ color:var(--ink) }
.carte{ width:100%; max-width:400px; background:var(--surface);
        border:1px solid var(--line); border-radius:12px; padding:28px 26px }
.marque{ display:flex; align-items:center; gap:12px; margin-bottom:24px }
.marque img{ width:34px; height:42px; object-fit:contain }
.marque b{ display:block; font-size:16px; font-weight:700; letter-spacing:-.01em }
.marque span{ display:block; font-size:10.5px; font-weight:500; color:var(--muted);
              letter-spacing:.16em; margin-top:3px }
h1{ margin:0 0 4px; font-size:20px; font-weight:700; letter-spacing:-.015em }
.sous{ margin:0 0 20px; font-size:13.5px; color:var(--muted) }
label{ display:block; font-size:12.5px; font-weight:600; color:var(--soft); margin-bottom:6px }
input[type=text],input[type=password]{ width:100%; height:40px; padding:0 12px;
  background:var(--bg); border:1px solid var(--line); border-radius:8px;
  color:var(--ink); font:400 14px Inter,system-ui,sans-serif }
input::placeholder{ color:var(--muted) }
input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft) }
.champ{ margin-bottom:16px }
button{ width:100%; height:40px; padding:0 14px; background:var(--gold);
        border:1px solid var(--gold); border-radius:8px; color:var(--gold-ink);
        font:600 14px Inter,system-ui,sans-serif; cursor:pointer }
button:hover{ filter:brightness(1.08) }
.erreurs{ margin:0 0 16px; padding:11px 14px; border-radius:8px;
  background:var(--danger-bg); color:var(--danger);
  font-size:13px; line-height:1.45; list-style:none }
.erreurs li + li{ margin-top:5px }
.info{ margin:0 0 16px; padding:11px 14px; border-radius:8px;
  background:var(--info-bg); color:var(--info); font-size:13px; line-height:1.45 }
.aide{ margin:10px 0 0; font-size:12.5px; line-height:1.5; color:var(--muted) }
.aide ul{ margin:6px 0 0; padding-left:18px }
</style>
</head>
<body>
<div class="carte">
  <div class="marque">
    <img src="{% static 'stock/heimdall.png' %}" alt="">
    <div><b>Heimdall</b><span>GESTION DE STOCK</span></div>
  </div>
  {% if messages %}{% for message in messages %}
    <p class="info">{{ message }}</p>
  {% endfor %}{% endif %}
  {% block contenu %}{% endblock %}
</div>
</body>
</html>
