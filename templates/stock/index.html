/* ---------- préparer une mission : malettes | matériel | mission ----------
   Trois colonnes pour composer un départ d'un seul regard : les malettes à gauche, les
   articles au milieu, et à droite la mission avec ce qui y part. Le panier est celui de
   « Réserver la sélection » (`demandePanier`, `manquesPanier`) et part par la même action
   serveur : tout sort, ou rien. */
function prepVide(){
  const noms = missionNamesEmpruntables();
  // `eq` : l'équipe de chaque ligne du panier (clé « a:<article> » ou « p:<malette> »), vide
  // pour « toute la mission » ; `active` : l'équipe qui reçoit ce qu'on ajoute ensuite.
  return { mission:noms[0]||"", commentaire:"", qtys:{}, packs:[], eq:{}, active:"" };
}
/* « + Nouvelle mission » : la carte de création s'ouvre sur la page des missions. */
function ouvrirNouvelleMission(){
  setT({page:"missions", creationMission:true, missionFormOuvert:false});
}
function basculerPreparation(){
  if(S.prepMode) return setT({prepMode:false});
  // La sélection déjà cochée dans le tableau sert de point de départ.
  const prep = S.prep || prepVide();
  prep.nouvelle = false;
  Object.keys(S.matSel).forEach(n=>{ if(!(n in prep.qtys)) prep.qtys[n] = 1; });
  Object.keys(S.packSel).forEach(nom=>{
    const pk = S.packs.find(x=>x.name===nom);
    if(pk && packDisponible(pk) && !prep.packs.includes(nom)) prep.packs.push(nom);
  });
  setT({prepMode:true, prep});
}
async function confirmerPreparation(){
  const b = S.prep; if(!b) return;
  const equipeDe = cle => (b.eq && b.eq[cle]) || "";   // déjà ramené à l'équipe imposée par la page
  const lignes = Object.keys(b.qtys).map(nm=>({ nom:nm, qty:Math.max(1, Number(b.qtys[nm])||1), equipe:equipeDe("a:"+nm) }));
  const packsEnvoyes = (b.packs||[]).map(nom=>({ nom, equipe:equipeDe("p:"+nom) }));
  if(S.creationMission && peutCreerMission()){
    // Le chef crée la mission et ses équipes ; chaque équipier prépare ensuite son matériel.
    const n = (S._mName||"").trim(); if(!n) return;
    const gestion = S._mGestion || [OPERATOR];
    const equipes = S._mEquipes.map(e=>({ nom:e.nom, membres:e.membres.slice() }));
    if(!(await agir("mission.creer", { nom:n, date:S._mDate||"", template:S._mTemplate||"",
                                       choix:S._mChoix, gestionnaires:gestion, equipes }))) return;
    const demandes = S._mDemandes;
    setT({ prep:prepVide(), matSel:{}, packSel:{}, prepMode:false, creationMission:false, page:"missions",
           _mName:"", _mDate:"", _mTemplate:"", _mChoix:{}, _mDeplie:{}, _mDemandes:[], _mGestion:null,
           _mEquipes:[], _mEquipeNom:"" });
    // Les demandes préparées partent maintenant que la mission existe.
    for(const d of demandes)
      await agir(d.forcer ? "pret.forcer" : "pret.demander",
                 {proprietaire:d.proprietaire, article:d.article, qty:d.qty, mission:n, motif:d.motif});
    return;
  }
  if(await agir("materiel.emprunt.groupe", { mission:(b.mission||"").trim(),
                                             lignes, packs:packsEnvoyes,
                                             commentaire:(b.commentaire||"").trim() })){
    const neuf = prepVide(); neuf.mission = b.mission;
    setT({ prep:neuf, matSel:{}, packSel:{} });
  }
}

function pagePreparation(creation){
  if(!S.prep) S.prep = prepVide();
  const b = S.prep;
  const t = (S.matQuery||"").trim().toLowerCase();
  const missions = missionNamesEmpruntables();
  if(!missions.includes(b.mission) && !creation) b.mission = missions[0] || "";
  // Une malette sortie ou supprimée entre-temps ne reste pas au panier.
  b.packs = b.packs.filter(nom=>{ const pk = S.packs.find(x=>x.name===nom); return pk && packDisponible(pk); });
  Object.keys(b.qtys).forEach(id=>{ if(!S.materiel.some(m=>(m.id||m.name)===id)) delete b.qtys[id]; });
  // Les équipes qui peuvent recevoir du matériel : celles qu'on est en train de créer, ou
  // celles de la mission choisie. Une équipe disparue renvoie ses lignes à « toute la mission ».
  const nouvelleMission = !!creation && peutCreerMission();
  const equipesMission = nouvelleMission ? [] : equipesDe((b.mission||"").trim());
  const equipesDispo = nouvelleMission ? S._mEquipes.map(e=>e.nom) : equipesMission.map(e=>e.nom);
  // Un simple équipier prépare pour **son** équipe : le matériel y va d'office, sans qu'il ait à
  // choisir. Les gestionnaires, les chefs de groupe et les administrateurs, eux, répartissent
  // entre toutes les équipes. Dans plusieurs équipes, la plus récente sert de défaut.
  const moiPrep = auteurEffectif();
  const mesEquipes = equipesMission.filter(e=>(e.membres||[]).includes(moiPrep)).map(e=>e.nom);
  const gereMissionPrep = !nouvelleMission && (peutGererMission((b.mission||"").trim()) || estChefDeGroupe());
  const restreint = !nouvelleMission && !gereMissionPrep && mesEquipes.length>0;
  const choixEquipes = restreint ? mesEquipes : equipesDispo;
  const equipeParDefaut = mesEquipes.length ? mesEquipes[mesEquipes.length-1] : "";
  const valide = v => choixEquipes.includes(v) || (!restreint && v==="");
  if(!b.eq) b.eq = {};
  Object.keys(b.eq).forEach(cle=>{ if(!valide(b.eq[cle])) b.eq[cle] = equipeParDefaut; });
  if(!valide(b.active)) b.active = equipeParDefaut;
  const equipeDe = cle => (cle in b.eq ? b.eq[cle] : equipeParDefaut) || "";

  const attribues = new Set(Object.values(S.dotations).flat().map(d=>d.article));
  const catalogue = S.materiel.filter(m=>!attribues.has(m.name));
  const articles = catalogue.filter(m=>!t
    || (m.name+" "+m.cat+" "+(m.etiquette||"")+" "+(m.numeroSerie||"")).toLowerCase().includes(t));
  const packs = S.packs.filter(x=>!t
    || (x.name+" "+(x.etiquette||"")+" "+x.owner+" "+x.items.map(i=>i.libelle).join(" ")).toLowerCase().includes(t));

  const demande = demandePanier(b);
  const manques = manquesPanier(b);
  const nbPanier = b.packs.length + Object.keys(b.qtys).length;
  const nouvelle = !!creation && peutCreerMission();
  const gestionCreation = S._mGestion || [OPERATOR];
  const modele = S.templates.find(t=>t.name===S._mTemplate) || null;
  const creable = !!(S._mName||"").trim() && templateCreable(modele) && gestionCreation.length>0;
  const bloque = manques.length>0 || (nouvelle ? !creable : (!nbPanier || !b.mission));

  const colonne = (titre, compte, contenu, pied)=>`
    <section class="card" aria-label="${esc(titre)}" style="display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden">
      <div class="chead" style="flex:none"><h2>${esc(titre)}</h2>${compte!==null?`<span class="count">${compte}</span>`:""}</div>
      <div style="flex:1;min-height:0;overflow:auto">${contenu}</div>
      ${pied?`<div style="flex:none;border-top:1px solid var(--line)">${pied}</div>`:""}
    </section>`;
  const vide = txt=>`<div class="item" style="color:var(--muted);font-size:13px">${txt}</div>`;

  // --- colonne de gauche : les malettes
  const lignePack = pk=>{
    const etat = packEtat(pk), dispo = packDisponible(pk), dedans = b.packs.includes(pk.name);
    const badge = etat==="sorti" ? '<span class="badge b-warn">Dehors</span>'
      : etat==="partiel" ? '<span class="badge b-danger">Incomplète</span>'
      : !dispo ? '<span class="badge b-danger">Incomplète</span>' : '<span class="badge b-ok">Rangée</span>';
    const raison = etat==="sorti" ? "Cette malette est dehors" : etat==="partiel" ? "Il manque des pièces" : !dispo ? "Stock insuffisant pour la sortir entière" : "";
    return `
      <div class="item" style="display:flex;align-items:center;gap:10px${dedans?";background:var(--gold-soft)":""}">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px"><strong style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(pk.name)}">${esc(pk.name)}</strong>${badge}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(pk.items.map(i=>i.qty+" × "+i.libelle).join(" · "))}">${esc(pk.items.map(i=>i.qty+" × "+i.libelle).join(" · ")||"Malette vide")}</div>
        </div>
        ${dedans
          ? `<button class="btn btn-sm" type="button" ${on(()=>{ b.packs = b.packs.filter(x=>x!==pk.name); delete b.eq["p:"+pk.name]; render(); })}>Retirer</button>`
          : `<button class="btn btn-sm btn-primary${dispo?"":" off"}" type="button" ${dispo?"":`disabled title="${esc(raison)}"`} ${on(()=>{ if(dispo){ b.packs.push(pk.name); b.eq["p:"+pk.name] = b.active||""; render(); } })}>Ajouter</button>`}
      </div>`;
  };

  // --- colonne du milieu : les articles, par catégorie
  const AFFICHES = 150;
  let cat = null;
  const ligneArticle = m=>{
    const id = m.id||m.name, dispo = matAvailable(id), dedans = id in b.qtys;
    const detail = exemplaireDetail(m);
    const bandeau = m.cat!==cat ? (cat = m.cat, `<div class="ghead"><span class="over" style="color:var(--soft)">${esc(m.cat)}</span></div>`) : "";
    return bandeau + `
      <div class="item" style="display:flex;align-items:center;gap:10px${dedans?";background:var(--gold-soft)":""}">
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.name)}</div>
          ${detail?`<div class="mono" style="font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(detail)}</div>`:""}
        </div>
        <span class="num" style="font-size:12px;white-space:nowrap;color:${dispo>0?"var(--muted)":"var(--danger)"}">disp. ${dispo}</span>
        ${dedans
          ? `<button class="btn btn-sm" type="button" ${on(()=>{ delete b.qtys[id]; delete b.eq["a:"+id]; render(); })}>Retirer</button>`
          : `<button class="btn btn-sm btn-primary${dispo>0?"":" off"}" type="button" ${dispo>0?"":"disabled"} ${on(()=>{ if(dispo>0){ b.qtys[id] = 1; b.eq["a:"+id] = b.active||""; render(); } })}>Ajouter</button>`}
      </div>`;
  };
  const tries = articles.slice().sort((a,c)=>a.cat.localeCompare(c.cat,"fr") || a.name.localeCompare(c.name,"fr"));

  // --- colonne de droite : la mission et ce qui part
  const deplacer = cle => choixEquipes.length > (restreint ? 1 : 0) ? `<select class="inp" aria-label="Équipe de cette ligne" data-k="peq-${esc(cle)}" style="width:auto;max-width:120px;padding:4px 6px;font-size:12px" ${ong(e=>{ b.eq[cle] = e.target.value; render(); })}>
      ${restreint ? "" : `<option value=""${!equipeDe(cle)?" selected":""}>Toute la mission</option>`}
      ${choixEquipes.map(n=>`<option value="${esc(n)}"${equipeDe(cle)===n?" selected":""}>${esc(n)}</option>`).join("")}
    </select>` : "";
  const lignePanierPack = nom=>{
    const pk = S.packs.find(x=>x.name===nom);
    return `
      <div class="item" style="display:flex;align-items:flex-start;gap:10px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;overflow-wrap:anywhere">${esc(nom)} <span class="badge b-gold">Malette</span></div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">${esc(pk.items.map(i=>i.qty+" × "+i.libelle).join(" · "))}</div>
        </div>
        ${deplacer("p:"+nom)}
        <button class="btn btn-sm btn-ghost" type="button" aria-label="Retirer la malette ${esc(nom)}" ${on(()=>{ b.packs = b.packs.filter(x=>x!==nom); delete b.eq["p:"+nom]; render(); })}>✕</button>
      </div>`;
  };
  const lignePanierArticle = id=>{
    const m = S.materiel.find(x=>(x.id||x.name)===id) || {name:id};
    const avail = matAvailable(id);
    const parPacks = (demande[id]||0) - Math.max(1, Number(b.qtys[id])||1);
    const trop = manques.includes(id);
    const unique = !!m.numeroSerie;
    return `
      <div class="item" style="display:flex;align-items:center;gap:10px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.name)}</div>
          <div style="font-size:12px;color:${trop?"var(--danger)":"var(--muted)"}">disp. ${avail}${parPacks?" · "+parPacks+" en malette":""}</div>
        </div>
        ${unique ? `<span class="num" style="font-weight:600">1 u.</span>`
          : `<input class="inp" data-k="pq-${esc(id)}" type="number" min="1" max="${Math.max(1, avail-parPacks)}" style="width:64px;padding:6px 8px;font-size:12px;${trop?"border-color:var(--danger)":""}" value="${esc(b.qtys[id])}" ${oni(e=>{ b.qtys[id]=e.target.value; render(); })}>`}
        ${deplacer("a:"+id)}
        <button class="btn btn-sm btn-ghost" type="button" aria-label="Retirer ${esc(m.name)}" ${on(()=>{ delete b.qtys[id]; delete b.eq["a:"+id]; render(); })}>✕</button>
      </div>`;
  };
  const bascule = "";
  const champsMission = nouvelle ? `
      <div><label class="lbl" for="p-name">Nom de la mission</label>
        <input class="input" id="p-name" data-k="mname" type="text" placeholder="Ex. Intervention site Nord" value="${esc(S._mName||"")}" ${oni(e=>{ S._mName=e.target.value; render(); })}></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div style="flex:1 1 130px"><label class="lbl" for="p-date">Date prévue</label>
          <input class="input" id="p-date" data-k="mdate" type="date" value="${esc(S._mDate||"")}" ${ong(e=>{ S._mDate=e.target.value; })}></div>
        ${S.templates.length ? `<div style="flex:1 1 130px"><label class="lbl" for="p-tpl">Modèle</label>
          <select class="input" id="p-tpl" data-k="mtemplate" ${ong(e=>setT({_mTemplate:e.target.value, _mChoix:{}, _mDeplie:{}}))}>
            <option value="">Sans modèle</option>
            ${S.templates.map(t=>`<option value="${esc(t.name)}"${S._mTemplate===t.name?" selected":""}>${esc(t.name)} · ${t.items.length} article${t.items.length>1?"s":""}</option>`).join("")}
          </select></div>` : ""}
      </div>
      ${modele ? apercuTemplateHtml(modele) : ""}
      <div><span class="lbl">Gestionnaires</span>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${S.annuaire.map(c=>chip(c+(c===OPERATOR?" (vous)":""), gestionCreation.includes(c), ()=>{
            const courants = S._mGestion || [OPERATOR];
            setT({_mGestion: courants.includes(c) ? courants.filter(x=>x!==c) : courants.concat([c])});
          })).join("")}
        </div>
        ${gestionCreation.length ? "" : `<p class="help" style="color:var(--danger)">Une mission a besoin d'au moins un gestionnaire.</p>`}</div>
      <div><div style="display:flex;align-items:center"><span class="lbl" style="flex:1;margin:0">Équipes</span><span class="count">${S._mEquipes.length}</span></div>
        ${S._mEquipes.map((e,i)=>{
          const dispo = S.annuaire;
          return `<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;display:flex;flex-direction:column;gap:8px;background:var(--raised)">
            <div style="display:flex;align-items:center;gap:8px"><strong style="flex:1;min-width:0;overflow-wrap:anywhere">${esc(e.nom)}</strong>
              <span style="font-size:12px;color:var(--muted)">${e.membres.filter(m=>dispo.includes(m)).length} membre${e.membres.filter(m=>dispo.includes(m)).length>1?"s":""}</span>
              <button class="btn btn-icon btn-ghost" style="width:24px;height:24px" type="button" aria-label="Retirer l'équipe ${esc(e.nom)}" ${on(()=>setT({_mEquipes:S._mEquipes.filter((_,j)=>j!==i)}))}>✕</button></div>
            <div style="display:flex;flex-wrap:wrap;gap:6px">
              ${dispo.length ? dispo.map(c=>chip(c, e.membres.includes(c), ()=>{ e.membres = e.membres.includes(c) ? e.membres.filter(x=>x!==c) : e.membres.concat([c]); render(); })).join("")
                : `<span style="font-size:12px;color:var(--muted)">Tous les comptes gèrent la mission.</span>`}
            </div></div>`;
        }).join("")}
        <div style="display:flex;gap:8px;margin-top:8px">
          <input class="input" data-k="meqnom" type="text" maxlength="200" placeholder="Nom de l'équipe (ex. Équipe terrain)" value="${esc(S._mEquipeNom||"")}" ${oni(e=>{ S._mEquipeNom=e.target.value; })}>
          <button class="btn btn-sm" type="button" ${on(()=>{
            const n = (S._mEquipeNom||"").trim(); if(!n) return;
            if(S._mEquipes.some(e=>e.nom.toLowerCase()===n.toLowerCase())){ syncNote("Une équipe s'appelle déjà « "+n+" »."); return; }
            setT({_mEquipes:S._mEquipes.concat([{nom:n, membres:[]}]), _mEquipeNom:""});
          })}>+ Ajouter</button>
        </div>
        ${S._mEquipes.length ? "" : `<p class="help">Facultatif : les équipes se créent ici, avec leurs membres, ou plus tard depuis la mission.</p>`}</div>
      <div><div style="display:flex;align-items:center"><span class="lbl" style="flex:1;margin:0">Matériel personnel à demander</span>
        <button class="btn btn-sm btn-ghost" type="button" style="color:var(--gold)" ${on(()=>ouvrirDemandePret("file", (S._mName||"").trim()||"cette mission"))}>+ Demander</button></div>
        ${S._mDemandes.length ? `<div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:8px">${S._mDemandes.map((d,i)=>`
          <span class="badge b-tag b-info" style="gap:7px;height:auto;padding:4px 8px">${d.qty} × ${esc(d.libelle)} → ${esc(d.proprietaire)}${d.forcer?" · forcé":""}
            <button class="btn btn-icon btn-ghost" style="width:20px;height:20px" aria-label="Retirer" ${on(()=>setT({_mDemandes:S._mDemandes.filter((_,j)=>j!==i)}))}>✕</button></span>`).join("")}</div>` : ""}</div>
      <div style="font-size:12.5px;color:var(--muted)">Une fois la mission créée, chaque membre d'une équipe prépare le matériel de son équipe depuis « Préparer une mission ».</div>`
    : `
      <label class="field"><span class="klabel">MISSION</span>
        <select class="inp" data-k="prepmission" ${ong(e=>{ b.mission=e.target.value; b.active=""; b.eq={}; render(); })}>
          ${missions.map(nm=>`<option value="${esc(nm)}"${nm===b.mission?" selected":""}>${nm===SANS_MISSION?"Sans mission":esc(nm)}</option>`).join("")}
        </select></label>
      <div style="font-size:12.5px;color:var(--muted)">Pris par <b style="color:var(--ink);font-weight:600">${esc(OPERATOR)}</b></div>`;
  /* L'équipe active : tout ce qu'on ajoute ensuite lui est attribué. Le panier est groupé par
     équipe, et chaque ligne peut changer de groupe — on peut toujours revenir sur ses pas. */
  const choixEquipe = restreint && mesEquipes.length===1 ? `
    <div style="padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--soft)">Le matériel que vous ajoutez part dans votre équipe : <b style="color:var(--ink);font-weight:600">${esc(mesEquipes[0])}</b>.</div>`
    : choixEquipes.length ? `
    <div style="padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px">
      <span class="klabel">LE MATÉRIEL AJOUTÉ VA À</span>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${(restreint ? choixEquipes : [""].concat(choixEquipes)).map(n=>chip(n || "Toute la mission", (b.active||"")===n, ()=>{ b.active = n; render(); })).join("")}
      </div>
    </div>` : "";
  const groupesEquipes = restreint ? choixEquipes : [""].concat(equipesDispo);
  const panierGroupe = groupesEquipes.map(nomEquipe=>{
    const packsG = b.packs.filter(n=>equipeDe("p:"+n)===nomEquipe);
    const itemsG = Object.keys(b.qtys).filter(id=>equipeDe("a:"+id)===nomEquipe);
    const unites = itemsG.reduce((n,id)=>n+Math.max(1, Number(b.qtys[id])||1), 0)
      + packsG.reduce((n,nom)=>n+((S.packs.find(x=>x.name===nom)||{items:[]}).items.reduce((t,i)=>t+i.qty,0)), 0);
    const actif = equipesDispo.length && !restreint && (b.active||"")===nomEquipe;
    if(!packsG.length && !itemsG.length && !actif) return "";
    const entete = (equipesDispo.length && !(restreint && mesEquipes.length===1)) ? `
      <div style="padding:8px 16px;display:flex;align-items:center;gap:8px;background:var(--raised);border-top:1px solid var(--line)${actif?";box-shadow:inset 3px 0 0 var(--gold)":""}">
        <span class="over" style="color:${nomEquipe?"var(--soft)":"var(--muted)"}">${nomEquipe?esc(nomEquipe):"Toute la mission"}</span>
        ${unites?`<span class="badge b-warn">${unites} u.</span>`:'<span class="badge b-neutral">Vide</span>'}
      </div>` : "";
    return entete + packsG.map(lignePanierPack).join("") + itemsG.map(lignePanierArticle).join("")
      + ((!packsG.length && !itemsG.length) ? `<div style="padding:10px 16px;font-size:13px;color:var(--muted)">Rien pour l'instant : ce que vous ajoutez ira ici.</div>` : "");
  }).join("");
  const panneauMission = `
    <div style="padding:14px 16px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)">
      ${bascule}
      ${champsMission}
    </div>
    ${choixEquipe}
    ${nbPanier ? panierGroupe
      : vide(nouvelle ? "Aucun matériel pour l'instant : la mission peut aussi être créée sans, ou avec un modèle." : "Rien n'est encore choisi : ajoutez des malettes et des articles depuis les deux autres colonnes.")}`;
  const piedMission = `
    <div style="padding:12px 16px;display:flex;flex-direction:column;gap:10px">
      <textarea class="inp" data-k="prepcomment" maxlength="500" rows="2" placeholder="Commentaire commun aux sorties (facultatif)" ${oni(e=>{ b.commentaire=e.target.value; })}>${esc(b.commentaire||"")}</textarea>
      ${manques.length ? `<span style="font-size:12px;line-height:1.35;color:var(--danger)">Stock insuffisant pour : ${esc(manques.map(matLabel).join(", "))}. Réduisez la quantité, ou retirez une malette qui réclame le même article.</span>` : ""}
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-sm btn-ghost" type="button" ${nbPanier?"":"disabled"} ${on(()=>{ const m = b.mission; S.prep = prepVide(); S.prep.mission = m; S.matSel = {}; S.packSel = {}; render(); })}>Vider</button>
        <button class="btn btn-primary${bloque?" off":""}" type="button" style="margin-left:auto" ${bloque?"disabled":""} ${on(confirmerPreparation)}>${nouvelle ? "Créer la mission"+(nbPanier?" et emprunter · "+nbPanier:"") : "Emprunter"+(nbPanier?" · "+nbPanier:"")}</button>
      </div>
    </div>`;

  if(nouvelle) return `
  <div style="flex:1;min-height:0;padding:20px 32px 32px;overflow:auto">
    <section class="card" aria-label="Nouvelle mission" style="max-width:760px;margin:0 auto;display:flex;flex-direction:column">
      <div class="chead"><h2>Nouvelle mission</h2></div>
      <div style="padding:14px 16px;display:flex;flex-direction:column;gap:14px">
        ${bascule}
        ${champsMission}
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)">
        <button class="btn" type="button" ${on(()=>setT({creationMission:false}))}>Annuler</button>
        <button class="btn btn-primary${creable?"":" off"}" type="button" ${creable?"":"disabled"} ${on(confirmerPreparation)}>Créer la mission</button>
      </div>
    </section>
  </div>`;

  return `
  <div style="flex:1;min-height:0;padding:20px 32px 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));grid-auto-rows:minmax(420px,1fr);gap:16px;min-width:0;overflow:auto">
    ${colonne("Malettes", packs.length, packs.length ? packs.map(lignePack).join("") : vide(S.packs.length ? "Aucune malette ne correspond à la recherche." : "Aucune malette n'est définie."))}
    ${colonne("Matériel", articles.length, tries.length ? tries.slice(0, AFFICHES).map(ligneArticle).join("") + (tries.length>AFFICHES ? vide("Seuls les "+AFFICHES+" premiers articles sont montrés : affinez la recherche.") : "") : vide("Aucun article ne correspond à la recherche."))}
    ${colonne("Mission", nbPanier, panneauMission, piedMission)}
  </div>`;
}

function openBatch(){
  const names = missionNames();
  const qtys = {};
  Object.keys(S.matSel).forEach(n=>{ qtys[n]=1; });
  const packs = Object.keys(S.packSel)
    .filter(nom=>{ const pk = S.packs.find(x=>x.name===nom); return pk && packDisponible(pk); });
  setT({ matBatch:{ mission:names[0]||"", by:"", commentaire:"", qtys, packs } });
}

function setDim(id, field, delta){
  agir("armoire.dimension", { cabId:id, champ:field, delta });
}
async function addCabinet(){
  const avant = S.cabinets.map(c=>c.id);
  if(await agir("armoire.ajouter")){
    const nouvelle = S.cabinets.find(c=>!avant.includes(c.id));
    if(nouvelle) set({ cabinet:nouvelle.id });
  }
}
async function removeCabinet(id){
  if(await agir("armoire.supprimer", { cabId:id })){
    if(S.cabinet===id && S.cabinets.length) set({ cabinet:S.cabinets[0].id });
  }
}

/* ---------- délégation d'événements ---------- */
const appEl = document.getElementById("app");
appEl.addEventListener("click", e=>{
  const t = e.target.closest("[data-c]");
  if(!t || !appEl.contains(t)) return;
  const fn = H[+t.dataset.c];
  if(fn) fn(e);
});
appEl.addEventListener("input", e=>{
  const t = e.target;
  if(t.dataset && t.dataset.i!==undefined){ const fn=H[+t.dataset.i]; if(fn) fn(e); }
});
appEl.addEventListener("change", e=>{
  const t = e.target;
  if(t.dataset && t.dataset.g!==undefined){ const fn=H[+t.dataset.g]; if(fn) fn(e); }
});

/* ---------- démarrage ---------- */
async function boot(){
  S = seed();

  /* Glisser-déposer des widgets du profil. Les écouteurs sont posés une fois
     sur le conteneur : `render()` remplace son contenu, eux restent. */
  let glisse = null;
  appEl.addEventListener("dragstart", e=>{
    const w = e.target.closest ? e.target.closest("[data-widget]") : null;
    if(!w || !S.profilEdition) return;
    glisse = w.dataset.widget;
    e.dataTransfer.effectAllowed = "move";
    try{ e.dataTransfer.setData("text/plain", glisse); }catch(err){}
  });
  appEl.addEventListener("dragover", e=>{
    if(glisse && e.target.closest && e.target.closest("[data-widget]")) e.preventDefault();
  });
  appEl.addEventListener("drop", e=>{
    const cible = e.target.closest ? e.target.closest("[data-widget]") : null;
    if(!glisse || !cible) return;
    e.preventDefault();
    widgetPlacerA(glisse, cible.dataset.widget);
    glisse = null;
  });
  appEl.addEventListener("dragend", ()=>{ glisse = null; });

  if(!SERVER){
    // Fichier ouvert en double-clic, sans serveur. Les règles métier vivent
    // désormais côté serveur : il n'y a plus rien à faire tourner seul.
    appEl.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;text-align:center;'
      + 'color:var(--c-9aa2af);font:400 13px/1.6 Inter,system-ui,sans-serif;padding:24px">'
      + '<div><b style="color:var(--c-e7e9ee);font-size:15px">Heimdall ne s\'ouvre plus directement</b><br><br>'
      + 'Ouvrez l\'adresse du serveur dans votre navigateur,<br>'
      + 'par exemple <code>http://192.168.x.x:8750</code>.<br><br>'
      + '<span style="color:var(--c-6d7480)">L\'adresse exacte est affichée dans la fenêtre du serveur.</span></div></div>';
    return;
  }

  appEl.innerHTML = '<div class="demarrage" role="status"><span class="rotation" aria-hidden="true"></span>Connexion au serveur…</div>';
  try{
    const res = await fetch("api/state");
    if(sessionPerdue(res)) return;
    if(!res.ok) throw 0;
    const d = await res.json();
    if(d.user) OPERATOR = d.user;
    if(d.admin!==undefined) ADMIN = !!d.admin;
    if(d.comptes) COMPTES = d.comptes;
    // Le rôle, le groupe, les sacs… : dès le premier affichage, pas au premier sondage.
    appliquerEnveloppe(d);
    // Les réglages du compte, puis la page d'accueil : le profil.
    appliquerReglages(d.reglages);
    S.page = pageDeLOnglet(OPERATOR);
    if(d.state || d.delta){
      adopt(d);
    } else {
      // Base vierge : le serveur n'a encore rien. On affiche l'application
      // vide, les premières saisies la rempliront.
      version = d.version || 0;
      render();
    }
  }catch(e){
    console.warn("[sync] connexion initiale échouée :", e);
    online = false;
    render();    // la boucle de synchronisation réessaiera automatiquement
  }
  setInterval(pull, 2500);
}
boot();
</script>
