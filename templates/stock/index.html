          ${!ongletDotation && reserves.length ? `
          <div class="field">
            <span class="klabel">TÉLÉPHONES RÉSERVÉS · ${reserves.length}</span>
            <div class="stack">${reservesHtml}</div>
            <span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-6d7480)">Réservé n'est pas sorti : l'appareil est toujours en casier.</span>
          </div>` : ""}
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({possessions:false}))}>Fermer</button>
        </div>
      </div>
    </div>`;
  }

  if(S.fiche && ADMIN) modals += ficheCompte(S.fiche);
  if(S.groupeEdit && ADMIN) modals += ficheGroupe(S.groupeEdit);
  if(S.compteNouveau && ADMIN) modals += ficheNouveauCompte(S.compteNouveau);
  if(S.sacMembre && S.page==="groupe") modals += fenetreSacMembre(S.sacMembre);

  /* Modifier un article. */
  if(S.matEdit && ADMIN){
    const f = S.matEdit;
    const cats = Array.from(new Set(CATEGORIES_MATERIEL.concat(S.materiel.map(x=>x.cat))));
    const dongle = (f.cat||"").trim()===CATEGORIE_DONGLE;
    modals += `
    <div class="modal-back" ${on(e=>{ if(e.target.classList.contains("modal-back")) setT({matEdit:null}); })}>
      <div class="modal" role="dialog" aria-modal="true" style="width:520px;max-height:92vh">
        <div class="modal-head">
          <span class="modal-title">Modifier l'article</span>
          <span class="modal-sub">${esc(f.id)}</span>
        </div>
        <div class="modal-body" style="overflow:auto">
          <label class="field"><span class="klabel">NOM</span>
            <input class="inp" data-k="me-nom" maxlength="200" value="${esc(f.nom)}" ${oni(e=>{ f.nom=e.target.value; })}>
            ${f.famille>1 ? `<span style="font:400 12px/1.4 Inter,system-ui,sans-serif;color:var(--muted)">Le nom et la catégorie s'appliquent aux ${f.famille} exemplaires qui portent ce nom.</span>` : ""}</label>
          <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px">
            <label class="field"><span class="klabel">CATÉGORIE</span>
              <input class="inp" data-k="me-cat" list="me-cats" maxlength="80" value="${esc(f.cat)}" ${oni(e=>{ f.cat=e.target.value; render(); })}>
              <datalist id="me-cats">${cats.map(c=>`<option value="${esc(c)}"></option>`).join("")}</datalist></label>
            <label class="field"><span class="klabel">AFFECTATION</span>
              <select class="inp" data-k="me-aff" ${ong(e=>{ f.affectation=e.target.value; })}>
                ${AFFECTATIONS.map(a=>`<option value="${esc(a)}"${a===f.affectation?" selected":""}>${esc(a)}</option>`).join("")}
              </select></label>
          </div>
          <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px">
            <label class="field"><span class="klabel">ÉTIQUETTE</span>
              <input class="inp" data-k="me-etq" maxlength="200" value="${esc(f.etiquette)}" ${oni(e=>{ f.etiquette=e.target.value; })}></label>
            <label class="field"><span class="klabel">NUMÉRO DE SÉRIE</span>
              <input class="inp" data-k="me-serie" maxlength="200" value="${esc(f.numeroSerie)}" ${oni(e=>{ f.numeroSerie=e.target.value; })}></label>
          </div>
          ${dongle ? `<label class="field"><span class="klabel">FIN DE LICENCE <span style="color:var(--muted);font-weight:400;letter-spacing:0">(facultatif)</span></span>
            <input class="inp" data-k="me-lic" type="date" value="${esc(f.licence)}" ${oni(e=>{ f.licence=e.target.value; })}></label>` : ""}
          <span style="font:400 12px/1.4 Inter,system-ui,sans-serif;color:var(--muted)">La quantité se règle dans le tableau, et les mouvements passés gardent le nom qu'avait l'article ce jour-là.</span>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" ${on(()=>setT({matEdit:null}))}>Annuler</button>
          <button class="btn-pri${(f.nom||"").trim()?"":" off"}" ${on(confirmMatEdit)}>Enregistrer</button>
        </div>
      </div>
    </div>`;
  }

  /* Fiche d'une pièce détachée : ses informations, et les modèles auxquels elle convient. */
  if(S.pieceForm){
    const f = S.pieceForm;
    const recherche = (f.recherche||"").trim().toLowerCase();
    const modeles = S.refs.filter(r=>!recherche || (r.brand+" "+r.model+" "+(r.mpn||"")).toLowerCase().includes(recherche));
    const listeModeles = modeles.map(r=>{
      const coche = f.modeles.includes(r.id);
      return `<button type="button" role="checkbox" aria-checked="${coche}" ${on(()=>{ f.modeles = coche ? f.modeles.filter(x=>x!==r.id) : f.modeles.concat([r.id]); render(); })}
        style="width:100%;padding:8px 11px;background:${coche?"var(--gold-soft)":"transparent"};border:0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;color:var(--ink)">
        <span style="width:16px;height:16px;flex:none;border-radius:4px;display:grid;place-items:center;font:700 12px/1 Inter,system-ui,sans-serif;${coche?"background:var(--gold);border:1px solid var(--gold);color:var(--gold-ink)":"border:1px solid var(--muted)"}">${coche?"✓":""}</span>
        <span style="flex:1;min-width:0"><span style="display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.brand+" "+r.model)}</span>
          ${r.mpn?`<span class="mono" style="display:block;font-size:12px;color:var(--muted)">${esc(r.mpn)}</span>`:""}</span>
      </button>`;
    }).join("");
    const types = Array.from(new Set([...TYPES_PIECES, ...S.pieces.map(x=>x.type)]));
    modals += `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true" style="width:560px;max-height:92vh">
        <div class="modal-head">
          <span class="modal-title">${f.id?"Modifier la pièce":"Nouvelle pièce détachée"}</span>
          <span class="modal-sub">${f.id?"Les entrées et les sorties se font depuis la liste.":"Référencez la pièce et les modèles de téléphone auxquels elle convient."}</span>
        </div>
        <div class="modal-body" style="overflow:auto">
          <label class="field"><span class="klabel">NOM</span>
            <input class="inp" data-k="pcnom" maxlength="200" placeholder="Écran OLED Galaxy S24" value="${esc(f.nom)}" ${oni(e=>{ f.nom=e.target.value; render(); })}></label>
          <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px">
            <label class="field"><span class="klabel">TYPE</span>
              <input class="inp" data-k="pctype" list="pc-types" maxlength="80" value="${esc(f.type)}" ${oni(e=>{ f.type=e.target.value; })}>
              <datalist id="pc-types">${types.map(ty=>`<option value="${esc(ty)}"></option>`).join("")}</datalist></label>
            <label class="field"><span class="klabel">RÉF. FABRICANT <span style="color:var(--muted);font-weight:400;letter-spacing:0">(facultatif)</span></span>
              <input class="inp" data-k="pcmpn" maxlength="120" value="${esc(f.mpn)}" ${oni(e=>{ f.mpn=e.target.value; })}></label>
          </div>
          ${f.id ? "" : `<label class="field"><span class="klabel">QUANTITÉ EN STOCK</span>
            <input class="inp" data-k="pcqty" type="number" min="0" value="${esc(String(f.qty))}" ${oni(e=>{ f.qty=e.target.value; })}></label>`}
          <label class="field"><span class="klabel">NOTES <span style="color:var(--muted);font-weight:400;letter-spacing:0">(facultatif)</span></span>
            <input class="inp" data-k="pcnotes" maxlength="300" placeholder="Fournisseur, remarque de montage…" value="${esc(f.notes)}" ${oni(e=>{ f.notes=e.target.value; })}></label>
          <div class="field" style="min-width:0">
            <div style="display:flex;align-items:center;gap:9px">
              <span class="klabel">MODÈLES COMPATIBLES · ${f.modeles.length}</span>
              <input class="inp" data-k="pcrech" style="margin-left:auto;flex:0 1 200px;min-width:110px;padding:7px 9px;font-size:12px" placeholder="Rechercher un modèle…" value="${esc(f.recherche)}" ${oni(e=>{ f.recherche=e.target.value; render(); })}>
            </div>
            <div class="stack" style="border-radius:8px;max-height:230px;overflow:auto">${listeModeles || '<div style="padding:14px 11px;font:400 12px Inter,system-ui,sans-serif;color:var(--muted)">'+(S.refs.length?"Aucun modèle ne correspond.":"Aucun modèle de téléphone n'est encore référencé.")+'</div>'}</div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" ${on(()=>setT({pieceForm:null}))}>Annuler</button>
          <button class="btn-pri${(f.nom||"").trim()?"":" off"}" ${on(enregistrerPiece)}>${f.id?"Enregistrer":"Créer la pièce"}</button>
        </div>
      </div>
    </div>`;
  }

  /* Entrée ou sortie d'une pièce. */
  if(S.pieceMvt){
    const f = S.pieceMvt;
    const piece = S.pieces.find(x=>x.id===f.id);
    if(!piece){ S.pieceMvt = null; }
    else {
      const sortie = f.genre==="sortie";
      modals += `
      <div class="modal-back" ${on(e=>{ if(e.target.classList.contains("modal-back")) setT({pieceMvt:null}); })}>
        <div class="modal" role="dialog" aria-modal="true" style="width:420px">
          <div class="modal-head">
            <span class="modal-title">${sortie?"Sortir une pièce":"Entrée de stock"}</span>
            <span class="modal-sub">${esc(piece.name)} · ${piece.qty} en stock</span>
          </div>
          <div class="modal-body">
            <label class="field"><span class="klabel">QUANTITÉ</span>
              <input class="inp" data-k="pmqty" type="number" min="1" ${sortie?'max="'+piece.qty+'"':""} value="${esc(String(f.qty))}" ${oni(e=>{ f.qty=e.target.value; })}></label>
            ${sortie ? `<label class="field"><span class="klabel">MOTIF <span style="color:var(--muted);font-weight:400;letter-spacing:0">(facultatif)</span></span>
              <input class="inp" data-k="pmmotif" maxlength="200" placeholder="Réparation du Galaxy S24 de…" value="${esc(f.motif)}" ${oni(e=>{ f.motif=e.target.value; })}></label>` : ""}
          </div>
          <div class="modal-foot">
            <button class="btn-sec" ${on(()=>setT({pieceMvt:null}))}>Annuler</button>
            <button class="btn-pri" ${on(enregistrerMouvementPiece)}>${sortie?"Sortir":"Enregistrer l'entrée"}</button>
          </div>
        </div>
      </div>`;
    }
  }

  if(S.dotationEdit){
    const f = S.dotationEdit;
    const recherche = (f.query||"").trim().toLowerCase();
    /* Le sac désigne des exemplaires, pas des libellés : la clé de l'article
       (`m.id`) est donc l'identifiant partout ici. S'en tenir à `m.name`
       confondrait les trois portables identiques, et l'écran ne pourrait plus
       dire lequel est dans quel sac. */
    const cle = m => m.id || m.name;
    const identiteDe = m => [m.etiquette?"étiquette "+m.etiquette:"", m.numeroSerie?"série "+m.numeroSerie:""]
      .filter(Boolean).join(" · ");
    const dansLeSac = new Map(f.lignes.map(l=>[l.article, l]));

    // Colonne de gauche : le catalogue, filtré par la recherche.
    const catalogue = S.materiel.filter(m=>!recherche
      || (m.name+" "+m.cat+" "+(m.etiquette||"")+" "+(m.numeroSerie||"")).toLowerCase().includes(recherche));
    const colCatalogue = catalogue.map(m=>{
      const k = cle(m);
      const ligne = dansLeSac.get(k);
      const identite = identiteDe(m);
      // Un exemplaire identifié est unique : une fois dans le sac, il n'y a plus
      // rien à ajouter.
      const complet = ligne && m.numeroSerie;
      return `<div style="display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid var(--c-1f232a)">
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font:500 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-eef0f4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.name)}</span>
          <span style="font:400 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-9aa2af);overflow-wrap:anywhere">${esc(identite||m.cat)}</span>
        </span>
        ${ligne&&!complet?`<span style="font:600 12px/1 Inter,system-ui,sans-serif;color:var(--c-8fb4ff)">×${ligne.quantite}</span>`:""}
        <button class="btn-mini ${complet?"":"hblue"}" ${complet?"disabled":""} ${on(()=>sacAjouter(k))}>${complet?"Dans le sac":"+ Ajouter"}</button>
      </div>`;
    }).join("");

    // Colonne de droite : le contenu du sac, modifiable sur place.
    const colSac = f.lignes.map(l=>{
      const k = l.article;
      const m = S.materiel.find(x=>cle(x)===l.article);
      const identite = m ? identiteDe(m) : "";
      const unique = m && m.numeroSerie;
      return `<div style="display:flex;flex-direction:column;gap:7px;padding:9px 11px;border-bottom:1px solid var(--c-1f232a)">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="font:500 12px/1.2 Inter,system-ui,sans-serif;color:${m?"var(--c-eef0f4)":"var(--c-ef8b83)"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m?m.name:l.article)}</span>
            <span style="font:400 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-9aa2af);overflow-wrap:anywhere">${esc(m?(identite||m.cat):"Article supprimé")}</span>
          </span>
          ${unique ? `<span style="font:600 12px/1 Inter,system-ui,sans-serif;color:var(--c-f0b45a)">1 u.</span>` : `
          <button class="btn-mini" aria-label="Retirer une unité" ${on(()=>sacPas(l.article,-1))}>−</button>
          <input class="inp" data-k="dot-qte-${esc(k)}" type="number" min="1" style="width:56px;padding:5px 6px;text-align:right" value="${esc(l.quantite)}" ${oni(e=>modifierLigneDotation(l.article,"quantite",e.target.value))}>
          <button class="btn-mini" aria-label="Ajouter une unité" ${on(()=>sacPas(l.article,1))}>+</button>`}
          <button class="btn-mini hred" aria-label="Retirer du sac" title="Retirer du sac" ${on(()=>sacRetirer(l.article))}>Retirer</button>
        </div>
        <input class="inp" data-k="dot-det-${esc(k)}" type="text" placeholder="Détail (facultatif)" style="padding:6px 8px;font-size:12px" value="${esc(l.detail||"")}" ${oni(e=>modifierLigneDotation(l.article,"detail",e.target.value))}>
      </div>`;
    }).join("");
    const nbSac = f.lignes.length;

    modals += `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true" style="width:1240px;max-width:100%">
        <div class="modal-head">
          <span class="modal-title">Modifier le sac</span>
          <span class="modal-sub">Dotation permanente de ${esc(f.compte)}</span>
        </div>
        <div class="modal-body">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px">
            <div class="field" style="min-width:0">
              <div style="display:flex;align-items:center;gap:9px">
                <span class="klabel">CATALOGUE · ${catalogue.length}</span>
                <input class="inp" data-k="dotationq" style="margin-left:auto;flex:0 1 220px;min-width:120px;padding:7px 9px;font-size:12px" placeholder="Rechercher un article…" value="${esc(f.query)}" ${oni(e=>{f.query=e.target.value; render();})}>
              </div>
              <div class="stack" style="border-radius:8px;height:clamp(320px,calc(100vh - 340px),780px);overflow:auto">${colCatalogue||'<div style="padding:18px 11px;color:var(--c-6d7480);font:400 12px Inter,system-ui,sans-serif">Aucun article ne correspond.</div>'}</div>
            </div>
            <div class="field" style="min-width:0">
              <div style="display:flex;align-items:center;gap:9px;min-height:30px">
                <span class="klabel">SAC DE ${esc(f.compte.toUpperCase())} · ${nbSac}</span>
              </div>
              <div class="stack" style="border-radius:8px;height:clamp(320px,calc(100vh - 340px),780px);overflow:auto;border-color:color-mix(in srgb, var(--gold) 40%, transparent)">${colSac||'<div style="padding:18px 11px;color:var(--c-6d7480);font:400 12px Inter,system-ui,sans-serif">Le sac est vide. Ajoutez du matériel depuis le catalogue.</div>'}</div>
            </div>
          </div>
          <span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-6d7480)">Retirer une ligne la sort du sac. Les articles du sac restent absents du stock commun.</span>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" ${on(()=>setT({dotationEdit:null}))}>Annuler</button>
          <button class="btn-pri" ${on(confirmerDotation)}>Enregistrer</button>
        </div>
      </div>
    </div>`;
  }

  /* Déclarer un prêt à une personne sans compte : comme pour le sac d'un effectif, le
     catalogue à gauche (avec sa recherche), ce qu'on déclare à droite. */
  if(S.pretExtForm){
    const f = S.pretExtForm;
    const recherche = (f.query||"").trim().toLowerCase();
    const cle = m => m.id || m.name;
    const identiteDe = m => [m.etiquette?"étiquette "+m.etiquette:"", m.numeroSerie?"série "+m.numeroSerie:""]
      .filter(Boolean).join(" · ");
    const miens = new Set((S.dotations[OPERATOR]||[]).map(d=>d.article));
    const choisi = S.materiel.find(m=>cle(m)===f.article) || null;

    const catalogue = S.materiel.filter(m=>!recherche
      || (m.name+" "+m.cat+" "+(m.etiquette||"")+" "+(m.numeroSerie||"")).toLowerCase().includes(recherche))
      .sort((a,b)=>(miens.has(cle(b))-miens.has(cle(a))));
    const colCatalogue = catalogue.map(m=>{
      const k = cle(m), actif = k===f.article;
      return `<div style="display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid var(--line)${actif?";background:var(--gold-soft)":""}">
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font:500 12px/1.2 Inter,system-ui,sans-serif;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.name)}</span>
          <span style="font:400 12px/1.2 Inter,system-ui,sans-serif;color:var(--soft);overflow-wrap:anywhere">${esc(identiteDe(m)||m.cat)}</span>
        </span>
        ${miens.has(k) ? `<span class="badge b-gold">Dans mon sac</span>` : ""}
        <button class="btn-mini ${actif?"":"hblue"}" ${actif?"disabled":""} ${on(()=>{ f.article = k; if(m.numeroSerie) f.qty = 1; render(); })}>${actif?"Choisi":"Choisir"}</button>
      </div>`;
    }).join("");

    const missions = S.missions.filter(m=>!m.archived).map(m=>m.name).sort((a,b)=>a.localeCompare(b,"fr"));
    const unique = choisi && choisi.numeroSerie;
    const colPret = `
      <div style="display:flex;align-items:center;gap:9px;min-height:30px"><span class="klabel">PRÊT DÉCLARÉ</span></div>
      <div class="stack" style="border-radius:8px;height:clamp(320px,calc(100vh - 340px),780px);overflow:auto;border-color:color-mix(in srgb, var(--gold) 40%, transparent)">
        <div style="padding:11px 12px;border-bottom:1px solid var(--line)">
          ${choisi ? `<span style="display:block;font:600 13px/1.25 Inter,system-ui,sans-serif;color:var(--ink);overflow-wrap:anywhere">${esc(choisi.name)}</span>
            <span style="display:block;font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--soft);margin-top:2px;overflow-wrap:anywhere">${esc(identiteDe(choisi)||choisi.cat)}</span>`
          : `<span style="font:400 12.5px/1.4 Inter,system-ui,sans-serif;color:var(--muted)">Choisissez le matériel prêté dans le catalogue.</span>`}
        </div>
        <div style="padding:12px;display:flex;flex-direction:column;gap:12px">
          <div style="display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:10px">
            <label class="field"><span class="klabel">PRÊTÉ À</span>
              <input class="inp" data-k="pxqui" maxlength="120" placeholder="Nom de la personne" value="${esc(f.emprunteur)}" ${oni(e=>{ f.emprunteur=e.target.value; })}></label>
            <label class="field"><span class="klabel">QUANTITÉ</span>
              ${unique ? `<span class="inp" style="text-align:right;color:var(--soft)">1</span>`
              : `<input class="inp" data-k="pxqte" type="number" min="1" value="${esc(String(f.qty))}" ${oni(e=>{ f.qty=e.target.value; })}>`}</label>
          </div>
          <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px">
            <label class="field"><span class="klabel">MISSION</span>
              <select class="inp" data-k="pxmis" ${ong(e=>{ f.mission=e.target.value; })}>
                <option value="${esc(SANS_MISSION)}"${f.mission===SANS_MISSION?" selected":""}>Hors mission</option>
                ${missions.map(n=>`<option value="${esc(n)}"${f.mission===n?" selected":""}>${esc(n)}</option>`).join("")}
              </select></label>
            <label class="field"><span class="klabel">À RENDRE AVANT LE</span>
              <input class="inp" data-k="pxech" type="date" min="${aujourdhui()}" value="${esc(f.echeance)}" ${oni(e=>{ f.echeance=e.target.value; })}></label>
          </div>
          <label class="field"><span class="klabel">COMMENTAIRE <span style="color:var(--muted);font-weight:400;letter-spacing:0">(facultatif)</span></span>
            <input class="inp" data-k="pxcom" maxlength="300" placeholder="Pourquoi, comment le joindre…" value="${esc(f.commentaire)}" ${oni(e=>{ f.commentaire=e.target.value; })}></label>
        </div>
      </div>`;

    modals += `
    <div class="modal-back" ${on(e=>{ if(e.target.classList.contains("modal-back")) setT({pretExtForm:null}); })}>
      <div class="modal" role="dialog" aria-modal="true" style="width:1000px;max-width:100%">
        <div class="modal-head">
          <span class="modal-title">Déclarer un prêt</span>
          <span class="modal-sub">Du matériel prêté à quelqu'un qui n'a pas de compte. Rien ne bouge dans le stock : c'est un rappel.</span>
        </div>
        <div class="modal-body">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px">
            <div class="field" style="min-width:0">
              <div style="display:flex;align-items:center;gap:9px">
                <span class="klabel">CATALOGUE · ${catalogue.length}</span>
                <input class="inp" data-k="pxrech" style="margin-left:auto;flex:0 1 220px;min-width:120px;padding:7px 9px;font-size:12px" placeholder="Rechercher un article…" value="${esc(f.query)}" ${oni(e=>{ f.query=e.target.value; render(); })}>
              </div>
              <div class="stack" style="border-radius:8px;height:clamp(320px,calc(100vh - 340px),780px);overflow:auto">${colCatalogue||'<div style="padding:18px 11px;color:var(--muted);font:400 12px Inter,system-ui,sans-serif">Aucun article ne correspond.</div>'}</div>
            </div>
            <div class="field" style="min-width:0">${colPret}</div>
          </div>
          <span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--muted)">Passée l'échéance, une alerte s'affiche sur votre profil, celui de votre chef de groupe, de votre adjoint et des administrateurs.</span>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" ${on(()=>setT({pretExtForm:null}))}>Annuler</button>
          <button class="btn-pri${choisi?'':' off'}" ${on(()=>{ if(choisi) envoyerPretExterne(); })}>Déclarer</button>
        </div>
      </div>
    </div>`;
  }

  /* Demander du matériel personnel : on cherche un type de matériel dans les sacs
     des autres, on choisit à qui le demander. Les personnes de la mission, qui
     emportent déjà leur sac, ne sont pas proposées. */
  if(S.demandePret){
    const f = S.demandePret;
    const requete = (f.query||"").trim().toLowerCase();
    const exclus = (f.mode==="direct" && f.mission!==SANS_MISSION) ? membresMission(f.mission) : new Set();
    const groupes = new Map();
    Object.keys(S.pret.sacs).sort().forEach(proprio=>{
      if(exclus.has(proprio)) return;
      S.pret.sacs[proprio].forEach(l=>{
        if(requete && !(l.libelle+" "+l.detail+" "+l.cat+" "+proprio).toLowerCase().includes(requete)) return;
        const cle = l.libelle.toLowerCase();
        const g = groupes.get(cle) || {libelle:l.libelle, lignes:[]};
        g.lignes.push(Object.assign({proprio}, l));
        groupes.set(cle, g);
      });
    });
    const liste = Array.from(groupes.values()).sort((a,b)=>a.libelle.localeCompare(b.libelle));
    const choisi = f.choix ? ligneDeSac(f.choix.proprietaire, f.choix.article) : null;
    // Forcer : le gestionnaire de la mission (ou un administrateur) peut se servir
    // dans le sac d'une personne absente, sans attendre sa réponse.
    const peutForcer = !f.choix ? false
      : peutForcerPour(f.mode==="file" ? "" : f.mission, f.choix.proprietaire)
        || (f.mode==="file" && (ADMIN || (S._mGestion || [OPERATOR]).includes(OPERATOR)));
    const missions = missionNames().filter(n=>n!==SANS_MISSION);
    modals += `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true" style="width:720px;max-width:100%">
        <div class="modal-head">
          <span class="modal-title">Demander du matériel personnel</span>
          <span class="modal-sub">Le sac appartient à la personne : elle reçoit votre demande, et accepte ou refuse.</span>
        </div>
        <div class="modal-body" style="gap:14px;padding:20px 24px">
          ${f.mode==="direct" ? `
          <label class="field">
            <span class="klabel">POUR LA MISSION</span>
            <select class="inp" data-k="dpmission" ${ong(e=>{ f.mission=e.target.value; f.choix=null; render(); })}>
              <option value="${SANS_MISSION}"${f.mission===SANS_MISSION?" selected":""}>Sans mission</option>
              ${missions.map(n=>`<option value="${esc(n)}"${f.mission===n?" selected":""}>${esc(n)}</option>`).join("")}
            </select>
          </label>` : `<div class="field"><span class="klabel">POUR LA MISSION</span><span style="font:500 12.5px Inter,system-ui,sans-serif;color:var(--c-eef0f4)">${esc(f.mission)} <span style="color:var(--c-6d7480);font-weight:400">· la demande part à la création</span></span></div>`}
          <div class="field">
            <div style="display:flex;align-items:center;gap:9px">
              <span class="klabel">MATÉRIEL DANS LES SACS · ${liste.length}</span>
              <input class="inp" data-k="dprecherche" style="margin-left:auto;flex:0 1 260px;min-width:140px;padding:7px 9px;font-size:12px" placeholder="Rechercher un type de matériel…" value="${esc(f.query)}" ${oni(e=>{f.query=e.target.value; render();})}>
            </div>
            <div class="stack" style="border-radius:8px;max-height:300px;overflow:auto">
              ${liste.length ? liste.map(g=>`
              <div style="background:var(--c-191c22)">
                <div style="padding:8px 12px 4px;font:600 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-f2f4f8)">${esc(g.libelle)} <span style="color:var(--c-6d7480);font-weight:400">· ${g.lignes.length} personne${g.lignes.length>1?"s":""}</span></div>
                ${g.lignes.map(l=>{
                  const actif = f.choix && f.choix.proprietaire===l.proprio && f.choix.article===l.article;
                  const indispo = l.disponible < 1;
                  return `<div style="padding:7px 12px;display:flex;align-items:center;gap:10px;${actif?"background:color-mix(in srgb, var(--gold) 14%, transparent)":""}${indispo?";opacity:.55":""}">
                    <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
                      <span style="font:500 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-eef0f4)">${esc(l.proprio)}</span>
                      ${l.detail?`<span style="font:400 12px/1.25 Inter,system-ui,sans-serif;color:var(--c-9aa2af);overflow-wrap:anywhere">${esc(l.detail)}</span>`:""}
                    </span>
                    <span style="font:500 12px Inter,system-ui,sans-serif;color:${indispo?"var(--c-ef8b83)":"var(--c-767d8a)"};flex:none">${indispo?"indisponible":l.disponible+" dispo."}</span>
                    <button class="btn-mini ${actif?"":"hblue"}" ${indispo?'disabled title="Déjà sorti ou prêté : rien à demander pour le moment"':""} ${on(()=>{ f.choix={proprietaire:l.proprio, article:l.article}; f.qty=1; render(); })}>${actif?"✓ Choisi":"Demander à "+esc(l.proprio)}</button>
                  </div>`;}).join("")}
              </div>`).join("") : `<div style="padding:22px 14px;background:var(--c-191c22);color:var(--c-6d7480);font:400 12px Inter,system-ui,sans-serif">${Object.keys(S.pret.sacs).length ? "Aucun matériel ne correspond à cette recherche." : "Aucun autre sac ne contient de matériel."}</div>`}
            </div>
            ${liste.length ? `<span style="font:400 12px/1.4 Inter,system-ui,sans-serif;color:var(--c-6d7480)">Les lignes grisées sont déjà sorties ou prêtées : on ne peut pas les demander pour l'instant.${exclus.size?" Les personnes de la mission, qui emportent déjà leur sac, ne sont pas proposées.":""}</span>` : ""}
          </div>
          ${choisi ? `
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;border:1px solid color-mix(in srgb, var(--gold) 40%, transparent);border-radius:10px;padding:12px;background:color-mix(in srgb, var(--gold) 7%, transparent)">
            <div style="flex:1 1 100%;font:600 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-f2f4f8)">Demande à ${esc(f.choix.proprietaire)} : ${esc(choisi.libelle)}${choisi.detail?" · "+esc(choisi.detail):""}</div>
            <label class="field" style="flex:none;width:110px"><span class="klabel">QUANTITÉ (max ${choisi.disponible})</span>
              <input class="inp" data-k="dpqty" type="number" min="1" max="${choisi.disponible}" value="${esc(f.qty)}" ${oni(e=>{f.qty=e.target.value;})}></label>
            <label class="field" style="flex:1;min-width:220px"><span class="klabel">MOTIF <span style="color:var(--c-6d7480);font-weight:400;letter-spacing:0">(facultatif)</span></span>
              <input class="inp" data-k="dpmotif" maxlength="300" placeholder="À quoi vous servira-t-il ?" value="${esc(f.motif)}" ${oni(e=>{f.motif=e.target.value;})}></label>
            ${peutForcer ? `
            <label style="flex:1 1 100%;display:flex;align-items:flex-start;gap:9px;font:500 12px/1.4 Inter,system-ui,sans-serif;color:var(--c-c3c9d3);cursor:pointer">
              <input type="checkbox" ${f.forcer?"checked":""} ${ong(e=>{ f.forcer=e.target.checked; render(); })} style="width:15px;height:15px;margin-top:1px;accent-color:var(--gold)">
              <span><b style="font-weight:600;color:var(--c-f2f4f8)">Forcer le prêt</b> — l'obtenir sans attendre la réponse de ${esc(f.choix.proprietaire)} (absent, ou sans accès à la plateforme). Il en est informé : le prêt figure dans ses prêts, marqué comme forcé par vous.</span>
            </label>` : ""}
          </div>` : ""}
        </div>
        <div class="modal-foot">
          <button class="btn-sec" ${on(()=>setT({demandePret:null}))}>Annuler</button>
          <button class="btn-pri${choisi?"":" off"}" ${on(envoyerDemandePret)}>${f.forcer&&peutForcer ? (f.mode==="file"?"Ajouter (forcé) à la création":"Forcer le prêt") : (f.mode==="file"?"Ajouter à la création":"Envoyer la demande")}</button>
        </div>
      </div>
    </div>`;
  }

  /* Réglages du compte : enregistrés sur le serveur, ils suivent la personne. */
  if(S.reglagesOuverts){
    const choix = (cle, cleP, valeurs)=>`<select class="inp" data-k="reg-${cle}" ${ong(e=>{
      const v = e.target.value;
      set({[cle]: (v==="all"||v==="auto") ? v : Number(v), [cleP]:0});
    })}>${valeurs.map(([v,libelle])=>`<option value="${v}"${String(S[cle])===String(v)?" selected":""}>${libelle}</option>`).join("")}</select>`;
    const tailleStock = [["auto","Auto (selon l'écran)"],[20,"20"],[50,"50"],["all","Tout afficher"]];
    const tailleAdmin = [[10,"10"],[20,"20"],[50,"50"],[100,"100"],["all","Tout afficher"]];
    const titreSection = (titre, premier)=>`
      <div style="display:flex;align-items:center;gap:9px;${premier?"":"margin-top:10px;padding-top:16px;border-top:1px solid var(--c-23262d)"}">
        <span style="width:3px;height:15px;border-radius:2px;background:var(--gold);flex:none"></span>
        <span style="font:700 12.5px/1 Inter,system-ui,sans-serif;letter-spacing:.1em;color:var(--c-f2f4f8)">${titre}</span>
      </div>`;
    const ligne = (titre, controle)=>`
      <label class="field" style="flex-direction:row;align-items:center;gap:12px">
        <span style="flex:1;font:500 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-c3c9d3)">${titre}</span>
        <span style="flex:none;min-width:240px">${controle}</span>
      </label>`;
    modals += `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true" style="width:760px;max-width:100%">
        <div class="modal-head">
          <span class="modal-title">Réglages</span>
          <span class="modal-sub">Enregistrés sur le compte ${esc(OPERATOR)} : retrouvés à chaque connexion, sur tous les postes.</span>
        </div>
        <div class="modal-body" style="gap:16px;padding:22px 26px">
          ${titreSection("APPARENCE", true)}
          ${ligne("Thème", `<select class="inp" data-k="reg-theme" ${ong(e=>set({theme:e.target.value}))}>
            ${[["sombre","Sombre"],["clair","Clair"],["auto","Automatique (selon le système)"]].map(([v,l])=>`<option value="${v}"${S.theme===v?" selected":""}>${l}</option>`).join("")}
          </select>`)}
          ${titreSection("SÉCURITÉ")}
          ${ligne("Mot de passe", `<a class="btn" href="mot-de-passe/" style="width:100%">Changer mon mot de passe</a>`)}
          ${ligne("En cas d'oubli", `<a class="btn" href="code-recuperation/" style="width:100%">Code de récupération</a>`)}
          <span style="font:400 12px/1.4 Inter,system-ui,sans-serif;color:var(--c-6d7480)">Le code de récupération permet de choisir un nouveau mot de passe depuis la page de connexion, si vous l'oubliez. Générez-le <b style="font-weight:600">avant</b> d'en avoir besoin, et gardez-le en lieu sûr : il ne s'affiche qu'une fois.</span>
          ${titreSection("LIGNES PAR PAGE")}
          ${ligne("Stock de téléphone", choix("stockPhonePageSize","stockPhonePage",tailleStock))}
          ${ligne("Stock de matériel", choix("stockMaterialPageSize","stockMaterialPage",tailleStock))}
          ${ADMIN ? `
          ${ligne("Administration · téléphones", choix("adminPhoneSize","adminPhonePage",tailleAdmin))}
          ${ligne("Administration · matériel", choix("adminMaterialSize","adminMaterialPage",tailleAdmin))}
          ${ligne("Administration · consommables", choix("adminConsoSize","adminConsoPage",tailleAdmin))}` : ""}
          ${titreSection("MISSIONS")}
          <label style="display:flex;align-items:center;gap:10px;font:500 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-c3c9d3);cursor:pointer">
            <input type="checkbox" ${S.showArchived?"checked":""} ${ong(e=>set({showArchived:e.target.checked}))} style="width:15px;height:15px;accent-color:var(--gold)">
            Afficher les missions archivées
          </label>
          <span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-6d7480)">Les filtres choisis dans les listes (marque, catégorie, journal) sont aussi retenus pour ce compte.</span>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" ${on(()=>{
            set({stockPhonePageSize:"auto", stockMaterialPageSize:"auto", adminPhoneSize:20, adminMaterialSize:20,
                 adminConsoSize:20, showArchived:false, brand:"Toutes", matCat:"Toutes", logFilter:"Tous",
                 stockPhonePage:0, stockMaterialPage:0});
          })}>Réinitialiser</button>
          <button class="btn-pri" ${on(()=>setT({reglagesOuverts:false}))}>Fermer</button>
        </div>
      </div>
    </div>`;
  }

  if(S.attributionEdit){
    const f = S.attributionEdit;
    modals += `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true" style="width:430px;max-width:100%">
        <div class="modal-head">
          <span class="modal-title">Attribuer au sac</span>
          <span class="modal-sub">${esc(matLabel(f.article))}${matDetail(f.article)?" · "+esc(matDetail(f.article)):""} · depuis le stock matériel</span>
        </div>
        <div class="modal-body">
          <label class="field">
            <span class="klabel">UTILISATEUR</span>
            <select class="inp" data-k="attcompte" ${ong(e=>{f.compte=e.target.value;})}>
              ${COMPTES.map(c=>`<option value="${esc(c)}"${c===f.compte?" selected":""}>${esc(c)}</option>`).join("")}
            </select>
          </label>
          <label class="field">
            <span class="klabel">QUANTITÉ À AJOUTER</span>
            <input class="inp" data-k="attqty" type="number" min="1" value="${esc(f.quantite)}" ${oni(e=>{f.quantite=e.target.value;})}>
          </label>
          <label class="field">
            <span class="klabel">DÉTAIL <span style="color:var(--c-6d7480);font-weight:400;letter-spacing:0">(facultatif)</span></span>
            <input class="inp" data-k="attdetail" placeholder="Numéro de série, emplacement…" value="${esc(f.detail)}" ${oni(e=>{f.detail=e.target.value;})}>
          </label>
          <span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-6d7480)">Le matériel attribué sera visible dans le sac de l’utilisateur, séparément de ses emprunts.</span>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" ${on(()=>setT({attributionEdit:null}))}>Annuler</button>
          <button class="btn-pri" ${on(confirmerAttribution)}>Attribuer</button>
        </div>
      </div>
    </div>`;
  }

  /* ---------- assemblage + focus ---------- */
  const app = document.getElementById("app");
  const ae = document.activeElement;
  const focusKey = ae && ae.dataset ? ae.dataset.k : null;
  let focusPos = null;
  if(focusKey){ try{ focusPos = ae.selectionStart; }catch(e){} }

  /* Composition d'une malette. Le contenu se choisit dans le catalogue du
     matériel : une ligne de pack désigne toujours un exemplaire précis, là
     où une ligne de template peut rester ouverte. */
  if(S.packEdit){
    const f = S.packEdit;
    const dejaDedans = new Set(f.lignes.map(l=>l.id));
    const recherche = (f.recherche||"").trim().toLowerCase();
    // Un article déjà rangé dans une autre malette n'est plus proposé : il ne peut pas
    // partir dans deux à la fois. La malette qu'on modifie, elle, ne se compte pas.
    const dansUneAutre = new Set(S.packs.filter(x=>x.name!==f.original).flatMap(x=>x.items.map(i=>i.id)));
    const candidats = S.materiel
      .filter(m=>!dejaDedans.has(m.id||m.name) && !dansUneAutre.has(m.id||m.name))
      .filter(m=>!recherche || (m.name+" "+m.cat+" "+(m.etiquette||"")+" "+(m.numeroSerie||"")).toLowerCase().includes(recherche))
      .slice(0, 40);

    const lignesHtml = f.lignes.map((l,i)=>{
      const detail = matDetail(l.id);
      return `
      <div style="padding:8px 11px;display:flex;align-items:center;gap:9px">
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font:500 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-eef0f4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(matLabel(l.id))}</span>
          ${detail?`<span style="font:400 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-6d7480);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(detail)}</span>`:""}
        </span>
        <input class="inp" data-k="pkq-${esc(l.id)}" type="number" min="1" style="width:62px;padding:6px 8px;font-size:12px;border-radius:7px" value="${esc(l.qty)}" ${oni(e=>{ l.qty=e.target.value; })}>
        <button class="btn-cell hred" ${on(()=>{ f.lignes.splice(i,1); render(); })}>Retirer</button>
      </div>`;
    }).join("");

    const candidatsHtml = candidats.map(m=>{
      const id = m.id||m.name;
      const detail = exemplaireDetail(m);
      return `
      <button ${on(()=>{ f.lignes.push({id, qty:1}); f.recherche=""; render(); })}
        style="width:100%;padding:8px 11px;background:transparent;border:0;border-bottom:1px solid var(--c-1f232a);display:flex;align-items:center;gap:9px;text-align:left;cursor:pointer">
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font:500 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-dfe3ea);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.name)}</span>
          <span style="font:400 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-6d7480);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.cat)}${detail?" · "+esc(detail):""}</span>
        </span>
        <span style="font:400 12px/1 Inter,system-ui,sans-serif;color:var(--c-5b6270);white-space:nowrap">disp. ${matAvailable(id)}</span>
        <span style="font:600 13px/1 Inter,system-ui,sans-serif;color:var(--c-8fb4ff)">+</span>
      </button>`;
    }).join("");

    const nomOk = (f.nom||"").trim().length>0;
    const pret = nomOk && f.lignes.length>0;

    modals += `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true" style="width:540px;max-height:86vh">
        <div class="modal-head">
          <span class="modal-title">${f.original?"Modifier le pack":"Nouveau pack"}</span>
          <span class="modal-sub">Les articles rangés dans une même malette</span>
        </div>
        <div class="modal-body" style="overflow:auto">
          <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px">
            <label class="field">
              <span class="klabel">NOM DE LA MALETTE</span>
              <input class="inp" data-k="pknom" maxlength="200" placeholder="Malette terrain A" value="${esc(f.nom)}" ${oni(e=>{ f.nom=e.target.value; render(); })}>
            </label>
            <label class="field">
              <span class="klabel">ÉTIQUETTE <span style="color:var(--c-6d7480);font-weight:400;letter-spacing:0">(facultatif)</span></span>
              <input class="inp" data-k="pketq" maxlength="200" placeholder="PELI-01" value="${esc(f.etiquette||"")}" ${oni(e=>{ f.etiquette=e.target.value; })}>
            </label>
          </div>

          <div class="field" style="gap:8px">
            <span class="klabel">CONTENU · ${f.lignes.length}</span>
            ${f.lignes.length
              ? `<div class="stack">${lignesHtml}</div>`
              : '<span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-6d7480)">Rien dedans pour l\'instant. Choisissez des articles ci-dessous.</span>'}
          </div>

          <div class="field" style="gap:8px">
            <span class="klabel">AJOUTER UN ARTICLE</span>
            <input class="inp" data-k="pkrech" placeholder="Rechercher dans le matériel…" value="${esc(f.recherche||"")}" ${oni(e=>{ f.recherche=e.target.value; render(); })}>
            <div class="stack" style="max-height:210px;overflow:auto">${candidatsHtml || '<div style="padding:14px 11px;font:400 12px Inter,system-ui,sans-serif;color:var(--c-6d7480)">Aucun article à ajouter</div>'}</div>
            ${S.materiel.filter(m=>dansUneAutre.has(m.id||m.name) && !dejaDedans.has(m.id||m.name)).length ? `<span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--muted)">${S.materiel.filter(m=>dansUneAutre.has(m.id||m.name) && !dejaDedans.has(m.id||m.name)).length} article(s) déjà rangé(s) dans une autre malette ne sont pas proposés.</span>` : ""}
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({packEdit:null}))}>Annuler</button>
          <button class="btn-pri${pret?'':' off'}" style="padding:9px 16px" ${on(()=>{ if(pret) confirmPackEdit(); })}>${f.original?"Enregistrer":"Créer le pack"}</button>
        </div>
      </div>
    </div>`;
  }

  /* Emprunt d'une malette. Entière, c'est une confirmation ; en partie, on
     coche ce qu'on emporte. Les deux passent par la même action. */
  if(S.packBorrow){
    const b = S.packBorrow;
    const pack = S.packs.find(x=>x.name===b.pack);
    if(!pack){ S.packBorrow = null; }
    else {
      const options = missionNamesEmpruntables();
      const dejaSorti = {};
      packSorties(pack.name).forEach(d=>{ dejaSorti[d.id] = (dejaSorti[d.id]||0) + d.qty; });
      const retenues = pack.items.filter(i=>!i.manquant && !dejaSorti[i.id] && b.choix[i.id]);
      const courts = retenues.filter(i=>matAvailable(i.id) < i.qty);
      const pret = retenues.length>0 && !courts.length;

      const lignesHtml = pack.items.map(i=>{
        const sorti = dejaSorti[i.id]||0;
        const bloque = i.manquant || sorti>0;
        const coche = !bloque && !!b.choix[i.id];
        const dispo = i.manquant ? 0 : matAvailable(i.id);
        const court = coche && dispo < i.qty;
        const raison = i.manquant ? "article supprimé" : sorti ? sorti+" déjà dehors" : "";
        return `
        <div style="padding:8px 11px;display:flex;align-items:center;gap:10px;${bloque?"opacity:.55":""}">
          <button ${bloque?"":on(()=>{ if(b.choix[i.id]) delete b.choix[i.id]; else b.choix[i.id]=true; render(); })}
            style="width:15px;height:15px;flex:none;border-radius:4px;display:grid;place-items:center;font:600 12px/1 Inter,system-ui,sans-serif;padding:0;${coche?"background:var(--gold);border:1px solid var(--gold);color:var(--gold-ink)":"background:var(--c-191c22);border:1px solid var(--c-343a45);color:transparent"}${bloque?";cursor:not-allowed":""}">${coche?"✓":""}</button>
          <span style="width:22px;flex:none;font:600 12px/1 Inter,system-ui,sans-serif;color:var(--c-6d7480);font-variant-numeric:tabular-nums">${i.qty}×</span>
          <span style="flex:1;min-width:0;font:500 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-dfe3ea);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(i.libelle)}</span>
          <span style="font:400 12px/1 Inter,system-ui,sans-serif;color:${court||raison?"var(--c-ef8b83)":"var(--c-5b6270)"};white-space:nowrap">${raison?esc(raison):"disp. "+dispo}</span>
        </div>`;
      }).join("");

      modals += `
      <div class="modal-back">
        <div class="modal" role="dialog" aria-modal="true" style="width:480px;max-height:86vh">
          <div class="modal-head">
            <span class="modal-title">Emprunter « ${esc(pack.name)} »</span>
            <span class="modal-sub">${b.partiel?"Cochez ce que vous emportez":"La malette entière part d'un seul geste"}</span>
          </div>
          <div class="modal-body" style="overflow:auto">
            <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px">
              <label class="field">
                <span class="klabel">MISSION</span>
                <select class="inp" data-k="pkmission" ${ong(e=>{ b.mission=e.target.value; render(); })}>
                  ${options.map(nm=>`<option value="${esc(nm)}"${nm===b.mission?" selected":""}>${nm===SANS_MISSION?"Sans mission":esc(nm)}</option>`).join("")}
                </select>
              </label>
              <div class="field">
                <span class="klabel">PRIS PAR</span>
                <span style="font:500 13px/1.2 Inter,system-ui,sans-serif;color:var(--c-e7e9ee);padding:9px 0">${esc(OPERATOR)}</span>
              </div>
            </div>
            <div class="field" style="gap:8px">
              <span class="klabel">CONTENU · ${retenues.length} retenu(s)</span>
              <div class="stack">${lignesHtml}</div>
            </div>
            ${selecteurEquipe((b.mission||"").trim(), b.equipe||"", v=>{b.equipe=v; render();})}
            <label class="field">
              <span class="klabel">COMMENTAIRE <span style="color:var(--c-6d7480);font-weight:400;letter-spacing:0">(facultatif)</span></span>
              <textarea class="inp" data-k="pkcomment" maxlength="500" rows="2" placeholder="Commentaire commun aux sorties" ${oni(e=>{ b.commentaire=e.target.value; })}>${esc(b.commentaire||"")}</textarea>
            </label>
            ${courts.length?`<span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-ef8b83)">Stock insuffisant pour : ${esc(courts.map(i=>i.libelle).join(", "))}. Décochez ces articles ou attendez un retour.</span>`:""}
            ${!retenues.length?'<span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-6d7480)">Rien de sélectionné.</span>':""}
          </div>
          <div class="modal-foot">
            <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({packBorrow:null}))}>Annuler</button>
            <button class="btn-pri${pret?'':' off'}" style="padding:9px 16px" ${on(()=>{ if(pret) confirmPackBorrow(); })}>Emprunter</button>
          </div>
        </div>
      </div>`;
    }
  }

  /* Identifiants d'un exemplaire : l'étiquette collée dessus, le numéro lu
     sur l'objet. Une modale plutôt que deux champs dans la ligne : corriger
     un numéro mal lu se fait posément, et le serveur refuse un doublon. */
  if(S.identForm){
    const f = S.identForm;
    const m = S.materiel.find(x=>(x.id||x.name)===f.id);
    if(!m){ S.identForm = null; }
    else {
      modals += `
      <div class="modal-back">
        <div class="modal" role="dialog" aria-modal="true" style="width:420px">
          <div class="modal-head">
            <span class="modal-title">Identifier l'exemplaire</span>
            <span class="modal-sub">${esc(m.name)}</span>
          </div>
          <div class="modal-body">
            <label class="field">
              <span class="klabel">NUMÉRO DE SÉRIE</span>
              <input class="inp" data-k="idserie" maxlength="200" placeholder="CAL-0041" value="${esc(f.numeroSerie||"")}" ${oni(e=>{f.numeroSerie=e.target.value;})}>
            </label>
            <label class="field">
              <span class="klabel">ÉTIQUETTE <span style="color:var(--c-6d7480);font-weight:400;letter-spacing:0">(facultatif)</span></span>
              <input class="inp" data-k="idetq" maxlength="200" placeholder="Bac A3" value="${esc(f.etiquette||"")}" ${oni(e=>{f.etiquette=e.target.value;})}>
            </label>
            <span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-6d7480)">Le numéro suit l'exemplaire dans le journal : c'est lui qui dira lequel a été consommé, et pour quelle mission. Les mouvements déjà inscrits gardent l'ancien.</span>
          </div>
          <div class="modal-foot">
            <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({identForm:null}))}>Annuler</button>
            <button class="btn-pri" style="padding:9px 16px" ${on(()=>confirmIdentForm())}>Enregistrer</button>
          </div>
        </div>
      </div>`;
    }
  }

  /* Enregistrement en lot : une ligne de stock par numéro de série. Saisir
     cinquante exemplaires un par un serait la seule raison de ne pas les
     tracer, donc de perdre ce que la série apporte. */
  if(S.lotForm){
    const f = S.lotForm;
    // Deux entrées vers la même modale. Depuis l'administration, on colle une
    // liste libre. Depuis l'entrée de matériel, le nombre d'exemplaires est
    // déjà connu : un champ par exemplaire, ni un de plus ni un de moins.
    const attendus = Number(f.attendus)||0;
    const series = attendus
      ? (f.champs||[]).map(x=>(x||"").trim()).filter(Boolean)
      : (f.series||"").split(/[\r\n,;\t]+/).map(x=>x.trim()).filter(Boolean);
    const doublons = series.filter((x,i)=>series.findIndex(y=>y.toLowerCase()===x.toLowerCase())!==i);
    const nomOk = (f.nom||"").trim().length>0;
    const complet = !attendus || series.length===attendus;
    const pret = nomOk && series.length>0 && !doublons.length && complet;

    const champsHtml = !attendus ? "" : (f.champs||[]).map((val,i)=>`
      <div style="padding:6px 11px;display:flex;align-items:center;gap:10px">
        <span style="width:26px;flex:none;font:600 12px/1 Inter,system-ui,sans-serif;color:var(--c-6d7480);font-variant-numeric:tabular-nums">${i+1}</span>
        <input class="inp" data-k="lotch-${i}" maxlength="200" placeholder="Numéro de série de l'exemplaire ${i+1}"
          style="flex:1;min-width:0;padding:6px 9px;font-size:12px;border-radius:7px${(val||"").trim()?"":";border-color:var(--c-343a45)"}"
          value="${esc(val||"")}" ${oni(e=>{ f.champs[i]=e.target.value; render(); })}>
      </div>`).join("");
    const cats = Array.from(new Set([...CATEGORIES_MATERIEL, ...S.materiel.map(m=>m.cat)]));
    const existants = Array.from(new Set(S.materiel.map(m=>m.name)));

    modals += `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true" style="width:500px;max-height:86vh">
        <div class="modal-head">
          <span class="modal-title">${attendus?"Numéros de série":"Exemplaires sériés"}</span>
          <span class="modal-sub">${attendus?esc(nbSeriesSub(f, attendus, series.length)):"Une ligne de stock par numéro de série"}</span>
        </div>
        <div class="modal-body" style="overflow:auto">
          ${attendus ? `
          <div class="field" style="gap:4px">
            <span class="klabel">ARTICLE</span>
            <span style="font:500 13px/1.3 Inter,system-ui,sans-serif;color:var(--c-e7e9ee)">${esc(f.nom||"")}</span>
            <span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-6d7480)">${esc(f.cat)} · ${esc(f.affectation)}${f.etiquette?" · étiquette "+esc(f.etiquette):""}</span>
          </div>
          <div class="field" style="gap:6px">
            <span class="klabel">UN NUMÉRO PAR EXEMPLAIRE · ${series.length} / ${attendus}</span>
            <div class="stack" style="max-height:290px;overflow:auto">${champsHtml}</div>
          </div>` : `
          <label class="field">
            <span class="klabel">ARTICLE</span>
            <input class="inp" data-k="lotnom" list="lot-noms" maxlength="200" placeholder="Cartouche de calibration" value="${esc(f.nom||"")}" ${oni(e=>{f.nom=e.target.value; render();})}>
            <datalist id="lot-noms">${existants.map(n=>`<option value="${esc(n)}"></option>`).join("")}</datalist>
          </label>
          <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px">
            <label class="field">
              <span class="klabel">CATÉGORIE</span>
              <select class="inp" data-k="lotcat" ${ong(e=>{f.cat=e.target.value; render();})}>
                ${cats.map(c=>`<option value="${esc(c)}"${c===f.cat?" selected":""}>${esc(c)}</option>`).join("")}
              </select>
            </label>
            <label class="field">
              <span class="klabel">AFFECTATION</span>
              <select class="inp" data-k="lotaff" ${ong(e=>{f.affectation=e.target.value;})}>
                ${AFFECTATIONS.map(a=>`<option value="${esc(a)}"${a===f.affectation?" selected":""}>${esc(a)}</option>`).join("")}
              </select>
            </label>
          </div>
          ${f.cat===CATEGORIE_DONGLE ? `
          <label class="field">
            <span class="klabel">FIN DE LICENCE <span style="color:var(--muted);font-weight:400;letter-spacing:0">(facultatif, commune aux exemplaires)</span></span>
            <input class="inp" data-k="lotlic" type="date" value="${esc(f.licence||"")}" ${oni(e=>{f.licence=e.target.value;})}>
          </label>` : ""}
          <label class="field">
            <span class="klabel">NUMÉROS DE SÉRIE · ${series.length}</span>
            <textarea class="inp" data-k="lotseries" rows="7" placeholder="Un numéro par ligne&#10;CAL-0041&#10;CAL-0042&#10;CAL-0043" ${oni(e=>{f.series=e.target.value; render();})}>${esc(f.series||"")}</textarea>
            <span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-6d7480)">Un par ligne, ou séparés par des virgules. Chacun donne un exemplaire de quantité 1 : c'est ce qui permet de dire lequel a servi.</span>
          </label>`}
          ${doublons.length?`<span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-ef8b83)">Numéro répété dans la liste : ${esc(Array.from(new Set(doublons)).join(", "))}.</span>`:""}
          ${series.length>500?'<span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-ef8b83)">Maximum 500 exemplaires en une fois.</span>':""}
        </div>
        <div class="modal-foot">
          ${attendus?`<button class="btn-mini hwhite" style="margin-right:auto" ${on(()=>sansNumeroDeSerie())}>Ces exemplaires n'ont pas de numéro</button>`:""}
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({lotForm:null, matReceptForm:f.retour||null}))}>${f.retour?"Retour":"Annuler"}</button>
          <button class="btn-pri${pret?'':' off'}" style="padding:9px 16px" ${on(()=>{ if(pret) confirmLotForm(); })}>Enregistrer ${series.length||""}</button>
        </div>
      </div>
    </div>`;
  }

  /* Creer ou renommer une equipe. Un seul champ : son nom n'a besoin d'etre
     unique que dans sa mission, et le serveur le verifie. */
  if(S.equipeEdit){
    const f = S.equipeEdit;
    const nomVoulu = (f.valeur||"").trim();
    const pris = nomVoulu && nomVoulu!==f.original
      && equipesDe(f.mission).some(e=>e.nom.toLowerCase()===nomVoulu.toLowerCase());
    const pret = nomVoulu.length>0 && !pris;
    modals += `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true" style="width:400px">
        <div class="modal-head">
          <span class="modal-title">${f.original?"Renommer l'équipe":"Nouvelle équipe"}</span>
          <span class="modal-sub">${esc(f.mission)}</span>
        </div>
        <div class="modal-body">
          <label class="field">
            <span class="klabel">NOM DE L'ÉQUIPE</span>
            <input class="inp" data-k="equipenom" maxlength="200" placeholder="Équipe Nord" value="${esc(f.valeur||"")}" ${oni(e=>{f.valeur=e.target.value; render();})}>
          </label>
          ${pris?'<span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-ef8b83)">Une équipe de ce nom existe déjà dans cette mission.</span>':""}
          <span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-6d7480)">${f.original?"Le matériel déjà attribué suit le nouveau nom.":"Le matériel s\'y attribue ensuite, à l\'emprunt ou en le déplaçant depuis la mission."}</span>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({equipeEdit:null}))}>Annuler</button>
          <button class="btn-pri${pret?'':' off'}" style="padding:9px 16px" ${on(()=>{ if(pret) confirmerEquipe(); })}>${f.original?"Renommer":"Créer"}</button>
        </div>
      </div>
    </div>`;
  }

  /* Composer les membres d'une equipe. La liste est remplacee en entier : on
     coche qui en fait partie aujourd'hui. */
  if(S.membresEdit){
    const f = S.membresEdit;
    const dans = new Set(f.choisis);
    // Les autres equipes de la mission, pour signaler qui est deja pris
    // ailleurs — ce n'est pas interdit, mais c'est bon a savoir.
    const ailleurs = {};
    equipesDe(f.mission).forEach(e=>{
      if(e.nom===f.nom) return;
      e.membres.forEach(m=>{ (ailleurs[m]=ailleurs[m]||[]).push(e.nom); });
    });
    // Tous les comptes sont proposés, gestionnaires compris, pas seulement aux
    // administrateurs : un gestionnaire compose son effectif, et peut en faire partie.
    const listeHtml = S.annuaire.map(c=>{
      const coche = dans.has(c);
      return `
      <button ${on(()=>{
        f.choisis = dans.has(c) ? f.choisis.filter(x=>x!==c) : f.choisis.concat([c]);
        render();
      })} style="width:100%;padding:8px 11px;background:transparent;border:0;border-bottom:1px solid var(--c-1f232a);display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer">
        <span style="width:15px;height:15px;flex:none;border-radius:4px;display:grid;place-items:center;font:600 12px/1 Inter,system-ui,sans-serif;${coche?"background:var(--gold);border:1px solid var(--gold);color:var(--gold-ink)":"background:var(--c-191c22);border:1px solid var(--c-343a45);color:transparent"}">${coche?"✓":""}</span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font:500 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-dfe3ea)">${esc(c)}${c===OPERATOR?'<span style="color:var(--c-6d7480);font-weight:400"> · vous</span>':""}</span>
          ${ailleurs[c]?`<span style="font:400 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-f0b45a)">déjà dans ${esc(ailleurs[c].join(", "))}</span>`:""}
        </span>
      </button>`;
    }).join("");
    modals += `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true" style="width:430px;max-height:86vh">
        <div class="modal-head">
          <span class="modal-title">Membres de « ${esc(f.nom)} »</span>
          <span class="modal-sub">${esc(f.mission)} · ${f.choisis.length} retenu(s)</span>
        </div>
        <div class="modal-body" style="overflow:auto">
          <div class="field" style="gap:8px">
            <span class="klabel">COMPTES</span>
            <div class="stack" style="max-height:340px;overflow:auto">${listeHtml||'<div style="padding:16px 11px;font:400 12px Inter,system-ui,sans-serif;color:var(--c-6d7480)">Aucun compte à proposer.</div>'}</div>
            <span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-6d7480)">La composition est l\'état du jour : elle remplace la précédente, et rien n\'en est conservé.</span>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({membresEdit:null}))}>Annuler</button>
          <button class="btn-pri" style="padding:9px 16px" ${on(confirmerMembres)}>Enregistrer</button>
        </div>
      </div>
    </div>`;
  }

  /* Bandeau d'emprunt d'identité. Volontairement voyant et permanent : agir
     au nom d'un autre sans s'en rendre compte fausserait le journal, et
     l'erreur ne se verrait qu'une fois inscrite. Il est dans le flux — au-dessus
     de la coque, qui se raccourcit d'autant — et non posé par-dessus : il
     masquait sinon le haut de la page, où se trouvent les champs de recherche. */
  const banniereAuteur = !AUTEUR ? "" : `
  <div style="flex:none;position:relative;z-index:5;padding:7px 16px;display:flex;align-items:center;justify-content:center;gap:12px;background:color-mix(in srgb, var(--warn) 16%, transparent);border-bottom:1px solid color-mix(in srgb, var(--warn) 50%, transparent);font:500 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-f0b45a)">
    <span>Vous agissez au nom de <b style="font-weight:600">${esc(AUTEUR)}</b> — tout ce que vous enregistrez sera inscrit à son nom.</span>
    <button class="btn-mini hwhite" ${on(()=>{ AUTEUR = null; render(); })}>Revenir à moi</button>
  </div>`;

  const syncBanner = (!SERVER || (online && !S.syncMsg)) ? "" : `
  <div style="position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;max-width:min(640px,90vw);padding:9px 16px;border-radius:9px;font:500 12px/1.4 Inter,system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.5);${!online
    ? "background:color-mix(in srgb, var(--danger) 16%, transparent);border:1px solid color-mix(in srgb, var(--danger) 45%, transparent);color:var(--c-ef8b83)"
    : "background:color-mix(in srgb, var(--warn) 14%, transparent);border:1px solid color-mix(in srgb, var(--warn) 45%, transparent);color:var(--c-f0b45a)"}">${!online
    ? "⚠ Connexion au serveur perdue — vos modifications ne sont pas partagées. Vérifiez que le serveur est lancé."
    : esc(S.syncMsg)}</div>`;

  app.innerHTML = `${enCours ? '<div class="chargement" role="progressbar" aria-label="Enregistrement en cours"></div>' : ""}${banniereAuteur}${syncBanner}
  <div class="shell">
    ${sidebar}
    <div class="topbar">
      <button class="btn btn-icon btn-ghost" type="button" aria-label="Ouvrir le menu" aria-expanded="${!!S.sbOuvert}" ${on(()=>setT({sbOuvert:!S.sbOuvert}))}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <span style="font-weight:700;letter-spacing:-.01em">Heimdall</span>
      <span style="margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(pageTitle)}</span>
    </div>
    <main class="principal">
      <div class="contenu">
        ${header}
        ${body}
      </div>
    </main>
    ${modals}
  </div>`;

  if(focusKey){
    const el = app.querySelector('[data-k="'+CSS.escape(focusKey)+'"]');
    if(el){
      el.focus();
      if(focusPos!=null){ try{ el.setSelectionRange(focusPos,focusPos); }catch(e){} }
    }
  }

  // La place disponible ne se connait qu'une fois le rendu pose. `enMesure`
  // garantit un seul redessin : la mesure ne dependant pas du contenu, elle
  // donne le meme resultat au second passage.
  if(!enMesure && mesurerRangs()){
    enMesure = true;
    try{ render(); } finally{ enMesure = false; }
  }
}

// Redimensionner la fenetre change ce qui tient : on remesure, sans plus.
addEventListener("resize", ()=>{ if(mesurerRangs()) render(); });

/* ============================================================
   ACTIONS
   ============================================================ */

/* Formulaire de réception.

   Ne suppose pas qu'une référence existe : sur une base neuve il n'y en a
   aucune, et c'est précisément le moment où l'on a besoin de créer la
   première. Un seul bouton mène ici — « + Réception » — et la bascule
   « Nouveau modèle » de la modale couvre la création. */
function formulairePhone(nouveauModele){
  const r = S.refs[0];
  const v = r && r.variants[0];
  return {
    refId: r ? r.id : "", variantIdx:"0", newVariant:false,
    newModel: nouveauModele, brand:"", modelName:"", mpn:"",

/* Empreinte d'une ligne de réservation, de sortie ou d'emprunt.
   Transmise au serveur avec le rang, elle lui permet de vérifier qu'il
   supprime bien la ligne qu'on croit désigner, et non celle qui a pris sa
   place entre-temps. Doit rester identique à `empreinte()` de actions.py. */
function empreinte(x){
  if(x.mission!==undefined && x.by!==undefined) return [x.qty, x.mission, x.by].join("|");
  return [x.who, x.qty, x.variantIdx, x.iso].join("|");
}

async function confirmReception(){
  const f = S.form; if(!f) return;
  const n = Math.max(1, Number(f.qty)||1);

  if(f.newModel){
    ok = await agir("telephone.creer", {
      brand:f.brand, model:f.modelName, mpn:f.mpn,
      capa:f.capa, color:f.color, qty:n, slot:f.slot||""
    });
  } else if(f.newVariant){
    ok = await agir("telephone.variante.ajouter", {
      refId:cible, capa:f.capa, color:f.color, qty:n
    });
  } else {
    ok = await agir("telephone.reception", {
      refId:cible, variantIdx:Number(f.variantIdx)||0, qty:n
    });
  }
  if(ok) setT({ form:null });
}

async function importerXlsx(input){
  const fichier = input.files && input.files[0];
  input.value = "";
  if(!fichier) return;
  if(!fichier.name.toLowerCase().endsWith(".xlsx")){
    syncNote("Sélectionnez un fichier XLSX.");
    return;
  }
  try{
    const octets = new Uint8Array(await fichier.arrayBuffer());
    let binaire = "";
    const taille = 0x8000;
    for(let i=0;i<octets.length;i+=taille)
      binaire += String.fromCharCode(...octets.subarray(i,i+taille));
    if(await agir("telephone.importer_xlsx", {xlsxBase64:btoa(binaire)}))
      syncNote("Import XLSX terminé.");
  }catch(e){
    syncNote("Impossible de lire le fichier sélectionné.");
  }
}

   retournable ; « Annuler » libère sans toucher au stock. */

/* chaque sortie est retournable : réincrémente la variante + ligne RETOUR */

/* La restitution d'une mission, avec ce qui a ete consomme.

   Les quantites nulles ne sont pas envoyees : le serveur les ignorerait,
   mais les taire rend la demande lisible dans l'historique des operations. */
async function confirmRelease(){
  const f = S.releaseForm; if(!f) return;
  const ouvertes = lignesOuvertesMission(f.mission);
  const consommes = {};
  Object.keys(f.consommes||{}).forEach(id=>{
    const l = ouvertes.find(x=>x.id===id);
    if(!l) return;
    const n = Math.min(l.qty, Math.max(0, Number(f.consommes[id])||0));
    if(n) consommes[id] = n;
  });
  const demande = { mission:f.mission, consommes,
                    commentaire:(f.commentaire||"").trim() };
  // `equipe` n'est envoyee que si la restitution vise une equipe : absente, le
  // serveur rend toute la mission — ce qui n'est pas la meme demande qu'une
  // chaine vide, laquelle rend ce qui n'a pas d'equipe.
  if(f.equipe) demande.equipe = f.equipe;
  if(await agir("materiel.mission.restituer", demande)){
    setT({ releaseForm:null });
  }
}
