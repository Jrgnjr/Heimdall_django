          ${COMPTES.filter(c=>c!==OPERATOR).map(c=>`<option value="${esc(c)}"${c===AUTEUR?" selected":""}>${esc(c)}</option>`).join("")}
        </select>
      </div>` : ""}
    </div>`;
  const pieds = !SERVER ? "" : `
    <div style="margin-top:auto;padding-top:24px">
      ${S.userMenu ? `<div style="position:fixed;inset:0;z-index:70" ${on(()=>setT({userMenu:false}))}></div>` : ""}
      <div style="position:relative">
        ${menuCompte}
        <div class="sb-compte${S.userMenu?" on":""}">
          <button class="sb-compte-nom" type="button" aria-haspopup="menu" aria-expanded="${!!S.userMenu}" title="Compte connecté" ${on(()=>setT({userMenu:!S.userMenu}))}>
            <span class="sb-ava${AUTEUR?" nom-de":""}">${esc(String(auteurEffectif()).slice(0,2).toUpperCase())}${nbNotifs?`<span class="sb-pastille" aria-label="${nbNotifs} à traiter" title="${nbDemandes?nbDemandes+" demande"+(nbDemandes>1?"s":"")+" de prêt":""}${(nbDemandes&&aRecommander.length)?" · ":""}${aRecommander.length?aRecommander.length+" consommable"+(aRecommander.length>1?"s":"")+" à recommander":""}">${nbNotifs}</span>`:""}</span>
            <span style="min-width:0;display:flex;flex-direction:column;flex:1;text-align:left">
              <span class="sb-compte-id"${AUTEUR?' style="color:var(--warn)"':""}>${esc(auteurEffectif())}</span>
              <span class="sb-compte-role">${AUTEUR?"Au nom de cette personne":esc(roleLibelle)}</span>
            </span>
          </button>
          <button class="btn btn-icon btn-ghost" type="button" aria-label="Se déconnecter" title="Se déconnecter" ${on(deconnexion)}>${ICONES_SVG["se-deconnecter"]}</button>
        </div>
      </div>
    </div>`;

  const sidebar = `
  ${S.sbOuvert ? `<div class="sb-fond" ${on(()=>setT({sbOuvert:false}))}></div>` : ""}
  <aside class="sb${S.sbOuvert?" ouvert":""}" aria-label="Barre latérale">
    <div class="sb-marque">
      <img src="{% static 'stock/heimdall.png' %}" alt="" style="width:34px;height:42px;object-fit:contain;flex:none">
      <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
        <span style="font-size:16px;font-weight:700;letter-spacing:-.01em;color:var(--ink)">Heimdall</span>
        <span style="font-size:10.5px;font-weight:500;letter-spacing:.16em;color:var(--muted)">GESTION DE STOCK</span>
      </div>
    </div>
    <nav aria-label="Navigation principale" style="display:flex;flex-direction:column;gap:2px">
      ${sectionsNav.map(([titre, items])=>`
        <div class="grp">${titre}</div>
        ${items.map(([p, libelle, icone, compte])=>`
        <button class="nav-btn${estActif(p)?" on":""}" type="button"${estActif(p)?' aria-current="page"':""} ${on(()=>allerA(p))}>${iconeNav(icone)}<span style="flex:1;text-align:left">${libelle}</span>${compte?`<span class="nav-compte" aria-label="${compte} à traiter">${compte}</span>`:""}</button>`).join("")}`).join("")}
    </nav>
    ${pieds}
  </aside>`;

  /* ---------- en-tête ---------- */
  const pageTitle = S.page==="stock" ? "Stock de téléphone"
    : S.page==="materiel" ? "Stock de matériel"
    : S.page==="missions" ? "Missions"
    : S.page==="profil" ? (S.profilDe ? "Profil de "+S.profilDe : "Mon profil")
    : S.page==="groupe" ? "Mon groupe"
    : S.page==="journal" ? "Journal des mouvements"
    : S.page==="admin" ? "Administration du stock"
    : "Plan de l'armoire";
  const pageSub = S.page==="stock" ? S.refs.length+" référence"+(S.refs.length>1?"s":"")+" · "+S.cabinets.length+" armoire"+(S.cabinets.length>1?"s":"")+" · "+capacity+" casier"+(capacity>1?"s":"")
    : S.page==="materiel" ? "Accessoires, pièces et consommables · "+S.packs.length+" malette"+(S.packs.length>1?"s":"")+" · bacs et étagères de l'atelier"
    : S.page==="missions" ? "Matériel affecté par mission"
    : S.page==="profil" ? "Tableau de bord du compte"
    : S.page==="groupe" ? (groupeMoi() ? groupeMoi().nom+" · "+groupeMoi().membres.length+" membre"+(groupeMoi().membres.length>1?"s":"")+(groupeMoi().affectation?" · matériel "+groupeMoi().affectation:"") : "Aucun groupe")
    : S.page==="journal" ? "Tous les mouvements de téléphones et de matériel · "+journalRows().length+" événement"+(journalRows().length>1?"s":"")
    : S.page==="admin" ? "Ajout et suppression des références, articles, modèles et comptes"
    : sansArmoire ? "Aucune armoire n'est encore définie"
    : "Armoire "+activeCab.id+" · "+activeCab.shelves+" étagère"+(activeCab.shelves>1?"s":"")+" × "+activeCab.cols+" casier"+(activeCab.cols>1?"s":"")+" · "+casiersOccupes+" casier"+(casiersOccupes>1?"s":"")+" occupé"+(casiersOccupes>1?"s":"")+" sur "+(activeCab.shelves*activeCab.cols);

  const header = S.page==="profil" ? "" : `
  <header class="entete">
    <div class="entete-titre">
      <h1>${esc(pageTitle)}</h1>
      <p>${esc(pageSub)}</p>
    </div>
    <div class="entete-actions">
      ${S.page==="stock" && S.stockVue==="pieces" ? champRecherche("pieceq", "Pièce, type, modèle, réf.…", S.pieceQ, v=>setT({pieceQ:v}), "flex:1 1 260px;max-width:380px") : ""}
      ${(S.page==="armoire" || (S.page==="stock" && S.stockVue!=="pieces")) ? champRecherche("q", S.page==="armoire" ? "Trouver un modèle, une marque, une réf.…" : "Modèle, marque, réf. fabricant…", S.q, v=>setT({q:v, stockPhonePage:0}), "flex:1 1 260px;max-width:380px") : ""}
      ${(S.page==="profil" && (!S.profilDe || S.profilDe===auteurEffectif())) ? `<button class="btn${S.profilEdition?" btn-primary":""}" ${on(()=>setT({profilEdition:!S.profilEdition}))}>${S.profilEdition?"Terminer la personnalisation":"Personnaliser"}</button>
      <button class="btn" ${on(()=>setT({reglagesOuverts:true}))}>Réglages</button>` : ""}
      ${S.page==="journal" ? champRecherche("logq", "Article, étiquette, personne…", S.logQuery, v=>setT({logQuery:v, logPage:0}), "flex:1 1 260px;max-width:380px") : ""}
      ${S.page==="missions" && peutCreerMission() ? `<button class="btn btn-primary" type="button" ${on(ouvrirNouvelleMission)}>+ Nouvelle mission</button>` : ""}
      ${(S.page==="missions"||S.page==="journal"||S.page==="admin"||S.page==="profil"||S.page==="groupe") ? "" : `
      ${S.page==="materiel" ? champRecherche("matq", "Article, malette, mission…", S.matQuery, v=>setT({matQuery:v, stockMaterialPage:0}), "flex:1 1 260px;max-width:380px") : ""}
      ${S.page==="materiel" ? `<button class="btn${S.prepMode?" btn-primary":""}" type="button" aria-pressed="${!!S.prepMode}" ${on(basculerPreparation)}>${S.prepMode?"← Vue tableau":"Préparer une mission"}</button>` : ""}
      ${ADMIN ? `<button class="btn btn-primary" ${on(()=>S.page==="materiel"?openMatReception():(S.page==="stock" && S.stockVue==="pieces")?ouvrirPiece():openReception())}>${S.page==="materiel"?"+ Entrée matériel":(S.page==="stock" && S.stockVue==="pieces")?"+ Pièce":"+ Réception"}</button>` : ""}`}
    </div>
  </header>`;

  /* ---------- page : stock de téléphone ---------- */
  let body = "";
  if(S.page==="stock"){
    const brands = ["Toutes", ...Array.from(new Set(S.refs.map(r=>r.brand)))];
    const fp = filtresDe("stock");
    const filtered = S.refs.filter(r=>{
      if(!((S.brand==="Toutes" || r.brand===S.brand) && (!searching || matches(r,S.q)))) return false;
      if(fp.reference && !(r.brand+" "+r.model+" "+(r.mpn||"")+" "+(r.commercialName||"")).toLowerCase().includes(fp.reference.trim().toLowerCase())) return false;
      if(fp.emplacement==="__nonplace" && place[r.id]) return false;
      if(fp.emplacement==="__fixe" && !S.assignments[r.id]) return false;
      if(fp.emplacement==="__libre" && (S.assignments[r.id] || !place[r.id])) return false;
      if(fp.emplacement && !fp.emplacement.startsWith("__") && locOf(r) !== fp.emplacement) return false;
      if(fp.qte==="stock" && r.qty <= 0) return false;
      if(fp.qte==="epuise" && r.qty > 0) return false;
      return true;
    });
    const locsConnues = Array.from(new Set(S.refs.filter(r=>place[r.id]).map(r=>locOf(r)))).sort();
    const ctlStock = {
      reference: {label:"Contient", texte:"Marque, modèle, réf. fabricant…"},
      emplacement: {liste:[["__nonplace", "Non placés"], ["__fixe", "Casier fixé à la main"], ["__libre", "Casier automatique"], ...locsConnues.map(l=>[l, l])]},
      qte: {liste:[["stock", "En stock (> 0)"], ["epuise", "Épuisé (0)"]]},
    };
    const thS = (col, titre, style, droite, avant)=>thFiltrable("stock", col, titre, ctlStock[col], style, droite, avant);
    const phonePageSize = S.stockPhonePageSize === "all"
      ? Math.max(1, filtered.length)
      : S.stockPhonePageSize === "auto"
      ? rangsQuiTiennent("stock", ROW_H)
      : ([20,50].includes(Number(S.stockPhonePageSize)) ? Number(S.stockPhonePageSize) : 20);
    const phonePageCount = Math.max(1, Math.ceil(filtered.length/phonePageSize));
    const phonePage = Math.min(Math.max(0, Number(S.stockPhonePage)||0), phonePageCount-1);
    S.stockPhonePage = phonePage;
    const pageFiltered = filtered.slice(phonePage*phonePageSize, (phonePage+1)*phonePageSize);
    const rowsHtml = pageFiltered.map(r=>{
      const fixed = !!S.assignments[r.id], nonPlace = !place[r.id];
      const affecter = e=>{ e.stopPropagation(); set({page:"armoire", assigning:r.id, selId:r.id}); };
      const idMenu = "tel:"+r.id;
      return `
      <div class="row" ${on(()=>set({page:"armoire", selId:r.id}))} style="grid-template-columns:${PH_GRID()};min-height:${ROW_H}px;box-sizing:border-box;cursor:pointer">
        <div style="min-width:0">
          <div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.brand+" "+r.model)}</div>
          <div style="font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.brand)} · <span class="mono">${esc(r.mpn)}</span> · ${r.variants.length} variante${r.variants.length>1?"s":""}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;min-width:0">
          ${nonPlace ? `<span class="badge b-warn">Non placé</span>` : `<span class="badge b-loc">${esc(locOf(r))}</span>`}
          ${fixed ? `<span class="badge b-gold" title="Casier choisi à la main">Fixé</span>` : ""}
        </div>
        <div class="num" style="text-align:right;font-weight:600;font-size:15px;display:flex;justify-content:flex-end;align-items:center;gap:6px">
          <span>${r.qty}</span>
        </div>
        <div style="display:flex;justify-content:flex-end;align-items:center;gap:4px">
          ${nonPlace ? `<button class="btn btn-sm" type="button" style="border-color:var(--warn);color:var(--warn)" ${on(affecter)}>Affecter</button>`
            : `<span class="acts"><button class="btn btn-sm btn-ghost" type="button" ${on(affecter)}>Déplacer</button></span>`}
          <span class="acts${S.menuLigne===idMenu?" ouvert":""}">${menuPlus(idMenu, [
            {libelle:"Voir sur le plan", fn:()=>set({page:"armoire", selId:r.id})},
            ...(ADMIN ? [{libelle:"Supprimer…", danger:true, desactive:telephoneBloque(r),
                          titre:telephoneBloque(r) ? "Impossible tant que ce téléphone a des réservations ou des sorties en cours" : "",
                          fn:()=>supprimerTelephone(r)}] : []),
          ])}</span>
        </div>
      </div>`;
    }).join("");

    // Derniers mouvements : « n × article », puis quand et qui ; à droite, le type et le casier.
    const mouvementsHtml = S.movements.slice(0,6).map(m=>{
      const morceaux = String(m.label||"").split(" — ");
      const article = morceaux.length>1 ? morceaux.slice(1).join(" — ") : String(m.label||"");
      return `
      <div style="display:flex;gap:12px;padding:12px 18px;border-top:1px solid var(--line)">
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:13px;overflow-wrap:anywhere">${esc(article)}</div>
          <div class="num" style="font-size:12px;color:var(--muted);margin-top:2px">${esc(jourMoisAn(m.iso))} ${esc(heureMinute(m.iso))} · ${esc(m.user)}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          <span class="badge ${kindCls(m.kind)}">${esc(m.kind)}</span>
          ${m.loc ? `<span class="badge b-loc" style="height:20px">${esc(m.loc)}</span>` : ""}
        </div>
      </div>`;
    }).join("");

    // À traiter : ce qui demande une action, puis les chiffres d'ensemble.
    const nonPlaces = S.refs.filter(r=>!place[r.id]);
    const noms = l=>l.slice(0,3).map(r=>r.brand+" "+r.model).join(", ")+(l.length>3?"…":"");
    const aTraiter = (n, titre, detail, libelleBouton, fn)=>`
      <div class="card" style="flex:1 1 300px;display:flex;align-items:center;gap:14px;padding:14px 18px">
        <span class="badge b-warn" style="height:28px;width:28px;padding:0;justify-content:center;font-size:14px">${n}</span>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600">${esc(titre)}</div>
          <div style="color:var(--muted);font-size:12.5px;overflow-wrap:anywhere">${esc(detail)}</div>
        </div>
        <button class="btn btn-sm" type="button" ${on(fn)}>${esc(libelleBouton)}</button>
      </div>`;
    const sectionATraiter = `
      <section aria-label="À traiter" style="display:flex;flex-wrap:wrap;gap:12px">
        ${nonPlaces.length ? aTraiter(nonPlaces.length, "Références non placées", noms(nonPlaces), "Affecter un casier", ()=>set({page:"armoire", assigning:nonPlaces[0].id, selId:nonPlaces[0].id})) : ""}
        <div class="card" style="flex:1 1 220px;display:flex;align-items:center;gap:14px;padding:14px 18px">
          <div style="flex:1"><div class="over">Appareils en armoire</div><div class="num" style="font-size:22px;font-weight:700;margin-top:2px">${S.refs.reduce((n,r)=>n+r.qty, 0)}</div></div>
          <div style="flex:1"><div class="over">Références actives</div><div class="num" style="font-size:22px;font-weight:700;margin-top:2px">${S.refs.length}</div></div>
        </div>
      </section>`;

    body = `
    <div style="flex:1;min-height:0;padding:20px 32px 40px;display:flex;flex-direction:column;gap:20px;min-width:0;overflow:auto">
      ${ongletsStock()}
      ${sectionATraiter}

      <div role="group" aria-label="Filtrer par marque" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
        ${brands.map(b=>chip(b, b===S.brand, ()=>set({brand:b,stockPhonePage:0}))).join("")}
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:stretch;flex:1;min-height:420px">
        <section class="card" aria-label="Références" style="flex:999 1 620px;min-width:0;overflow:hidden;display:flex;flex-direction:column">
          <div style="overflow-x:auto;flex:1;min-height:0;display:flex;flex-direction:column">
            <div style="min-width:560px;flex:1;min-height:0;display:flex;flex-direction:column">
              <div class="row" style="grid-template-columns:${PH_GRID()};border-top:0;padding-top:0;padding-bottom:0;flex:none">
                ${thS("reference", "Référence", "padding:12px 0", false, boutonToutEffacer("stock"))}
                ${thS("emplacement", "Emplacement", "padding:12px 0")}
                ${thS("qte", "Qté", "padding:12px 0", true)}
                <span class="th" style="position:absolute;width:1px;height:1px;overflow:hidden">Actions</span>
              </div>
              <div class="serre" ${S.stockPhonePageSize==="all" ? 'style="overflow:auto"' : 'data-rangs="stock" data-rangh="'+ROW_H+'"'}>${rowsHtml}</div>
              ${!filtered.length ? `
              <div style="padding:46px 16px;text-align:center;display:flex;flex-direction:column;gap:7px">
                <span style="font-weight:600">Aucune référence ne correspond</span>
                <span style="font-size:12.5px;color:var(--muted)">Vérifiez l'orthographe ou retirez les filtres</span>
              </div>`:""}
            </div>
          </div>
          ${filtered.length ? `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;flex:none">
            <span style="flex:1">${pageFiltered.length} sur ${filtered.length} référence${filtered.length>1?"s":""} · page ${phonePage+1} sur ${phonePageCount}</span>
            <label style="display:flex;align-items:center;gap:7px">Afficher<select class="inp" style="padding:5px 8px;font-size:12.5px" ${ong(e=>set({stockPhonePageSize:["all","auto"].includes(e.target.value)?e.target.value:Number(e.target.value),stockPhonePage:0}))}><option value="auto" ${S.stockPhonePageSize==="auto"?"selected":""}>Auto</option><option value="20" ${S.stockPhonePageSize===20?"selected":""}>20</option><option value="50" ${S.stockPhonePageSize===50?"selected":""}>50</option><option value="all" ${S.stockPhonePageSize==="all"?"selected":""}>Tout</option></select></label>
            <button class="btn btn-sm" ${phonePage<=0?"disabled":""} ${on(()=>setT({stockPhonePage:phonePage-1}))}>Précédent</button>
            <button class="btn btn-sm" ${phonePage>=phonePageCount-1?"disabled":""} ${on(()=>setT({stockPhonePage:phonePage+1}))}>Suivant</button>
          </div>` : ""}
        </section>

        <aside class="card" aria-label="Derniers mouvements" style="flex:1 1 300px;min-width:0;align-self:flex-start">
          <div style="display:flex;align-items:center;padding:16px 18px 12px">
            <h2 style="margin:0;font-size:14px;font-weight:700;flex:1">Derniers mouvements</h2>
            <a href="#" ${on(e=>{ e.preventDefault(); set({page:"journal"}); })} style="font-size:12.5px;font-weight:600">Tout voir</a>
          </div>
          ${mouvementsHtml || `<div style="padding:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px">Aucun mouvement enregistré.</div>`}
        </aside>
      </div>
    </div>`;
    if(S.stockVue==="pieces") body = pagePieces();
  }

  /* ---------- page : plan de l'armoire ---------- */
  if(S.page==="armoire" && sansArmoire){
    body = `
    <div style="flex:1;display:grid;place-items:center;padding:40px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;max-width:420px;text-align:center">
        <span style="font:600 15px/1.3 Inter,system-ui,sans-serif;color:var(--c-c3c9d3)">Aucune armoire</span>
        <span style="font:400 12px/1.5 Inter,system-ui,sans-serif;color:var(--c-6d7480)">Les téléphones sont rangés dans des casiers, répartis en étagères et en colonnes. Créez une première armoire pour commencer.</span>
        <button class="btn-pri" style="padding:9px 16px" ${on(addCabinet)}>Créer une armoire</button>
      </div>
    </div>`;
  }
  else if(S.page==="armoire"){
    const SH = Array.from({length:activeCab.shelves},(_,i)=>"E"+(i+1));
    const CO = Array.from({length:activeCab.cols},(_,i)=>"C"+(i+1));

    /* Le serveur fixe lui-même les occupants déjà présents pour que le
       placement automatique ne les déplace pas : le casier devient partagé. */
    const assignTo = async (loc)=>{
      if(!assigning) return;
      const cible = assigning.id;
      if(await agir("armoire.affecter", { refId:cible, loc })){
        setT({ assigning:null, selId:cible });
      }
    };

    const colHasMatch = c => searching && S.refs.some(r=>matchIds.includes(r.id) && place[r.id] && place[r.id].cab===activeCab.id && place[r.id].col===c);
    const shelfHasMatch = sh => searching && S.refs.some(r=>matchIds.includes(r.id) && place[r.id] && place[r.id].cab===activeCab.id && place[r.id].shelf===sh);
    const grille = `grid-template-columns:36px repeat(${activeCab.cols}, minmax(0, 1fr))`;

    const shelvesHtml = SH.map(sh=>{
      const cells = CO.map(c=>{
        const rs = S.refs.filter(x=>{ const pl=place[x.id]; return pl && pl.cab===activeCab.id && pl.shelf===sh && pl.col===c; });
        const r = rs[0];
        const loc = activeCab.id+"·"+sh+"·"+c;
        const isSel = rs.some(x=>x.id===S.selId);
        const isMatch = rs.some(x=>matchIds.includes(x.id));
        const dimmed = searching && !isMatch;
        const totalQty = rs.reduce((n,x)=>n+x.qty, 0);
        const classes = ["cell", !r ? "empty" : "", isSel ? "sel" : "", isMatch ? "hit" : "", dimmed ? "dim" : "", assigning ? "assign" : ""].filter(Boolean).join(" ");
        const libelle = r ? r.brand+" "+r.model+(rs.length>1?" et "+(rs.length-1)+" autre"+(rs.length>2?"s":""):"")+", "+totalQty+" unité"+(totalQty>1?"s":"")
                          : "Casier libre";
        // La bulle : sous les casiers de la première étagère (au-dessus, elle sortirait de la carte),
        // et calée sur le bord pour les colonnes des extrémités.
        const ci = CO.indexOf(c);
        const placeBulle = (sh===SH[0] ? "top:calc(100% + 8px);" : "bottom:calc(100% + 8px);")
          + (ci===0 && CO.length>1 ? "left:0;" : ci===CO.length-1 && CO.length>1 ? "right:0;" : "left:50%;transform:translateX(-50%);");
        const bulle = `<span class="tip" role="tooltip" style="${placeBulle}">
            ${!rs.length ? `<span style="font-size:13px;font-weight:600">Casier libre</span><span style="font-size:12px;color:var(--muted)">Aucune référence affectée</span>`
              : rs.length===1 ? `<span style="font-size:13px;font-weight:600">${esc(r.brand+" "+r.model)}</span><span style="font-size:12px;color:var(--muted)">${esc(r.variantSummary||"")}</span>`
              : rs.map(x=>`<span style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span style="font-size:12.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.brand+" "+x.model)}</span><span class="num" style="font-size:12px;color:var(--muted)">${x.qty} u.</span></span>`).join("")}
            <span style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px;border-top:1px solid var(--line)">
              <span class="mono" style="font-size:12px;color:var(--soft)">${esc(loc)}</span>
              <span class="num" style="font-size:12px;font-weight:600">${totalQty} u.</span>
            </span>
          </span>`;
        return `
        <button class="${classes}" type="button" aria-label="${esc(loc+" : "+libelle)}" ${on(()=>{
            if(assigning) return assignTo(loc);
            if(!rs.length) return setT({selId:null});
            const idx = rs.findIndex(x=>x.id===S.selId);
            setT({selId: rs[(idx+1)%rs.length].id});
          })}>
          <span style="display:flex;align-items:center;gap:6px">
            <span class="mono" style="font-size:12px;color:var(--muted)">${esc(sh+"·"+c)}</span>
          </span>
          ${r ? `<span style="display:block;min-width:0">
            <span style="display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.model)}${rs.length>1?" +"+(rs.length-1):""}</span>
            <span class="num" style="display:block;font-size:12px;color:var(--muted)">${totalQty} u.</span>
          </span>` : `<span style="font-size:12.5px">Libre</span>`}
          ${bulle}
        </button>`;
      }).join("");
      return `<div style="display:grid;${grille};gap:10px;align-items:stretch">
        <span class="over" style="align-self:center;${shelfHasMatch(sh)?"color:var(--gold)":""}">${sh}</span>${cells}</div>`;
    }).join("");

    const colHeads = CO.map(c=>`<span class="over" style="text-align:center;${colHasMatch(c)?"color:var(--gold)":""}">${c}</span>`).join("");

    /* panneau latéral : le détail du casier choisi */
    let panel;
    if(sel){
      const pl = place[sel.id];
      const fixed = !!S.assignments[sel.id];
      const cohab = pl ? S.refs.filter(x=>place[x.id] && place[x.id].loc===pl.loc) : [sel];
      const ligneSous = (pastille, haut, bas2, droite, actions)=>`
        <div style="padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px">
          <span style="width:6px;height:6px;flex:none;border-radius:50%;background:${pastille};display:block"></span>
          <span style="flex:1 1 90px;min-width:0">
            <span style="display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(haut)}</span>
            <span class="num" style="display:block;font-size:12px;color:var(--muted)">${esc(bas2)}</span>
          </span>
          <span class="num" style="font-weight:600;font-size:12.5px;color:${pastille}">${droite}</span>
          ${actions ? `<span style="margin-left:auto">${actions}</span>` : ""}
        </div>`;
      const resHtml = sel.reservations.map((r,k)=>ligneSous("var(--warn)", r.who, r.variant+" · "+dateCourte(r.iso), r.qty+" u.",
        `<span style="display:flex;gap:4px"><button class="btn btn-sm" ${on(()=>resolveReservation(sel,k,"sell"))}>Sortir</button><button class="btn btn-sm btn-danger" ${on(()=>resolveReservation(sel,k,"cancel"))}>Annuler</button></span>`)).join("");
      const outsHtml = sel.outs.map((o,k)=>ligneSous("var(--warn)", o.who, o.variant+" · "+dateCourte(o.iso)+" "+heureMinute(o.iso), o.qty+" u.",
        `<button class="btn btn-sm" ${on(()=>returnOut(sel,k))}>Retourner</button>`)).join("");
      const variantsHtml = sel.variants.map(v=>`
        <div style="padding:9px 12px;display:flex;align-items:center;gap:10px">
          <span style="width:10px;height:10px;flex:none;border-radius:3px;display:block;border:1px solid var(--line);background:${esc(v.swatch)}"></span>
          <span style="flex:1;min-width:0;font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(v.capa+" · "+v.color)}</span>
          <span class="num" style="font-weight:600;font-size:12.5px">${v.qty} u.</span>
        </div>`).join("");
      const titreSection = t=>`<div class="over" style="margin-bottom:8px">${t}</div>`;

      panel = `
      <div style="display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;align-items:center;gap:10px">
          <span class="badge b-loc" style="height:26px;font-size:13px">${esc(locOf(sel))}</span>
          <span style="flex:1"></span>
          <button class="btn btn-icon btn-ghost" type="button" aria-label="Fermer le détail" ${on(()=>setT({selId:null}))}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div>
          <div style="font-size:18px;font-weight:700">${esc(sel.brand+" "+sel.model)}</div>
          <div style="font-size:12.5px;color:var(--muted);margin-top:2px">${esc(sel.brand)} · <span class="mono">${esc(sel.mpn)}</span> · ${esc(sel.variantSummary)}</div>
          <div style="font-size:12.5px;color:var(--muted);margin-top:2px">${pl ? "Armoire "+esc(pl.cab)+" · étagère "+esc(pl.shelf.slice(1))+" · casier "+esc(pl.col.slice(1)) : "Aucun casier disponible"}</div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
          <div style="padding:12px;border-radius:10px;background:var(--raised)"><div class="over">En casier</div><div class="num" style="font-size:24px;font-weight:700">${sel.qty}</div></div>
          <div style="padding:12px;border-radius:10px;background:var(--raised)"><div class="over">Réservées</div><div class="num" style="font-size:24px;font-weight:700${sel.reserved?";color:var(--warn)":""}">${sel.reserved}</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)">
          <span>${fixed?"Casier choisi à la main":"Casier attribué automatiquement"}</span>
          ${fixed?`<button class="btn btn-sm" ${on(()=>agir("armoire.liberer",{refId:sel.id}))}>Libérer le casier</button>`:""}
        </div>

        ${cohab.length>1 ? `
        <div>${titreSection("Modèles dans ce casier ("+cohab.length+")")}
          <div class="card" style="overflow:hidden">${cohab.map((x,n)=>`
            <button ${on(()=>setT({selId:x.id}))} style="display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;${n?"border-top:1px solid var(--line);":""}background:${x.id===sel.id?"var(--raised)":"transparent"};color:var(--ink);text-align:left;cursor:pointer">
              <span style="width:6px;height:6px;flex:none;border-radius:50%;background:${x.id===sel.id?"var(--gold)":"var(--muted)"};display:block"></span>
              <span style="flex:1;min-width:0;font-size:13px;${x.id===sel.id?"font-weight:600;":""}white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.brand+" "+x.model)}</span>
              <span class="num" style="font-weight:600;font-size:12.5px">${x.qty} u.</span>
            </button>`).join("")}</div>
        </div>` : ""}

        ${sel.reservations.length ? `<div>${titreSection("Réservé")}<div class="card" style="overflow:hidden;border-color:var(--warn)">${resHtml}</div></div>` : ""}

        <div>${titreSection("Sorties actives")}
          <div class="card" style="overflow:hidden">${sel.outs.length ? outsHtml : '<div style="padding:12px;font-size:13px;color:var(--muted)">Aucune sortie en cours sur ce casier</div>'}</div>
        </div>

        <div>${titreSection("Variantes dans ce casier")}<div class="card" style="overflow:hidden">${variantsHtml}</div></div>

        <div style="display:flex;flex-wrap:wrap;gap:8px">
          <button class="btn btn-sm btn-primary" ${on(()=>openOp("sortie"))}>Sortir</button>
          <button class="btn btn-sm" ${on(()=>openOp("reserve"))}>Réserver</button>
          <button class="btn btn-sm" ${on(()=>setT({assigning:sel.id}))}>Déplacer</button>
          <button class="btn btn-sm" ${on(()=>set({page:"stock", colFiltres:Object.assign({}, S.colFiltres, {stock:Object.assign({}, S.colFiltres.stock, {reference:sel.model})}), stockPhonePage:0}))}>Voir la référence</button>
        </div>
      </div>`;
    } else {
      panel = `
      <div>
        <div style="font-size:15px;font-weight:700">Sélectionnez un casier</div>
        <p style="margin:8px 0 0;font-size:13px;color:var(--muted);line-height:1.55">Cliquez un casier pour voir son contenu, ou cherchez un modèle : les casiers correspondants s'allument et le reste de l'armoire s'estompe.</p>
      </div>`;
    }

    const alerteCapacite = unplaced ? `
      <section aria-label="Alerte capacité" style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:14px 18px;border-radius:12px;background:var(--warn-bg)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--warn);flex-shrink:0"><path d="M12 4 2.5 20h19Z"/><path d="M12 10v4.5M12 17.5v.01"/></svg>
        <div style="flex:1 1 260px"><strong>${unplaced} modèle${unplaced>1?"s":""} n'${unplaced>1?"ont":"a"} pas de casier</strong><span style="color:var(--soft)"> — ${S.refs.length} modèle${S.refs.length>1?"s":""} pour ${capacity} casier${capacity>1?"s":""}. ${ADMIN ? "Agrandissez l'armoire "+esc(activeCab.id)+" ou ajoutez-en une." : "Signalez-le à un administrateur."}</span></div>
        <button class="btn btn-sm" type="button" ${on(()=>set({page:"stock", colFiltres:Object.assign({}, S.colFiltres, {stock:Object.assign({}, S.colFiltres.stock, {emplacement:"__nonplace"})}), stockPhonePage:0}))}>Voir les non placés</button>
      </section>` : "";

    const panneauDimensions = (ADMIN && S.armoireEdition) ? `
      <section class="card" aria-label="Dimensions de l'armoire" style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px 18px">
        <label style="display:flex;align-items:center;gap:10px;font-size:13px;color:var(--soft)">Étagères
          <span class="step"><button class="stepbtn" type="button" aria-label="Retirer une étagère" ${on(()=>setDim(activeCab.id,"shelves",-1))}>−</button><span>${activeCab.shelves}</span><button class="stepbtn" type="button" aria-label="Ajouter une étagère" ${on(()=>setDim(activeCab.id,"shelves",1))}>+</button></span></label>
        <label style="display:flex;align-items:center;gap:10px;font-size:13px;color:var(--soft)">Casiers par étagère
          <span class="step"><button class="stepbtn" type="button" aria-label="Retirer un casier" ${on(()=>setDim(activeCab.id,"cols",-1))}>−</button><span>${activeCab.cols}</span><button class="stepbtn" type="button" aria-label="Ajouter un casier" ${on(()=>setDim(activeCab.id,"cols",1))}>+</button></span></label>
        <span style="flex:1;font-size:12.5px;color:var(--muted)">${capacity} casier${capacity>1?"s":""} au total</span>
        <button class="btn btn-sm btn-ghost" type="button" style="color:${S.cabinets.length>1?"var(--danger)":"var(--muted)"}" ${S.cabinets.length>1?"":"disabled title=\"Il faut garder au moins une armoire\""}
          ${on(()=>{ if(S.cabinets.length>1 && confirm("Supprimer l'armoire « "+activeCab.id+" » ?\n\nLes modèles qui y sont rangés perdront leur casier.")) removeCabinet(activeCab.id); })}>Supprimer l'armoire</button>
      </section>` : "";

    body = `
    <div style="flex:1;min-height:0;padding:20px 32px 40px;display:flex;flex-direction:column;gap:20px;min-width:0;overflow:auto">
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px">
        <span class="over" style="margin-right:4px">Armoire</span>
        ${S.cabinets.map(c=>`<button class="chip${c.id===S.cabinet?" on":""}" type="button" ${on(()=>set({cabinet:c.id}))}>${esc(c.id)} <span style="color:var(--muted);font-weight:500">${c.shelves} × ${c.cols}</span></button>`).join("")}
        ${ADMIN ? `<button class="chip" type="button" style="border-style:dashed;color:var(--muted)" ${on(addCabinet)}>+ Ajouter une armoire</button>` : ""}
        <span style="flex:1"></span>
        ${ADMIN ? `<button class="btn btn-sm${S.armoireEdition?" btn-primary":""}" type="button" aria-pressed="${!!S.armoireEdition}" ${on(()=>setT({armoireEdition:!S.armoireEdition}))}><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16Z"/><path d="m13.5 6.5 4 4"/></svg>Dimensions</button>` : ""}
      </div>

      ${panneauDimensions}
      ${alerteCapacite}

      ${assigning ? `
      <div style="background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:13px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <span style="width:8px;height:8px;border-radius:50%;background:var(--gold);display:block"></span>
        <span style="font-size:13.5px">Cliquez le casier où ranger <strong>${esc(assigning.brand+" "+assigning.model)}</strong></span>
        <span style="font-size:12.5px;color:var(--muted)">${place[assigning.id] ? "actuellement en "+esc(place[assigning.id].loc) : "actuellement sans casier"} · un casier occupé sera partagé</span>
        <button class="btn btn-sm" style="margin-left:auto" ${on(()=>setT({assigning:null}))}>Annuler</button>
      </div>`:""}

      <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
        <section class="card" aria-label="Armoire ${esc(activeCab.id)}" style="flex:999 1 640px;min-width:0;padding:18px 20px">
          <div style="overflow-x:auto">
            <div style="min-width:640px;display:flex;flex-direction:column;gap:10px">
              <div style="display:grid;${grille};gap:10px"><span></span>${colHeads}</div>
              ${shelvesHtml}
            </div>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:16px;font-size:12.5px;color:var(--muted)">
            <span style="display:inline-flex;align-items:center;gap:8px"><span style="width:14px;height:14px;border-radius:4px;background:var(--raised);border:1px solid var(--line)"></span>Occupé</span>
            <span style="display:inline-flex;align-items:center;gap:8px"><span style="width:14px;height:14px;border-radius:4px;border:1px dashed var(--muted)"></span>Libre</span>
            <span style="display:inline-flex;align-items:center;gap:8px"><span style="width:14px;height:14px;border-radius:4px;background:var(--gold-soft);border:1px solid var(--gold)"></span>Résultat de recherche</span>
          </div>
        </section>

        <aside class="card" aria-label="Détail du casier" style="flex:1 1 300px;min-width:0;padding:20px">${panel}</aside>
      </div>
    </div>`;
  }

  /* ---------- page : stock de matériel ---------- */
  if(S.page==="materiel"){
    const articlesAttribues = new Set(Object.values(S.dotations)
      .flat().map(d=>d.article));
    const catalogueCommun = S.materiel.filter(m=>!articlesAttribues.has(m.name));
    const cats = ["Toutes", ...Array.from(new Set(catalogueCommun.map(m=>m.cat)))];
    const t = S.matQuery.trim().toLowerCase();
    /* Les filtres par colonne, qui s'ajoutent à la catégorie et à la recherche. Un
       filtre vide ne filtre rien ; chaque colonne a le sien. */
    const fc = filtresDe("materiel");
    const reserves = m=>(S.matRes[m.id||m.name]||[]).filter(r=>!r.returned);
    const missionsDe = m=>reserves(m).map(r=>r.mission || SANS_MISSION);
    // La colonne « Article » filtre par catégorie : l'ancien filtre de texte n'a plus d'écran, on
    // l'ignore plutôt que de laisser un filtre invisible. La recherche de la page cherche les noms.
    const colonnesActives = Object.keys(fc).filter(k=>k!=="article" && fc[k]!=="");
    const passeColonnes = m=>{
      if(fc.cat && m.cat !== fc.cat) return false;
      if(fc.affectation && m.affectation !== fc.affectation) return false;
      if(fc.qte==="epuise" && m.qty > 0) return false;
      if(fc.qte==="stock" && m.qty <= 0) return false;
      if(fc.mission==="__aucune" && reserves(m).length) return false;
      if(fc.mission && fc.mission!=="__aucune" && !missionsDe(m).includes(fc.mission)) return false;
      if(fc.reservation==="reserve" && !reserves(m).length) return false;
      if(fc.reservation==="libre" && reserves(m).length) return false;
      return true;
    };
    const filtered = catalogueCommun.filter(m=>{
      if(!passeColonnes(m)) return false;
      if(!t) return true;
      const identifiant = m.id||m.name;
      const missions = (S.matRes[identifiant]||[]).map(r=>r.mission+" "+(r.by||"")).join(" ");
      return (m.name+" "+m.cat+" "+m.affectation+" "+(m.etiquette||"")+" "+(m.numeroSerie||"")+" "+missions).toLowerCase().includes(t);
    }).sort((a, b)=>{
      // Rangé par catégorie, dans l'ordre des catégories proposées (puis les autres) ; à
      // l'intérieur, l'ordre du stock est conservé (le tri est stable).
      const rang = c=>{ const i = CATEGORIES_MATERIEL.indexOf(c); return i < 0 ? CATEGORIES_MATERIEL.length : i; };
      return rang(a.cat) - rang(b.cat) || (rang(a.cat) === CATEGORIES_MATERIEL.length ? a.cat.localeCompare(b.cat, "fr") : 0);
    });
    const parCategorie = {};
    filtered.forEach(m=>{ parCategorie[m.cat] = (parCategorie[m.cat]||0) + 1; });
    const materialPageSize = S.stockMaterialPageSize === "all"
      ? Math.max(1, filtered.length)
      : S.stockMaterialPageSize === "auto"
      ? rangsQuiTiennent("materiel", 46)
      : ([20,50].includes(Number(S.stockMaterialPageSize)) ? Number(S.stockMaterialPageSize) : 20);
    const materialPageCount = Math.max(1, Math.ceil(filtered.length/materialPageSize));
    const materialPage = Math.min(Math.max(0, Number(S.stockMaterialPage)||0), materialPageCount-1);
    S.stockMaterialPage = materialPage;
    const pageFiltered = filtered.slice(materialPage*materialPageSize, (materialPage+1)*materialPageSize);
    const selCount = Object.keys(S.matSel).length;
    // Une malette supprimée ou sortie entre-temps ne doit pas rester au
    // panier : la sélection se relit contre l'état courant, pas contre le
    // souvenir qu'en avait l'écran.
    const packsChoisis = Object.keys(S.packSel)
      .filter(nom=>{ const pk = S.packs.find(x=>x.name===nom); return pk && packDisponible(pk); });
    const selTotal = selCount + packsChoisis.length;

    const groupes = [];
    const groupesParNom = new Map();
    pageFiltered.forEach(m=>{
      const groupe = groupesParNom.get(m.name);
      if(groupe) groupe.push(m);
      else {
        const nouveau = [m];
        groupesParNom.set(m.name, nouveau);
        groupes.push(nouveau);
      }
    });
    const caseHtml = (cochee, fn, titre)=>`<button type="button" role="checkbox" aria-checked="${cochee}" aria-label="${esc(titre)}" ${on(fn)}
      style="width:16px;height:16px;flex:none;border-radius:4px;display:grid;place-items:center;font:700 12px/1 Inter,system-ui,sans-serif;padding:0;${cochee?"background:var(--gold);border:1px solid var(--gold);color:var(--gold-ink)":"background:transparent;border:1px solid var(--muted);color:transparent"}">${cochee?"✓":""}</button>`;
    let categorieCourante = null;
    const rowsHtml = groupes.map(articles=>{
      const nomGroupe = articles[0].name;
      const ouvert = articles.length < 2 || !!S.matGroups[nomGroupe];
      // Un bandeau annonce chaque catégorie, avec son nombre d'articles.
      let bandeau = "";
      if(articles[0].cat !== categorieCourante){
        categorieCourante = articles[0].cat;
        bandeau = `<div class="ghead"><span class="over" style="color:var(--soft)">${esc(categorieCourante)}</span><span style="font-size:12px;color:var(--muted)">${parCategorie[categorieCourante]} article${parCategorie[categorieCourante]>1?"s":""}</span></div>`;
      }
      const enTete = articles.length > 1 ? `
        <button class="row" ${on(()=>setT({matGroups:Object.assign({},S.matGroups,{[nomGroupe]:!ouvert})}))}
          aria-expanded="${ouvert}" style="grid-template-columns:auto 1fr auto;width:100%;border-left:0;border-right:0;border-bottom:0;background:var(--raised);color:var(--ink);text-align:left;cursor:pointer;column-gap:10px${ouvert?";box-shadow:inset 3px 0 0 var(--gold)":""}">
          <span style="width:12px;color:var(--gold);font-weight:700">${ouvert?"▾":"▸"}</span>
          <span style="font-weight:600">${esc(nomGroupe)}</span>
          <span style="font-size:12px;color:var(--muted)">${articles.length} exemplaires</span>
        </button>` : "";
      if(!ouvert) return bandeau + enTete;
      const enfant = articles.length > 1;
      return bandeau + enTete + articles.map((m, rang)=>{
      const identifiant = m.id||m.name;
      const resList = (S.matRes[identifiant]||[]).filter(r=>!r.returned);
      const resTotal = resList.reduce((n,r)=>n+r.qty,0);
      const checked = !!S.matSel[identifiant];
      const idMenu = "mat:"+identifiant;
      return `
      <div class="row" style="grid-template-columns:${MAT_GRID()};min-height:54px;box-sizing:border-box${enfant?";background:var(--raised);box-shadow:inset 3px 0 0 var(--gold)":""}">
        <div style="min-width:0;display:flex;align-items:center;gap:12px">
          ${caseHtml(checked, ()=>{ if(S.matSel[identifiant]) delete S.matSel[identifiant]; else S.matSel[identifiant]=true; render(); }, "Sélectionner "+m.name)}
          <div style="min-width:0">
            <div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.name)}${m.licenceFin ? `<img src="{% static 'stock/licence-logicielle.svg' %}" width="18" height="18" alt="${esc(libelleLicence(m.licenceFin))}" title="${esc(libelleLicence(m.licenceFin))}" tabindex="0" style="vertical-align:-4px;margin-left:8px;cursor:help">` : ""}</div>
            ${m.etiquette||m.numeroSerie?`<div style="font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span class="mono">${m.etiquette?esc(m.etiquette):""}${m.etiquette&&m.numeroSerie?" · ":""}${m.numeroSerie?esc(m.numeroSerie):""}</span></div>`:""}
          </div>
        </div>
        <div style="min-width:0">
          <select class="affect ${affectCls(m.affectation)}" aria-label="Affectation de ${esc(m.name)}" ${ong(e=>agir("materiel.affectation",{nom:identifiant, affectation:e.target.value}))}>
            ${AFFECTATIONS.map(a=>`<option value="${esc(a)}"${a===m.affectation?" selected":""}>${esc(a)}</option>`).join("")}
          </select>
        </div>
        <div class="num" style="text-align:right;font-weight:600;font-size:15px">${m.qty}</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;min-width:0">
          ${resList.map(r=>`<span class="badge b-tag b-info" style="max-width:100%;overflow:hidden;text-overflow:ellipsis">${esc((r.mission&&r.mission!==SANS_MISSION?r.mission+" · ":"")+r.qty+" u.")}</span>`).join("")}
        </div>
        <div>
          ${resTotal ? `<button class="badge b-tag b-warn" type="button" style="border:0;cursor:pointer" title="Voir ou modifier les réservations" ${on(()=>openMatRes(m))}>${resTotal} u. réservée${resTotal>1?"s":""}</button>` : ""}
        </div>
        <div style="display:flex;justify-content:flex-end;align-items:center;gap:4px">
          <span class="acts"><button class="btn btn-sm btn-ghost" type="button" ${on(()=>openMatRes(m))}>Réserver</button></span>
          ${ADMIN ? `<span class="acts${S.menuLigne===idMenu?" ouvert":""}">${menuPlus(idMenu, [
            {libelle:"Modifier…", fn:()=>openMatEdit(m)},
            {libelle:"Attribuer à une personne", fn:()=>ouvrirAttribution(m)},
            {libelle:"Supprimer…", danger:true, desactive:!!resTotal,
             titre:resTotal ? "Impossible tant que cet article est emprunté" : "", fn:()=>supprimerMateriel(m)},
          ])}</span>` : ""}
        </div>
      </div>`;
      }).join("");
    }).join("");

    /* Les malettes, au-dessus des articles qu'elles contiennent. Elles
       partagent la recherche de la page : chercher « tournevis » doit
       montrer l'article et la malette qui le transporte. */
    const visibles = S.packs.filter(x=>{
      if(!t) return true;
      const contenu = x.items.map(i=>i.libelle).join(" ");
      return (x.name+" "+(x.etiquette||"")+" "+x.owner+" "+contenu).toLowerCase().includes(t);
    });
    const SVG_MALETTE = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M9 8V5.5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1V8M3 13h18"/></svg>`;
    /* Beaucoup de malettes : un filtre par état, et seules les premières sont montrées
       d'emblée — le tableau des articles, dessous, reste à portée de vue. */
    const PACKS_VISIBLES = 6;
    const parEtat = {tous:visibles.length, range:0, sorti:0, partiel:0};
    visibles.forEach(x=>{ parEtat[packEtat(x)]++; });
    const filtre = parEtat[S.packFiltre]!==undefined ? S.packFiltre : "tous";
    const filtrees = visibles.filter(x=>filtre==="tous" || packEtat(x)===filtre);
    const affichees = (S.packsTout || filtrees.length<=PACKS_VISIBLES+1) ? filtrees : filtrees.slice(0, PACKS_VISIBLES);
    const cartes = affichees.map(pack=>{
      const etat = packEtat(pack);
      const dehors = packSorties(pack.name);
      const manquants = packManquants(pack);
      const deplie = !!S.packOuverts[pack.name];
      // Une malette dehors ou incomplète en stock ne se met pas au panier :
      // la cocher promettrait un départ que le serveur refuserait.
      const selectionnable = packDisponible(pack);
      const coche = selectionnable && !!S.packSel[pack.name];
      const badge = etat==="sorti" ? '<span class="badge b-warn">Dehors</span>'
        : etat==="partiel" ? '<span class="badge b-danger">Incomplète</span>'
        : '<span class="badge b-ok">Rangée</span>';

      const sortiesParArticle = {};
      dehors.forEach(d=>{ sortiesParArticle[d.id] = (sortiesParArticle[d.id]||0) + d.qty; });

      const lignes = pack.items.map(i=>{
        const sorti = sortiesParArticle[i.id]||0;
        const dispo = i.manquant ? 0 : matAvailable(i.id);
        const court = !i.manquant && !sorti && dispo < i.qty;
        const detail = [i.etiquette?"étiquette "+i.etiquette:"", i.numeroSerie?"série "+i.numeroSerie:""].filter(Boolean).join(" · ");
        return `
        <div style="padding:9px 18px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line)">
          <span class="num" style="width:26px;flex:none;font-weight:600;color:var(--muted)">${i.qty}×</span>
          <span style="flex:1;min-width:0">
            <span style="display:block;font-size:13px;${i.manquant?"color:var(--danger)":""};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.libelle)}</span>
            ${detail?`<span class="mono" style="display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(detail)}</span>`:""}
          </span>
          ${i.manquant ? '<span style="font-size:12px;color:var(--danger);white-space:nowrap">article supprimé</span>'
            : sorti ? `<span style="font-size:12px;color:var(--warn);white-space:nowrap">${sorti} dehors</span>`
            : court ? `<span style="font-size:12px;color:var(--danger);white-space:nowrap">disp. ${dispo}</span>`
            : `<span style="font-size:12px;color:var(--muted);white-space:nowrap">disp. ${dispo}</span>`}
        </div>`;
      }).join("");

      const missions = Array.from(new Set(dehors.map(d=>d.mission).filter(m=>m && m!==SANS_MISSION)));
      const idMenu = "pack:"+pack.name;

      return `
      <div class="card" style="min-width:0;overflow:hidden">
        <div style="display:flex;align-items:center;gap:12px;padding:14px 16px 10px">
          ${selectionnable ? caseHtml(coche, ()=>{ if(S.packSel[pack.name]) delete S.packSel[pack.name]; else S.packSel[pack.name]=true; render(); }, "Sélectionner la malette "+pack.name) : ""}
          <div style="width:36px;height:36px;border-radius:10px;background:var(--gold-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0">${SVG_MALETTE}</div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:8px"><strong style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(pack.name)}">${esc(pack.name)}</strong>${badge}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${pack.etiquette?`<span class="mono">${esc(pack.etiquette)}</span> · `:""}${pack.items.length} article${pack.items.length>1?"s":""} · par ${esc(pack.owner)}</div>
          </div>
          ${menuPlus(idMenu, [
            ...(etat!=="sorti" && pack.items.length ? [{libelle:"Sortir une partie", fn:()=>openPackBorrow(pack, true)}] : []),
            {libelle:"Modifier", fn:()=>openPackEdit(pack)},
            {libelle:"Supprimer…", danger:true, desactive:!!dehors.length, titre:dehors.length ? "Impossible tant que la malette est dehors" : "", fn:()=>supprimerPack(pack)},
          ])}
        </div>
        ${missions.length||(etat==="range" && manquants.length) ? `<div style="padding:0 16px 8px;display:flex;flex-direction:column;gap:2px">
          ${missions.length?`<div style="font-size:12px;color:var(--info)">Sortie pour ${esc(missions.join(", "))}</div>`:""}
          ${etat==="range" && manquants.length?`<div style="font-size:12px;color:var(--danger)">Incomplète en stock : ${esc(manquants.map(i=>i.libelle).join(", "))}</div>`:""}
        </div>` : ""}
        <div style="display:flex;gap:6px;align-items:center;padding:0 16px 14px">
          ${etat==="range"
            ? `<button class="btn btn-sm btn-primary${packDisponible(pack)?"":" off"}" type="button"${packDisponible(pack)?"":" disabled"} ${on(()=>{ if(packDisponible(pack)) openPackBorrow(pack); })}>Emprunter</button>`
            : `<button class="btn btn-sm btn-primary" type="button" ${on(()=>agir("pack.retour",{pack:pack.name}))}>Rendre la malette</button>`}
          <button class="btn btn-sm" type="button" aria-expanded="${deplie}" ${on(()=>setT({packOuverts:Object.assign({},S.packOuverts,{[pack.name]:!deplie})}))}>${deplie?"Masquer":"Contenu"}</button>
        </div>
        ${deplie?`<div>${lignes||'<div style="padding:12px 18px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)">Malette vide</div>'}</div>`:""}
      </div>`;
    }).join("");

    const puce = (cle, libelle)=>parEtat[cle] || cle==="tous"
      ? `<button class="chip${filtre===cle?" on":""}" type="button" aria-pressed="${filtre===cle}" ${on(()=>setT({packFiltre:cle, packsTout:false}))}>${libelle} <span style="color:var(--muted);font-weight:500">${parEtat[cle]}</span></button>` : "";
    const bandePacks = (t && !visibles.length) ? "" : `
      <section aria-label="Malettes" style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px">
          <h2 style="margin:0;font-size:14px;font-weight:700">Malettes</h2><span class="count">${S.packs.length}</span>
          ${S.packs.length>1 ? `<span style="display:flex;flex-wrap:wrap;gap:6px;margin-left:6px">${puce("tous","Toutes")}${puce("range","Rangées")}${puce("sorti","Dehors")}${puce("partiel","Incomplètes")}</span>` : ""}
          <button class="btn btn-sm" type="button" style="margin-left:auto" ${on(()=>openPackEdit())}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nouveau pack</button>
        </div>
        ${cartes ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px;align-items:start">${cartes}</div>`
          : `<div class="card" style="padding:16px 18px;font-size:13px;color:var(--muted)">${S.packs.length ? "Aucune malette dans cet état." : "Une malette regroupe plusieurs articles pour les emporter d'un seul geste — un pelicase et son contenu, pris en une fois."}</div>`}
        ${filtrees.length>affichees.length || (S.packsTout && filtrees.length>PACKS_VISIBLES+1) ? `
        <div style="display:flex;justify-content:center">
          <button class="btn btn-sm" type="button" ${on(()=>setT({packsTout:!S.packsTout}))}>${S.packsTout ? "Réduire la liste" : "Afficher les "+(filtrees.length-affichees.length)+" autres malettes"}</button>
        </div>` : ""}
      </section>`;

    const missionsConnues = Array.from(new Set(catalogueCommun.flatMap(missionsDe))).sort((a,b)=>a.localeCompare(b, "fr"));
    const controles = {
      article: {label:"Contient", texte:"Nom, étiquette, série…"},
      cat: {liste:cats.filter(c=>c!=="Toutes").map(c=>[c, c])},
      affectation: {liste:AFFECTATIONS.map(a=>[a, a])},
      qte: {liste:[["stock", "En stock (> 0)"], ["epuise", "Épuisé (0)"]]},
      mission: {liste:[["__aucune", "Aucune réservation"], ...missionsConnues.map(m=>[m, m])]},
      reservation: {liste:[["reserve", "Réservés"], ["libre", "Libres"]]},
    };
    const thF = (col, titre, style, droite, avant)=>thFiltrable("materiel", col, titre, controles[col], style, droite, avant);
    const toutEffacer = boutonToutEffacer("materiel");

    // Ce qui est réservé ou parti en mission, en un coup d'œil.
    const nbReserves = catalogueCommun.filter(m=>reserves(m).length).length;
    const nbEnMission = catalogueCommun.filter(m=>missionsDe(m).some(x=>x!==SANS_MISSION)).length;
    const filtreCat = fc.cat ? `<span class="chip on" style="gap:8px">Catégorie : ${esc(fc.cat)}<button type="button" aria-label="Retirer le filtre de catégorie" ${on(()=>poserFiltre("materiel","cat","",true))} style="border:0;background:transparent;color:inherit;padding:0;cursor:pointer;font-size:14px;line-height:1">×</button></span>` : "";

    body = `
    <div style="flex:1;min-height:0;padding:20px 32px 40px;display:flex;flex-direction:column;gap:20px;min-width:0;overflow:auto">

      ${bandePacks}

      <div style="display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center">
        ${filtreCat}
        <span style="flex:1"></span>
        <span style="font-size:12.5px;color:var(--muted)">${nbReserves} article${nbReserves>1?"s":""} réservé${nbReserves>1?"s":""} · ${nbEnMission} en mission</span>
      </div>

      ${selTotal ? `
      <div style="background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span style="font-size:13.5px">${[packsChoisis.length?packsChoisis.length+" malette"+(packsChoisis.length>1?"s":""):"", selCount?selCount+" article"+(selCount>1?"s":""):""].filter(Boolean).join(" et ")} sélectionné${selTotal>1?"s":""}</span>
        <button class="btn btn-sm btn-primary" type="button" ${on(openBatch)}>Réserver la sélection</button>
        <button class="btn btn-sm" type="button" style="margin-left:auto" ${on(()=>setT({matSel:{},packSel:{}}))}>Tout désélectionner</button>
      </div>`:""}

      <section class="card" aria-label="Articles" style="overflow:hidden;flex:1;min-height:300px;display:flex;flex-direction:column">
        <div style="overflow-x:auto;flex:1;min-height:0;display:flex;flex-direction:column">
          <div style="min-width:760px;flex:1;min-height:0;display:flex;flex-direction:column">
            <div class="row" style="grid-template-columns:${MAT_GRID()};border-top:0;padding-top:0;padding-bottom:0;flex:none">
              ${thF("cat", "Article", "padding:12px 0", false, toutEffacer)}
              ${thF("affectation", "Affectation", "padding:12px 0")}
              ${thF("qte", "Qté", "padding:12px 0", true)}
              ${thF("mission", "En mission", "padding:12px 0")}
              ${thF("reservation", "Réservation", "padding:12px 0")}
              <span class="th" style="position:absolute;width:1px;height:1px;overflow:hidden">Actions</span>
            </div>
            <div class="serre" style="overflow:auto" ${S.stockMaterialPageSize==="all" ? "" : 'data-rangs="materiel" data-rangh="54"'}>${rowsHtml}</div>
            ${!filtered.length ? `
            <div style="padding:46px 16px;text-align:center;display:flex;flex-direction:column;gap:7px">
              <span style="font-weight:600">Aucun article ne correspond</span>
              <span style="font-size:12.5px;color:var(--muted)">Vérifiez l'orthographe ou retirez les filtres</span>
            </div>`:""}
          </div>
        </div>
        ${filtered.length ? `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;flex:none">
          <span style="flex:1">${pageFiltered.length} sur ${filtered.length} article${filtered.length>1?"s":""} · page ${materialPage+1} sur ${materialPageCount}</span>
          <label style="display:flex;align-items:center;gap:7px">Afficher<select class="inp" style="padding:5px 8px;font-size:12.5px" ${ong(e=>set({stockMaterialPageSize:["all","auto"].includes(e.target.value)?e.target.value:Number(e.target.value),stockMaterialPage:0}))}><option value="auto" ${S.stockMaterialPageSize==="auto"?"selected":""}>Auto</option><option value="20" ${S.stockMaterialPageSize===20?"selected":""}>20</option><option value="50" ${S.stockMaterialPageSize===50?"selected":""}>50</option><option value="all" ${S.stockMaterialPageSize==="all"?"selected":""}>Tout</option></select></label>
          <button class="btn btn-sm" ${materialPage<=0?"disabled":""} ${on(()=>setT({stockMaterialPage:materialPage-1}))}>Précédent</button>
          <button class="btn btn-sm" ${materialPage>=materialPageCount-1?"disabled":""} ${on(()=>setT({stockMaterialPage:materialPage+1}))}>Suivant</button>
        </div>` : ""}
      </section>
    </div>`;
    if(S.prepMode) body = pagePreparation();
  }

  /* ---------- page : administration du stock ---------- */
  if(S.page==="profil"){
    body = pageProfil();
  }

  if(S.page==="groupe"){
    body = pageGroupe();
  }

  if(S.page==="admin" && ADMIN){
    const phoneQuery = S.adminPhoneQuery.trim().toLowerCase();
    const materialQuery = S.adminMaterialQuery.trim().toLowerCase();
    const adminPhones = S.refs.filter(r=>(r.brand+" "+r.model+" "+r.mpn+" "+(r.commercialName||"")).toLowerCase().includes(phoneQuery));
    const adminMaterials = S.materiel.filter(m=>(m.name+" "+(m.libelle||"")+" "+m.cat+" "+(m.etiquette||"")+" "+(m.numeroSerie||"")).toLowerCase().includes(materialQuery));
    const phoneSize = tailleAdmin("adminPhoneSize", adminPhones.length);
    const materialSize = tailleAdmin("adminMaterialSize", adminMaterials.length);
    const phonePages = Math.max(1, Math.ceil(adminPhones.length/phoneSize));
    const materialPages = Math.max(1, Math.ceil(adminMaterials.length/materialSize));
    const phonePage = Math.min(Math.max(0, Number(S.adminPhonePage)||0), phonePages-1);
    const materialPage = Math.min(Math.max(0, Number(S.adminMaterialPage)||0), materialPages-1);
    S.adminPhonePage = phonePage;
    S.adminMaterialPage = materialPage;
    const phonesPage = adminPhones.slice(phonePage*phoneSize, (phonePage+1)*phoneSize);
    const materialsPage = adminMaterials.slice(materialPage*materialSize, (materialPage+1)*materialSize);
    const nbConsos = S.materiel.filter(m=>m.cat===CATEGORIE_CONSOMMABLE).length;
    const ongletsAdmin = [
      ["phones", "Téléphones", S.refs.length], ["material", "Matériel", S.materiel.length],
      ["consommables", "Consommables", nbConsos], ["missions", "Missions", S.missions.length],
      ["templates", "Modèles", S.templates.length], ["comptes", "Comptes", Object.keys(S.comptesRoles||{}).length || COMPTES.length],
    ];
    const SVG_CORBEILLE = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></svg>`;
    // Un tableau d'administration : ses lignes, puis le pied (page, taille, précédent / suivant).
    const piedAdmin = (affiches, total, unite, page, pages, cleTaille, clePage)=>`
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px">
        <span style="flex:1">${affiches} sur ${total} ${unite}${total>1?"s":""} · page ${page+1} sur ${pages}</span>
        ${cleTaille?selecteurTaille(cleTaille, clePage):""}
        <button class="btn btn-sm" ${page<=0?"disabled":""} ${on(()=>setT({[clePage]:page-1}))}>Précédent</button>
        <button class="btn btn-sm" ${page>=pages-1?"disabled":""} ${on(()=>setT({[clePage]:page+1}))}>Suivant</button>
      </div>`;
    const boutonCorbeille = (libelle, fn)=>`<span class="acts"><button class="btn btn-icon btn-ghost btn-danger" type="button" aria-label="${esc(libelle)}" title="${esc(libelle)}" ${on(fn)}>${SVG_CORBEILLE}</button></span>`;
    const videAdmin = t=>`<div style="padding:32px 20px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)">${t}</div>`;
    const enteteAdmin = (titre, sous, actions)=>`
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px 20px">
        <div style="flex:1 1 240px"><h2 style="margin:0;font-size:15px;font-weight:700">${titre}</h2><p style="margin:2px 0 0;font-size:12.5px;color:var(--muted)">${sous}</p></div>
        ${actions||""}
      </div>`;
    const rechercheAdmin = (cle, indication, valeur, fn)=>`<div style="padding:0 20px 14px">${champRecherche(cle, indication, valeur, fn)}</div>`;
    const GRILLE_ADMIN = "minmax(0,1fr) 150px 84px 56px";
    const titresAdmin = (a, b, c)=>`<div class="row over" style="grid-template-columns:${GRILLE_ADMIN};padding-top:12px;padding-bottom:10px"><span>${a}</span><span>${b}</span><span style="text-align:right">${c}</span><span style="position:absolute;width:1px;height:1px;overflow:hidden">Actions</span></div>`;

    const lignesTel = phonesPage.map(r=>`
      <div class="row" style="grid-template-columns:${GRILLE_ADMIN}">
        <div style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span style="color:var(--muted)">${esc(r.brand)}</span> <strong style="font-weight:600">${esc(r.model)}</strong></div>
        <span class="mono" style="color:var(--soft)">${esc(r.mpn)}</span>
        <span class="num" style="text-align:right;font-weight:600">${r.qty} u.</span>
        ${boutonCorbeille("Supprimer "+r.brand+" "+r.model, ()=>{ if(confirm("Supprimer cette référence et ses variantes ?")) agir("telephone.supprimer",{refId:r.id}); })}
      </div>`).join("");
    const lignesMat = materialsPage.map(m=>{
      const id = m.id||m.name;
      return `
      <div class="row" style="grid-template-columns:${GRILLE_ADMIN}">
        <div style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><strong style="font-weight:600">${esc(m.libelle||m.name)}</strong>${m.etiquette?` <span class="mono" style="color:var(--muted)">${esc(m.etiquette)}</span>`:""}</div>
        <span style="color:var(--soft)">${esc(m.cat)}</span>
        <span class="num" style="text-align:right;font-weight:600">${m.qty} u.</span>
        ${boutonCorbeille("Supprimer "+(m.libelle||m.name), ()=>{ if(confirm("Supprimer cet article ?")) agir("materiel.supprimer",{nom:id}); })}
      </div>`;
    }).join("");

    const requeteMissions = (S.adminMissionQuery||"").trim().toLowerCase();
    const missionsAdmin = S.missions.filter(m=>!requeteMissions||m.name.toLowerCase().includes(requeteMissions));
    const pagesMissions = Math.max(1, Math.ceil(missionsAdmin.length/20));
    const pageMissions = Math.min(Math.max(0, Number(S.adminMissionPage)||0), pagesMissions-1);
    S.adminMissionPage = pageMissions;
    const missionsVisibles = missionsAdmin.slice(pageMissions*20, (pageMissions+1)*20);
    const lignesMissions = missionsVisibles.map(m=>`
      <div class="row" style="grid-template-columns:minmax(0,1fr) 56px">
        <div style="min-width:0;overflow-wrap:anywhere"><strong style="font-weight:600">${esc(m.name)}</strong>${m.archived?` <span class="badge b-neutral">Archivée</span>`:""}</div>
        ${boutonCorbeille("Supprimer la mission "+m.name, ()=>{ if(confirm("Supprimer la mission « "+m.name+" » ?")) agir("mission.supprimer",{nom:m.name}); })}
      </div>`).join("");

    body = `
    <div style="flex:1;min-height:0;padding:20px 32px 40px;display:flex;flex-direction:column;gap:20px;min-width:0;overflow:${S.adminTab==="templates"&&S.templateEdit?"hidden":"auto"}">
      <div class="tabs" role="tablist" aria-label="Rubriques">
        ${ongletsAdmin.map(([cle, libelle, n])=>`<button class="tab${S.adminTab===cle?" on":""}" role="tab" aria-selected="${S.adminTab===cle}" type="button" ${on(()=>setT({adminTab:cle}))}>${libelle} <span class="n">${n}</span></button>`).join("")}
      </div>

      <section class="card admin-stock-card" aria-label="Téléphones" style="overflow:hidden;display:${S.adminTab==="phones"?"flex":"none"};flex-direction:column;flex:1;min-height:0">
        ${enteteAdmin("Téléphones", "Réceptionner ou supprimer une référence et ses variantes", `
          <button class="btn" type="button" ${on(()=>document.getElementById("import-xlsx").click())}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg>Importer XLSX</button>
          <input id="import-xlsx" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none" onchange="importerXlsx(this)">
          <button class="btn btn-primary" type="button" ${on(()=>openReception())}>+ Ajouter une référence</button>`)}
        ${rechercheAdmin("adminphoneq", "Téléphone, marque ou référence…", S.adminPhoneQuery, v=>setT({adminPhoneQuery:v, adminPhonePage:0}))}
        <div class="admin-stock-list"><div style="min-width:560px">
          ${titresAdmin("Modèle", "Référence", "En stock")}
          ${lignesTel || videAdmin("Aucun téléphone correspondant.")}
        </div></div>
        ${piedAdmin(phonesPage.length, adminPhones.length, "téléphone", phonePage, phonePages, "adminPhoneSize", "adminPhonePage")}
      </section>

      <section class="card admin-stock-card" aria-label="Matériel" style="overflow:hidden;display:${S.adminTab==="material"?"flex":"none"};flex-direction:column;flex:1;min-height:0">
        ${enteteAdmin("Matériel", "Réceptionner ou supprimer un article qui n'est plus emprunté", `<button class="btn btn-primary" type="button" ${on(()=>openMatReception())}>+ Ajouter un article</button>`)}
        ${rechercheAdmin("adminmatq", "Article, catégorie ou référence…", S.adminMaterialQuery, v=>setT({adminMaterialQuery:v, adminMaterialPage:0}))}
        <div class="admin-stock-list"><div style="min-width:560px">
          ${titresAdmin("Article", "Catégorie", "En stock")}
          ${lignesMat || videAdmin("Aucun article correspondant.")}
        </div></div>
        ${piedAdmin(materialsPage.length, adminMaterials.length, "article", materialPage, materialPages, "adminMaterialSize", "adminMaterialPage")}
      </section>

      <section class="card" aria-label="Missions" style="overflow:hidden;display:${S.adminTab==="missions"?"block":"none"}">
        ${enteteAdmin("Missions", "Supprimer une mission qui ne possède plus de matériel affecté")}
        ${rechercheAdmin("adminmissionq", "Rechercher une mission…", S.adminMissionQuery, v=>setT({adminMissionQuery:v, adminMissionPage:0}))}
        <div style="overflow-x:auto"><div style="min-width:420px">
          <div class="row over" style="grid-template-columns:minmax(0,1fr) 56px;padding-top:12px;padding-bottom:10px"><span>Mission</span><span style="position:absolute;width:1px;height:1px;overflow:hidden">Actions</span></div>
          ${lignesMissions || videAdmin("Aucune mission correspondante.")}
        </div></div>
        ${piedAdmin(missionsVisibles.length, missionsAdmin.length, "mission", pageMissions, pagesMissions, null, "adminMissionPage")}
      </section>
      ${carteConsommables()}
      ${carteTemplates()}
      ${carteComptesAdmin()}
    </div>`;
  }

  /* ---------- page : missions ---------- */
  if(S.page==="missions"){
    const selectedTemplate = S.templates.find(t=>t.name===S._mTemplate) || null;
    const apercuTemplate = selectedTemplate ? apercuTemplateHtml(selectedTemplate) : "";
    const gestionCreation = S._mGestion || [OPERATOR];
    const creable = templateCreable(selectedTemplate) && gestionCreation.length > 0;
    const derived = {};
    // `index` est le rang de la ligne dans les emprunts de SON article : c'est
    // ce que `materiel.equipe.affecter` attend pour retrouver la ligne.
    Object.keys(S.matRes).forEach(name=>(S.matRes[name]||[]).forEach((r,index)=>{
      (derived[r.mission]=derived[r.mission]||[]).push({item:matLabel(name),detail:matDetail(name),materialId:name,index,equipe:r.equipe||"",qty:r.qty,returned:r.returned,by:r.by});
    }));
    // Le matériel pris sans mission est regroupé sous SANS_MISSION : ce n'est pas
    // une mission, il n'a rien à faire dans cet écran.
    const allNames = Array.from(new Set([...S.missions.map(m=>m.name), ...Object.keys(derived)]))
      .filter(n=>n!==SANS_MISSION);
    const archivedCount = allNames.filter(missionArchived).length;
    const names = S.showArchived ? allNames : allNames.filter(n=>!missionArchived(n));
    const statusOfMission = name=>statutMission(name);

    // Les demandes de prêt de matériel personnel qui attendent une réponse.
    const demandesMission = nom=>{
      const l = demandesDeMission(nom);
      if(!l.length) return "";
      return `
        <div style="margin:0 12px 12px;border-radius:10px;background:var(--warn-bg);padding:12px 14px;display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="badge b-warn" style="background:transparent;padding:0">${l.length}</span>
            <span class="over" style="color:var(--warn)">Demande${l.length>1?"s":""} de prêt en attente</span>
          </div>
          ${l.map(d=>`
          <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
            <span style="flex:1;min-width:180px">
              <span style="display:block;font-size:13px;font-weight:600">${d.quantite} × ${esc(d.libelle)}${d.detail?` <span style="color:var(--muted);font-weight:400">· ${esc(d.detail)}</span>`:""}</span>
              <span style="display:block;font-size:12px;color:var(--muted)">${esc(d.de)} → ${esc(d.a)}${d.motif?" · « "+esc(d.motif)+" »":""} · ${esc(depuisQuand(d.iso))}</span>
            </span>
            ${d.role==="emise" ? `<button class="btn btn-sm" ${on(()=>agir("pret.annuler",{id:d.id}))}>Annuler</button>` : ""}
            ${d.role==="recue" ? `<button class="btn btn-sm btn-primary" title="Accepter ou refuser, depuis votre profil" ${on(()=>set({page:"profil", profilDe:null}))}>Répondre</button>` : ""}
          </div>`).join("")}
        </div>`;
    };

    const cards = names.map(name=>{
      const demandesHtml = demandesMission(name);
      const meta = S.missions.find(m=>m.name===name) || {};
      const gestion = gestionnairesDe(name);
      let datePrevue = "";
      if(meta.date){ const pd=meta.date.split("-"); datePrevue = pd.length===3 ? pd[2]+"/"+pd[1]+"/"+pd[0] : meta.date; }
      const sousTitre = [datePrevue ? "Prévue le "+datePrevue : "", gestion.length ? "gérée par "+gestion.join(", ") : ""].filter(Boolean).join(" · ");
      const st = statusOfMission(name);
      // Prévue : information ; en cours : bon (vert) ; terminée : neutre ; annulée : rouge.
      const stCls = st==="EN COURS" ? "ok" : st==="PRÉVUE" ? "info" : st==="ANNULÉE" ? "bad" : "mut";
      const archived = missionArchived(name);
      const items = derived[name]||[];
      const equipes = equipesDe(name);
      const gere = peutGererMission(name);

      const ligneHtml = (it,rang)=>{
        const checkKey = name+"|"+rang;
        const checked = !!S.missionChecks[checkKey];
        return `
        <div style="padding:10px 16px;display:flex;align-items:flex-start;gap:10px;border-top:1px solid var(--line);opacity:${it.returned?".6":"1"}">
          <input type="checkbox" aria-label="Marquer ${esc(it.item+(it.detail?" "+it.detail:""))} comme fait" ${checked?"checked":""} ${ong(()=>{
            const checks=Object.assign({},S.missionChecks,{[checkKey]:!checked});
            setT({missionChecks:checks});
          })} style="margin:3px 0 0;width:16px;height:16px;flex:none;accent-color:var(--gold);cursor:pointer">
          <span style="flex:1;min-width:0">
            <span style="display:block;font-weight:600;font-size:13px;${checked?"text-decoration:line-through;opacity:.65":""}">${esc(it.item)}</span>
            <span style="display:block;font-size:12px;color:var(--muted)">Pris par ${esc(it.by||"non précisé")}${it.detail?" · "+esc(it.detail):""}</span>
            ${it.returned?`<span style="display:block;font-size:12px;color:var(--ok)">Rendu le ${esc(dateComplete(it.returned.iso))} par ${esc(it.returned.by)}</span>`:""}
          </span>
          ${(!it.returned && equipes.length && gere)?`<select class="inp" style="flex:none;width:122px;padding:4px 6px;font-size:12px" aria-label="Équipe de ${esc(it.item)}"
            ${ong(e=>agir("materiel.equipe.affecter",{nom:it.materialId, index:it.index, equipe:e.target.value}))}>
            <option value=""${it.equipe?"":" selected"}>— mission</option>
            ${equipes.map(e=>`<option value="${esc(e.nom)}"${e.nom===it.equipe?" selected":""}>${esc(e.nom)}</option>`).join("")}
          </select>`:""}
          <span class="num" style="font-weight:600;font-size:13px;flex:none;color:${it.returned?"var(--ok)":"var(--ink)"}">${it.qty} u.</span>
        </div>`;
      };

      /* Un groupe par equipe, plus un pour ce qui n'en a pas.
         Le groupe « sans equipe » n'apparait que s'il contient quelque chose :
         sur une mission sans equipes, il serait le seul et son titre
         n'apprendrait rien. */
      const groupes = [];
      equipes.forEach(e=>{
        groupes.push({nom:e.nom, membres:e.membres,
                      lignes:items.filter(it=>it.equipe===e.nom)});
      });
      const orphelines = items.filter(it=>!it.equipe || !equipeExiste(name, it.equipe));
      if(orphelines.length && equipes.length)
        groupes.push({nom:"", membres:[], lignes:orphelines});

      let rang = 0;
      const itemsHtml = !equipes.length
        ? items.map(it=>ligneHtml(it, rang++)).join("")
        : groupes.map(g=>{
            const dehors = g.lignes.filter(it=>!it.returned);
            const total = dehors.reduce((n,it)=>n+it.qty, 0);
            const idMenu = "eq:"+name+"|"+g.nom;
            return `
            <div style="padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--raised)">
              <span class="over" style="color:${g.nom?"var(--soft)":"var(--muted)"}">${g.nom?esc(g.nom):"Sans équipe"}</span>
              ${total?`<span class="badge b-warn">${total} u.</span>`:'<span class="badge b-neutral">Vide</span>'}
              ${g.nom?(g.membres.length
                ? `<span style="display:flex;flex-wrap:wrap;gap:6px;min-width:0">${g.membres.map(m=>{
                    const n = g.lignes.filter(it=>!it.returned && it.by===m).reduce((t,it)=>t+it.qty, 0);
                    return `<span class="badge ${n?"b-neutral":"b-warn"}" style="height:auto;padding:3px 8px;text-transform:none;letter-spacing:0" title="${n?esc(m)+" a pris "+n+" unité"+(n>1?"s":""):esc(m)+" n'a encore rien pris"}">${esc(m)} · ${n?n+" u.":"rien"}</span>`; }).join("")}</span>`
                : `<span style="font-size:12px;color:var(--muted)">aucun membre</span>`):""}
              ${g.nom?`<span style="margin-left:auto;display:flex;gap:4px;align-items:center">
                ${dehors.length?`<button class="btn btn-sm" ${on(()=>setT({releaseForm:{mission:name, equipe:g.nom, by:"", consommes:{}, commentaire:""}}))}>Restituer</button>`:""}
                ${gere?menuPlus(idMenu, [
                  {libelle:"Membres", fn:()=>ouvrirMembres(name, g.nom)},
                  {libelle:"Renommer", fn:()=>ouvrirEquipe(name, g.nom)},
                  {libelle:"Supprimer l'équipe…", danger:true, desactive:!!dehors.length, titre:dehors.length ? "Rendez ou déplacez son matériel d'abord" : "", fn:()=>supprimerEquipe(name, g.nom)},
                ]):""}
              </span>`:""}
            </div>
            ${g.lignes.length?g.lignes.map(it=>ligneHtml(it, rang++)).join(""):'<div style="padding:10px 16px;font-size:13px;color:var(--muted)">Rien d\'attribué.</div>'}`;
          }).join("");
      return `
      <article class="card" style="display:flex;flex-direction:column;overflow:hidden${archived?";opacity:.65":""}">
        <div style="display:flex;align-items:flex-start;gap:10px;padding:16px 16px 12px">
          <div style="flex:1;min-width:0">
            <h2 style="margin:0;font-size:15px;font-weight:700;overflow-wrap:anywhere;cursor:pointer" title="Cliquer pour copier le lien de la mission" ${on(()=>copierLien(lienMission(name), name))}>${esc(name)}</h2>
            ${sousTitre?`<div style="font-size:12px;color:var(--muted);margin-top:2px">${esc(sousTitre)}</div>`:""}
          </div>
          ${archived?'<span class="badge b-neutral" style="flex:none">Archivée</span>':""}
          <select class="badge ${stCls}" aria-label="Statut de ${esc(name)}" ${gere?"":"disabled"} title="${gere?"Changer le statut":"Seul un gestionnaire de la mission ou un administrateur change son statut"}"
            style="flex:none;cursor:${gere?"pointer":"default"};padding:0 8px;border:0"
            ${ong(e=>agir("mission.statut", { nom:name, statut:e.target.value }))}>
