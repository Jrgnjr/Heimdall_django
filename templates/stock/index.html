          return (visibles.map(m=>`<div style="display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid #1f232a"><span style="flex:1;min-width:0;font:500 12px Archivo,sans-serif;color:#eef0f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.name)}${m.archived?` <span class="badge mut">ARCHIVÉE</span>`:""}</span><button class="btn-mini hred" ${on(()=>{if(confirm("Supprimer la mission « "+m.name+" » ?")) agir("mission.supprimer",{nom:m.name});})}>Supprimer</button></div>`).join("")||'<div style="padding:24px 16px;color:#6d7480;font:400 12px Archivo,sans-serif">Aucune mission correspondante.</div>')+`<div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:10px 16px"><span style="font:400 11px Archivo,sans-serif;color:#6d7480">Page ${page+1} / ${pages} · ${missions.length} mission${missions.length>1?"s":""}</span><button class="btn-mini hwhite" ${page<=0?"disabled":""} ${on(()=>setT({adminMissionPage:page-1}))}>Précédent</button><button class="btn-mini hwhite" ${page>=pages-1?"disabled":""} ${on(()=>setT({adminMissionPage:page+1}))}>Suivant</button></div>`;
        })()}
      </div>
      ${carteConsommables()}
      ${carteTemplates()}
      ${carteComptesAdmin()}
    </div>`;
  }

  /* ---------- page : missions ---------- */
  if(S.page==="missions"){
    const selectedTemplate = S.templates.find(t=>t.name===S._mTemplate) || null;
    const apercuTemplate = selectedTemplate ? apercuTemplateHtml(selectedTemplate) : "";
    const creable = templateCreable(selectedTemplate);
    const derived = {};
    // `index` est le rang de la ligne dans les emprunts de SON article : c'est
    // ce que `materiel.equipe.affecter` attend pour retrouver la ligne.
    Object.keys(S.matRes).forEach(name=>(S.matRes[name]||[]).forEach((r,index)=>{
      (derived[r.mission]=derived[r.mission]||[]).push({item:matLabel(name),detail:matDetail(name),materialId:name,index,equipe:r.equipe||"",qty:r.qty,returned:r.returned,by:r.by});
    }));
    const allNames = Array.from(new Set([...S.missions.map(m=>m.name), ...Object.keys(derived)]));
    const archivedCount = allNames.filter(missionArchived).length;
    const names = S.showArchived ? allNames : allNames.filter(n=>!missionArchived(n));
    const statusOfMission = name=>{
      if(S.missionStatus[name]) return S.missionStatus[name];
      const all = derived[name]||[];
      if(!all.length) return "PRÉVUE";
      return all.every(r=>r.returned) ? "TERMINÉE" : "EN COURS";
    };

    const cards = names.map(name=>{
      const meta = S.missions.find(m=>m.name===name) || {};
      const parts = [];
      if(meta.owner) parts.push("Responsable : "+meta.owner);
      if(meta.date){ const pd=meta.date.split("-"); parts.push("Prévue le "+(pd.length===3?pd[2]+"/"+pd[1]+"/"+pd[0]:meta.date)); }
      const st = statusOfMission(name);
      const stCls = st==="EN COURS" ? "info" : st==="TERMINÉE" ? "ok" : "mut";
      const archived = missionArchived(name);
      const items = derived[name]||[];
      const equipes = equipesDe(name);

      const ligneHtml = (it,rang)=>{
        const checkKey = name+"|"+rang;
        const checked = !!S.missionChecks[checkKey];
        return `
        <div style="background:#191c22;padding:8px 11px;display:flex;align-items:center;gap:10px;opacity:${it.returned?".6":"1"}">
          <input type="checkbox" aria-label="Marquer ${esc(it.item+(it.detail?" "+it.detail:""))} comme fait" ${checked?"checked":""} ${ong(()=>{
            const checks=Object.assign({},S.missionChecks,{[checkKey]:!checked});
            setT({missionChecks:checks});
          })} style="width:15px;height:15px;flex:none;accent-color:#2A6BF2;cursor:pointer">
          <span style="display:flex;flex-direction:column;gap:2px;min-width:0;flex:1">
            <span style="font:400 11.5px/1.2 Archivo,sans-serif;color:#c3c9d3;${checked?"text-decoration:line-through;opacity:.65":""}">${esc(it.item+" · pris par "+(it.by||"non précisé"))}</span>
            ${it.detail?`<span style="font:400 10.5px/1.2 Archivo,sans-serif;color:#9aa2af;${checked?"opacity:.65":""}">${esc(it.detail)}</span>`:""}
            ${it.returned?`<span style="font:400 10px/1.2 Archivo,sans-serif;color:#5fc79a">Rendu le ${esc(dateComplete(it.returned.iso))} par ${esc(it.returned.by)}</span>`:""}
          </span>
          ${(!it.returned && equipes.length)?`<select class="inp" style="flex:none;width:118px;padding:4px 6px;font-size:10.5px" aria-label="Équipe de ${esc(it.item)}"
            ${ong(e=>agir("materiel.equipe.affecter",{nom:it.materialId, index:it.index, equipe:e.target.value}))}>
            <option value=""${it.equipe?"":" selected"}>— mission</option>
            ${equipes.map(e=>`<option value="${esc(e.nom)}"${e.nom===it.equipe?" selected":""}>${esc(e.nom)}</option>`).join("")}
          </select>`:""}
          <span style="font:600 11px/1 Archivo,sans-serif;color:${it.returned?"#5fc79a":"#f0b45a"};flex:none">${it.qty} u.</span>
        </div>`;
      };

      /* Un groupe par equipe, plus un pour ce qui n'en a pas.
         Le groupe « sans equipe » n'apparait que s'il contient quelque chose :
         sur une mission sans equipes, il serait le seul et son titre
         n'apprendrait rien. */
      const groupes = [];
      equipes.forEach(e=>{
        groupes.push({nom:e.nom, membres:e.membres,
                      lignes:items.filter(it=>it.equipe===e.nom)});
      });
      const orphelines = items.filter(it=>!it.equipe || !equipeExiste(name, it.equipe));
      if(orphelines.length && equipes.length)
        groupes.push({nom:"", membres:[], lignes:orphelines});

      let rang = 0;
      const itemsHtml = !equipes.length
        ? items.map(it=>ligneHtml(it, rang++)).join("")
        : groupes.map(g=>{
            const dehors = g.lignes.filter(it=>!it.returned);
            const total = dehors.reduce((n,it)=>n+it.qty, 0);
            return `
            <div style="background:#15181d;padding:9px 11px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #23262d">
              <span class="klabel" style="color:${g.nom?"#8fb4ff":"#6d7480"}">${g.nom?esc(g.nom.toUpperCase()):"SANS ÉQUIPE"}</span>
              ${total?`<span class="badge warn">${total} u.</span>`:'<span class="badge mut">VIDE</span>'}
              ${g.nom?`<span style="font:400 10.5px/1.3 Archivo,sans-serif;color:#767d8a;min-width:0;overflow-wrap:anywhere">${g.membres.length?esc(g.membres.join(", ")):"aucun membre"}</span>`:""}
              ${g.nom?`<span style="margin-left:auto;display:flex;gap:5px;flex-wrap:wrap">
                <button class="btn-mini hwhite" ${on(()=>ouvrirMembres(name, g.nom))}>Membres</button>
                ${dehors.length?`<button class="btn-mini hblue" ${on(()=>setT({releaseForm:{mission:name, equipe:g.nom, by:"", consommes:{}, commentaire:""}}))}>Libérer</button>`:""}
                ${ADMIN?`<button class="btn-mini hwhite" ${on(()=>ouvrirEquipe(name, g.nom))}>Renommer</button>`:""}
                ${ADMIN?`<button class="btn-mini hred" ${dehors.length?'disabled title="Rendez ou déplacez son matériel d\'abord"':''} ${on(()=>supprimerEquipe(name, g.nom))}>Supprimer</button>`:""}
              </span>`:""}
            </div>
            ${g.lignes.length?g.lignes.map(it=>ligneHtml(it, rang++)).join(""):'<div style="background:#191c22;padding:9px 11px;font:400 11px Archivo,sans-serif;color:#6d7480">Rien d\'attribué.</div>'}`;
          }).join("");
      return `
      <div class="card" style="padding:14px 16px;display:flex;flex-direction:column;gap:10px${archived?";opacity:.65":""}">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="font:600 13.5px/1.2 Archivo,sans-serif;color:#f2f4f8">${esc(name)}</span>
            ${parts.length?`<span style="font:400 10.5px/1.3 Archivo,sans-serif;color:#767d8a">${esc(parts.join(" · "))}</span>`:""}
          </span>
          ${archived?'<span class="badge mut">ARCHIVÉE</span>':""}
          <button class="badge ${stCls}" style="cursor:pointer" ${on(()=>{
            const order=["PRÉVUE","EN COURS","TERMINÉE"];
            const cur=S.missionStatus[name]||statusOfMission(name);
            agir("mission.statut", { nom:name, statut:order[(order.indexOf(cur)+1)%3] });
          })}>${st}</button>
          <button class="btn-mini hblue" ${on(()=>setT({editMission:{name, owner:meta.owner||"", date:meta.date||""}}))}>Modifier</button>
          ${items.some(it=>!it.returned)?`<button class="btn-mini hblue" ${on(()=>setT({releaseForm:{mission:name, by:"", consommes:{}, commentaire:""}}))}>Libérer tout</button>`:""}
          ${ADMIN?`<button class="btn-mini hwhite" ${on(()=>ouvrirEquipe(name, null))}>+ Équipe</button>`:""}
          ${!archived && st==="TERMINÉE"?`<button class="btn-mini hblue" ${on(()=>setMissionArchived(name, meta, true))}>Archiver</button>`:""}
          ${archived?`<button class="btn-mini hblue" ${on(()=>setMissionArchived(name, meta, false))}>Désarchiver</button>`:""}
          ${!items.length?`<button class="btn-mini hred" ${on(()=>agir("mission.supprimer",{nom:name}))}>Supprimer</button>`:""}
        </div>
        ${(!items.length && !equipes.length)?'<span style="font:400 11.5px/1.3 Archivo,sans-serif;color:#6d7480">Aucun matériel affecté</span>':""}
        ${(items.length || equipes.length)?`<div class="stack" style="border-radius:8px">${itemsHtml}</div>`:""}
      </div>`;
    }).join("");

    body = `
    <div style="flex:1;min-height:0;padding:22px 26px 32px;display:flex;flex-direction:column;gap:16px;min-width:0;max-width:640px;overflow:auto">
      <div class="card" style="padding:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <input class="inp" data-k="mname" style="flex:1 1 100%;width:100%;min-width:0" placeholder="Nom de la nouvelle mission" value="${esc(S._mName||"")}" ${oni(e=>{S._mName=e.target.value;})}>
        <span style="font:400 11.5px/1.2 Archivo,sans-serif;color:#767d8a;white-space:nowrap">Responsable : <b style="color:#e7e9ee;font-weight:500">${esc(OPERATOR)}</b></span>
        <input class="inp" data-k="mdate" type="date" style="flex:none" value="${esc(S._mDate||"")}" ${ong(e=>{S._mDate=e.target.value;})}>
        ${S.templates.length ? `<select class="inp" data-k="mtemplate" style="min-width:190px" ${ong(e=>setT({_mTemplate:e.target.value, _mChoix:{}, _mDeplie:{}}))}>
          <option value="">Sans template</option>
          ${S.templates.map(t=>`<option value="${esc(t.name)}"${S._mTemplate===t.name?" selected":""}>${esc(t.name)} · ${t.items.length} article${t.items.length>1?"s":""}</option>`).join("")}
        </select>` : ""}
        <button class="btn-pri${creable?"":" off"}" style="padding:9px 16px" ${on(async ()=>{
          const n=(S._mName||"").trim(); if(!n || !creable) return;
          if(await agir("mission.creer", { nom:n, date:S._mDate||"", template:S._mTemplate||"", choix:S._mChoix })){
            setT({ _mName:"", _mDate:"", _mTemplate:"", _mChoix:{}, _mDeplie:{} });
          }
        })}>Créer</button>
      </div>
      ${apercuTemplate}
      ${(archivedCount||S.showArchived) ? `
      <div style="display:flex;align-items:center;gap:8px">
        ${chip("Afficher les archivées ("+archivedCount+")", S.showArchived, ()=>set({showArchived:!S.showArchived}))}
      </div>`:""}
      ${!names.length ? `<div style="padding:40px 16px;text-align:center;font:400 12.5px Archivo,sans-serif;color:#6d7480">${archivedCount
        ? "Aucune mission active — "+archivedCount+" mission(s) archivée(s)."
        : "Aucune mission pour l'instant. Créez-en une, ou réservez du matériel pour une mission depuis le stock de matériel."}</div>` : cards}
    </div>`;
  }

  /* ---------- page : journal ---------- */
  if(S.page==="journal"){
    const kinds = ["Tous","Téléphones","Matériel","ENTRÉE","SORTIE","RETOUR","CONSOMMÉ","RÉSERV.","ANNUL.","TRANSF.","AJUST.","CRÉATION"];
    const all = journalRows();
    const lq = S.logQuery.trim().toLowerCase();
    const rows = all.filter(e=>{
      const f = S.logFilter;
      if(f==="Téléphones"){ if(e.source!=="phone") return false; }
      else if(f==="Matériel"){ if(e.source!=="mat") return false; }
      else if(f!=="Tous" && !e.kind.startsWith(f)) return false;
      if(lq && !(e.item+" "+e.loc+" "+e.identite+" "+e.who+" "+e.mission+" "+e.kind+" "+e.commentaire+" "+dateComplete(e.iso)).toLowerCase().includes(lq)) return false;
      return true;
    });
    const logPageSize = rangsQuiTiennent("journal", LOG_ROW_H, LOG_PAGE_SIZE);
    const pageCount = Math.max(1, Math.ceil(rows.length/logPageSize));
    const logPage = Math.min(Math.max(0, Number(S.logPage)||0), pageCount-1);
    if(logPage !== S.logPage) S.logPage = logPage;
    const pageRows = rows.slice(logPage*logPageSize, (logPage+1)*logPageSize);
    const rowsHtml = pageRows.map(e=>`
      <div style="display:grid;grid-template-columns:${LOG_GRID};padding:0 16px;height:44px;align-items:center;border-bottom:1px solid #1f232a">
        <div style="padding-right:8px;font:400 11px/1.2 Archivo,sans-serif;color:#6d7480;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(jourMoisAn(e.iso)+" · "+heureMinute(e.iso))}</div>
        <div style="padding:0 8px;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font:500 12px/1.2 Archivo,sans-serif;color:#eef0f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.item)}</span>
          ${e.loc?`<span style="font:400 10px/1.2 Archivo,sans-serif;color:#8fb4ff;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.loc)}</span>`:""}
          ${e.identite?`<span style="font:400 10px/1.2 Archivo,sans-serif;color:#9aa2af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.identite)}</span>`:""}
        </div>
        <div style="padding:0 8px;text-align:right;font:600 12px/1 Archivo,sans-serif;color:#f2f4f8;font-variant-numeric:tabular-nums">${e.qty?e.qty+" u.":"—"}</div>
        <div style="padding:0 8px;min-width:0;font:400 11.5px/1.2 Archivo,sans-serif;color:#aeb5c1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.who)}</div>
        <div style="padding:0 8px;min-width:0;font:400 11.5px/1.2 Archivo,sans-serif;color:#aeb5c1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.mission)}</div>
        <div style="padding-left:8px;display:flex;align-items:center;justify-content:flex-end;gap:7px">
          ${e.commentaire?`<span title="${esc(e.commentaire)}" aria-label="Commentaire : ${esc(e.commentaire)}" style="font-size:15px;line-height:1;cursor:help">💬</span>`:""}
          <span class="badge ${kindCls(e.kind)}">${esc(e.kind)}</span>
        </div>
      </div>`).join("");

    body = `
    <div style="flex:1;min-height:0;padding:22px 26px 32px;display:flex;flex-direction:column;gap:16px;min-width:0;overflow:auto">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        ${kinds.map(k=>chip(k, k===S.logFilter, ()=>set({logFilter:k,logPage:0}))).join("")}
        <input class="inp" data-k="logq" style="margin-left:auto;flex:0 1 300px;min-width:180px;font-size:12px;padding:8px 11px" placeholder="Rechercher un article, une étiquette, une personne, un casier…" value="${esc(S.logQuery)}" ${oni(e=>setT({logQuery:e.target.value,logPage:0}))}>
      </div>
      <div class="card" style="overflow:hidden;flex:1;min-height:170px;display:flex;flex-direction:column">
        <div style="display:grid;grid-template-columns:${LOG_GRID};padding:0 16px;background:#191c22;border-bottom:1px solid #23262d;align-items:center;flex:none">
          <div class="th" style="padding-left:0">DATE</div>
          <div class="th">ARTICLE</div>
          <div class="th" style="text-align:right">QTÉ</div>
          <div class="th">PERSONNE</div>
          <div class="th">MISSION</div>
          <div class="th" style="padding-right:0;text-align:right">TYPE</div>
        </div>
        <div class="serre" data-rangs="journal" data-rangh="${LOG_ROW_H}">${rowsHtml}</div>
        ${!rows.length ? `
        <div style="padding:46px 16px;text-align:center;display:flex;flex-direction:column;gap:7px">
          <span style="font:500 13px Archivo,sans-serif;color:#c3c9d3">${all.length?"Aucun mouvement ne correspond":"Aucun mouvement enregistré"}</span>
          <span style="font:400 11.5px Archivo,sans-serif;color:#6d7480">${all.length?"Vérifiez l'orthographe ou retirez les filtres":"Les mouvements de téléphones et de matériel s'afficheront ici"}</span>
        </div>`:""}
      </div>
      ${rows.length ? `<div style="display:flex;align-items:center;justify-content:flex-end;gap:10px">
        <span style="font:400 11px Archivo,sans-serif;color:#6d7480">Page ${logPage+1} / ${pageCount} · ${rows.length} événement${rows.length>1?"s":""}</span>
        <button class="btn-mini hwhite" ${logPage<=0?"disabled":""} ${on(()=>setT({logPage:logPage-1}))}>Précédent</button>
        <button class="btn-mini hwhite" ${logPage>=pageCount-1?"disabled":""} ${on(()=>setT({logPage:logPage+1}))}>Suivant</button>
      </div>`:""}
    </div>`;
  }

  /* ---------- modales ---------- */
  let modals = "";

  // Réception téléphone
  if(S.form){
    const f = S.form;
    // Sans référence au catalogue, seule la création a un sens : on y force,
    // sinon la bascule « Nouveau modèle » ramènerait à un formulaire qui
    // désigne une référence inexistante.
    if(!S.refs.length) f.newModel = true;
    const ref = S.refs.find(r=>r.id===f.refId) || S.refs[0]
      || { id:"", brand:"", model:"", mpn:"", qty:0, variants:[] };
    const freeSlots = (()=>{
      const occ = {};
      S.refs.forEach(r=>{ if(place[r.id]) (occ[place[r.id].loc]=occ[place[r.id].loc]||[]).push(r); });
      const list = [{value:"",label:"Auto — 1er casier libre"}];
      S.cabinets.forEach(c=>{
        for(let s=1;s<=c.shelves;s++)
          for(let k=1;k<=c.cols;k++){
            const loc = c.id+"·E"+s+"·C"+k;
            const o = occ[loc];
            list.push({value:loc, label:loc+" — "+(o ? o[0].model+(o.length>1?" +"+(o.length-1):"") : "libre")});
          }
      });
      return list;
    })();
    const n = Math.max(1, Number(f.qty)||1);
    const summary = f.newModel
      ? "Nouveau modèle · "+n+" u. à l'entrée"
      : ref.qty+" u. en casier → "+(ref.qty+n)+" u. après réception";
    const newVariantOn = f.newVariant || f.newModel;

    modals += `
    <div class="modal-back">
      <div class="modal" style="width:480px">
        <div class="modal-head">
          <span class="modal-title">Réception de stock</span>
          <span class="modal-sub">Entrée d'appareils dans l'armoire — le casier suit le modèle</span>
        </div>
        <div class="modal-body">
          <div class="field">
            <div style="display:flex;align-items:center;gap:10px">
              <span class="klabel">MODÈLE</span>
              ${ADMIN && S.refs.length ? `<button class="btn-mini hblue${f.newModel?' tog-on':''}" ${on(()=>{ f.newModel=!f.newModel; f.newVariant=false; render(); })}>${f.newModel?"Modèle existant":"Nouveau modèle"}</button>` : ""}
            </div>
            ${!f.newModel ? `
            <select class="inp" data-k="rmodel-sel" style="width:100%" ${ong(e=>{
              const r2=S.refs.find(x=>x.id===e.target.value);
              f.refId=e.target.value; f.variantIdx="0"; f.newVariant=false;
              if(r2){ f.capa=r2.variants[0].capa; }
              render();
            })}>
              ${S.refs.map(r=>`<option value="${esc(r.id)}"${r.id===f.refId?" selected":""}>${esc(r.brand+" "+r.model+" · "+r.mpn)}</option>`).join("")}
            </select>` : `
            <div style="display:flex;flex-direction:column;gap:8px">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                <input class="inp" data-k="rbrand" placeholder="Marque (ex. Motorola)" value="${esc(f.brand)}" ${oni(e=>{f.brand=e.target.value;})}>
                <input class="inp" data-k="rmodel" placeholder="Nom commercial (ex. Edge 50)" value="${esc(f.modelName)}" ${oni(e=>{f.modelName=e.target.value;})}>
              </div>
              <input class="inp" data-k="rmpn" placeholder="Réf. fabricant (ex. XT2409-1)" value="${esc(f.mpn)}" ${oni(e=>{f.mpn=e.target.value;})}>
              <span style="font:400 10.5px/1.3 Archivo,sans-serif;color:#6d7480">Un casier libre lui sera attribué automatiquement ; vous pourrez le changer depuis le tableau.</span>
            </div>`}
          </div>

          <div class="field">
            <div style="display:flex;align-items:center;gap:10px">
              <span class="klabel">VARIANTE</span>
              ${ADMIN && !f.newModel?`<button class="btn-mini hblue${f.newVariant?' tog-on':''}" ${on(()=>{ f.newVariant=!f.newVariant; render(); })}>Nouvelle variante</button>`:""}
            </div>
            ${!newVariantOn ? `
            <select class="inp" data-k="rvar" style="width:100%" ${ong(e=>{ f.variantIdx=e.target.value; render(); })}>
              ${ref.variants.map((v,k)=>`<option value="${k}"${String(k)===String(f.variantIdx)?" selected":""}>${esc(v.capa+" · "+v.color+" ("+v.qty+" u.)")}</option>`).join("")}
            </select>` : `
            <div style="display:grid;grid-template-columns:140px 1fr;gap:8px">
              <select class="inp" data-k="rcapa" ${ong(e=>{ f.capa=e.target.value; })}>
                ${CAPAS.map(c=>`<option value="${esc(c)}"${c===f.capa?" selected":""}>${esc(c)}</option>`).join("")}
              </select>
              <input class="inp" data-k="rcolor" placeholder="Couleur (ex. Titane bleu)" value="${esc(f.color)}" ${oni(e=>{f.color=e.target.value;})}>
            </div>`}
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <label class="field">
              <span class="klabel">QUANTITÉ</span>
              <input class="inp" data-k="rq" type="number" min="1" value="${esc(f.qty)}" ${oni(e=>{f.qty=e.target.value; render();})}>
            </label>
          </div>

          <div style="background:#191c22;border:1px solid #23262d;border-radius:9px;padding:11px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px">
            <div style="display:flex;flex-direction:column;gap:3px">
              <span class="klabel">RANGEMENT</span>
              <span style="font:400 11.5px/1.3 Archivo,sans-serif;color:#9aa2af">${esc(summary)}</span>
            </div>
            ${!f.newModel ? `
            <span style="font:600 12px/1 Archivo,sans-serif;color:#fff;background:#2A6BF2;border-radius:7px;padding:7px 10px;letter-spacing:.06em">${esc(place[ref.id]?place[ref.id].loc:"aucun casier libre")}</span>` : `
            <select class="inp" data-k="rslot" style="padding:8px 10px;border:1px solid rgba(42,107,242,.4);border-radius:7px;color:#8fb4ff;font:500 12px Archivo,sans-serif;max-width:190px" ${ong(e=>{ f.slot=e.target.value; })}>
              ${freeSlots.map(o=>`<option value="${esc(o.value)}"${o.value===f.slot?" selected":""}>${esc(o.label)}</option>`).join("")}
            </select>`}
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({form:null}))}>Annuler</button>
          <button class="btn-pri" style="padding:9px 16px" ${on(confirmReception)}>Valider la réception</button>
        </div>
      </div>
    </div>`;
  }

  // Sortie / réservation téléphone
  if(S.opMode && sel && sel.variants.length){
    const f = S.opForm;
    const v = sel.variants[Number(f.variantIdx)] || sel.variants[0];
    const n = Math.max(1, Number(f.qty)||1);
    const isSortie = S.opMode==="sortie";
    const stockLine = isSortie
      ? v.qty+" u. → "+Math.max(0,v.qty-n)+" u. sur cette variante"
      : sel.reserved+" u. réservées → "+(sel.reserved+n)+" u. sur ce casier";
    modals += `
    <div class="modal-back">
      <div class="modal" style="width:430px">
        <div class="modal-head">
          <span class="modal-title">${isSortie?"Sortie de stock":"Réservation client"}</span>
        <div class="modal-body">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font:600 13.5px/1.2 Archivo,sans-serif;color:#f2f4f8">${esc(sel.brand+" "+sel.model)}</span>
            <span class="loctag">${esc(locOf(sel))}</span>
          </div>
          <label class="field">
            <span class="klabel">VARIANTE</span>
            <select class="inp" data-k="opvar" ${ong(e=>{ f.variantIdx=e.target.value; render(); })}>
              ${sel.variants.map((vv,k)=>`<option value="${k}"${String(k)===String(f.variantIdx)?" selected":""}>${esc(vv.capa+" · "+vv.color+" ("+vv.qty+" u.)")}</option>`).join("")}
            </select>
          </label>
          <div style="display:grid;grid-template-columns:110px 1fr;gap:10px">
            <label class="field">
              <span class="klabel">QUANTITÉ</span>
              <input class="inp" data-k="opqty" type="number" min="1" value="${esc(f.qty)}" ${oni(e=>{f.qty=e.target.value; render();})}>
            </label>
            <div class="field">
              <span class="klabel">${isSortie?"SORTI PAR":"RÉSERVÉ PAR"}</span>
              <span style="font:500 13px/1.2 Archivo,sans-serif;color:#e7e9ee;padding:9px 0">${esc(OPERATOR)}</span>
            </div>
          </div>
          <div style="background:#191c22;border:1px solid #23262d;border-radius:9px;padding:11px 12px;display:flex;flex-direction:column;gap:3px">
            <span class="klabel">APRÈS VALIDATION</span>
            <span style="font:400 11.5px/1.3 Archivo,sans-serif;color:#9aa2af">${esc(stockLine)}</span>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({opMode:null}))}>Annuler</button>
          <button class="btn-pri" style="padding:9px 16px" ${on(()=>confirmOp(sel))}>${isSortie?"Valider la sortie":"Valider la réservation"}</button>
        </div>
      </div>
    </div>`;
  }

  // Entrée matériel
  if(S.matReceptForm){
    const f = S.matReceptForm;
    const cats = Array.from(new Set(CATEGORIES_MATERIEL.concat(S.materiel.map(m=>m.cat))));
    // Un consommable entré en plusieurs unités passe par la saisie des
    // numéros : c'est ce qui permettra plus tard de dire lequel a servi.
    const nbEntre = Math.max(1, Number(f.qty)||1);
    const versSeries = f.newItem && f.newCat===CATEGORIE_CONSOMMABLE && nbEntre>1;
    modals += `
    <div class="modal-back">
      <div class="modal" style="width:400px">
        <div class="modal-head">
          <span class="modal-title">${f.newItem?"Nouvel article":"Entrée de matériel"}</span>
          <span class="modal-sub">${f.newItem
            ? "Crée l'article et enregistre sa quantité de départ"
            : "Ajoute du stock à un article existant"}</span>
        </div>
        <div class="modal-body">
          <div class="field">
            <div style="display:flex;align-items:center;gap:10px">
              <span class="klabel">ARTICLE</span>
              ${ADMIN && S.materiel.length ? `
              <button class="btn-mini hblue${!f.newItem?' tog-on':''}" ${on(()=>{ f.newItem=!f.newItem; render(); })}>${f.newItem?"Article existant":"Nouvel article"}</button>` : ""}
            </div>
            ${!f.newItem ? `
            <select class="inp" data-k="mrsel" style="width:100%" ${ong(e=>{ f.name=e.target.value; })}>
              ${S.materiel.map(m=>`<option value="${esc(m.id||m.name)}"${(m.id||m.name)===f.name?" selected":""}>${esc(m.name)}${m.etiquette||m.numeroSerie?" · "+esc(m.etiquette||m.numeroSerie):""}</option>`).join("")}
            </select>` : `
            <div style="display:flex;flex-direction:column;gap:8px">
              <input class="inp" data-k="mrname" placeholder="Nom de l'article (ex. Chargeur 45 W)" value="${esc(f.newName)}" ${oni(e=>{f.newName=e.target.value;})}>
              ${versSeries ? `
              <input class="inp" data-k="mretq" placeholder="Étiquette (commune aux exemplaires)" value="${esc(f.etiquette||"")}" ${oni(e=>{f.etiquette=e.target.value;})}>` : `
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                <input class="inp" data-k="mretq" placeholder="Étiquette" value="${esc(f.etiquette||"")}" ${oni(e=>{f.etiquette=e.target.value;})}>
                <input class="inp" data-k="mrserie" placeholder="Numéro de série" value="${esc(f.numeroSerie||"")}" ${oni(e=>{f.numeroSerie=e.target.value;})}>
              </div>`}
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
                <select class="inp" data-k="mrcat" ${ong(e=>{ f.newCat=e.target.value; })}>
                  ${cats.map(c=>`<option value="${esc(c)}"${c===f.newCat?" selected":""}>${esc(c)}</option>`).join("")}
                </select>
                <select class="inp" data-k="mraffect" ${ong(e=>{ f.newAffectation=e.target.value; })}>
                  ${AFFECTATIONS.map(a=>`<option value="${esc(a)}"${a===f.newAffectation?" selected":""}>${esc(a)}</option>`).join("")}
                </select>
              </div>
            </div>`}
          </div>
          <label class="field">
            <span class="klabel">QUANTITÉ</span>
            <input class="inp" data-k="mrqty" type="number" min="1" value="${esc(f.qty)}" ${oni(e=>{f.qty=e.target.value; render();})}>
          </label>
          ${versSeries?`<span style="font:400 11px/1.3 Archivo,sans-serif;color:#8fb4ff">${nbEntre} exemplaires : leurs numéros de série seront demandés à l'étape suivante, pour pouvoir tracer lequel a servi.</span>`:""}
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({matReceptForm:null}))}>Annuler</button>
          <button class="btn-pri${f.newItem && !(f.newName||"").trim() ? ' off':''}" style="padding:9px 16px" ${on(confirmMatReception)}>${versSeries?"Saisir les "+nbEntre+" numéros":(f.newItem?"Créer l'article":"Valider")}</button>
        </div>
      </div>
    </div>`;
  }

  // Réservation matériel (unitaire)
  if(S.matResForm){
    const f = S.matResForm;
    const options = missionNames();
    const available = matAvailable(f.name);
    const wanted = Math.max(1, Number(f.qty)||1);
    const overQty = wanted > available;
    const blocked = overQty;
    const listHtml = (S.matRes[f.name]||[]).map((r,k)=>`
      <div style="padding:9px 11px;display:flex;align-items:center;gap:9px">
        <span style="flex:1;min-width:0;font:400 11.5px/1.2 Archivo,sans-serif;color:#c3c9d3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.mission+" · pris par "+(r.by||"non précisé")+(r.returned?" · rendu":""))}</span>
        <span style="font:600 11px/1 Archivo,sans-serif;color:#f0b45a">${r.qty} u.</span>
        <button class="btn-cell hred" style="padding:4px 8px;font-size:10px" ${on(()=>{
          agir("materiel.emprunt.retour", { nom:f.name, index:k, empreinte:empreinte(r) });
        })}>Libérer</button>
      </div>`).join("");

    modals += `
    <div class="modal-back">
      <div class="modal" style="width:420px">
        <div class="modal-head">
          <span class="modal-title">Emprunter du matériel</span>
          <span class="modal-sub">${esc(matLabel(f.name))}</span>
        </div>
        <div class="modal-body">
          ${(S.matRes[f.name]||[]).length?`<div class="stack">${listHtml}</div>`:""}
          <div style="display:grid;grid-template-columns:100px 1fr;gap:10px">
            <label class="field">
              <span class="klabel">QUANTITÉ</span>
              <input class="inp" data-k="resqty" type="number" min="1" max="${available}" style="${overQty?"border-color:#ef8b83":""}" value="${esc(f.qty)}" ${oni(e=>{f.qty=e.target.value; render();})}>
            </label>
            <label class="field">
              <span class="klabel">MISSION</span>
              <select class="inp" data-k="resmission" ${ong(e=>{ f.mission=e.target.value; render(); })}>
                ${options.map(nm=>`<option value="${esc(nm)}"${nm===f.mission?" selected":""}>${nm===SANS_MISSION?"Sans mission":esc(nm)}</option>`).join("")}
              </select>
            </label>
          </div>
          <div class="field">
            <span class="klabel">PRIS PAR</span>
            <span style="font:500 13px/1.2 Archivo,sans-serif;color:#e7e9ee">${esc(OPERATOR)}</span>
          </div>
          ${selecteurEquipe((f.mission||"").trim(), f.equipe||"", v=>{f.equipe=v; render();})}
          <label class="field">
            <span class="klabel">COMMENTAIRE <span style="color:#6d7480;font-weight:400;letter-spacing:0">(facultatif)</span></span>
            <textarea class="inp" data-k="rescomment" maxlength="500" rows="3" placeholder="Pourquoi ce matériel sort-il ?" ${oni(e=>{f.commentaire=e.target.value;})}>${esc(f.commentaire||"")}</textarea>
          </label>
          <span style="font:400 11px/1.3 Archivo,sans-serif;color:#6d7480">${available} unité(s) disponible(s) hors réservations existantes</span>
          ${overQty?`<span style="font:400 11px/1.3 Archivo,sans-serif;color:#ef8b83">Stock insuffisant : ${available===0?"plus aucune unité disponible":"seulement "+available+" unité(s) disponible(s)"} pour cet article.</span>`:""}
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({matResForm:null}))}>Fermer</button>
          <button class="btn-pri${blocked?' off':''}" style="padding:9px 16px" ${on(async ()=>{
            if(blocked) return;
            const n2 = Math.max(1, Number(f.qty)||1);
            if(await agir("materiel.emprunt", { nom:f.name, qty:n2, mission:(f.mission||"").trim(), equipe:f.equipe||"", commentaire:(f.commentaire||"").trim() })){
              setT({ matResForm:null });
            }
          })}>Emprunter</button>
        </div>
      </div>
    </div>`;
  }

  // Réservation groupée
  if(S.matBatch){
    const b = S.matBatch;
    const options = missionNames();
    b.packs = (b.packs||[]).filter(nom=>{
      const pk = S.packs.find(x=>x.name===nom); return pk && packDisponible(pk);
    });
    const demande = demandePanier(b);
    const overItems = manquesPanier(b);
    const blocked = overItems.length>0 || (!b.packs.length && !Object.keys(b.qtys).length);

    const packsHtml = b.packs.map(nom=>{
      const pk = S.packs.find(x=>x.name===nom);
      const contenu = pk.items.map(i=>i.qty+" × "+i.libelle).join(" · ");
      return `
      <div style="padding:8px 11px;display:flex;align-items:flex-start;gap:10px">
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font:500 11.5px/1.2 Archivo,sans-serif;color:#eef0f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(pk.name)}</span>
          <span style="font:400 10px/1.3 Archivo,sans-serif;color:#6d7480">${esc(contenu)}</span>
        </span>
        <button class="btn-cell hred" ${on(()=>{ b.packs = b.packs.filter(x=>x!==nom); delete S.packSel[nom]; render(); })}>Retirer</button>
      </div>`;
    }).join("");

    const itemsHtml = Object.keys(b.qtys).map(nm=>{
      const avail = matAvailable(nm);
      // Ce que les malettes du panier réclament déjà du même article : la
      // quantité saisie ici ne dispose que du reste.
      const parPacks = (demande[nm]||0) - Math.max(1, Number(b.qtys[nm])||1);
      const over = overItems.includes(nm);
      return `
      <div style="padding:8px 11px;display:flex;align-items:center;gap:10px">
        <span style="flex:1;min-width:0;font:400 11.5px/1.2 Archivo,sans-serif;color:#c3c9d3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc((S.materiel.find(m=>(m.id||m.name)===nm)||{}).name||nm)}</span>
        <span style="font:400 10.5px/1 Archivo,sans-serif;color:${over?"#ef8b83":"#6d7480"};white-space:nowrap">disp. ${avail}${parPacks?" · "+parPacks+" en malette":""}</span>
        <input class="inp" data-k="bq-${esc(nm)}" type="number" min="1" max="${Math.max(1, avail-parPacks)}" style="width:64px;padding:6px 8px;font-size:12px;border-radius:7px;${over?"border-color:#ef8b83":""}" value="${esc(b.qtys[nm])}" ${oni(e=>{b.qtys[nm]=e.target.value; render();})}>
      </div>`;
    }).join("");

    modals += `
    <div class="modal-back">
      <div class="modal" style="width:470px">
        <div class="modal-head">
          <span class="modal-title">Emprunter la sélection</span>
          <span class="modal-sub">Une seule personne · tout part ensemble ou rien ne part</span>
        </div>
        <div class="modal-body">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <label class="field">
              <span class="klabel">MISSION</span>
              <select class="inp" data-k="bmission" ${ong(e=>{ b.mission=e.target.value; render(); })}>
                ${options.map(nm=>`<option value="${esc(nm)}"${nm===b.mission?" selected":""}>${nm===SANS_MISSION?"Sans mission":esc(nm)}</option>`).join("")}
              </select>
            </label>
            <div class="field">
              <span class="klabel">PRIS PAR</span>
              <span style="font:500 13px/1.2 Archivo,sans-serif;color:#e7e9ee;padding:9px 0">${esc(OPERATOR)}</span>
            </div>
          </div>
          ${b.packs.length ? `
          <div class="field" style="gap:8px">
            <span class="klabel">MALETTES · ${b.packs.length}</span>
            <div class="stack">${packsHtml}</div>
          </div>` : ""}
          ${Object.keys(b.qtys).length ? `
          <div class="field" style="gap:8px">
            <span class="klabel">ARTICLES · ${Object.keys(b.qtys).length}</span>
            <div class="stack">${itemsHtml}</div>
          </div>` : ""}
          ${selecteurEquipe((b.mission||"").trim(), b.equipe||"", v=>{b.equipe=v; render();})}
          <label class="field">
            <span class="klabel">COMMENTAIRE <span style="color:#6d7480;font-weight:400;letter-spacing:0">(facultatif)</span></span>
            <textarea class="inp" data-k="bcomment" maxlength="500" rows="3" placeholder="Commentaire commun aux sorties" ${oni(e=>{b.commentaire=e.target.value;})}>${esc(b.commentaire||"")}</textarea>
          </label>
          ${overItems.length?`<span style="font:400 11px/1.3 Archivo,sans-serif;color:#ef8b83">Stock insuffisant pour : ${esc(overItems.map(matLabel).join(", "))}. Réduisez la quantité, ou retirez une malette qui réclame le même article.</span>`:""}
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({matBatch:null}))}>Annuler</button>
          <button class="btn-pri${blocked?' off':''}" style="padding:9px 16px" ${on(()=>{ if(!blocked) confirmBatch(); })}>Emprunter</button>
        </div>
      </div>
    </div>`;
  }

  // Restitution
  if(S.releaseForm){
    const f = S.releaseForm;
    const ouvertes = lignesOuvertesMission(f.mission);
    const consommables = ouvertes.filter(l=>estConsommable(l.id));
    const rendus = ouvertes.filter(l=>!estConsommable(l.id));
    f.consommes = f.consommes || {};

    /* Un consommable peut avoir ete utilise en partie. Le reste rentre.
       Seuls les consommables portent la case : un outil revient toujours,
       et s'il est casse c'est une correction d'inventaire, pas une
       consommation. */
    const consoHtml = consommables.map(l=>{
      const saisi = f.consommes[l.id];
      const coche = saisi !== undefined;
      const n = Math.min(l.qty, Math.max(0, Number(saisi)||0));
      // Un exemplaire serie sort a l'unite : la case suffit, demander « combien
      // sur 1 » n'aurait pas de sens.
      const unique = l.qty === 1;
      const detail = matDetail(l.id);
      return `
      <div style="padding:8px 11px;display:flex;align-items:center;gap:10px">
        <button ${on(()=>{ if(coche) delete f.consommes[l.id]; else f.consommes[l.id]=l.qty; render(); })}
          style="width:15px;height:15px;flex:none;border-radius:4px;display:grid;place-items:center;font:600 9px/1 Archivo,sans-serif;padding:0;${coche?"background:#2A6BF2;border:1px solid #2A6BF2;color:#fff":"background:#191c22;border:1px solid #343a45;color:transparent"}">${coche?"✓":""}</button>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font:400 11.5px/1.2 Archivo,sans-serif;color:#c3c9d3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(matLabel(l.id))}</span>
          ${detail?`<span style="font:400 10px/1.2 Archivo,sans-serif;color:#9aa2af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(detail)}</span>`:""}
        </span>
        ${unique ? "" : `<span style="font:400 10.5px/1 Archivo,sans-serif;color:#6d7480;white-space:nowrap">sorti ${l.qty}</span>
        <input class="inp" data-k="cons-${esc(l.id)}" type="number" min="0" max="${l.qty}" ${coche?"":"disabled"}
          style="width:64px;padding:6px 8px;font-size:12px;border-radius:7px;${coche?"":"opacity:.4"}"
          value="${coche?esc(saisi):0}" ${oni(e=>{ f.consommes[l.id]=e.target.value; render(); })}>`}
        <span style="width:${unique?"92px":"74px"};text-align:right;font:400 10.5px/1 Archivo,sans-serif;color:${coche&&n?"#7fd1a6":"#5b6270"};white-space:nowrap">${unique?(coche?"utilisé":"rentre"):(coche?(l.qty-n)+" rentrent":"tout rentre")}</span>
      </div>`;
    }).join("");

    const totalConso = Object.keys(f.consommes).reduce((s,id)=>{
      const l = consommables.find(x=>x.id===id);
      return s + (l ? Math.min(l.qty, Math.max(0, Number(f.consommes[id])||0)) : 0);
    }, 0);

    modals += `
    <div class="modal-back">
      <div class="modal" style="width:${consommables.length?"500px":"400px"};max-height:86vh">
        <div class="modal-head">
          <span class="modal-title">Restitution du matériel</span>
          <span class="modal-sub">${esc(f.mission)}${f.equipe?" · équipe "+esc(f.equipe):""}</span>
        </div>
        <div class="modal-body" style="gap:12px;overflow:auto">
          <div class="field">
            <span class="klabel">RENDU PAR</span>
            <span style="font:500 13px/1.2 Archivo,sans-serif;color:#e7e9ee">${esc(OPERATOR)}</span>
          </div>
          ${consommables.length ? `
          <div class="field" style="gap:8px">
            <span class="klabel">CONSOMMABLES · CE QUI A ÉTÉ UTILISÉ</span>
            <div class="stack">${consoHtml}</div>
            <span style="font:400 11px/1.3 Archivo,sans-serif;color:#6d7480">Ce qui est déclaré utilisé ne revient pas au stock. Le reste rentre normalement.</span>
          </div>` : ""}
          ${rendus.length ? `
          <div class="field" style="gap:6px">
            <span class="klabel">REVIENT AU STOCK · ${rendus.length}</span>
            <span style="font:400 11.5px/1.4 Archivo,sans-serif;color:#aeb5c1">${esc(rendus.map(l=>l.qty+" × "+matLabel(l.id)).join(" · "))}</span>
          </div>` : ""}
          ${totalConso ? `
          <label class="field">
            <span class="klabel">COMMENTAIRE <span style="color:#6d7480;font-weight:400;letter-spacing:0">(facultatif)</span></span>
            <textarea class="inp" data-k="relcomment" maxlength="500" rows="2" placeholder="Pourquoi ces consommables ont été utilisés" ${oni(e=>{f.commentaire=e.target.value;})}>${esc(f.commentaire||"")}</textarea>
          </label>` : ""}
          <span style="font:400 11px/1.3 Archivo,sans-serif;color:#6d7480">Les lignes de matériel restent visibles avec la mention « Rendu le » et la date du jour.</span>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({releaseForm:null}))}>Annuler</button>
          <button class="btn-pri" style="padding:9px 16px" ${on(()=>confirmRelease())}>${totalConso?"Restituer et décompter "+totalConso:"Confirmer la restitution"}</button>
        </div>
      </div>
    </div>`;
  }

  // Modifier la mission
  if(S.editMission){
    const f = S.editMission;
    modals += `
    <div class="modal-back">
      <div class="modal" style="width:400px">
        <div class="modal-head">
          <span class="modal-title">Modifier la mission</span>
          <span class="modal-sub">${esc(f.name)}</span>
        </div>
        <div class="modal-body" style="gap:12px">
          <div class="field">
            <span class="klabel">RESPONSABLE</span>
            <span style="font:500 13px/1.2 Archivo,sans-serif;color:#e7e9ee">${esc(f.owner||"—")}</span>
            <span style="font:400 10.5px/1.3 Archivo,sans-serif;color:#6d7480">Celui qui a créé la mission. Modifier la date ne change pas le responsable.</span>
          </div>
          <label class="field">
            <span class="klabel">DATE PRÉVUE</span>
            <input class="inp" data-k="eddate" type="date" value="${esc(f.date)}" ${ong(e=>{f.date=e.target.value;})}>
          </label>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({editMission:null}))}>Annuler</button>
          <button class="btn-pri" style="padding:9px 16px" ${on(async ()=>{
            // Le responsable n'est pas modifié : c'est celui qui a créé la
            // mission, pas celui qui en corrige la date aujourd'hui.
            if(await agir("mission.date", { nom:f.name, date:f.date||"" })){
              setT({ editMission:null });
            }
          })}>Enregistrer</button>
        </div>
      </div>
    </div>`;
  }

  /* Mon matériel — ce qui est sorti au nom du compte connecté.
     La liste se vide d'elle-même : chaque restitution renvoie une différence
     que le rendu suivant prend en compte, la modale reste ouverte. */
  if(S.possessions){
    const dotations = S.dotations[auteurEffectif()]||[];
    const emprunts = mesEmprunts();
    const sorties  = mesSorties();
    const reserves = mesReservations();
    const ongletDotation = S.possessionsTab === "dotation";
    const nbEmprunts = emprunts.length + sorties.length + reserves.length;

    const empruntsHtml = emprunts.map(({nom, index, r})=>`
      <div style="padding:9px 11px;display:flex;align-items:center;gap:9px">
        <span style="width:6px;height:6px;flex:none;border-radius:50%;background:#f0b45a;display:block"></span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
          <span style="font:500 11.5px/1.2 Archivo,sans-serif;color:#eef0f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(matLabel(nom))}</span>
          <span style="font:400 10px/1.2 Archivo,sans-serif;color:#6d7480">${esc("Mission : "+(r.mission||"—"))}</span>
        </span>
        <span style="font:600 11px/1 Archivo,sans-serif;color:#f0b45a;font-variant-numeric:tabular-nums">${r.qty} u.</span>
        <button class="btn-cell hgreen" ${on(()=>{
          agir("materiel.emprunt.retour", { nom, index, empreinte:empreinte(r) });
        })}>Rendre</button>
      </div>`).join("");

    const sortiesHtml = sorties.map(({ref, index, o})=>`
      <div style="padding:9px 11px;display:flex;align-items:center;gap:9px">
        <span style="width:6px;height:6px;flex:none;border-radius:50%;background:#ef8b83;display:block"></span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
          <span style="font:500 11.5px/1.2 Archivo,sans-serif;color:#eef0f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ref.brand+" "+ref.model)}</span>
          <span style="font:400 10px/1.2 Archivo,sans-serif;color:#6d7480">${esc(o.variant+" · sorti le "+dateComplete(o.iso)+" à "+heureMinute(o.iso))}</span>
        </span>
        <span style="font:600 11px/1 Archivo,sans-serif;color:#ef8b83;font-variant-numeric:tabular-nums">${o.qty} u.</span>
        <button class="btn-cell hgreen" ${on(()=>returnOut(ref, index))}>Retourner</button>
      </div>`).join("");

    const dotationsHtml = dotations.map(d=>`
      <div style="padding:9px 11px;display:flex;align-items:center;gap:9px">
        <span style="width:6px;height:6px;flex:none;border-radius:50%;background:#5fc79a;display:block"></span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
          <span style="font:500 11.5px/1.2 Archivo,sans-serif;color:#eef0f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.article)}</span>
          <span style="font:400 10px/1.2 Archivo,sans-serif;color:#6d7480">${esc(d.detail||"Dotation personnelle")}</span>
        </span>
        <span style="font:600 11px/1 Archivo,sans-serif;color:#5fc79a;font-variant-numeric:tabular-nums">${d.quantite} u.</span>
      </div>`).join("");

    const reservesHtml = reserves.map(({ref, index, r})=>`
      <div style="padding:9px 11px;display:flex;align-items:center;gap:9px">
        <span style="width:6px;height:6px;flex:none;border-radius:50%;background:#f0b45a;display:block"></span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
          <span style="font:500 11.5px/1.2 Archivo,sans-serif;color:#eef0f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ref.brand+" "+ref.model)}</span>
          <span style="font:400 10px/1.2 Archivo,sans-serif;color:#6d7480">${esc(r.variant+" · réservé le "+dateComplete(r.iso))}</span>
        </span>
        <span style="font:600 11px/1 Archivo,sans-serif;color:#f0b45a;font-variant-numeric:tabular-nums">${r.qty} u.</span>
        <span style="display:flex;align-items:center;gap:5px">
          <button class="btn-cell hblue" ${on(()=>resolveReservation(ref, index, "sell"))}>Sortir</button>
          <button class="btn-cell hred" ${on(()=>resolveReservation(ref, index, "cancel"))}>Annuler</button>
        </span>
      </div>`).join("");

    modals += `
    <div class="modal-back">
      <div class="modal" style="width:520px;max-height:82vh">
        <div class="modal-head">
          <span class="modal-title">Mon matériel</span>
          <span class="modal-sub">${esc("Matériel du compte "+auteurEffectif())}</span>
        </div>
        <div class="modal-body" style="gap:16px;overflow:auto">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#2b2f37;border:1px solid #2b2f37;border-radius:8px;overflow:hidden">
            <button class="chip${ongletDotation?' on':''}" style="border:0;border-radius:0;text-align:center" ${on(()=>setT({possessionsTab:"dotation"}))}>Sac de dotation <span style="opacity:.7">· ${dotations.length}</span></button>
            <button class="chip${!ongletDotation?' on':''}" style="border:0;border-radius:0;text-align:center" ${on(()=>setT({possessionsTab:"emprunts"}))}>Emprunts et sorties <span style="opacity:.7">· ${nbEmprunts}</span></button>
          </div>

          ${(ongletDotation && !dotations.length) || (!ongletDotation && !nbEmprunts) ? `
          <div style="padding:34px 16px;text-align:center;display:flex;flex-direction:column;gap:7px">
            <span style="font:500 13px Archivo,sans-serif;color:#c3c9d3">Vous ne détenez rien</span>
            <span style="font:400 11.5px Archivo,sans-serif;color:#6d7480">${ongletDotation ? "Aucun matériel ne vous est attribué dans votre sac" : "Aucun matériel emprunté, téléphone sorti ou réservation à votre nom"}</span>
          </div>` : ""}

          ${ongletDotation && dotations.length ? `
          <div class="field">
            <span class="klabel">SAC ATTRIBUÉ · ${dotations.length}</span>
            <div class="stack">${dotationsHtml}</div>
          </div>` : ""}

          ${!ongletDotation && emprunts.length ? `
          <div class="field">
            <span class="klabel">MATÉRIEL EMPRUNTÉ · ${emprunts.length}</span>
            <div class="stack">${empruntsHtml}</div>
          </div>` : ""}

          ${!ongletDotation && sorties.length ? `
          <div class="field">
            <span class="klabel">TÉLÉPHONES SORTIS · ${sorties.length}</span>
            <div class="stack">${sortiesHtml}</div>
          </div>` : ""}

          ${!ongletDotation && reserves.length ? `
          <div class="field">
            <span class="klabel">TÉLÉPHONES RÉSERVÉS · ${reserves.length}</span>
            <div class="stack">${reservesHtml}</div>
            <span style="font:400 10.5px/1.3 Archivo,sans-serif;color:#6d7480">Réservé n'est pas sorti : l'appareil est toujours en casier, mais il n'est plus vendable tant que vous ne l'avez pas sorti ou libéré.</span>
          </div>` : ""}
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({possessions:false}))}>Fermer</button>
        </div>
      </div>
    </div>`;
  }

  if(S.dotationEdit){
    const f = S.dotationEdit;
    const recherche = (f.query||"").trim().toLowerCase();
    /* Le sac designe des exemplaires, pas des libelles : la cle de l'article
       (`m.id`) est donc l'identifiant partout ici. S'en tenir a `m.name`
       confondrait les trois portables identiques, et l'ecran ne pourrait plus
       dire lequel est dans quel sac. */
    const cle = m => m.id || m.name;
    const articles = S.materiel.filter(m=>!recherche
      || (m.name+" "+m.cat+" "+(m.etiquette||"")+" "+(m.numeroSerie||"")).toLowerCase().includes(recherche));
    f.lignes.forEach(l=>{
      if(!articles.some(m=>cle(m)===l.article) && (!recherche
          || l.article.toLowerCase().includes(recherche)))
        articles.push({id:l.article, name:l.article, cat:"Article supprimé",
                       manquant:true});
    });
    const lignesDotation = articles.map(m=>{
      const k = cle(m);
      const ligne = f.lignes.find(l=>l.article===k);
      const quantite = ligne ? ligne.quantite : 0;
      // Ce qui distingue cet exemplaire de ses jumeaux, sous son nom : c'est
      // la seule facon de choisir le bon dans une liste d'homonymes.
      const marques = [];
      if(m.etiquette) marques.push("étiquette "+m.etiquette);
      if(m.numeroSerie) marques.push("série "+m.numeroSerie);
      const identite = marques.join(" · ");
      return `<div style="display:grid;grid-template-columns:minmax(150px,2fr) minmax(82px,1fr) 74px;gap:9px;padding:9px 11px;align-items:center;border-bottom:1px solid #1f232a">
        <span style="min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font:500 11.5px/1.2 Archivo,sans-serif;color:${m.manquant?"#ef8b83":"#eef0f4"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.name)}</span>
          ${identite?`<span style="font:400 10px/1.2 Archivo,sans-serif;color:#9aa2af;overflow-wrap:anywhere">${esc(identite)}</span>`:""}
          <span style="font:400 10px/1.2 Archivo,sans-serif;color:#6d7480">${esc(m.cat)}${identite||m.manquant?"":" · sans identifiant"}</span>
        </span>
        <input class="inp" data-k="dot-det-${esc(k)}" type="text" placeholder="Détail" value="${esc(ligne?ligne.detail:"")}" ${oni(e=>modifierLigneDotation(k,"detail",e.target.value))}>
        <input class="inp" data-k="dot-qte-${esc(k)}" type="number" min="0" style="padding:7px 8px" value="${quantite||""}" placeholder="0" ${oni(e=>modifierLigneDotation(k,"quantite",e.target.value))}>
      </div>`;
    }).join("");
    modals += `
    <div class="modal-back">
      <div class="modal" style="width:520px;max-width:100%">
        <div class="modal-head">
          <span class="modal-title">Modifier le sac</span>
          <span class="modal-sub">Dotation permanente de ${esc(f.compte)}</span>
        </div>
        <div class="modal-body">
          <div class="field">
            <div style="display:flex;align-items:center;gap:9px">
              <span class="klabel">CATALOGUE DU MATÉRIEL</span>
              <input class="inp" data-k="dotationq" style="margin-left:auto;flex:0 1 260px;min-width:150px;padding:7px 9px;font-size:11.5px" placeholder="Rechercher un article…" value="${esc(f.query)}" ${oni(e=>{f.query=e.target.value; render();})}>
            </div>
            <div style="display:grid;grid-template-columns:minmax(150px,2fr) minmax(82px,1fr) 74px;padding:8px 11px;background:#191c22;border:1px solid #23262d;border-bottom:0;border-radius:8px 8px 0 0">
              <span class="th" style="padding:0">ARTICLE</span><span class="th" style="padding:0">DÉTAIL</span><span class="th" style="padding:0;text-align:right">QUANTITÉ</span>
            </div>
            <div class="stack" style="border-radius:0 0 8px 8px;max-height:330px;overflow:auto">${lignesDotation||'<div style="padding:18px 11px;color:#6d7480;font:400 11px Archivo,sans-serif">Aucun article trouvé.</div>'}</div>
            <span style="font:400 10.5px/1.3 Archivo,sans-serif;color:#6d7480">Une quantité nulle retire l’article du sac. Les articles du sac restent absents du stock commun.</span>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" ${on(()=>setT({dotationEdit:null}))}>Annuler</button>
          <button class="btn-pri" ${on(confirmerDotation)}>Enregistrer</button>
        </div>
      </div>
    </div>`;
  }

  if(S.attributionEdit){
    const f = S.attributionEdit;
    modals += `
    <div class="modal-back">
      <div class="modal" style="width:430px;max-width:100%">
        <div class="modal-head">
          <span class="modal-title">Attribuer au sac</span>
          <span class="modal-sub">${esc(matLabel(f.article))}${matDetail(f.article)?" · "+esc(matDetail(f.article)):""} · depuis le stock matériel</span>
        </div>
        <div class="modal-body">
          <label class="field">
            <span class="klabel">UTILISATEUR</span>
            <select class="inp" data-k="attcompte" ${ong(e=>{f.compte=e.target.value;})}>
              ${COMPTES.map(c=>`<option value="${esc(c)}"${c===f.compte?" selected":""}>${esc(c)}</option>`).join("")}
            </select>
          </label>
          <label class="field">
            <span class="klabel">QUANTITÉ À AJOUTER</span>
            <input class="inp" data-k="attqty" type="number" min="1" value="${esc(f.quantite)}" ${oni(e=>{f.quantite=e.target.value;})}>
          </label>
          <label class="field">
            <span class="klabel">DÉTAIL <span style="color:#6d7480;font-weight:400;letter-spacing:0">(facultatif)</span></span>
            <input class="inp" data-k="attdetail" placeholder="Numéro de série, emplacement…" value="${esc(f.detail)}" ${oni(e=>{f.detail=e.target.value;})}>
          </label>
          <span style="font:400 10.5px/1.3 Archivo,sans-serif;color:#6d7480">Le matériel attribué sera visible dans le sac de l’utilisateur, séparément de ses emprunts.</span>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" ${on(()=>setT({attributionEdit:null}))}>Annuler</button>
          <button class="btn-pri" ${on(confirmerAttribution)}>Attribuer</button>
        </div>
      </div>
    </div>`;
  }

  /* ---------- assemblage + focus ---------- */
  const app = document.getElementById("app");
  const ae = document.activeElement;
  const focusKey = ae && ae.dataset ? ae.dataset.k : null;
  let focusPos = null;
  if(focusKey){ try{ focusPos = ae.selectionStart; }catch(e){} }

  /* Composition d'une malette. Le contenu se choisit dans le catalogue du
     matériel : une ligne de pack désigne toujours un exemplaire précis, là
     où une ligne de template peut rester ouverte. */
  if(S.packEdit){
    const f = S.packEdit;
    const dejaDedans = new Set(f.lignes.map(l=>l.id));
    const recherche = (f.recherche||"").trim().toLowerCase();
    const candidats = S.materiel
      .filter(m=>!dejaDedans.has(m.id||m.name))
      .filter(m=>!recherche || (m.name+" "+m.cat+" "+(m.etiquette||"")+" "+(m.numeroSerie||"")).toLowerCase().includes(recherche))
      .slice(0, 40);

    const lignesHtml = f.lignes.map((l,i)=>{
      const detail = matDetail(l.id);
      return `
      <div style="padding:8px 11px;display:flex;align-items:center;gap:9px">
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font:500 11.5px/1.2 Archivo,sans-serif;color:#eef0f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(matLabel(l.id))}</span>
          ${detail?`<span style="font:400 10px/1.2 Archivo,sans-serif;color:#6d7480;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(detail)}</span>`:""}
        </span>
        <input class="inp" data-k="pkq-${esc(l.id)}" type="number" min="1" style="width:62px;padding:6px 8px;font-size:12px;border-radius:7px" value="${esc(l.qty)}" ${oni(e=>{ l.qty=e.target.value; })}>
        <button class="btn-cell hred" ${on(()=>{ f.lignes.splice(i,1); render(); })}>Retirer</button>
      </div>`;
    }).join("");

    const candidatsHtml = candidats.map(m=>{
      const id = m.id||m.name;
      const detail = exemplaireDetail(m);
      return `
      <button ${on(()=>{ f.lignes.push({id, qty:1}); f.recherche=""; render(); })}
        style="width:100%;padding:8px 11px;background:transparent;border:0;border-bottom:1px solid #1f232a;display:flex;align-items:center;gap:9px;text-align:left;cursor:pointer">
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font:500 11.5px/1.2 Archivo,sans-serif;color:#dfe3ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.name)}</span>
          <span style="font:400 10px/1.2 Archivo,sans-serif;color:#6d7480;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.cat)}${detail?" · "+esc(detail):""}</span>
        </span>
        <span style="font:400 10.5px/1 Archivo,sans-serif;color:#5b6270;white-space:nowrap">disp. ${matAvailable(id)}</span>
        <span style="font:600 13px/1 Archivo,sans-serif;color:#8fb4ff">+</span>
      </button>`;
    }).join("");

    const nomOk = (f.nom||"").trim().length>0;
    const pret = nomOk && f.lignes.length>0;

    modals += `
    <div class="modal-back">
      <div class="modal" style="width:540px;max-height:86vh">
        <div class="modal-head">
          <span class="modal-title">${f.original?"Modifier le pack":"Nouveau pack"}</span>
          <span class="modal-sub">Les articles rangés dans une même malette</span>
        </div>
        <div class="modal-body" style="overflow:auto">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <label class="field">
              <span class="klabel">NOM DE LA MALETTE</span>
              <input class="inp" data-k="pknom" maxlength="200" placeholder="Malette terrain A" value="${esc(f.nom)}" ${oni(e=>{ f.nom=e.target.value; render(); })}>
            </label>
            <label class="field">
              <span class="klabel">ÉTIQUETTE <span style="color:#6d7480;font-weight:400;letter-spacing:0">(facultatif)</span></span>
              <input class="inp" data-k="pketq" maxlength="200" placeholder="PELI-01" value="${esc(f.etiquette||"")}" ${oni(e=>{ f.etiquette=e.target.value; })}>
            </label>
          </div>

          <div class="field" style="gap:8px">
            <span class="klabel">CONTENU · ${f.lignes.length}</span>
            ${f.lignes.length
              ? `<div class="stack">${lignesHtml}</div>`
              : '<span style="font:400 11.5px/1.3 Archivo,sans-serif;color:#6d7480">Rien dedans pour l\'instant. Choisissez des articles ci-dessous.</span>'}
          </div>

          <div class="field" style="gap:8px">
            <span class="klabel">AJOUTER UN ARTICLE</span>
            <input class="inp" data-k="pkrech" placeholder="Rechercher dans le matériel…" value="${esc(f.recherche||"")}" ${oni(e=>{ f.recherche=e.target.value; render(); })}>
            <div class="stack" style="max-height:210px;overflow:auto">${candidatsHtml || '<div style="padding:14px 11px;font:400 11px Archivo,sans-serif;color:#6d7480">Aucun article à ajouter</div>'}</div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({packEdit:null}))}>Annuler</button>
          <button class="btn-pri${pret?'':' off'}" style="padding:9px 16px" ${on(()=>{ if(pret) confirmPackEdit(); })}>${f.original?"Enregistrer":"Créer le pack"}</button>
        </div>
      </div>
    </div>`;
  }

  /* Emprunt d'une malette. Entière, c'est une confirmation ; en partie, on
     coche ce qu'on emporte. Les deux passent par la même action. */
  if(S.packBorrow){
    const b = S.packBorrow;
    const pack = S.packs.find(x=>x.name===b.pack);
    if(!pack){ S.packBorrow = null; }
    else {
      const options = missionNames();
      const dejaSorti = {};
      packSorties(pack.name).forEach(d=>{ dejaSorti[d.id] = (dejaSorti[d.id]||0) + d.qty; });
      const retenues = pack.items.filter(i=>!i.manquant && !dejaSorti[i.id] && b.choix[i.id]);
      const courts = retenues.filter(i=>matAvailable(i.id) < i.qty);
      const pret = retenues.length>0 && !courts.length;

      const lignesHtml = pack.items.map(i=>{
        const sorti = dejaSorti[i.id]||0;
        const bloque = i.manquant || sorti>0;
        const coche = !bloque && !!b.choix[i.id];
        const dispo = i.manquant ? 0 : matAvailable(i.id);
        const court = coche && dispo < i.qty;
        const raison = i.manquant ? "article supprimé" : sorti ? sorti+" déjà dehors" : "";
        return `
        <div style="padding:8px 11px;display:flex;align-items:center;gap:10px;${bloque?"opacity:.55":""}">
          <button ${bloque?"":on(()=>{ if(b.choix[i.id]) delete b.choix[i.id]; else b.choix[i.id]=true; render(); })}
            style="width:15px;height:15px;flex:none;border-radius:4px;display:grid;place-items:center;font:600 9px/1 Archivo,sans-serif;padding:0;${coche?"background:#2A6BF2;border:1px solid #2A6BF2;color:#fff":"background:#191c22;border:1px solid #343a45;color:transparent"}${bloque?";cursor:not-allowed":""}">${coche?"✓":""}</button>
          <span style="width:22px;flex:none;font:600 11px/1 Archivo,sans-serif;color:#6d7480;font-variant-numeric:tabular-nums">${i.qty}×</span>
          <span style="flex:1;min-width:0;font:500 11.5px/1.2 Archivo,sans-serif;color:#dfe3ea;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(i.libelle)}</span>
          <span style="font:400 10.5px/1 Archivo,sans-serif;color:${court||raison?"#ef8b83":"#5b6270"};white-space:nowrap">${raison?esc(raison):"disp. "+dispo}</span>
        </div>`;
      }).join("");

      modals += `
      <div class="modal-back">
        <div class="modal" style="width:480px;max-height:86vh">
          <div class="modal-head">
            <span class="modal-title">Emprunter « ${esc(pack.name)} »</span>
            <span class="modal-sub">${b.partiel?"Cochez ce que vous emportez":"La malette entière part d'un seul geste"}</span>
          </div>
          <div class="modal-body" style="overflow:auto">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
              <label class="field">
                <span class="klabel">MISSION</span>
                <select class="inp" data-k="pkmission" ${ong(e=>{ b.mission=e.target.value; render(); })}>
                  ${options.map(nm=>`<option value="${esc(nm)}"${nm===b.mission?" selected":""}>${nm===SANS_MISSION?"Sans mission":esc(nm)}</option>`).join("")}
                </select>
              </label>
              <div class="field">
                <span class="klabel">PRIS PAR</span>
                <span style="font:500 13px/1.2 Archivo,sans-serif;color:#e7e9ee;padding:9px 0">${esc(OPERATOR)}</span>
              </div>
            </div>
            <div class="field" style="gap:8px">
              <span class="klabel">CONTENU · ${retenues.length} retenu(s)</span>
              <div class="stack">${lignesHtml}</div>
            </div>
            ${selecteurEquipe((b.mission||"").trim(), b.equipe||"", v=>{b.equipe=v; render();})}
            <label class="field">
              <span class="klabel">COMMENTAIRE <span style="color:#6d7480;font-weight:400;letter-spacing:0">(facultatif)</span></span>
              <textarea class="inp" data-k="pkcomment" maxlength="500" rows="2" placeholder="Commentaire commun aux sorties" ${oni(e=>{ b.commentaire=e.target.value; })}>${esc(b.commentaire||"")}</textarea>
            </label>
            ${courts.length?`<span style="font:400 11px/1.3 Archivo,sans-serif;color:#ef8b83">Stock insuffisant pour : ${esc(courts.map(i=>i.libelle).join(", "))}. Décochez ces articles ou attendez un retour.</span>`:""}
            ${!retenues.length?'<span style="font:400 11px/1.3 Archivo,sans-serif;color:#6d7480">Rien de sélectionné.</span>':""}
          </div>
          <div class="modal-foot">
            <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({packBorrow:null}))}>Annuler</button>
            <button class="btn-pri${pret?'':' off'}" style="padding:9px 16px" ${on(()=>{ if(pret) confirmPackBorrow(); })}>Emprunter</button>
          </div>
        </div>
      </div>`;
    }
  }

  /* Identifiants d'un exemplaire : l'étiquette collée dessus, le numéro lu
     sur l'objet. Une modale plutôt que deux champs dans la ligne : corriger
     un numéro mal lu se fait posément, et le serveur refuse un doublon. */
  if(S.identForm){
    const f = S.identForm;
    const m = S.materiel.find(x=>(x.id||x.name)===f.id);
    if(!m){ S.identForm = null; }
    else {
      modals += `
      <div class="modal-back">
        <div class="modal" style="width:420px">
          <div class="modal-head">
            <span class="modal-title">Identifier l'exemplaire</span>
            <span class="modal-sub">${esc(m.name)}</span>
          </div>
          <div class="modal-body">
            <label class="field">
              <span class="klabel">NUMÉRO DE SÉRIE</span>
              <input class="inp" data-k="idserie" maxlength="200" placeholder="CAL-0041" value="${esc(f.numeroSerie||"")}" ${oni(e=>{f.numeroSerie=e.target.value;})}>
            </label>
            <label class="field">
              <span class="klabel">ÉTIQUETTE <span style="color:#6d7480;font-weight:400;letter-spacing:0">(facultatif)</span></span>
              <input class="inp" data-k="idetq" maxlength="200" placeholder="Bac A3" value="${esc(f.etiquette||"")}" ${oni(e=>{f.etiquette=e.target.value;})}>
            </label>
            <span style="font:400 11px/1.3 Archivo,sans-serif;color:#6d7480">Le numéro suit l'exemplaire dans le journal : c'est lui qui dira lequel a été consommé, et pour quelle mission. Les mouvements déjà inscrits gardent l'ancien.</span>
          </div>
          <div class="modal-foot">
            <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({identForm:null}))}>Annuler</button>
            <button class="btn-pri" style="padding:9px 16px" ${on(()=>confirmIdentForm())}>Enregistrer</button>
          </div>
        </div>
      </div>`;
    }
  }

  /* Enregistrement en lot : une ligne de stock par numéro de série. Saisir
     cinquante exemplaires un par un serait la seule raison de ne pas les
     tracer, donc de perdre ce que la série apporte. */
  if(S.lotForm){
    const f = S.lotForm;
    // Deux entrées vers la même modale. Depuis l'administration, on colle une
    // liste libre. Depuis l'entrée de matériel, le nombre d'exemplaires est
    // déjà connu : un champ par exemplaire, ni un de plus ni un de moins.
    const attendus = Number(f.attendus)||0;
    const series = attendus
      ? (f.champs||[]).map(x=>(x||"").trim()).filter(Boolean)
      : (f.series||"").split(/[\r\n,;\t]+/).map(x=>x.trim()).filter(Boolean);
    const doublons = series.filter((x,i)=>series.findIndex(y=>y.toLowerCase()===x.toLowerCase())!==i);
    const nomOk = (f.nom||"").trim().length>0;
    const complet = !attendus || series.length===attendus;
    const pret = nomOk && series.length>0 && !doublons.length && complet;

    const champsHtml = !attendus ? "" : (f.champs||[]).map((val,i)=>`
      <div style="padding:6px 11px;display:flex;align-items:center;gap:10px">
        <span style="width:26px;flex:none;font:600 11px/1 Archivo,sans-serif;color:#6d7480;font-variant-numeric:tabular-nums">${i+1}</span>
        <input class="inp" data-k="lotch-${i}" maxlength="200" placeholder="Numéro de série de l'exemplaire ${i+1}"
          style="flex:1;min-width:0;padding:6px 9px;font-size:12px;border-radius:7px${(val||"").trim()?"":";border-color:#343a45"}"
          value="${esc(val||"")}" ${oni(e=>{ f.champs[i]=e.target.value; render(); })}>
      </div>`).join("");
    const cats = Array.from(new Set([...CATEGORIES_MATERIEL, ...S.materiel.map(m=>m.cat)]));
    const existants = Array.from(new Set(S.materiel.map(m=>m.name)));

    modals += `
    <div class="modal-back">
      <div class="modal" style="width:500px;max-height:86vh">
        <div class="modal-head">
          <span class="modal-title">${attendus?"Numéros de série":"Exemplaires sériés"}</span>
          <span class="modal-sub">${attendus?esc(nbSeriesSub(f, attendus, series.length)):"Une ligne de stock par numéro de série"}</span>
        </div>
        <div class="modal-body" style="overflow:auto">
          ${attendus ? `
          <div class="field" style="gap:4px">
            <span class="klabel">ARTICLE</span>
            <span style="font:500 13px/1.3 Archivo,sans-serif;color:#e7e9ee">${esc(f.nom||"")}</span>
            <span style="font:400 11px/1.3 Archivo,sans-serif;color:#6d7480">${esc(f.cat)} · ${esc(f.affectation)}${f.etiquette?" · étiquette "+esc(f.etiquette):""}</span>
          </div>
          <div class="field" style="gap:6px">
            <span class="klabel">UN NUMÉRO PAR EXEMPLAIRE · ${series.length} / ${attendus}</span>
            <div class="stack" style="max-height:290px;overflow:auto">${champsHtml}</div>
          </div>` : `
          <label class="field">
            <span class="klabel">ARTICLE</span>
            <input class="inp" data-k="lotnom" list="lot-noms" maxlength="200" placeholder="Cartouche de calibration" value="${esc(f.nom||"")}" ${oni(e=>{f.nom=e.target.value; render();})}>
            <datalist id="lot-noms">${existants.map(n=>`<option value="${esc(n)}"></option>`).join("")}</datalist>
          </label>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <label class="field">
              <span class="klabel">CATÉGORIE</span>
              <select class="inp" data-k="lotcat" ${ong(e=>{f.cat=e.target.value;})}>
                ${cats.map(c=>`<option value="${esc(c)}"${c===f.cat?" selected":""}>${esc(c)}</option>`).join("")}
              </select>
            </label>
            <label class="field">
              <span class="klabel">AFFECTATION</span>
              <select class="inp" data-k="lotaff" ${ong(e=>{f.affectation=e.target.value;})}>
                ${AFFECTATIONS.map(a=>`<option value="${esc(a)}"${a===f.affectation?" selected":""}>${esc(a)}</option>`).join("")}
              </select>
            </label>
          </div>
          <label class="field">
            <span class="klabel">NUMÉROS DE SÉRIE · ${series.length}</span>
            <textarea class="inp" data-k="lotseries" rows="7" placeholder="Un numéro par ligne&#10;CAL-0041&#10;CAL-0042&#10;CAL-0043" ${oni(e=>{f.series=e.target.value; render();})}>${esc(f.series||"")}</textarea>
            <span style="font:400 11px/1.3 Archivo,sans-serif;color:#6d7480">Un par ligne, ou séparés par des virgules. Chacun donne un exemplaire de quantité 1 : c'est ce qui permet de dire lequel a servi.</span>
          </label>`}
          ${doublons.length?`<span style="font:400 11px/1.3 Archivo,sans-serif;color:#ef8b83">Numéro répété dans la liste : ${esc(Array.from(new Set(doublons)).join(", "))}.</span>`:""}
          ${series.length>500?'<span style="font:400 11px/1.3 Archivo,sans-serif;color:#ef8b83">Maximum 500 exemplaires en une fois.</span>':""}
        </div>
        <div class="modal-foot">
          ${attendus?`<button class="btn-mini hwhite" style="margin-right:auto" ${on(()=>sansNumeroDeSerie())}>Ces exemplaires n'ont pas de numéro</button>`:""}
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({lotForm:null, matReceptForm:f.retour||null}))}>${f.retour?"Retour":"Annuler"}</button>
          <button class="btn-pri${pret?'':' off'}" style="padding:9px 16px" ${on(()=>{ if(pret) confirmLotForm(); })}>Enregistrer ${series.length||""}</button>
        </div>
      </div>
    </div>`;
  }

  /* Creer ou renommer une equipe. Un seul champ : son nom n'a besoin d'etre
     unique que dans sa mission, et le serveur le verifie. */
  if(S.equipeEdit){
    const f = S.equipeEdit;
    const nomVoulu = (f.valeur||"").trim();
    const pris = nomVoulu && nomVoulu!==f.original
      && equipesDe(f.mission).some(e=>e.nom.toLowerCase()===nomVoulu.toLowerCase());
    const pret = nomVoulu.length>0 && !pris;
    modals += `
    <div class="modal-back">
      <div class="modal" style="width:400px">
        <div class="modal-head">
          <span class="modal-title">${f.original?"Renommer l'équipe":"Nouvelle équipe"}</span>
          <span class="modal-sub">${esc(f.mission)}</span>
        </div>
        <div class="modal-body">
          <label class="field">
            <span class="klabel">NOM DE L'ÉQUIPE</span>
            <input class="inp" data-k="equipenom" maxlength="200" placeholder="Équipe Nord" value="${esc(f.valeur||"")}" ${oni(e=>{f.valeur=e.target.value; render();})}>
          </label>
          ${pris?'<span style="font:400 11px/1.3 Archivo,sans-serif;color:#ef8b83">Une équipe de ce nom existe déjà dans cette mission.</span>':""}
          <span style="font:400 11px/1.3 Archivo,sans-serif;color:#6d7480">${f.original?"Le matériel déjà attribué suit le nouveau nom.":"Le matériel s\'y attribue ensuite, à l\'emprunt ou en le déplaçant depuis la mission."}</span>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({equipeEdit:null}))}>Annuler</button>
          <button class="btn-pri${pret?'':' off'}" style="padding:9px 16px" ${on(()=>{ if(pret) confirmerEquipe(); })}>${f.original?"Renommer":"Créer"}</button>
        </div>
      </div>
    </div>`;
  }

  /* Composer les membres d'une equipe. La liste est remplacee en entier : on
     coche qui en fait partie aujourd'hui. */
  if(S.membresEdit){
    const f = S.membresEdit;
    const dans = new Set(f.choisis);
    // Les autres equipes de la mission, pour signaler qui est deja pris
    // ailleurs — ce n'est pas interdit, mais c'est bon a savoir.
    const ailleurs = {};
    equipesDe(f.mission).forEach(e=>{
      if(e.nom===f.nom) return;
      e.membres.forEach(m=>{ (ailleurs[m]=ailleurs[m]||[]).push(e.nom); });
    });
    const listeHtml = COMPTES.map(c=>{
      const coche = dans.has(c);
      return `
      <button ${on(()=>{
        f.choisis = dans.has(c) ? f.choisis.filter(x=>x!==c) : f.choisis.concat([c]);
        render();
      })} style="width:100%;padding:8px 11px;background:transparent;border:0;border-bottom:1px solid #1f232a;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer">
        <span style="width:15px;height:15px;flex:none;border-radius:4px;display:grid;place-items:center;font:600 9px/1 Archivo,sans-serif;${coche?"background:#2A6BF2;border:1px solid #2A6BF2;color:#fff":"background:#191c22;border:1px solid #343a45;color:transparent"}">${coche?"✓":""}</span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font:500 11.5px/1.2 Archivo,sans-serif;color:#dfe3ea">${esc(c)}${c===OPERATOR?'<span style="color:#6d7480;font-weight:400"> · vous</span>':""}</span>
