<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
/* Le document ne defile jamais : c'est la coque qui tient la hauteur de la
   fenetre, et chaque page designe a l'interieur la zone qui absorbe le
   trop-plein. Sans `overflow:hidden` ici, un enfant trop grand ferait
   reapparaitre la barre de defilement du navigateur. */
body{background:#111318;font-family:Archivo,Helvetica,Arial,sans-serif;color:#e7e9ee;-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:#6f9dff;text-decoration:none}a:hover{color:#a8c3ff}
input,button,select{font-family:inherit}
button{cursor:pointer}
@keyframes halo{0%{box-shadow:0 0 0 0 rgba(42,107,242,.55),0 0 22px 2px rgba(42,107,242,.45)}70%{box-shadow:0 0 0 9px rgba(42,107,242,0),0 0 30px 6px rgba(42,107,242,.30)}100%{box-shadow:0 0 0 0 rgba(42,107,242,0),0 0 22px 2px rgba(42,107,242,.45)}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2f343d;border-radius:6px;border:3px solid transparent;background-clip:content-box}

/* `dvh` plutot que `vh` : sur mobile, la barre d'adresse se retracte et
   `100vh` depasse alors la hauteur reellement visible. La regle `vh` reste en
   premier comme repli pour les navigateurs qui ignorent `dvh`. */
.shell{display:flex;height:100vh;height:100dvh;overflow:hidden;background:#111318}

/* La zone mesuree d'une table : elle prend la place restante et ne defile pas,
   parce que le nombre de lignes affichees est calcule pour y tenir.

   `min-height:0` est indispensable : sans lui, un enfant flex refuse de
   descendre sous sa hauteur de contenu et pousse la page au lieu de la laisser
   repartir l'espace. C'est aussi ce qui rend la mesure stable — la hauteur
   vient du parent, pas du contenu. */
.serre{flex:1;min-height:0;overflow:hidden}

/* ---------- encart du compte, en pied de barre latérale ----------
   Le menu s'ouvre vers le haut : sous le bouton il n'y a plus de place, et

.user-btn{width:100%;display:flex;align-items:center;gap:9px;padding:8px 9px;border:1px solid #23262d;border-radius:9px;background:#131720;color:#e7e9ee;text-align:left}

<body>
<div id="app"></div>
<script>
"use strict";

/* ============================================================
   Heimdall — application autonome (aucun serveur requis)
   Recréation du design handoff · persistance localStorage
   ============================================================ */

const ROW_H = 40;            // densité "compacte"
/* La colonne d'action s'élargit pour l'administrateur, qui y trouve un bouton
   de plus. En-tête et lignes sont deux grilles distinctes : toute largeur qui
   se résoudrait différemment dans l'une et dans l'autre — `auto`, par exemple —
   les désalignerait. */
const PH_GRID  = () => "minmax(130px,2.4fr) 104px 40px " + (ADMIN ? "186px" : "92px");
const MAT_GRID = () => "26px minmax(110px,2.2fr) minmax(80px,1fr) 108px 44px "
  + "minmax(84px,1.5fr) " + (ADMIN ? "198px" : "100px");

/* Affectations du matériel : liste fermée, qui doit rester identique à
   AFFECTATIONS dans stock/models.py. Le serveur refuse toute autre valeur. */
const AFFECTATIONS = ["Groupe 1","Groupe 2","Groupe 3","Commun"];
const affectCls = a => a==="Commun" ? "commun" : "groupe";

/* Catégories toujours proposées à la création d'un article. Sans elles, la
   liste serait vide sur une base neuve — impossible d'en choisir une. Les
   catégories déjà utilisées viennent s'y ajouter. */
const CATEGORIES_MATERIEL = ["Stockage", "Dongle", "Outil", "Ordinateur", "Consommable", "Autre"];
/* Ce qui se consomme. Un article de cette categorie peut etre declare
   utilise au retour de mission, et ne rentre alors pas au stock. Doit rester
   identique a CATEGORIE_CONSOMMABLE dans coeur/base.py. */
const CATEGORIE_CONSOMMABLE = "Consommable";
const LOG_GRID = "104px minmax(130px,2fr) 52px minmax(90px,1fr) minmax(90px,1fr) 92px";
const LOG_PAGE_SIZE = 20;      // repli si la mesure n'a pas encore eu lieu
const LOG_ROW_H = 44;
const STOCK_PAGE_SIZE = 20;
/* Capacités proposées à la réception. « Indéterminé » est une valeur à part
   entière, pas une absence de réponse : elle s'enregistre et s'affiche telle
   quelle, pour un appareil dont on ne connaît pas encore le stockage. Une
   entrée vide, elle, serait refusée par le serveur — la capacité est un champ
   obligatoire. */
const CAPA_INDETERMINEE = "Indéterminé";
const CAPAS = [CAPA_INDETERMINEE, "64 Go","128 Go","256 Go","512 Go","1 To"];
const SANS_MISSION = "—";
/* Numéro du compte connecté. Renseigné par le serveur à chaque réponse de
   l'API : toute action est signée par la personne réellement identifiée, et
   plus par un nom saisi à la main. En mode solo (fichier ouvert sans serveur)
   il n'y a personne à identifier, d'où le repli. */
let OPERATOR = "hors ligne";
/* Le compte connecté peut-il modifier la structure des armoires ? Renseigné
   par le serveur à chaque réponse. Ce drapeau ne fait que masquer des
   commandes : la vraie décision appartient au serveur, qui refuse ces actions
   à quiconque n'est pas administrateur (regles.ACTIONS_ADMINISTRATEUR). */
let ADMIN = false;
/* Comptes proposables comme auteur (administrateurs seulement), et compte au
   nom duquel on agit. `null` signifie « en mon nom ». */
let COMPTES = [];
let AUTEUR = null;
/* Le compte auquel s'imputent les actions et sur lequel « Mon matériel »
   filtre. Un seul point de vérité : tout le reste passe par ici. */
function auteurEffectif(){ return AUTEUR || OPERATOR; }


/* ---------- utilitaires ---------- */
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const pad = x => String(x).padStart(2,"0");

/* ---------- horodatages ----------

   Le serveur n'envoie qu'une seule forme : l'ISO 8601 avec année et fuseau
   ("2026-08-16T00:45:00+02:00"). Les dates ne sont plus fabriquées ici — le
   serveur horodate au moment où il applique la modification, et l'heure d'un
   poste peut être fausse. Ces fonctions ne servent qu'à l'affichage.

   Un tri alphabétique sur l'ISO est un tri chronologique, ce qui n'était vrai
   d'aucun des formats précédents. */
const quand = s => { const d = s ? new Date(s) : null; return d && !isNaN(d) ? d : null; };
const jourMois     = s => { const d=quand(s); return d ? pad(d.getDate())+"/"+pad(d.getMonth()+1) : "—"; };
const jourMoisAn   = s => { const d=quand(s); return d ? jourMois(s)+"/"+String(d.getFullYear()).slice(2) : "—"; };
const heureMinute  = s => { const d=quand(s); return d ? pad(d.getHours())+":"+pad(d.getMinutes()) : ""; };
const dateComplete = s => { const d=quand(s); return d ? pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear() : "—"; };

/* Affichage compact : l'année n'apparaît que si ce n'est pas l'année en cours.
   Une réservation qui traîne depuis un an cesse ainsi de ressembler à une
   réservation d'hier — ce que l'ancien format « 16/08 » rendait impossible. */
function dateCourte(s){
  const d = quand(s);
  if(!d) return "—";
  return d.getFullYear()===new Date().getFullYear() ? jourMois(s) : jourMoisAn(s);
}

/* un modèle = un casier : dérive les champs agrégés d'une référence */
function derive(g){
  g.reservations = g.reservations || [];
  g.outs = g.outs || [];
  g.qty = g.variants.reduce((s,v)=>s+v.qty,0);
  g.reserved = g.reservations.reduce((s,r)=>s+r.qty,0);
  g.variantSummary = g.variants.length + (g.variants.length>1?" variantes":" variante")
    + " · " + Array.from(new Set(g.variants.map(v=>v.capa))).join(" / ");
  return g;
}

/* État de départ, avant la première réponse du serveur : vide.

   La v0 pré-remplissait ici un catalogue de démonstration, parce qu'elle
   pouvait fonctionner sans serveur. Ce n'est plus le cas : les données
   viennent du serveur, et afficher un faux catalogue en attendant sa réponse
   ferait apparaître des références qui disparaîtraient au premier
   rafraîchissement. */
function seed(){
  return {
    page:"stock", q:"", brand:"Toutes", selId:null, assigning:null,
    refs:[],
    cabinets:[], cabinet:null,
    assignments:{},
    movements:[],
    materiel:[],
    dotations:{},
    matCat:"Toutes", matQuery:"", matSel:{}, matGroups:{}, matRes:{}, matLog:[], logFilter:"Tous", logQuery:"", logPage:0,
    missions:[], missionStatus:{}, templates:[], showArchived:false,
    equipes:[], equipeEdit:null, membresEdit:null,
    packs:[], packOuverts:{}, packsReplies:false, packSel:{},
    // état transitoire des modales
    form:null, opMode:null, opForm:null,
    matReceptForm:null, matResForm:null, matBatch:null, releaseForm:null, editMission:null,
    packEdit:null, packBorrow:null,
    userMenu:false, possessions:false, possessionsTab:"dotation", stockPhonePage:0, stockPhonePageSize:"auto", stockMaterialPage:0, stockMaterialPageSize:"auto", adminTab:"phones", adminPhoneQuery:"", adminMaterialQuery:"", adminMissionQuery:"", adminPhonePage:0, adminMaterialPage:0, adminMissionPage:0, adminTemplateQuery:"", adminTemplatePage:0, templateEdit:null, adminConsoQuery:"",
    identForm:null, lotForm:null,
    adminCompteQuery:"", adminComptesActifs:false, dotationEdit:null, attributionEdit:null,
    _mChoix:{}, _mDeplie:{}, missionChecks:{}
  };
}

/* données partagées entre tous les utilisateurs (serveur) vs préférences locales du poste */
const SHARED = ["refs","cabinets","assignments","movements","materiel","matRes","matLog","missions","missionStatus","templates","packs","equipes","dotations"];
const PREFS  = ["page","brand","cabinet","matCat","logFilter","showArchived","stockPhonePageSize","stockMaterialPageSize"];
const PREFS_KEY = "gestistock-prefs";
const SERVER = location.protocol === "http:" || location.protocol === "https:";

let version = 0, online = true, enCours = false;

/* ---------- session ---------- */

function cookie(nom){
  const m = document.cookie.match("(^|;)\\s*"+nom+"\\s*=\\s*([^;]+)");
  return m ? m.pop() : "";
}

/* Django refuse une déconnexion en GET depuis la version 5 : il faut un POST
   accompagné du jeton anti-CSRF, d'où ce formulaire construit à la volée. */
function deconnexion(){
  const f = document.createElement("form");
  f.method = "POST";
  f.action = "deconnexion/";
  const jeton = document.createElement("input");
  jeton.type = "hidden";
  jeton.name = "csrfmiddlewaretoken";
  jeton.value = cookie("csrftoken");
  f.appendChild(jeton);
  document.body.appendChild(f);
  f.submit();
}

/* Session expirée, ou mot de passe à renouveler : le serveur répond 401 ou 403.
   Inutile d'insister, on renvoie la personne là où elle doit aller. */
function sessionPerdue(res){
  if(res.status !== 401 && res.status !== 403) return false;
  location.href = res.status === 401 ? "connexion/" : "mot-de-passe/";
  return true;
}

/* Les préférences d'affichage (page courante, filtres) restent locales au
   navigateur : elles ne regardent que la personne, pas l'équipe. */
function savePrefs(){
  const o={}; PREFS.forEach(k=>o[k]=S[k]);
  try{ localStorage.setItem(PREFS_KEY, JSON.stringify(o)); }catch(e){}
}
function applyPrefs(){
  try{
    const o = JSON.parse(localStorage.getItem(PREFS_KEY)||"{}");
    PREFS.forEach(k=>{ if(o[k]!==undefined) S[k]=o[k]; });
  }catch(e){}
}

/* ---------- actions ----------

   Le navigateur ne calcule plus le résultat des opérations et n'envoie plus
   l'état entier : il décrit son intention, le serveur décide. Trois issues
   possibles, toutes traitées ici :

   - acceptée : le serveur renvoie la différence, qu'on applique ;
   - refusée (422) : son message est affiché tel quel, rien n'a changé ;
   - injoignable : on le signale et on laisse le sondage rétablir l'affichage.
*/
async function agir(nom, params){
  if(enCours) return false;                 // évite le double-clic
  enCours = true;
  render();
  try{
    const res = await fetch("api/action",{
      method:"POST",
      headers:{"Content-Type":"application/json", "X-CSRFToken":cookie("csrftoken")},
      // Le nom emprunté voyage avec l'action : le serveur vérifie qu'on a le
      // droit de l'employer, et l'inscrit dans son historique.
      body: JSON.stringify({action:nom, params: AUTEUR
        ? Object.assign({}, params||{}, {auteur:AUTEUR})
        : (params||{})})
    });
    if(sessionPerdue(res)){ return false; }
    const d = await res.json().catch(()=>({}));
    if(res.status===422){
      syncNote(d.error || "Action impossible.");
      return false;
    }
    if(!res.ok) throw new Error("HTTP "+res.status);
    version = d.version;
    if(d.user) OPERATOR = d.user;
    if(d.admin!==undefined) ADMIN = !!d.admin;
    if(d.comptes) COMPTES = d.comptes;
    if(d.dotations) S.dotations = d.dotations;
    if(d.delta) appliquerDelta(d.delta); else await rechargerTout();
    online = true;
    return true;
  }catch(e){
    console.warn("[action] "+nom+" a échoué :", e);
    online = false;
    syncNote("Le serveur n'a pas répondu. Vérifiez que rien n'a été enregistré avant de recommencer.");
    return false;
  }finally{
    enCours = false;
    render();
  }
}

/* Applique une différence reçue du serveur.
   Miroir exact de `appliquer_delta()` dans stock/tests_actions.py : si les deux
   divergent, l'affichage se met à mentir. */
function appliquerDelta(delta){
  const fusionner = (liste, nouveaux, cle)=>{
    nouveaux.forEach(n=>{
      const i = liste.findIndex(x=>x[cle]===n[cle]);
      if(i>=0) liste[i] = n; else liste.push(n);
    });
  };
  if(delta.refs) fusionner(S.refs, delta.refs, "id");
  (delta.refsSupprimes||[]).forEach(id=>{ S.refs = S.refs.filter(r=>r.id!==id); });
  if(delta.materiel) fusionner(S.materiel, delta.materiel, "id");
  (delta.materielSupprimes||[]).forEach(id=>{
    S.materiel = S.materiel.filter(m=>(m.id||m.name)!==id);
    delete S.matRes[id];
  });
  Object.keys(delta.matRes||{}).forEach(nom=>{
    // Une liste vide signifie « plus aucun emprunt » : on retire la clé, pour
    // rester identique à ce que renverrait un rechargement complet.
    if(delta.matRes[nom].length) S.matRes[nom] = delta.matRes[nom];
    else delete S.matRes[nom];
  });
  ["missions","missionStatus","templates","packs","equipes","cabinets","assignments"].forEach(k=>{
    if(delta[k]!==undefined) S[k] = delta[k];
  });
  if(delta.movementsNouveaux) S.movements = delta.movementsNouveaux.concat(S.movements);
  if(delta.matLogNouveaux)    S.matLog    = delta.matLogNouveaux.concat(S.matLog);
  if(delta.dotations) S.dotations = delta.dotations;
  S.refs.forEach(derive);
  recadrer();
}

function adopt(d){
  version = d.version;
  if(d.delta){ appliquerDelta(d.delta); render(); return; }
  const st = d.state || {};
  SHARED.forEach(k=>{ if(st[k]!==undefined) S[k]=st[k]; });
  S.refs.forEach(derive);
  recadrer();
  render();
}

/* Après un changement venu d'ailleurs, la sélection courante peut désigner
   quelque chose qui n'existe plus. */
function recadrer(){
  if(!S.cabinets.length) return;
  if(!S.cabinets.some(c=>c.id===S.cabinet)) S.cabinet = S.cabinets[0].id;
  if(S.selId && !S.refs.some(r=>r.id===S.selId)) S.selId = null;
  if(S.assigning && !S.refs.some(r=>r.id===S.assigning)) S.assigning = null;
}

async function rechargerTout(){
  const res = await fetch("api/state");
  if(sessionPerdue(res)) return;
  if(!res.ok) throw new Error("HTTP "+res.status);
  adopt(await res.json());
}

function syncNote(msg){
  S.syncMsg = msg; render();
  setTimeout(()=>{ if(S.syncMsg===msg){ S.syncMsg = null; render(); } }, 7000);
}

async function pull(){
  if(enCours) return;                       // une action est en vol
  try{
    const res = await fetch("api/state?since="+version);
    if(sessionPerdue(res)) return;
    if(!res.ok) throw new Error("HTTP "+res.status);
    const d = await res.json();
    if(!online){ online = true; render(); }
    if(d.user && d.user !== OPERATOR){ OPERATOR = d.user; render(); }
    if(d.admin!==undefined && !!d.admin !== ADMIN){ ADMIN = !!d.admin; render(); }
    if(d.comptes) COMPTES = d.comptes;
    if(d.dotations) S.dotations = d.dotations;
    if(d.changed) adopt(d);
  }catch(e){
    console.warn("[sync] lecture échouée :", e);
    if(online){ online = false; render(); }
  }
}

let S;

/* ---------- moteur de rendu minimal ---------- */
let H = [];
const h   = fn => (H.push(fn), H.length-1);
const on  = fn => 'data-c="'+h(fn)+'"';   // click
const oni = fn => 'data-i="'+h(fn)+'"';   // input
const ong = fn => 'data-g="'+h(fn)+'"';   // change

/* `set` mémorise une préférence d'affichage, `setT` ne fait que redessiner.
   Les données métier, elles, ne se modifient plus qu'à travers `agir()`. */
function set(patch){ Object.assign(S,patch); savePrefs(); render(); }
function setT(patch){ Object.assign(S,patch); render(); }

/* ---------- affectation des casiers (2 passes, aucun casier perdu) ---------- */
function placement(extra){
  const slots = [];
  S.cabinets.forEach(c=>{
    for(let s=1;s<=c.shelves;s++)
      for(let k=1;k<=c.cols;k++)
        slots.push({cab:c.id, shelf:"E"+s, col:"C"+k, key:c.id+"E"+s, loc:c.id+"·E"+s+"·C"+k});
  });
  const map = {}, used = slots.map(()=>false), pending = [];

  // casiers choisis manuellement : priorité absolue.
  // Plusieurs modèles peuvent pointer vers le même casier (casier partagé).
  const manual = Object.assign({}, S.assignments, extra||{});
  Object.keys(manual).forEach(refId=>{
    const i = slots.findIndex(s=>s.loc===manual[refId]);
    if(i>=0 && S.refs.some(r=>r.id===refId)){ used[i]=true; map[refId]=slots[i]; }
  });

  const order = [];
  S.refs.forEach(r=>{ if(order.indexOf(r.brand)<0) order.push(r.brand); });

  order.forEach(b=>{
    const block = S.refs.filter(r=>r.brand===b && !map[r.id]);
    if(!block.length) return;
    let at = -1;
    for(let i=0;i<slots.length;i++){
      if(used[i]) continue;
      let free = true;
      for(let j=0;j<block.length;j++) if(i+j>=slots.length || used[i+j]){ free=false; break; }
      if(!free) continue;
      const startsShelf = slots[i].col==="C1";
      const sameShelf = slots[i+block.length-1].key===slots[i].key;
      if(startsShelf || sameShelf){ at=i; break; }
    }
    if(at>=0) block.forEach((r,j)=>{ map[r.id]=slots[at+j]; used[at+j]=true; });
    else block.forEach(r=>pending.push(r));
  });

  let p = 0;
  for(let i=0;i<slots.length && p<pending.length;i++){
    if(!used[i]){ used[i]=true; map[pending[p++].id]=slots[i]; }
  }
  for(;p<pending.length;p++) map[pending[p].id]=null;
  S.refs.forEach(r=>{ if(!(r.id in map)) map[r.id]=null; });
  return map;
}

/* recherche limitée au nom commercial, à la marque et à la réf. fabricant */
function matches(r,q){
  if(!q) return false;
  const t = q.toLowerCase().trim();
  return (r.brand+" "+r.model+" "+r.mpn).toLowerCase().includes(t)
    || r.mpn.toLowerCase().replace(/-/g,"").includes(t.replace(/-/g,""));
}

function kindCls(kind){
  if(kind==="CONSOMMÉ") return "bad";
  if(kind==="SORTIE") return "bad";
  if(kind==="ENTRÉE"||kind==="RETOUR") return "ok";
  if(kind==="CRÉATION") return "info";
  if(kind==="RÉSERV.") return "warn";
  return "mut";
}

/* Journal unifié : mouvements de téléphones + mouvements de matériel.
   Les mouvements téléphone sont stockés sous forme « Action — n × Modèle » :
   on en extrait l'article et la quantité pour les afficher en colonnes. */
/* L'ISO se trie alphabétiquement dans l'ordre chronologique : plus besoin de
   recomposer une clé à partir d'un jour, d'un mois et d'une année séparés. */
function logSortKey(e){ return String(e.iso||""); }
function journalRows(){
  const phone = S.movements.map(m=>{
    const parts = String(m.label||"").split(" — ");
    let item = parts.length>1 ? parts.slice(1).join(" — ") : String(m.label||"");
    const q = item.match(/^(\d+)\s*×\s*/);
    if(q) item = item.slice(q[0].length);
    return { source:"phone", iso:m.iso, kind:m.kind, item,
             loc:m.loc||"", identite:"", qty:q?Number(q[1]):null,
             who:m.user||"—", mission:"—" };
  });
  const mat = S.matLog.map(e=>({
    source:"mat", iso:e.iso, kind:e.kind, item:e.item,
    loc:"", identite:e.identite||"", qty:e.qty, who:e.who||"—",
    mission:e.mission||"—", commentaire:e.commentaire||""
  }));
  return phone.concat(mat).sort((a,b)=>logSortKey(b).localeCompare(logSortKey(a)));
}
function missionArchived(name){
  return !!(S.missions.find(m=>m.name===name)||{}).archived;
}
/* missions proposées pour une nouvelle réservation : les archivées sont exclues */
function missionNames(){
  const derived = new Set();
  Object.keys(S.matRes).forEach(k=>(S.matRes[k]||[]).forEach(r=>derived.add(r.mission)));
  return [SANS_MISSION, ...Array.from(new Set([...S.missions.map(m=>m.name), ...derived]))
    .filter(n=>n!==SANS_MISSION && !missionArchived(n))];
}
/* ---------- suppression d'un article du stock ----------

   L'action est réservée aux administrateurs, et le serveur la refuse à tout
   autre : le bouton n'est qu'une commodité, pas le contrôle. Il refuse en
   revanche de proposer une suppression que le serveur rejetterait — un
   article encore sorti ou réservé —, parce qu'un bouton qui ne mène qu'à un
   refus ne rend service à personne.

   Ces deux fonctions doivent rester d'accord avec `telephone.supprimer` et
   `materiel.supprimer` dans coeur/regles.py. */

function telephoneBloque(r){
  return (r.reservations||[]).length + (r.outs||[]).length;
}
function materielBloque(m){
  return (S.matRes[m.id||m.name]||[]).filter(r=>!r.returned)
    .reduce((s,r)=>s+r.qty, 0);
}
function supprimerTelephone(r){
  if(telephoneBloque(r)) return;
  const n = r.variants.length;
  if(!confirm("Supprimer « "+r.brand+" "+r.model+" » ?\n\n"
      + n+" déclinaison(s) et "+r.qty+" unité(s) en stock seront effacées, "
      + "ainsi que son affectation de casier. Le journal, lui, est conservé."))
    return;
  agir("telephone.supprimer", { refId:r.id });
}
function supprimerMateriel(m){
  if(materielBloque(m)) return;
  if(!confirm("Supprimer « "+m.name+" » ?\n\n"
      + m.qty+" unité(s) en stock seront effacées. "
      + "Le journal, lui, est conservé."))
    return;
  agir("materiel.supprimer", { nom:m.id||m.name });
}

function setMissionArchived(name, meta, val){
  agir("mission.archiver", { nom:name, archive:val });
}
/* disponible = quantité en stock − réservations non rendues */
function matAvailable(name){
  const it = S.materiel.find(m=>(m.id||m.name)===name);
  const already = (S.matRes[name]||[]).filter(r=>!r.returned).reduce((s,r)=>s+r.qty,0);
  return Math.max(0, (it?it.qty:0) - already);
}
/* La categorie d'un article, ou rien s'il a ete supprime. */
function matCategorie(id){
  const m = S.materiel.find(x=>(x.id||x.name)===id);
  return m ? m.cat : "";
}
function estConsommable(id){ return matCategorie(id)===CATEGORIE_CONSOMMABLE; }

/* Ce qu'une mission detient encore, regroupe par article : une mission peut
   avoir sorti le meme article en deux fois, et la restitution ne demande
   qu'une quantite par article. */
function lignesOuvertesMission(nom){
  const par = {};
  Object.keys(S.matRes).forEach(id=>(S.matRes[id]||[]).forEach(r=>{
    if(r.mission===nom && !r.returned) par[id] = (par[id]||0) + r.qty;
  }));
  return Object.keys(par).map(id=>({ id, qty:par[id] }));
}

/* Total consomme par article, lu dans le journal. Le stock dit ce qui reste,
   pas ce qui est parti : sans ce cumul, l'administration ne saurait pas a
   quel rythme un consommable se vide. */
function totalConsomme(id){
  const nom = matLabel(id);
  return S.matLog.filter(e=>e.kind==="CONSOMMÉ" && e.item===nom)
                 .reduce((s,e)=>s+e.qty, 0);
}

function matLabel(id){
  const m = S.materiel.find(x=>(x.id||x.name)===id);
  return m ? m.name : id;
}
/* Ce qui distingue un exemplaire de ses jumeaux. Depuis que le template
   laisse designer lequel on emporte, le libelle seul ne suffit plus a dire
   ce qui est sorti : trois perceuses portent le meme nom, et c'est
   l'etiquette qui dit laquelle est partie. Vide quand rien ne les distingue,
   ou quand l'article a ete supprime. */
function matDetail(id){
  const m = S.materiel.find(x=>(x.id||x.name)===id);
  return m ? exemplaireDetail(m) : "";
}
/* ---------- templates de mission ----------

   Un template dit ce qu'il faut emporter, pas ce qui est réservé. Chaque
   ligne vise soit un type d'article — n'importe quelle perceuse fera
   l'affaire —, soit un exemplaire nommément désigné, et c'est `genre` qui le
   dit. Les fonctions qui suivent sont le miroir de `_servir_template()` dans
   coeur/regles.py : si les deux divergent, l'écran promet ce que le serveur
   refusera. */

/* Le catalogue vu par les templates : un article par libellé, ses exemplaires
   regroupés dessous. C'est exactement la distinction que l'écran donne à
   choisir. */
function catalogueMateriel(){
  const groupes = new Map();
  S.materiel.forEach(m=>{
    const cle = (m.name||"").toLowerCase();
    let g = groupes.get(cle);
    if(!g) groupes.set(cle, g = { libelle:m.name, cat:m.cat, exemplaires:[] });
    g.exemplaires.push(m);
  });
  return Array.from(groupes.values())
    .sort((a,b)=>a.libelle.localeCompare(b.libelle,"fr"));
}

/* Ce qui distingue deux exemplaires du même article. Vide quand rien ne les
   distingue : mieux vaut ne rien afficher qu'un « sans identifiant » répété. */
function exemplaireDetail(m){
  const bits = [];
  if(m.etiquette) bits.push("étiquette "+m.etiquette);
  if(m.numeroSerie) bits.push("série "+m.numeroSerie);
  return bits.join(" · ");
}


function libelleLigneTemplate(ligne){
  if(ligne.genre!=="exemplaire") return ligne.libelle;
  const m = S.materiel.find(x=>(x.id||x.name)===ligne.id);
  const detail = m ? exemplaireDetail(m) : "";
  return ligne.libelle + (detail ? " · "+detail : "");
}

/* Le pastillage d'une ligne : son genre, puis son état vis-à-vis du stock. */
function badgesLigneTemplate(ligne){
  const dispo = dispoLigneTemplate(ligne);
  const genre = ligne.genre==="exemplaire"
    ? '<span class="badge info">EXEMPLAIRE</span>'
    : '<span class="badge mut">TYPE</span>';
  if(dispo===null) return genre+'<span class="badge bad">ARTICLE SUPPRIMÉ</span>';
  if(dispo < ligne.qty) return genre+'<span class="badge bad">'+dispo+' DISPO.</span>';
  return genre;
}

function ouvrirTemplate(t){
  setT({ templateEdit:{
    origine: t ? t.name : null,
    nom: t ? t.name : "",
    lignes: t ? t.items.map(i=>({ genre:i.genre, libelle:i.libelle, id:i.id, qty:i.qty })) : [],
    q:"", page:0, deplie:{}
  }});
}

/* Ajouter deux fois la même chose incrémente la quantité plutôt que de créer
   un doublon — que le serveur refuserait, et à juste titre. */
function ajouterLigneTemplate(ligne){
  const f = S.templateEdit; if(!f) return;
  const existante = f.lignes.find(x=> x.genre===ligne.genre && (ligne.genre==="exemplaire"
    ? x.id===ligne.id
    : (x.libelle||"").toLowerCase()===(ligne.libelle||"").toLowerCase()));
  if(existante) existante.qty = Number(existante.qty||0) + 1;
  else f.lignes.push(ligne);
  render();
}

async function enregistrerTemplate(){
  const f = S.templateEdit; if(!f) return;
  const nom = (f.nom||"").trim();
  const lignes = f.lignes.map(l=>({
    genre:l.genre, libelle:l.libelle, id:l.id, qty:Math.max(1, Number(l.qty)||1)
  }));
  if(!nom || !lignes.length) return;
  const ok = f.origine
    ? await agir("mission.template.modifier", { nom:f.origine, nouveauNom:nom, lignes })
    : await agir("mission.template.creer", { nom, lignes });
  if(ok) setT({ templateEdit:null });
}

/* Les exemplaires qui peuvent servir une ligne : celui qu'elle nomme, ou
   tous ceux qui portent son libellé. */
function candidatsLigneTemplate(ligne){
  return ligne.genre==="exemplaire"
    ? S.materiel.filter(m=>(m.id||m.name)===ligne.id)
    : S.materiel.filter(m=>(m.name||"").toLowerCase()===(ligne.libelle||"").toLowerCase());
}

/* Ce que le stock peut servir pour une ligne, ou `null` si l'article qu'elle
   nomme a disparu — auquel cas la ligne est cassée, pas insuffisante. */
function dispoLigneTemplate(ligne){
  const cibles = candidatsLigneTemplate(ligne);
  if(!cibles.length) return null;
  return cibles.reduce((n,m)=>n+matAvailable(m.id||m.name), 0);
}

/* Ce que la personne a désigné pour une ligne, et ce qu'il reste à servir
   automatiquement. Miroir de `_servir_template()` dans coeur/regles.py. */
function designesLigne(ligne){
  const par = S._mChoix[ligne.ligne] || {};
  const total = Object.values(par).reduce((n,q)=>n+(Number(q)||0), 0);
  return { par, total, reste: ligne.qty - total, trop: total > ligne.qty };
}

function poserChoixLigne(ligne, id, quantite){
  const par = Object.assign({}, S._mChoix[ligne.ligne] || {});
  const n = Math.max(0, Number(quantite)||0);
  if(n) par[id] = n; else delete par[id];
  setT({ _mChoix: Object.assign({}, S._mChoix, {[ligne.ligne]: par}) });
}

/* ---------- ce que chaque compte détient ----------

   L'onglet « Comptes » de l'administration. Il ne demande rien de plus au
   serveur : tout est déjà dans l'état synchronisé, et la boucle de
   synchronisation le rafraîchit comme le reste. Une carte cesse donc d'être à
   jour au plus deux secondes et demie après un emprunt, sans qu'on ait à la
   rouvrir.

   `COMPTES` n'est rempli que pour un administrateur — le serveur n'envoie la
   liste des comptes à personne d'autre. */

/* Depuis combien de temps, dit en une expression.

   La date absolue reste affichée à côté : « depuis 3 jours » répond à la
   question qu'on se pose, « 10/09 » à celle qu'on posera ensuite. Un emprunt
   antérieur à l'enregistrement des dates de départ n'en a pas ; l'inventer
   serait pire que l'admettre. */
function depuisQuand(iso){
  const d = quand(iso);
  if(!d) return "depuis une date inconnue";
  const minutes = Math.floor((Date.now() - d.getTime()) / 60000);
  if(minutes < 1)  return "à l'instant";
  if(minutes < 60) return "depuis " + minutes + " min";
  const heures = Math.floor(minutes / 60);
  if(heures < 24)  return "depuis " + heures + " h";
  const jours = Math.floor(heures / 24);
  if(jours < 31)   return "depuis " + jours + " jour" + (jours > 1 ? "s" : "");
  const mois = Math.floor(jours / 30);
  return "depuis " + mois + " mois";
}

/* Tout ce qu'un compte détient, des trois sources qui existent : le matériel
   emprunté pour une mission, les téléphones sortis de l'armoire, et les
   téléphones réservés. La réservation compte : l'appareil n'a pas quitté son
   casier, mais personne d'autre ne peut le prendre. */
function possessionsDe(compte){
  const lignes = [];
  (S.dotations[compte]||[]).forEach(d=>{
    // Une ligne de sac designe un exemplaire precis : son etiquette et son
    // numero de serie sont ce qui distingue le portable de Compte-001 des deux
    // autres identiques. Sans eux, « Dell Latitude 5450 » ne dit pas lequel.
    const marques = [];
    if(d.etiquette) marques.push("étiquette "+d.etiquette);
    if(d.numeroSerie) marques.push("série "+d.numeroSerie);
    if(d.manquant) marques.push("article supprimé du catalogue");
    else if(!marques.length) marques.push("sans identifiant");
    // Le detail saisi a la main vient apres l'identite, qui est la donnee sure.
    if(d.detail) marques.push(d.detail);
    lignes.push({ genre:"dotation", libelle:d.libelle||d.article,
                  detail:marques.join(" · "), qty:d.quantite,
                  contexte:"Sac attribué à l'arrivée", iso:null,
                  manquant:!!d.manquant });
  });
  Object.keys(S.matRes).forEach(id=>{
    (S.matRes[id]||[]).forEach(r=>{
      if(r.returned || r.by !== compte) return;
      lignes.push({ genre:"matériel", libelle:matLabel(id), detail:matDetail(id),
                    qty:r.qty, contexte:r.mission || "—", iso:r.iso || null });
    });
  });
  S.refs.forEach(ref=>{
    (ref.outs||[]).forEach(o=>{
      if(o.who !== compte) return;
      lignes.push({ genre:"téléphone", libelle:ref.brand+" "+ref.model,
                    detail:o.variant || "", qty:o.qty, contexte:"Sorti de l'armoire",
                    iso:o.iso || null });
    });
    (ref.reservations||[]).forEach(r=>{
      if(r.who !== compte) return;
      lignes.push({ genre:"réservation", libelle:ref.brand+" "+ref.model,
                    detail:r.variant || "", qty:r.qty, contexte:"Réservé, encore en casier",
                    iso:r.iso || null });
    });
  });
  // Le plus ancien en tête : c'est ce qui traîne qui appelle une relance.
  // Une ligne sans date passe en premier — elle traîne depuis plus longtemps
  // encore que la plus ancienne datée, puisqu'elle précède l'enregistrement
  // des dates.
  return lignes.sort((a,b)=>String(a.iso||"").localeCompare(String(b.iso||"")));
}

const GENRE_BADGE = { "dotation":"ok", "matériel":"warn", "téléphone":"info", "réservation":"mut" };

  const dotations = lignes.filter(l=>l.genre==="dotation");
  const possessions = lignes.filter(l=>l.genre!=="dotation");
  const total = lignes.reduce((n,l)=>n+l.qty, 0);
  /* Trois lignes, et l'identite a la sienne.
     Elle etait auparavant collee au libelle sur la meme ligne, donc coupee par
     l'ellipse des que le nom de l'article etait un peu long : « etiquette
     PC-003 · serie 8KJ2NS5 » disparaissait precisement quand on en avait
     besoin. La meme information existe deja sur sa propre ligne dans la table

  const listeHtml = liste => liste.length ? `<div class="stack" style="border-radius:8px">${liste.map(l=>`
        <div style="padding:8px 11px;display:flex;align-items:center;gap:10px">

          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="font:500 11.5px/1.2 Archivo,sans-serif;color:#eef0f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(l.libelle)}</span>
            ${l.detail?`<span style="font:400 10.5px/1.25 Archivo,sans-serif;color:${l.manquant?"#ef8b83":"#9aa2af"};overflow-wrap:anywhere">${esc(l.detail)}</span>`:""}
            <span style="font:400 10px/1.2 Archivo,sans-serif;color:#6d7480;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(l.contexte)} · ${esc(depuisQuand(l.iso))}${l.iso?" ("+esc(dateCourte(l.iso))+")":""}</span>
          </span>
          <span style="flex:none;font:600 11px/1 Archivo,sans-serif;color:#f0b45a;font-variant-numeric:tabular-nums">${l.qty} u.</span>
        </div>`).join("")}</div>` : "";
  const corps = !lignes.length
    ? '<span style="font:400 11.5px/1.4 Archivo,sans-serif;color:#6d7480">Rien en sa possession.</span>'
    : `${dotations.length?`<div class="field" style="gap:6px"><span class="klabel">SAC DE DOTATION · ${dotations.length}</span>${listeHtml(dotations)}</div>`:""}
      ${possessions.length?`<div class="field" style="gap:6px"><span class="klabel">EMPRUNTS ET SORTIES · ${possessions.length}</span>${listeHtml(possessions)}</div>`:""}`;
  return `
  <div class="card" style="padding:13px 15px;display:flex;flex-direction:column;gap:10px${lignes.length?"":";opacity:.7"}">
    <div style="display:flex;align-items:center;gap:9px">
      <span style="width:24px;height:24px;flex:none;border-radius:50%;background:#1f242c;border:1px solid #343a45;display:grid;place-items:center;font:600 9.5px/1 Archivo,sans-serif;color:#9aa2af">${esc(compte.split(/[\s._-]+/).map(p=>p[0]||"").join("").slice(0,2).toUpperCase())}</span>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
        <span style="font:600 12.5px/1.2 Archivo,sans-serif;color:#f2f4f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(compte)}${compte===OPERATOR?'<span style="color:#6d7480;font-weight:400"> · vous</span>':""}</span>
        <span style="font:400 10px/1.2 Archivo,sans-serif;color:#6d7480">${lignes.length?lignes.length+" ligne"+(lignes.length>1?"s":"")+" · "+total+" unité"+(total>1?"s":""):"aucune possession"}</span>
      </span>
      ${lignes.length?`<span class="badge ${lignes.length>2?"bad":"warn"}">${total}</span>`:'<span class="badge ok">À JOUR</span>'}
      ${ADMIN?`<button class="btn-mini hblue" ${on(()=>ouvrirDotation(compte))}>Modifier le sac</button>`:""}
    </div>
    ${corps}

}

function ouvrirDotation(compte){
  const lignes = (S.dotations[compte]||[]).map(d=>({
    article:d.article, quantite:Number(d.quantite)||0, detail:d.detail||""}));
  setT({dotationEdit:{compte, query:"", lignes}});
}

async function confirmerDotation(){
  const f = S.dotationEdit; if(!f) return;
  const materiel = f.lignes.filter(l=>l.article && Number(l.quantite)>0)
    .map(l=>[l.article, Number(l.quantite), l.detail||""]);
  if(await agir("compte.dotations", {compte:f.compte, materiel}))
    setT({dotationEdit:null});
}

function ouvrirAttribution(materiel){
  if(!ADMIN || !COMPTES.length) return;
  // La cle, pas le libelle : c'est cet exemplaire-la qu'on attribue, avec son
  // etiquette et son numero de serie.
  setT({attributionEdit:{
    article:materiel.id||materiel.name, compte:COMPTES[0], quantite:1, detail:""}});
}

async function confirmerAttribution(){
  const f = S.attributionEdit; if(!f) return;
  const quantite = Number(f.quantite);
  if(!Number.isInteger(quantite) || quantite < 1){
    syncNote("La quantité doit être un entier positif."); return;
  }
  const lignes = (S.dotations[f.compte]||[]).map(d=>({
    article:d.article, quantite:Number(d.quantite)||0, detail:d.detail||""}));
  const ligne = lignes.find(d=>d.article===f.article);
  if(ligne){
    ligne.quantite += quantite;
    if(f.detail.trim()) ligne.detail = f.detail.trim();
  }else{
    lignes.push({article:f.article, quantite, detail:f.detail.trim()});
  }
  const materiel = lignes.map(d=>[d.article,d.quantite,d.detail]);
  if(await agir("compte.dotations", {compte:f.compte, materiel}))
    setT({attributionEdit:null});
}

/* Modifie une ligne du sac en cours d'edition, sans redessiner.

   Le redessin etait ici, et il faisait sortir le curseur du champ a chaque
   caractere tape : `render()` remplace tout le contenu de la page, et le
   moteur ne remet le curseur que sur un element portant `data-k` — ce que ces
   deux champs n'avaient pas.

   Les deux corrections sont necessaires, et pour des raisons differentes :

   - ne plus redessiner a chaque frappe, parce que rien a l'ecran ne depend de
     ce qu'on tape ici. C'est le meme parti pris que les autres champs texte du
     fichier (`f.etiquette=e.target.value`, sans render) ;
   - donner quand meme un `data-k` a chaque champ, parce que la boucle de
     synchronisation redessine toutes les 2,5 secondes des que quelqu'un
     d'autre modifie quelque chose. Sans lui, le curseur sauterait encore,
     juste moins souvent — et de façon d'autant plus deroutante. */
function modifierLigneDotation(article, champ, valeur){
  const f = S.dotationEdit; if(!f) return;
  let ligne = f.lignes.find(l=>l.article===article);
  if(!ligne){ ligne={article, quantite:0, detail:""}; f.lignes.push(ligne); }
  ligne[champ] = champ==="quantite" ? Math.max(0, Number(valeur)||0) : valeur;
}

function carteComptesAdmin(){
  const q = (S.adminCompteQuery||"").trim().toLowerCase();
  const detenu = new Map(COMPTES.map(c=>[c, possessionsDe(c)]));

  // Un emprunt peut porter un nom qui n'est plus dans la liste des comptes —
  // compte supprimé, ou donnée reprise de GestiStock_v0. L'omettre ferait
  // disparaître du matériel bel et bien sorti : on lui fait sa carte.
  Object.keys(S.matRes).forEach(id=>(S.matRes[id]||[]).forEach(r=>{
    if(!r.returned && r.by && !detenu.has(r.by)) detenu.set(r.by, possessionsDe(r.by));
  }));
  S.refs.forEach(ref=>{
    [...(ref.outs||[]), ...(ref.reservations||[])].forEach(x=>{
      if(x.who && !detenu.has(x.who)) detenu.set(x.who, possessionsDe(x.who));
    });
  });

  let comptes = Array.from(detenu.entries());
  if(S.adminComptesActifs) comptes = comptes.filter(([, l])=>l.length);
  if(q) comptes = comptes.filter(([c, l])=> c.toLowerCase().includes(q)
    || l.some(x=>(x.libelle+" "+x.detail+" "+x.contexte).toLowerCase().includes(q)));

  // Ceux qui détiennent quelque chose d'abord, le plus ancien emprunt en tête :
  // c'est l'ordre dans lequel on relance.
  comptes.sort((a,b)=>{
    if(!a[1].length !== !b[1].length) return a[1].length ? -1 : 1;
    if(a[1].length && b[1].length)
      return String(a[1][0].iso||"").localeCompare(String(b[1][0].iso||""));
    return a[0].localeCompare(b[0], "fr");
  });

  const avec = Array.from(detenu.values()).filter(l=>l.length).length;
  const unites = Array.from(detenu.values())
    .reduce((n,l)=>n + l.reduce((s,x)=>s+x.qty, 0), 0);

  return `
  <div class="card" style="overflow:hidden;display:${S.adminTab==="comptes"?"block":"none"}">
    <div style="padding:14px 16px;border-bottom:1px solid #23262d;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:3px">
        <span style="font:600 13px Archivo,sans-serif;color:#eef0f4">Comptes et possessions</span>
        <span style="font:400 11px Archivo,sans-serif;color:#6d7480">${detenu.size} compte${detenu.size>1?"s":""} · ${avec} ${avec>1?"détiennent":"détient"} quelque chose · ${unites} unité${unites>1?"s":""} en circulation</span>
      </div>
      ${chip(S.adminComptesActifs?"Seulement ceux qui détiennent":"Tous les comptes", S.adminComptesActifs, ()=>setT({adminComptesActifs:!S.adminComptesActifs}))}
    </div>
    <div style="padding:12px 16px;border-bottom:1px solid #23262d"><input class="inp" data-k="cptq" style="width:100%;font-size:12px" placeholder="Rechercher un compte, un article, une mission…" value="${esc(S.adminCompteQuery)}" ${oni(e=>setT({adminCompteQuery:e.target.value}))}></div>
    ${comptes.length
      ? `<div style="padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(316px,1fr));gap:12px;align-items:start">${comptes.map(([c, l])=>carteCompte(c, l)).join("")}</div>`
      : `<div style="padding:34px 16px;text-align:center;color:#6d7480;font:400 12px Archivo,sans-serif">${COMPTES.length?"Aucun compte correspondant.":"Le serveur n'a transmis aucun compte."}</div>`}
  </div>`;
}

/* Aperçu d'un template sur la page « Missions ».

   Il annonce ce que la création va sortir du stock — le refus du serveur ne
   doit pas être la première nouvelle — et, sur les lignes que le template a
   laissées ouvertes, il laisse désigner l'exemplaire réellement emporté. Le
   template dit « une perceuse » ; celui qui part sait laquelle il a prise, et
   c'est ce nom-là qui doit figurer dans le journal. */
function apercuTemplateHtml(t){
  const lignes = t.items.map(ligne=>{
    const candidats = candidatsLigneTemplate(ligne);
    const dispo = candidats.length
      ? candidats.reduce((n,m)=>n+matAvailable(m.id||m.name), 0) : null;
    const choisissable = ligne.genre==="type" && candidats.length > 1;
    const deplie = !!S._mDeplie[ligne.ligne];
    const etat = designesLigne(ligne);
    const manque = dispo===null || dispo < ligne.qty;

    const exemplaires = !(choisissable && deplie) ? "" : candidats.map(m=>{
      const id = m.id||m.name;
      const libre = matAvailable(id);
      const pose = Number(etat.par[id]||0);
      const detail = exemplaireDetail(m) || "Sans identifiant";
      const champ = libre<=1
        ? `<input type="checkbox" aria-label="J'ai pris ${esc(detail)}" ${pose?"checked":""} ${libre?"":"disabled"} ${ong(()=>poserChoixLigne(ligne, id, pose?0:1))} style="width:15px;height:15px;flex:none;accent-color:#2A6BF2;cursor:pointer">`
        : `<input class="inp" data-k="mchoix-${esc(ligne.ligne)}-${esc(id)}" type="number" min="0" max="${Math.min(libre, ligne.qty)}" style="width:68px;padding:5px 7px;flex:none" value="${esc(pose||"")}" placeholder="0" ${oni(e=>poserChoixLigne(ligne, id, e.target.value))}>`;
      return `
      <div style="display:flex;align-items:center;gap:10px;padding:5px 0 5px 14px">
        <span style="flex:1;min-width:0;font:400 11px Archivo,sans-serif;color:${libre?"#9aa2af":"#5f6672"};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(detail)}</span>
        <span style="flex:none;font:400 10.5px Archivo,sans-serif;color:#6d7480">${libre} / ${m.qty} dispo.</span>
        ${champ}
      </div>`;
    }).join("");

    const pied = !(choisissable && deplie) ? "" : (
      etat.trop
        ? `<span style="font:400 10.5px/1.4 Archivo,sans-serif;color:#ef8b83;padding-left:14px">Vous avez désigné ${etat.total} exemplaire(s) pour une ligne qui n'en demande que ${ligne.qty}.</span>`
        : etat.reste > 0
          ? `<span style="font:400 10.5px/1.4 Archivo,sans-serif;color:#6d7480;padding-left:14px">${etat.reste} restant(s) servi(s) automatiquement.</span>`
          : `<span style="font:400 10.5px/1.4 Archivo,sans-serif;color:#8fb4ff;padding-left:14px">Les ${ligne.qty} exemplaire(s) sont désignés.</span>`);

    return `
    <div style="display:flex;flex-direction:column;gap:2px">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="flex:1;min-width:0;font:400 11.5px Archivo,sans-serif;color:${manque||etat.trop?"#ef8b83":"#c3c9d3"};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(libelleLigneTemplate(ligne))}</span>
        <span style="flex:none;font:400 11.5px Archivo,sans-serif;color:${manque?"#ef8b83":"#8fb4ff"}">${dispo===null?"article supprimé":(manque?dispo+" sur "+ligne.qty+" dispo.":ligne.qty+" u.")}</span>
        ${choisissable?`<button class="btn-mini ${deplie?"tog-on":"hblue"}" style="flex:none" ${on(()=>setT({_mDeplie:Object.assign({}, S._mDeplie, {[ligne.ligne]:!deplie})}))}>${deplie?"Masquer":"Préciser"}</button>`:""}
      </div>
      ${exemplaires}
      ${pied}
    </div>`;
  }).join("");

  const bloquant = t.items.some(ligne=>{
    const dispo = dispoLigneTemplate(ligne);
    return dispo===null || dispo < ligne.qty || designesLigne(ligne).trop;
  });

    ligne.genre==="type" && candidatsLigneTemplate(ligne).length > 1).length;

  return `

  </div>`;
}

/* Vrai quand rien n'empêche de créer la mission avec ce template : la
   vérification est refaite côté serveur, mais griser le bouton évite d'aller
   chercher le refus. */
function templateCreable(t){
  return !t || !t.items.some(ligne=>{
    const dispo = dispoLigneTemplate(ligne);
    return dispo===null || dispo < ligne.qty || designesLigne(ligne).trop;
  });
}
/* ---------- packs ----------

   Un pack est une malette : plusieurs articles rangés ensemble, qu'on
   emporte d'un seul geste. Miroir de la section « Packs » de
   coeur/regles.py — le serveur reste seul juge, ces fonctions ne servent
   qu'à ne pas proposer ce qu'il refuserait.

   Un pack ne réserve rien : composer une malette ne retire aucun article du
   stock. Ce qui est « dehors » se lit dans les emprunts, qui portent le nom
   du pack d'où ils viennent. */

/* Ce qu'un panier réclame par article, malettes dépliées. Sans ce cumul,
   l'écran laisserait valider ce que le serveur refusera : deux lignes visant
   le même article paraissent tenir chacune dans le stock. */
function demandePanier(b){
  const total = {};
  (b.packs||[]).forEach(nom=>{
    const pk = S.packs.find(x=>x.name===nom);
    if(pk) pk.items.forEach(i=>{ if(!i.manquant) total[i.id] = (total[i.id]||0) + i.qty; });
  });
  Object.keys(b.qtys||{}).forEach(nm=>{
    total[nm] = (total[nm]||0) + Math.max(1, Number(b.qtys[nm])||1);
  });
  return total;
}

/* Les articles que le panier réclame au-delà du disponible. */
function manquesPanier(b){
  const demande = demandePanier(b);
  return Object.keys(demande).filter(nm=>demande[nm] > matAvailable(nm));
}

function packSorties(nom){
  const lignes = [];
  Object.keys(S.matRes).forEach(id=>(S.matRes[id]||[]).forEach(r=>{
    if(r.pack===nom && !r.returned) lignes.push({id, qty:r.qty, mission:r.mission, by:r.by});
  }));
  return lignes;
}

/* Trois états, et pas deux : une malette dont il manque une pièce n'est ni
   rangée ni partie, et c'est précisément le cas qu'il faut voir. */
function packEtat(pack){
  const dehors = packSorties(pack.name);
  if(!dehors.length) return "range";
  const attendus = pack.items.filter(i=>!i.manquant).length;
  return dehors.length >= attendus ? "sorti" : "partiel";
}

/* Ce qui manquerait pour sortir la malette entière, telle qu'elle est. */
function packManquants(pack){
  return pack.items.filter(i=>i.manquant || matAvailable(i.id) < i.qty);
}

function packDisponible(pack){
  return pack.items.length>0 && packEtat(pack)==="range" && !packManquants(pack).length;
}

/* ---------- equipes d'une mission ----------

   Une mission se divise souvent en groupes qui partent chacun de leur cote.
   Une equipe porte deux choses distinctes : ses membres, qui sont un etat
   courant, et son materiel, qui est attribue ligne par ligne sur les emprunts.

   Le nom d'une equipe n'est unique qu'a l'interieur de sa mission : deux
   missions peuvent chacune avoir leur « Equipe A ». Toutes les recherches se
   font donc sur le couple. */

function equipesDe(mission){
  if(!mission || mission===SANS_MISSION) return [];
  return S.equipes.filter(e=>e.mission===mission)
                  .sort((a,b)=>(a.ordre-b.ordre) || a.nom.localeCompare(b.nom));
}

function equipeExiste(mission, nom){
  return equipesDe(mission).some(e=>e.nom===nom);
}

/* Le selecteur d'equipe des modales d'emprunt. Vide quand la mission n'a pas
   d'equipes : proposer un choix a une seule option serait du bruit. */
function selecteurEquipe(mission, choisie, poser){
  const equipes = equipesDe(mission);
  if(!equipes.length) return "";
  return `
  <label class="field">
    <span class="klabel">ÉQUIPE <span style="color:#6d7480;font-weight:400;letter-spacing:0">(facultatif)</span></span>
    <select class="inp" ${ong(e=>poser(e.target.value))}>
      <option value=""${!choisie?" selected":""}>Toute la mission</option>
      ${equipes.map(e=>`<option value="${esc(e.nom)}"${e.nom===choisie?" selected":""}>${esc(e.nom)}${e.membres.length?" · "+e.membres.length+" membre(s)":""}</option>`).join("")}
    </select>
  </label>`;
}

function ouvrirEquipe(mission, nom){
  setT({equipeEdit:{mission, original:nom||null, valeur:nom||""}});
}

async function confirmerEquipe(){
  const f = S.equipeEdit; if(!f) return;
  const nom = (f.valeur||"").trim();
  if(!nom) return;
  const ok = f.original
    ? await agir("mission.equipe.renommer",
                 {mission:f.mission, nom:f.original, nouveauNom:nom})
    : await agir("mission.equipe.creer", {mission:f.mission, nom});
  if(ok) setT({equipeEdit:null});
}

function ouvrirMembres(mission, nom){
  const equipe = equipesDe(mission).find(e=>e.nom===nom);
  setT({membresEdit:{mission, nom, choisis:(equipe?equipe.membres:[]).slice()}});
}

async function confirmerMembres(){
  const f = S.membresEdit; if(!f) return;
  if(await agir("mission.equipe.membres",
                {mission:f.mission, nom:f.nom, membres:f.choisis}))
    setT({membresEdit:null});
}

function supprimerEquipe(mission, nom){
  if(!confirm("Supprimer l'équipe « "+nom+" » de « "+mission+" » ?\n\n"
    + "Son matériel déjà rendu garde son nom dans le journal. Ce qui est "
    + "encore dehors doit d'abord être rendu ou déplacé.")) return;
  agir("mission.equipe.supprimer", {mission, nom});
}

/* ---------- ce que le compte connecté détient ----------

   Deux sources, parce qu'il y a deux stocks : le matériel emprunté pour une
   mission, et les téléphones sortis de l'armoire. Les réservations ne comptent
   pas — l'appareil réservé n'a pas quitté son casier.

   Le rang renvoyé est celui de la ligne dans la liste complète, jamais dans la
   liste filtrée : c'est lui que le serveur reçoit, accompagné de l'empreinte
   qui lui permet de vérifier qu'il rend bien cette ligne-là. */
function mesEmprunts(){
  const liste = [];
  Object.keys(S.matRes).forEach(nom=>{
    (S.matRes[nom]||[]).forEach((r,index)=>{
      if(!r.returned && r.by===auteurEffectif()) liste.push({nom, index, r});
    });
  });
  return liste.sort((a,b)=>(a.r.mission+matLabel(a.nom)).localeCompare(b.r.mission+matLabel(b.nom)));
}
function mesSorties(){
  const liste = [];
  S.refs.forEach(ref=>{
    (ref.outs||[]).forEach((o,index)=>{
      if(o.who===auteurEffectif()) liste.push({ref, index, o});
    });
  });
  return liste.sort((a,b)=>String(a.o.iso||"").localeCompare(String(b.o.iso||"")));
}
function mesReservations(){
  const liste = [];
  S.refs.forEach(ref=>{
    (ref.reservations||[]).forEach((r,index)=>{
      if(r.who===auteurEffectif()) liste.push({ref, index, r});
    });
  });
  return liste.sort((a,b)=>String(a.r.iso||"").localeCompare(String(b.r.iso||"")));
}
function nbPossessions(){
  return (S.dotations[auteurEffectif()]||[]).length
    + mesEmprunts().length + mesSorties().length + mesReservations().length;
}

/* ---------- ce qui tient dans la fenetre ----------

   Une table paginee a 20 lignes fixes defilait sur un petit ecran et laissait
   du vide sur un grand. Elle demande desormais combien de lignes tiennent
   reellement dans la place disponible.

   La mesure est stable, et c'est ce qui permet de la faire apres le rendu sans
   boucler : la zone mesuree est en `overflow:hidden` et tient sa hauteur du
   flex parent, donc elle ne depend pas du nombre de lignes qu'on y met.
   Mesurer, ajuster, redessiner une fois, et c'est fige. */
const RANGS = {};
let enMesure = false;

function rangsQuiTiennent(cle, hauteurLigne, defaut){
  return RANGS[cle] || defaut || Math.max(1, Math.floor(520 / hauteurLigne));
}

function mesurerRangs(){
  let change = false;
  app.querySelectorAll("[data-rangs]").forEach(el=>{
    const cle = el.getAttribute("data-rangs");
    const h = Number(el.getAttribute("data-rangh")) || 40;
    const dispo = el.clientHeight;
    if(!dispo) return;                     // zone masquee : rien a mesurer
    // +1 : une derniere ligne dont il ne manque qu'un pixel de bordure tient
    // en pratique, et l'ecarter laisserait un trou visible.
    const n = Math.max(1, Math.floor((dispo + 1) / h));
    if(RANGS[cle] !== n){ RANGS[cle] = n; change = true; }
  });
  return change;
}

        <div style="background:#15181d;border:1px solid #23262d;border-radius:13px;padding:20px;display:flex;flex-direction:column;gap:16px">

  if(S.page==="materiel"){
    const articlesAttribues = new Set(Object.values(S.dotations)
      .flat().map(d=>d.article));
    const catalogueCommun = S.materiel.filter(m=>!articlesAttribues.has(m.name));

    const t = S.matQuery.trim().toLowerCase();
    const filtered = catalogueCommun.filter(m=>{
      if(!(S.matCat==="Toutes" || m.cat===S.matCat)) return false;
      if(!t) return true;
      const identifiant = m.id||m.name;
      const missions = (S.matRes[identifiant]||[]).map(r=>r.mission+" "+(r.by||"")).join(" ");

    const materialPageCount = Math.max(1, Math.ceil(filtered.length/materialPageSize));
    const materialPage = Math.min(Math.max(0, Number(S.stockMaterialPage)||0), materialPageCount-1);
    S.stockMaterialPage = materialPage;
    const pageFiltered = filtered.slice(materialPage*materialPageSize, (materialPage+1)*materialPageSize);
    const selCount = Object.keys(S.matSel).length;
    // Une malette supprimée ou sortie entre-temps ne doit pas rester au

    // souvenir qu'en avait l'écran.
    const packsChoisis = Object.keys(S.packSel)
      .filter(nom=>{ const pk = S.packs.find(x=>x.name===nom); return pk && packDisponible(pk); });
    const selTotal = selCount + packsChoisis.length;

    const groupes = [];
    const groupesParNom = new Map();
    pageFiltered.forEach(m=>{
      const groupe = groupesParNom.get(m.name);
      if(groupe) groupe.push(m);
      else {
        const nouveau = [m];
        groupesParNom.set(m.name, nouveau);
        groupes.push(nouveau);
      }
    });
    const rowsHtml = groupes.map(articles=>{
      const nomGroupe = articles[0].name;
      const ouvert = articles.length < 2 || !!S.matGroups[nomGroupe];
      const enTete = articles.length > 1 ? `
        <button ${on(()=>setT({matGroups:Object.assign({},S.matGroups,{[nomGroupe]:!ouvert})}))}

          <span style="font:500 10px/1 Archivo,sans-serif;color:#6d7480">${articles.length} items</span>

      if(!ouvert) return enTete;
      return enTete + articles.map(m=>{
      const identifiant = m.id||m.name;
      const resList = (S.matRes[identifiant]||[]).filter(r=>!r.returned);
      const resTotal = resList.reduce((s,r)=>s+r.qty,0);
      const checked = !!S.matSel[identifiant];
      return `
      <div style="display:grid;grid-template-columns:${MAT_GRID()};padding:0 16px;height:46px;align-items:center;border-bottom:1px solid #1f232a">

          <button ${on(()=>{ if(S.matSel[identifiant]) delete S.matSel[identifiant]; else S.matSel[identifiant]=true; render(); })}

        <div style="padding-right:8px;display:flex;flex-direction:column;gap:2px;min-width:0">

          ${m.etiquette||m.numeroSerie?`<span style="font:400 10px/1.2 Archivo,sans-serif;color:#6d7480;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.etiquette?"Étiquette : "+esc(m.etiquette):""}${m.etiquette&&m.numeroSerie?" · ":""}${m.numeroSerie?"Série : "+esc(m.numeroSerie):""}</span>`:""}
        </div>
        <div style="padding:0 8px;font:400 12px/46px Archivo,sans-serif;color:#aeb5c1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.cat)}</div>
        <div style="padding:0 8px;display:flex;align-items:center;min-width:0">
          <select class="affect ${affectCls(m.affectation)}" ${ong(e=>agir("materiel.affectation",{nom:identifiant, affectation:e.target.value}))}>
            ${AFFECTATIONS.map(a=>`<option value="${esc(a)}"${a===m.affectation?" selected":""}>${esc(a)}</option>`).join("")}
          </select>
        </div>
        <div style="padding:0 8px;display:flex;align-items:center;justify-content:flex-end">
          <span style="font:600 13px/1 Archivo,sans-serif;font-variant-numeric:tabular-nums;color:#f2f4f8">${m.qty}</span>
        </div>
        <div style="padding:0 8px;display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden">
          ${resList.length
            ? resList.map(r=>`<span style="font:500 10px/1.4 Archivo,sans-serif;color:#8fb4ff;background:rgba(42,107,242,.13);border:1px solid rgba(42,107,242,.32);border-radius:5px;padding:3px 6px;letter-spacing:.03em;white-space:nowrap;max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto">${esc(r.mission+" · "+r.qty+" u.")}</span>`).join("")
            : '<span style="font:400 11px/1 Archivo,sans-serif;color:#4a5058">—</span>'}
        </div>
        <div style="padding-left:8px;display:flex;align-items:center;justify-content:flex-end;gap:6px">
          <button ${on(()=>openMatRes(m))} class="${resTotal?'':'btn-mini hblue'}" style="${resTotal?"padding:5px 9px;border-radius:6px;white-space:nowrap;font:500 10.5px Archivo,sans-serif;background:rgba(240,180,90,.14);border:1px solid rgba(240,180,90,.4);color:#f0b45a;cursor:pointer":""}">${resTotal ? resTotal+" u. réservées" : "Réserver"}</button>
          ${ADMIN?`<button class="btn-mini hblue" ${on(()=>ouvrirAttribution(m))}>Attribuer</button>`:""}
          ${ADMIN?`<button class="btn-mini hred" ${resTotal?'disabled title="Impossible tant que cet article est emprunté"':''} ${on(()=>supprimerMateriel(m))}>Supprimer</button>`:""}

    /* Les malettes, au-dessus des articles qu'elles contiennent. Elles
       partagent la recherche de la page : chercher « tournevis » doit
       montrer l'article et la malette qui le transporte. */
    const visibles = S.packs.filter(x=>{
      if(!t) return true;
      const contenu = x.items.map(i=>i.libelle).join(" ");
      return (x.name+" "+(x.etiquette||"")+" "+x.owner+" "+contenu).toLowerCase().includes(t);
    });
    const packsOuvert = !S.packsReplies;
    const cartes = visibles.map(pack=>{
      const etat = packEtat(pack);
      const dehors = packSorties(pack.name);
      const manquants = packManquants(pack);
      const deplie = !!S.packOuverts[pack.name];
      // Une malette dehors ou incomplète en stock ne se met pas au panier :
      // la cocher promettrait un départ que le serveur refuserait.
      const selectionnable = packDisponible(pack);
      const coche = selectionnable && !!S.packSel[pack.name];
      const badge = etat==="sorti"
        ? '<span style="font:500 10px/1 Archivo,sans-serif;color:#f0b45a;background:rgba(240,180,90,.14);border:1px solid rgba(240,180,90,.4);border-radius:5px;padding:4px 7px;letter-spacing:.03em;white-space:nowrap">DEHORS</span>'
        : etat==="partiel"
        ? '<span style="font:500 10px/1 Archivo,sans-serif;color:#ef8b83;background:rgba(239,139,131,.13);border:1px solid rgba(239,139,131,.4);border-radius:5px;padding:4px 7px;letter-spacing:.03em;white-space:nowrap">INCOMPLÈTE</span>'
        : '<span style="font:500 10px/1 Archivo,sans-serif;color:#7fd1a6;background:rgba(127,209,166,.12);border:1px solid rgba(127,209,166,.34);border-radius:5px;padding:4px 7px;letter-spacing:.03em;white-space:nowrap">RANGÉE</span>';

      const sortiesParArticle = {};
      dehors.forEach(d=>{ sortiesParArticle[d.id] = (sortiesParArticle[d.id]||0) + d.qty; });

      const lignes = pack.items.map(i=>{
        const sorti = sortiesParArticle[i.id]||0;
        const dispo = i.manquant ? 0 : matAvailable(i.id);
        const court = !i.manquant && !sorti && dispo < i.qty;
        const detail = [i.etiquette?"étiquette "+i.etiquette:"", i.numeroSerie?"série "+i.numeroSerie:""].filter(Boolean).join(" · ");
        return `
        <div style="padding:8px 13px;display:flex;align-items:center;gap:10px;border-top:1px solid #1f232a">
          <span style="width:22px;flex:none;font:600 11px/1 Archivo,sans-serif;color:#6d7480;font-variant-numeric:tabular-nums">${i.qty}×</span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
            <span style="font:500 11.5px/1.2 Archivo,sans-serif;color:${i.manquant?"#ef8b83":"#dfe3ea"};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(i.libelle)}</span>
            ${detail?`<span style="font:400 10px/1.2 Archivo,sans-serif;color:#6d7480;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(detail)}</span>`:""}
          </span>
          ${i.manquant
            ? '<span style="font:400 10.5px/1 Archivo,sans-serif;color:#ef8b83;white-space:nowrap">article supprimé</span>'
            : sorti
            ? `<span style="font:500 10.5px/1 Archivo,sans-serif;color:#f0b45a;white-space:nowrap">${sorti} dehors</span>`
            : court
            ? `<span style="font:400 10.5px/1 Archivo,sans-serif;color:#ef8b83;white-space:nowrap">disp. ${dispo}</span>`
            : `<span style="font:400 10.5px/1 Archivo,sans-serif;color:#5b6270;white-space:nowrap">disp. ${dispo}</span>`}
        </div>`;
      }).join("");

      const missions = Array.from(new Set(dehors.map(d=>d.mission).filter(m=>m && m!==SANS_MISSION)));

      return `
      <div class="card" style="display:flex;flex-direction:column;overflow:hidden">
        <div style="padding:13px 14px;display:flex;flex-direction:column;gap:9px">
          <div style="display:flex;align-items:flex-start;gap:9px">
            ${selectionnable ? `
            <button ${on(()=>{ if(S.packSel[pack.name]) delete S.packSel[pack.name]; else S.packSel[pack.name]=true; render(); })}
              style="width:15px;height:15px;flex:none;margin-top:2px;border-radius:4px;display:grid;place-items:center;font:600 9px/1 Archivo,sans-serif;padding:0;${coche?"background:#2A6BF2;border:1px solid #2A6BF2;color:#fff":"background:#191c22;border:1px solid #343a45;color:transparent"}">${coche?"✓":""}</button>` : ""}
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
              <span style="font:600 13px/1.2 Archivo,sans-serif;color:#f2f4f8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(pack.name)}</span>
              <span style="font:400 10.5px/1.2 Archivo,sans-serif;color:#6d7480;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${pack.etiquette?"Étiquette : "+esc(pack.etiquette)+" · ":""}${pack.items.length} article(s) · par ${esc(pack.owner)}</span>
            </div>
            ${badge}
          </div>
          ${missions.length?`<span style="font:400 10.5px/1.3 Archivo,sans-serif;color:#8fb4ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Sortie pour ${esc(missions.join(", "))}</span>`:""}
          ${etat==="range" && manquants.length?`<span style="font:400 10.5px/1.3 Archivo,sans-serif;color:#ef8b83">Incomplète en stock : ${esc(manquants.map(i=>i.libelle).join(", "))}</span>`:""}
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            ${etat==="range"
              ? `<button class="btn-pri${packDisponible(pack)?"":" off"}" style="padding:7px 12px;font-size:11.5px;border-radius:7px" ${on(()=>{ if(packDisponible(pack)) openPackBorrow(pack); })}>Emprunter</button>`
              : `<button class="btn-pri" style="padding:7px 12px;font-size:11.5px;border-radius:7px" ${on(()=>agir("pack.retour",{pack:pack.name}))}>Rendre la malette</button>`}
            ${etat!=="sorti" && pack.items.length ? `<button class="btn-mini hblue" ${on(()=>openPackBorrow(pack, true))}>Sortir une partie</button>` : ""}
            <button class="btn-mini hwhite" ${on(()=>setT({packOuverts:Object.assign({},S.packOuverts,{[pack.name]:!deplie})}))}>${deplie?"Masquer":"Contenu"}</button>
            <button class="btn-mini hwhite" style="margin-left:auto" ${on(()=>openPackEdit(pack))}>Modifier</button>
            <button class="btn-mini hred" ${dehors.length?'disabled title="Impossible tant que la malette est dehors"':''} ${on(()=>supprimerPack(pack))}>Supprimer</button>
          </div>
        </div>
        ${deplie?`<div style="background:#14171c">${lignes||'<div style="padding:12px 13px;font:400 11px Archivo,sans-serif;color:#6d7480;border-top:1px solid #1f232a">Malette vide</div>'}</div>`:""}
      </div>`;
    }).join("");

    const bandePacks = !S.packs.length ? `
      <div style="display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px dashed #2b3038;border-radius:11px">
        <span style="font:400 11.5px/1.3 Archivo,sans-serif;color:#767d8a;flex:1;min-width:0">Une malette regroupe plusieurs articles pour les emporter d'un seul geste — un pelicase et son contenu, pris en une fois.</span>
        <button class="btn-mini hblue" ${on(()=>openPackEdit())}>+ Nouveau pack</button>
      </div>`
      : (t && !visibles.length) ? ""
      : `
      <div style="display:flex;flex-direction:column;gap:11px">
        <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
          <button ${on(()=>setT({packsReplies:packsOuvert}))}
            style="background:transparent;border:0;padding:0;display:flex;align-items:center;gap:7px;cursor:pointer">
            <span style="width:11px;color:#8fb4ff;font:600 11px/1 Archivo,sans-serif">${packsOuvert?"▾":"▸"}</span>
            <span class="klabel">MALETTES · ${visibles.length}</span>
          </button>
          <span style="font:400 11px/1.3 Archivo,sans-serif;color:#6d7480">Emportées d'un seul geste · ne réservent rien</span>
          <button class="btn-mini hblue" style="margin-left:auto" ${on(()=>openPackEdit())}>+ Nouveau pack</button>
        </div>
        ${packsOuvert?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:13px;align-items:start;max-height:40vh;overflow:auto">${cartes}</div>`:""}
      </div>`;

    body = `
    <div style="flex:1;min-height:0;padding:22px 26px 32px;display:flex;flex-direction:column;gap:16px;min-width:0;overflow:auto">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        ${cats.map(c=>chip(c, c===S.matCat, ()=>set({matCat:c,stockMaterialPage:0}))).join("")}
        <input class="inp" data-k="matq" style="margin-left:auto;flex:0 1 300px;min-width:180px;font-size:12px;padding:8px 11px" placeholder="Rechercher un article, une malette, une mission…" value="${esc(S.matQuery)}" ${oni(e=>setT({matQuery:e.target.value,stockMaterialPage:0}))}>
      </div>

      ${bandePacks}

      ${selTotal ? `
      <div style="background:rgba(42,107,242,.10);border:1px solid rgba(42,107,242,.45);border-radius:11px;padding:11px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span style="font:500 12px/1.3 Archivo,sans-serif;color:#dde6ff">${[packsChoisis.length?packsChoisis.length+" malette(s)":"", selCount?selCount+" article(s)":""].filter(Boolean).join(" et ")} sélectionné(s)</span>
        <button class="btn-pri" style="padding:7px 13px;font-size:11.5px;border-radius:7px" ${on(openBatch)}>Réserver la sélection</button>
        <button class="btn-sec" style="margin-left:auto;padding:7px 12px;font-size:11.5px;border-radius:7px" ${on(()=>setT({matSel:{},packSel:{}}))}>Tout désélectionner</button>
      </div>`:""}

      <div class="card" style="overflow:hidden;flex:1;min-height:170px;display:flex;flex-direction:column">
        <div style="display:grid;grid-template-columns:${MAT_GRID()};padding:0 16px;background:#191c22;border-bottom:1px solid #23262d;align-items:center;flex:none">
          <div></div>
          <div class="th" style="padding-left:0">ARTICLE</div>
          <div class="th" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">CATÉGORIE</div>
          <div class="th">AFFECTATION</div>
          <div class="th" style="text-align:right">QTÉ</div>
          <div class="th">MISSIONS</div>
          <div class="th" style="padding-right:0;text-align:right">RÉSERVATION</div>
        </div>
        <div class="serre" data-rangs="materiel" data-rangh="46">${rowsHtml}</div>
        ${!filtered.length ? `
        <div style="padding:46px 16px;text-align:center;display:flex;flex-direction:column;gap:7px">
          <span style="font:500 13px Archivo,sans-serif;color:#c3c9d3">Aucun article ne correspond</span>
          <span style="font:400 11.5px Archivo,sans-serif;color:#6d7480">Vérifiez l'orthographe ou retirez les filtres</span>
        </div>`:""}
      </div>
      ${filtered.length ? `<div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap"><label style="display:flex;align-items:center;gap:7px;font:400 11px Archivo,sans-serif;color:#6d7480">Afficher<select class="inp" style="padding:6px 8px;font-size:11px" ${ong(e=>set({stockMaterialPageSize:["all","auto"].includes(e.target.value)?e.target.value:Number(e.target.value),stockMaterialPage:0}))}><option value="auto" ${S.stockMaterialPageSize==="auto"?"selected":""}>Auto</option><option value="20" ${S.stockMaterialPageSize===20?"selected":""}>20</option><option value="50" ${S.stockMaterialPageSize===50?"selected":""}>50</option><option value="all" ${S.stockMaterialPageSize==="all"?"selected":""}>All</option></select></label><span style="font:400 11px Archivo,sans-serif;color:#6d7480">Page ${materialPage+1} / ${materialPageCount} · ${filtered.length} article${filtered.length>1?"s":""}</span><button class="btn-mini hwhite" ${materialPage<=0?"disabled":""} ${on(()=>setT({stockMaterialPage:materialPage-1}))}>Précédent</button><button class="btn-mini hwhite" ${materialPage>=materialPageCount-1?"disabled":""} ${on(()=>setT({stockMaterialPage:materialPage+1}))}>Suivant</button></div>`:""}
    </div>`;
  }

  /* ---------- page : administration du stock ---------- */
  if(S.page==="admin" && ADMIN){
    const adminPageSize = 20;
    const phoneQuery = S.adminPhoneQuery.trim().toLowerCase();
    const materialQuery = S.adminMaterialQuery.trim().toLowerCase();
    const adminPhones = S.refs.filter(r=>(r.brand+" "+r.model+" "+r.mpn+" "+(r.commercialName||"")).toLowerCase().includes(phoneQuery));
    const adminMaterials = S.materiel.filter(m=>(m.name+" "+(m.libelle||"")+" "+m.cat+" "+(m.etiquette||"")+" "+(m.numeroSerie||"")).toLowerCase().includes(materialQuery));
    const phonePages = Math.max(1, Math.ceil(adminPhones.length/adminPageSize));
    const materialPages = Math.max(1, Math.ceil(adminMaterials.length/adminPageSize));
    const phonePage = Math.min(Math.max(0, Number(S.adminPhonePage)||0), phonePages-1);
    const materialPage = Math.min(Math.max(0, Number(S.adminMaterialPage)||0), materialPages-1);
    S.adminPhonePage = phonePage;
    S.adminMaterialPage = materialPage;
    const phonesPage = adminPhones.slice(phonePage*adminPageSize, (phonePage+1)*adminPageSize);
    const materialsPage = adminMaterials.slice(materialPage*adminPageSize, (materialPage+1)*adminPageSize);
    body = `
    <div style="flex:1;min-height:0;padding:22px 26px 32px;display:flex;flex-direction:column;gap:16px;min-width:0;overflow:auto">
      <div style="display:flex;gap:8px;border-bottom:1px solid #23262d;padding-bottom:10px">
        <button class="chip${S.adminTab==="phones"?' on':''}" ${on(()=>setT({adminTab:"phones"}))}>Téléphones</button>
        <button class="chip${S.adminTab==="material"?' on':''}" ${on(()=>setT({adminTab:"material"}))}>Matériel</button>
        <button class="chip${S.adminTab==="consommables"?' on':''}" ${on(()=>setT({adminTab:"consommables"}))}>Consommables</button>
        <button class="chip${S.adminTab==="missions"?' on':''}" ${on(()=>setT({adminTab:"missions"}))}>Missions</button>
        <button class="chip${S.adminTab==="templates"?' on':''}" ${on(()=>setT({adminTab:"templates"}))}>Templates</button>
        <button class="chip${S.adminTab==="comptes"?' on':''}" ${on(()=>setT({adminTab:"comptes"}))}>Comptes</button>
      </div>
      <div class="card" style="overflow:hidden;display:${S.adminTab==="phones"?"block":"none"}">
        <div style="padding:14px 16px;border-bottom:1px solid #23262d;display:flex;align-items:center;justify-content:space-between">
          <div style="display:flex;flex-direction:column;gap:3px"><span style="font:600 13px Archivo,sans-serif;color:#eef0f4">Téléphones</span><span style="font:400 11px Archivo,sans-serif;color:#6d7480">Réceptionner ou supprimer une référence et ses variantes.</span></div>
          <div style="display:flex;gap:7px;align-items:center">
            <button class="btn-mini hwhite" style="padding:7px 10px;font-size:11px" ${on(()=>document.getElementById("import-xlsx").click())}>Importer XLSX</button>
            <input id="import-xlsx" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none" onchange="importerXlsx(this)">
            <button class="btn-pri" style="padding:7px 12px;font-size:11px" ${on(()=>openReception())}>+ Ajouter</button>
          </div>
        </div>
        <div style="padding:12px 16px;border-bottom:1px solid #23262d"><input class="inp" data-k="adminphoneq" style="width:100%;font-size:12px" placeholder="Rechercher un téléphone, une marque ou une référence…" value="${esc(S.adminPhoneQuery)}" ${oni(e=>setT({adminPhoneQuery:e.target.value,adminPhonePage:0}))}></div>
        ${phonesPage.map(r=>`<div style="display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid #1f232a"><span style="flex:1;min-width:0;font:500 12px Archivo,sans-serif;color:#eef0f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.brand+" "+r.model)} <span style="color:#6d7480">· ${esc(r.mpn)}</span></span><span style="font:400 11px Archivo,sans-serif;color:#6d7480">${r.qty} u.</span><button class="btn-mini hred" ${on(()=>{if(confirm("Supprimer cette référence et ses variantes ?")) agir("telephone.supprimer",{refId:r.id});})}>Supprimer</button></div>`).join("") || '<div style="padding:24px 16px;color:#6d7480;font:400 12px Archivo,sans-serif">Aucun téléphone correspondant.</div>'}
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:10px 16px"><span style="font:400 11px Archivo,sans-serif;color:#6d7480">Page ${phonePage+1} / ${phonePages} · ${adminPhones.length} téléphone${adminPhones.length>1?"s":""}</span><button class="btn-mini hwhite" ${phonePage<=0?"disabled":""} ${on(()=>setT({adminPhonePage:phonePage-1}))}>Précédent</button><button class="btn-mini hwhite" ${phonePage>=phonePages-1?"disabled":""} ${on(()=>setT({adminPhonePage:phonePage+1}))}>Suivant</button></div>
      </div>
      <div class="card" style="overflow:hidden;display:${S.adminTab==="material"?"block":"none"}">
        <div style="padding:14px 16px;border-bottom:1px solid #23262d;display:flex;align-items:center;justify-content:space-between">
          <div style="display:flex;flex-direction:column;gap:3px"><span style="font:600 13px Archivo,sans-serif;color:#eef0f4">Matériel</span><span style="font:400 11px Archivo,sans-serif;color:#6d7480">Réceptionner ou supprimer un article qui n'est plus emprunté.</span></div>
          <button class="btn-pri" style="padding:7px 12px;font-size:11px" ${on(()=>openMatReception())}>+ Ajouter</button>
        </div>
        <div style="padding:12px 16px;border-bottom:1px solid #23262d"><input class="inp" data-k="adminmatq" style="width:100%;font-size:12px" placeholder="Rechercher un article, une catégorie ou une référence…" value="${esc(S.adminMaterialQuery)}" ${oni(e=>setT({adminMaterialQuery:e.target.value,adminMaterialPage:0}))}></div>
        ${materialsPage.map(m=>{const id=m.id||m.name; return `<div style="display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid #1f232a"><span style="flex:1;min-width:0;font:500 12px Archivo,sans-serif;color:#eef0f4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.libelle||m.name)} <span style="color:#6d7480">· ${esc(m.cat)}</span></span><span style="font:400 11px Archivo,sans-serif;color:#6d7480">${m.qty} u.</span><button class="btn-mini hred" ${on(()=>{if(confirm("Supprimer cet article ?")) agir("materiel.supprimer",{nom:id});})}>Supprimer</button></div>`;}).join("") || '<div style="padding:24px 16px;color:#6d7480;font:400 12px Archivo,sans-serif">Aucun article correspondant.</div>'}
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:10px 16px"><span style="font:400 11px Archivo,sans-serif;color:#6d7480">Page ${materialPage+1} / ${materialPages} · ${adminMaterials.length} article${adminMaterials.length>1?"s":""}</span><button class="btn-mini hwhite" ${materialPage<=0?"disabled":""} ${on(()=>setT({adminMaterialPage:materialPage-1}))}>Précédent</button><button class="btn-mini hwhite" ${materialPage>=materialPages-1?"disabled":""} ${on(()=>setT({adminMaterialPage:materialPage+1}))}>Suivant</button></div>
      </div>
      <div class="card" style="overflow:hidden;display:${S.adminTab==="missions"?"block":"none"}">
        <div style="padding:14px 16px;border-bottom:1px solid #23262d;display:flex;flex-direction:column;gap:3px"><span style="font:600 13px Archivo,sans-serif;color:#eef0f4">Missions</span><span style="font:400 11px Archivo,sans-serif;color:#6d7480">Supprimer une mission qui ne possède plus de matériel affecté.</span></div>
        <div style="padding:12px 16px;border-bottom:1px solid #23262d"><input class="inp" data-k="adminmissionq" style="width:100%;font-size:12px" placeholder="Rechercher une mission…" value="${esc(S.adminMissionQuery)}" ${oni(e=>setT({adminMissionQuery:e.target.value,adminMissionPage:0}))}></div>
        ${(()=>{
          const query=(S.adminMissionQuery||"").trim().toLowerCase();
          const missions=S.missions.filter(m=>!query||m.name.toLowerCase().includes(query));
          const pages=Math.max(1,Math.ceil(missions.length/20));
          const page=Math.min(Math.max(0,Number(S.adminMissionPage)||0),pages-1);
          S.adminMissionPage=page;
          const visibles=missions.slice(page*20,(page+1)*20);
