          ${ailleurs[c]?`<span style="font:400 10px/1.2 Archivo,sans-serif;color:#f0b45a">déjà dans ${esc(ailleurs[c].join(", "))}</span>`:""}
        </span>
      </button>`;
    }).join("");
    modals += `
    <div class="modal-back">
      <div class="modal" style="width:430px;max-height:86vh">
        <div class="modal-head">
          <span class="modal-title">Membres de « ${esc(f.nom)} »</span>
          <span class="modal-sub">${esc(f.mission)} · ${f.choisis.length} retenu(s)</span>
        </div>
        <div class="modal-body" style="overflow:auto">
          <div class="field" style="gap:8px">
            <span class="klabel">COMPTES</span>
            <div class="stack" style="max-height:340px;overflow:auto">${listeHtml||'<div style="padding:16px 11px;font:400 11px Archivo,sans-serif;color:#6d7480">Aucun compte à proposer.</div>'}</div>
            <span style="font:400 11px/1.3 Archivo,sans-serif;color:#6d7480">La composition est l\'état du jour : elle remplace la précédente, et rien n\'en est conservé.</span>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({membresEdit:null}))}>Annuler</button>
          <button class="btn-pri" style="padding:9px 16px" ${on(confirmerMembres)}>Enregistrer</button>
        </div>
      </div>
    </div>`;
  }

  /* Bandeau d'emprunt d'identité. Volontairement voyant et permanent : agir
     au nom d'un autre sans s'en rendre compte fausserait le journal, et
     l'erreur ne se verrait qu'une fois inscrite. */
  const banniereAuteur = !AUTEUR ? "" : `
  <div style="position:fixed;top:0;left:0;right:0;z-index:120;padding:7px 16px;display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(240,180,90,.16);border-bottom:1px solid rgba(240,180,90,.5);font:500 12px/1.3 Archivo,sans-serif;color:#f0b45a">
    <span>Vous agissez au nom de <b style="font-weight:600">${esc(AUTEUR)}</b> — tout ce que vous enregistrez sera inscrit à son nom.</span>
    <button class="btn-mini hwhite" ${on(()=>{ AUTEUR = null; render(); })}>Revenir à moi</button>
  </div>`;

  const syncBanner = (!SERVER || (online && !S.syncMsg)) ? "" : `
  <div style="position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;max-width:min(640px,90vw);padding:9px 16px;border-radius:9px;font:500 12px/1.4 Archivo,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.5);${!online
    ? "background:rgba(224,90,80,.16);border:1px solid rgba(224,90,80,.45);color:#ef8b83"
    : "background:rgba(240,180,90,.14);border:1px solid rgba(240,180,90,.45);color:#f0b45a"}">${!online
    ? "⚠ Connexion au serveur perdue — vos modifications ne sont pas partagées. Vérifiez que le serveur est lancé."
    : esc(S.syncMsg)}</div>`;

  app.innerHTML = `${banniereAuteur}${syncBanner}
  <div class="shell">
    ${sidebar}
    <main style="flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:#111318">
      ${header}
      ${body}
    </main>
    ${modals}
  </div>`;

  if(focusKey){
    const el = app.querySelector('[data-k="'+CSS.escape(focusKey)+'"]');
    if(el){
      el.focus();
      if(focusPos!=null){ try{ el.setSelectionRange(focusPos,focusPos); }catch(e){} }
    }
  }

  // La place disponible ne se connait qu'une fois le rendu pose. `enMesure`
  // garantit un seul redessin : la mesure ne dependant pas du contenu, elle
  // donne le meme resultat au second passage.
  if(!enMesure && mesurerRangs()){
    enMesure = true;
    try{ render(); } finally{ enMesure = false; }
  }
}

// Redimensionner la fenetre change ce qui tient : on remesure, sans plus.
addEventListener("resize", ()=>{ if(mesurerRangs()) render(); });

/* ============================================================
   ACTIONS
   ============================================================ */

/* Formulaire de réception.

   Ne suppose pas qu'une référence existe : sur une base neuve il n'y en a
   aucune, et c'est précisément le moment où l'on a besoin de créer la
   première. Un seul bouton mène ici — « + Réception » — et la bascule
   « Nouveau modèle » de la modale couvre la création. */
function formulairePhone(nouveauModele){
  const r = S.refs[0];
  const v = r && r.variants[0];
  return {
    refId: r ? r.id : "", variantIdx:"0", newVariant:false,
    newModel: nouveauModele, brand:"", modelName:"", mpn:"",
    capa: (!nouveauModele && v) ? v.capa : "256 Go", color:"",
    qty: nouveauModele ? 1 : 5,
    slot:"",
  };
}
function openReception(){
  // Sans référence au catalogue, il n'y a rien à réapprovisionner : la modale
  // s'ouvre alors sur la création, seule action possible.
  setT({ form: formulairePhone(!S.refs.length) });
}

/* Empreinte d'une ligne de réservation, de sortie ou d'emprunt.
   Transmise au serveur avec le rang, elle lui permet de vérifier qu'il
   supprime bien la ligne qu'on croit désigner, et non celle qui a pris sa
   place entre-temps. Doit rester identique à `empreinte()` de actions.py. */
function empreinte(x){
  if(x.mission!==undefined && x.by!==undefined) return [x.qty, x.mission, x.by].join("|");
  return [x.who, x.qty, x.variantIdx, x.iso].join("|");
}

async function confirmReception(){
  const f = S.form; if(!f) return;
  const n = Math.max(1, Number(f.qty)||1);
  const cible = f.refId;

  let ok;
  if(f.newModel){
    ok = await agir("telephone.creer", {
      brand:f.brand, model:f.modelName, mpn:f.mpn,
      capa:f.capa, color:f.color, qty:n, slot:f.slot||""
    });
  } else if(f.newVariant){
    ok = await agir("telephone.variante.ajouter", {
      refId:cible, capa:f.capa, color:f.color, qty:n
    });
  } else {
    ok = await agir("telephone.reception", {
      refId:cible, variantIdx:Number(f.variantIdx)||0, qty:n
    });
  }
  if(ok) setT({ form:null });
}

async function importerXlsx(input){
  const fichier = input.files && input.files[0];
  input.value = "";
  if(!fichier) return;
  if(!fichier.name.toLowerCase().endsWith(".xlsx")){
    syncNote("Sélectionnez un fichier XLSX.");
    return;
  }
  try{
    const octets = new Uint8Array(await fichier.arrayBuffer());
    let binaire = "";
    const taille = 0x8000;
    for(let i=0;i<octets.length;i+=taille)
      binaire += String.fromCharCode(...octets.subarray(i,i+taille));
    if(await agir("telephone.importer_xlsx", {xlsxBase64:btoa(binaire)}))
      syncNote("Import XLSX terminé.");
  }catch(e){
    syncNote("Impossible de lire le fichier sélectionné.");
  }
}

function openOp(mode){
  setT({ opMode:mode, opForm:{ variantIdx:"0", qty:1 } });
}

async function confirmOp(ref){
  const f = S.opForm; if(!ref || !f) return;
  const n = Math.max(1, Number(f.qty)||1);
  const ok = await agir(
    S.opMode==="sortie" ? "telephone.sortie" : "telephone.reservation",
    { refId:ref.id, variantIdx:Number(f.variantIdx)||0, qty:n }
  );
  if(ok) setT({ opMode:null });
}

/* « Sortir » depuis une réservation décrémente la variante ET crée une sortie
   retournable ; « Annuler » libère sans toucher au stock. */
function resolveReservation(ref, idx, mode){
  const r = ref.reservations[idx]; if(!r) return;
  agir(mode==="sell" ? "telephone.reservation.vendre" : "telephone.reservation.annuler",
       { refId:ref.id, index:idx, empreinte:empreinte(r) });
}

/* chaque sortie est retournable : réincrémente la variante + ligne RETOUR */
function returnOut(ref, idx){
  const o = ref.outs[idx]; if(!o) return;
  agir("telephone.sortie.retour", { refId:ref.id, index:idx, empreinte:empreinte(o) });
}

/* La modale s'ouvre directement sur la création d'un article : c'est le cas
   d'usage courant. Le bouton « Article existant » permet de basculer vers un
   simple réapprovisionnement. */
function openMatReception(){
  const premier = S.materiel[0];
  setT({ matReceptForm:{ name:premier?(premier.id||premier.name):"", qty:1, newItem:ADMIN,
                         newName:"", newCat:CATEGORIES_MATERIEL[0],
                         newAffectation:"Commun", etiquette:"", numeroSerie:"" } });
}

async function confirmMatReception(){
  const f = S.matReceptForm; if(!f) return;
  const n = Math.max(1, Number(f.qty)||1);
  if(f.newItem && !(f.newName||"").trim()) return;   // bouton inactif
  // Plusieurs unites d'un consommable : chacune doit pouvoir etre nommee, sans
  // quoi le journal dira « 1 consomme » sans dire lequel. On passe donc par la
  // saisie des numeros plutot que de creer une ligne de quantite N.
  if(f.newItem && f.newCat===CATEGORIE_CONSOMMABLE && n>1){
    openLotDepuisEntree(f, n);
    return;
  }
  let ok;
  if(f.newItem){
    ok = await agir("materiel.creer", {
      nom:f.newName, cat:f.newCat, affectation:f.newAffectation, qty:n,
      etiquette:f.etiquette||"", numeroSerie:f.numeroSerie||""
    });
    if(ok) S.matCat = "Toutes";
  } else {
    ok = await agir("materiel.reception", { nom:f.name, qty:n });
  }
  if(ok) setT({ matReceptForm:null });
}

/* ---------- packs ----------

   Composer, emprunter, rendre. Le serveur revérifie tout : ces fonctions ne
   font que préparer une demande qu'il a des chances d'accepter. */

function openPackEdit(pack){
  setT({ packEdit: pack
    ? { original:pack.name, nom:pack.name, etiquette:pack.etiquette||"", recherche:"",
        lignes:pack.items.map(i=>({ id:i.id, qty:i.qty })) }
    : { original:null, nom:"", etiquette:"", recherche:"", lignes:[] } });
}

async function confirmPackEdit(){
  const f = S.packEdit; if(!f) return;
  const lignes = f.lignes.map(l=>({ id:l.id, qty:Math.max(1, Number(l.qty)||1) }));
  const params = { etiquette:(f.etiquette||"").trim(), lignes };
  let ok;
  if(f.original){
    ok = await agir("pack.modifier", Object.assign({ nom:f.original, nouveauNom:(f.nom||"").trim() }, params));
  } else {
    ok = await agir("pack.creer", Object.assign({ nom:(f.nom||"").trim() }, params));
  }
  if(ok) setT({ packEdit:null });
}

/* `partiel` ne change pas l'action envoyée, seulement ce qui est coché au
   départ : tout pour un emprunt normal, rien quand on vient trier. */
function openPackBorrow(pack, partiel){
  const names = missionNames();
  const dejaSorti = new Set(packSorties(pack.name).map(d=>d.id));
  const choix = {};
  if(!partiel) pack.items.forEach(i=>{ if(!i.manquant && !dejaSorti.has(i.id)) choix[i.id]=true; });
  setT({ packBorrow:{ pack:pack.name, partiel:!!partiel, mission:names[0]||"", commentaire:"", choix } });
}

async function confirmPackBorrow(){
  const b = S.packBorrow; if(!b) return;
  const pack = S.packs.find(x=>x.name===b.pack); if(!pack) return;
  const lignes = pack.items.filter(i=>b.choix[i.id]).map(i=>({ nom:i.id, qty:i.qty }));
  if(!lignes.length) return;
  // Envoyer `lignes` même pour une malette entière : le serveur recevrait
  // sinon « tout le contenu », qui peut avoir changé depuis l'affichage.
  if(await agir("pack.emprunt", { pack:b.pack, mission:(b.mission||"").trim(),
                                  equipe:b.equipe||"",
                                  commentaire:(b.commentaire||"").trim(), lignes })){
    setT({ packBorrow:null });
  }
}

function supprimerPack(pack){
  if(!confirm("Supprimer le pack « "+pack.name+" » ?\n\nLes articles qu'il contient ne sont pas supprimés : seule la malette disparaît.")) return;
  agir("pack.supprimer", { nom:pack.name });
}

function openMatRes(item){
  const names = missionNames();
  setT({ matResForm:{ name:item.id||item.name, qty:1, mission:names[0]||"", by:"", commentaire:"" } });
}

/* Le panier part d'un bloc. Le serveur verifie l'ensemble avant d'enregistrer
   quoi que ce soit : soit tout sort, soit rien. */
async function confirmBatch(){
  const b = S.matBatch; if(!b) return;
  const lignes = Object.keys(b.qtys).map(nm=>({
    nom:nm, qty:Math.max(1, Number(b.qtys[nm])||1)
  }));
  if(await agir("materiel.emprunt.groupe", { mission:(b.mission||"").trim(),
                                             equipe:b.equipe||"",
                                             lignes, packs:b.packs||[],
                                             commentaire:(b.commentaire||"").trim() })){
    setT({ matBatch:null, matSel:{}, packSel:{} });
  }
}

/* La restitution d'une mission, avec ce qui a ete consomme.

   Les quantites nulles ne sont pas envoyees : le serveur les ignorerait,
   mais les taire rend la demande lisible dans l'historique des operations. */
async function confirmRelease(){
  const f = S.releaseForm; if(!f) return;
  const ouvertes = lignesOuvertesMission(f.mission);
  const consommes = {};
  Object.keys(f.consommes||{}).forEach(id=>{
    const l = ouvertes.find(x=>x.id===id);
    if(!l) return;
    const n = Math.min(l.qty, Math.max(0, Number(f.consommes[id])||0));
    if(n) consommes[id] = n;
  });
  const demande = { mission:f.mission, consommes,
                    commentaire:(f.commentaire||"").trim() };
  // `equipe` n'est envoyee que si la restitution vise une equipe : absente, le
  // serveur rend toute la mission — ce qui n'est pas la meme demande qu'une
  // chaine vide, laquelle rend ce qui n'a pas d'equipe.
  if(f.equipe) demande.equipe = f.equipe;
  if(await agir("materiel.mission.restituer", demande)){
    setT({ releaseForm:null });
  }
}

/* Sous-titre de la fenetre de saisie : il doit dire ou on en est, parce que
   remplir vingt champs sans savoir combien il en reste est penible. */
function nbSeriesSub(f, attendus, saisis){
  if(saisis >= attendus) return attendus+" exemplaires de « "+f.nom+" »";
  return (attendus-saisis)+" numéro(s) restant(s) sur "+attendus;
}

/* Depuis l'entree de materiel : on connait le nom, la categorie et le nombre.
   `retour` retient l'ecran d'ou l'on vient, pour que « Retour » ne perde pas
   la saisie. */
function openLotDepuisEntree(f, nb){
  setT({
    matReceptForm: null,
    lotForm: { nom:(f.newName||"").trim(), cat:f.newCat,
               affectation:f.newAffectation, etiquette:(f.etiquette||"").trim(),
               attendus:nb, champs:new Array(nb).fill(""), series:"",
               retour:f },
  });
}

/* La sortie pour un consommable qui se compte mais ne se numerote pas : une
   seule ligne de quantite N, comme avant. Sans elle, entrer cent paires de
   gants exigerait cent numeros qui n'existent pas. */
async function sansNumeroDeSerie(){
  const f = S.lotForm; if(!f || !f.retour) return;
  const r = f.retour;
  const n = Math.max(1, Number(r.qty)||1);
  if(await agir("materiel.creer", { nom:r.newName, cat:r.newCat,
                                    affectation:r.newAffectation, qty:n,
                                    etiquette:r.etiquette||"", numeroSerie:"" })){
    S.matCat = "Toutes";
    setT({ lotForm:null, matReceptForm:null });
  }
}

function openIdentForm(m){
  setT({ identForm:{ id:m.id||m.name, numeroSerie:m.numeroSerie||"", etiquette:m.etiquette||"" } });
}

async function confirmIdentForm(){
  const f = S.identForm; if(!f) return;
  if(await agir("materiel.identifiants", { nom:f.id,
                                           numeroSerie:(f.numeroSerie||"").trim(),
                                           etiquette:(f.etiquette||"").trim() })){
    setT({ identForm:null });
  }
}

function openLotForm(){
  setT({ lotForm:{ nom:"", cat:CATEGORIE_CONSOMMABLE, affectation:"Commun",
                   series:"", attendus:0, champs:[], etiquette:"", retour:null } });
}

async function confirmLotForm(){
  const f = S.lotForm; if(!f) return;
  const series = Number(f.attendus)
    ? (f.champs||[]).map(x=>(x||"").trim()).filter(Boolean)
    : (f.series||"").split(/[\r\n,;\t]+/).map(x=>x.trim()).filter(Boolean);
  if(!series.length) return;
  const etiquettes = {};
  if((f.etiquette||"").trim()) series.forEach(x=>{ etiquettes[x]=f.etiquette.trim(); });
  if(await agir("materiel.creer.lot", { nom:(f.nom||"").trim(), cat:f.cat,
                                        affectation:f.affectation, series,
                                        etiquettes })){
    if(Number(f.attendus)) S.matCat = "Toutes";
    setT({ lotForm:null, matReceptForm:null });
  }
}

function openBatch(){
  const names = missionNames();
  const qtys = {};
  Object.keys(S.matSel).forEach(n=>{ qtys[n]=1; });
  const packs = Object.keys(S.packSel)
    .filter(nom=>{ const pk = S.packs.find(x=>x.name===nom); return pk && packDisponible(pk); });
  setT({ matBatch:{ mission:names[0]||"", by:"", commentaire:"", qtys, packs } });
}

function setDim(id, field, delta){
  agir("armoire.dimension", { cabId:id, champ:field, delta });
}
async function addCabinet(){
  const avant = S.cabinets.map(c=>c.id);
  if(await agir("armoire.ajouter")){
    const nouvelle = S.cabinets.find(c=>!avant.includes(c.id));
    if(nouvelle) set({ cabinet:nouvelle.id });
  }
}
async function removeCabinet(id){
  if(await agir("armoire.supprimer", { cabId:id })){
    if(S.cabinet===id && S.cabinets.length) set({ cabinet:S.cabinets[0].id });
  }
}

/* ---------- délégation d'événements ---------- */
const appEl = document.getElementById("app");
appEl.addEventListener("click", e=>{
  const t = e.target.closest("[data-c]");
  if(!t || !appEl.contains(t)) return;
  const fn = H[+t.dataset.c];
  if(fn) fn(e);
});
appEl.addEventListener("input", e=>{
  const t = e.target;
  if(t.dataset && t.dataset.i!==undefined){ const fn=H[+t.dataset.i]; if(fn) fn(e); }
});
appEl.addEventListener("change", e=>{
  const t = e.target;
  if(t.dataset && t.dataset.g!==undefined){ const fn=H[+t.dataset.g]; if(fn) fn(e); }
});

/* ---------- démarrage ---------- */
async function boot(){
  S = seed(); applyPrefs();

  if(!SERVER){
    // Fichier ouvert en double-clic, sans serveur. Les règles métier vivent
    // désormais côté serveur : il n'y a plus rien à faire tourner seul.
    appEl.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;text-align:center;'
      + 'color:#9aa2af;font:400 13px/1.6 Archivo,sans-serif;padding:24px">'
      + '<div><b style="color:#e7e9ee;font-size:15px">Heimdall ne s\'ouvre plus directement</b><br><br>'
      + 'Ouvrez l\'adresse du serveur dans votre navigateur,<br>'
      + 'par exemple <code>http://192.168.x.x:8750</code>.<br><br>'
      + '<span style="color:#6d7480">L\'adresse exacte est affichée dans la fenêtre du serveur.</span></div></div>';
    return;
  }

  appEl.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;color:#767d8a;font:400 13px Archivo,sans-serif">Connexion au serveur…</div>';
  try{
    const res = await fetch("api/state");
    if(sessionPerdue(res)) return;
    if(!res.ok) throw 0;
    const d = await res.json();
    if(d.user) OPERATOR = d.user;
    if(d.admin!==undefined) ADMIN = !!d.admin;
    if(d.comptes) COMPTES = d.comptes;
    if(d.state || d.delta){
      adopt(d);
    } else {
      // Base vierge : le serveur n'a encore rien. On affiche l'application
      // vide, les premières saisies la rempliront.
      version = d.version || 0;
      render();
    }
  }catch(e){
    console.warn("[sync] connexion initiale échouée :", e);
    online = false;
    render();    // la boucle de synchronisation réessaiera automatiquement
  }
  setInterval(pull, 2500);
}
boot();
</script>
