            ${["PRÉVUE","EN COURS","TERMINÉE","ANNULÉE"].map(v=>`<option value="${v}"${v===st?" selected":""}${changementStatutPermis(st, v, peutReculerMission(name))?"":" disabled"}>${v}</option>`).join("")}
          </select>
        </div>
        ${demandesHtml}
        ${(items.length || equipes.length) ? `<div>${itemsHtml}</div>`
          : (!demandesHtml ? `<div style="border-top:1px solid var(--line);padding:12px 16px;font-size:13px;color:var(--muted)">Aucun matériel affecté pour l'instant.</div>` : "")}
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid var(--line);margin-top:auto">
          <a class="btn btn-sm" href="${esc(adresseMission(name))}" target="_blank" rel="noopener">Ouvrir le tableau</a>
          <button class="btn btn-sm btn-ghost" type="button" title="Le matériel se réserve pour une mission depuis le stock de matériel" ${on(()=>set({page:"materiel"}))}>Affecter</button>
          <button class="btn btn-icon btn-ghost" type="button" style="margin-left:auto" aria-label="Modifier la mission ${esc(name)}" ${on(()=>setT({editMission:{name, owner:meta.owner||"", date:meta.date||"",
            ouvertes:items.some(it=>!it.returned), vide:!items.length,
            archivable:!archived && (st==="TERMINÉE" || st==="ANNULÉE"), archived}}))}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16Z"/><path d="m13.5 6.5 4 4"/></svg></button>
        </div>
      </article>`;
    }).join("");

    // Matériel emprunté hors mission : regroupé par personne, seulement ce qui
    // n'est pas encore rendu.
    const libres = {};
    Object.keys(S.matRes).forEach(id=>(S.matRes[id]||[]).forEach(r=>{
      if(r.mission!==SANS_MISSION || r.returned) return;
      (libres[r.by||"non précisé"]=libres[r.by||"non précisé"]||[]).push({id, qty:r.qty, iso:r.iso});
    }));
    const nbLibres = Object.values(libres).reduce((n,l)=>n+l.length,0);
    const vue = S.missionsVue==="emprunts" ? "emprunts" : "missions";
    const onglets = `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px">
        <div role="tablist" aria-label="Vue" class="seg">
          <button class="tab${vue==="missions"?" on":""}" role="tab" aria-selected="${vue==="missions"}" type="button" ${on(()=>set({missionsVue:"missions"}))}>Missions <span class="n">${names.length}</span></button>
          <button class="tab${vue==="emprunts"?" on":""}" role="tab" aria-selected="${vue==="emprunts"}" type="button" ${on(()=>set({missionsVue:"emprunts"}))}>Emprunts hors mission <span class="n">${nbLibres}</span></button>
        </div>
        <span style="flex:1"></span>
        ${(archivedCount||S.showArchived) && vue==="missions" ? `<button class="btn btn-sm btn-ghost" type="button" aria-pressed="${!!S.showArchived}" ${on(()=>set({showArchived:!S.showArchived}))}>${S.showArchived?"Masquer":"Afficher"} les archivées (${archivedCount})</button>` : ""}
      </div>`;
    const empruntsHtml = !nbLibres
      ? `<div style="padding:40px 16px;text-align:center;font-size:13px;color:var(--muted)">Aucun matériel emprunté hors mission.</div>`
      : `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px;align-items:start">
        ${Object.keys(libres).sort((a,b)=>a.localeCompare(b)).map(qui=>`
        <article class="card" style="overflow:hidden">
          <div style="display:flex;align-items:center;gap:10px;padding:16px 16px 12px">
            <h2 style="margin:0;font-size:15px;font-weight:700;flex:1">${esc(qui)}</h2>
            <span class="badge b-warn">${libres[qui].length} ligne${libres[qui].length>1?"s":""}</span>
          </div>
          ${libres[qui].map(l=>`<div style="padding:10px 16px;display:flex;align-items:flex-start;gap:10px;border-top:1px solid var(--line)">
              <span style="flex:1;min-width:0">
                <span style="display:block;font-weight:600;font-size:13px">${esc(matLabel(l.id))}</span>
                ${matDetail(l.id)?`<span style="display:block;font-size:12px;color:var(--muted)">${esc(matDetail(l.id))}</span>`:""}
                ${l.iso?`<span class="num" style="display:block;font-size:12px;color:var(--muted)">Pris le ${esc(dateComplete(l.iso))}</span>`:""}
              </span>
              <span class="num" style="font-weight:600;font-size:13px">${l.qty} u.</span>
            </div>`).join("")}
        </article>`).join("")}
      </div>`;

    /* Le formulaire de création, dans une carte à droite des missions : il s'ouvre par
       « Nouvelle mission » dans l'en-tête. Les champs et les règles sont ceux d'avant. */
    const formulaire = !S.missionFormOuvert || !peutCreerMission() ? "" : `
      <aside class="card" aria-label="Nouvelle mission" style="flex:1 1 340px;min-width:0;max-width:440px;padding:20px">
        <div style="display:flex;align-items:center;margin-bottom:16px">
          <h2 style="margin:0;font-size:15px;font-weight:700;flex:1">Nouvelle mission</h2>
          <button class="btn btn-icon btn-ghost" type="button" aria-label="Fermer" ${on(()=>setT({missionFormOuvert:false}))}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div style="display:flex;flex-direction:column;gap:16px">
          <div>
            <label class="lbl" for="m-name">Nom de la mission</label>
            <input class="input" id="m-name" data-k="mname" type="text" placeholder="Ex. Intervention site Nord" value="${esc(S._mName||"")}" ${oni(e=>{S._mName=e.target.value;})}>
          </div>
          <div style="display:flex;gap:12px;flex-wrap:wrap">
            <div style="flex:1 1 140px">
              <label class="lbl" for="m-date">Date prévue</label>
              <input class="input" id="m-date" data-k="mdate" type="date" value="${esc(S._mDate||"")}" ${ong(e=>{S._mDate=e.target.value;})}>
            </div>
            ${S.templates.length ? `<div style="flex:1 1 140px">
              <label class="lbl" for="m-tpl">Modèle</label>
              <select class="input" id="m-tpl" data-k="mtemplate" ${ong(e=>setT({_mTemplate:e.target.value, _mChoix:{}, _mDeplie:{}}))}>
                <option value="">Sans modèle</option>
                ${S.templates.map(t=>`<option value="${esc(t.name)}"${S._mTemplate===t.name?" selected":""}>${esc(t.name)} · ${t.items.length} article${t.items.length>1?"s":""}</option>`).join("")}
              </select>
            </div>` : ""}
          </div>
          ${apercuTemplate}
          <div>
            <span class="lbl">Gestionnaires</span>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
              ${S.annuaire.map(c=>chip(c+(c===OPERATOR?" (vous)":""), gestionCreation.includes(c), ()=>{
                const courants = S._mGestion || [OPERATOR];
                setT({_mGestion: courants.includes(c) ? courants.filter(x=>x!==c) : courants.concat([c])});
              })).join("")}
            </div>
            <p class="help" style="${gestionCreation.length?"":"color:var(--danger)"}">${gestionCreation.length
              ? "Les gestionnaires composent l'effectif, peuvent prêter le sac d'une personne absente et revenir sur les statuts. Un gestionnaire peut aussi faire partie d'une équipe."
              : "Une mission a besoin d'au moins un gestionnaire."}</p>
          </div>
          <div>
            <div style="display:flex;align-items:center"><span class="lbl" style="flex:1;margin:0">Matériel personnel à demander</span><button class="btn btn-sm btn-ghost" type="button" style="color:var(--gold)" ${on(()=>ouvrirDemandePret("file", (S._mName||"").trim()||"cette mission"))}>+ Demander</button></div>
            ${S._mDemandes.length ? `<div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:8px">${S._mDemandes.map((d,i)=>`
              <span class="badge b-tag b-info" style="gap:7px;height:auto;padding:4px 8px">
                ${d.qty} × ${esc(d.libelle)} → ${esc(d.proprietaire)}${d.forcer?" · forcé":""}
                <button class="btn btn-icon btn-ghost" style="width:20px;height:20px" aria-label="Retirer" ${on(()=>setT({_mDemandes:S._mDemandes.filter((_,j)=>j!==i)}))}>✕</button>
              </span>`).join("")}</div>` : `<p class="help">Ce que les absents peuvent vous prêter depuis leur sac. Chacun reçoit la demande et l'accepte ou la refuse.</p>`}
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end;padding-top:4px">
            <button class="btn" type="button" ${on(()=>setT({missionFormOuvert:false}))}>Annuler</button>
            <button class="btn btn-primary${creable?"":" off"}" type="button" ${creable?"":"disabled"} ${on(async ()=>{
              const n=(S._mName||"").trim(); if(!n || !creable) return;
              if(await agir("mission.creer", { nom:n, date:S._mDate||"", template:S._mTemplate||"", choix:S._mChoix, gestionnaires:gestionCreation })){
                const demandes = S._mDemandes;
                setT({ _mName:"", _mDate:"", _mTemplate:"", _mChoix:{}, _mDeplie:{}, _mDemandes:[], _mGestion:null, missionFormOuvert:false });
                // Les demandes préparées partent maintenant que la mission existe —
                // celles marquées « forcées » sans attendre la réponse du sac.
                for(const d of demandes)
                  await agir(d.forcer ? "pret.forcer" : "pret.demander",
                             {proprietaire:d.proprietaire, article:d.article, qty:d.qty, mission:n, motif:d.motif});
              }
            })}>Créer la mission</button>
          </div>
        </div>
      </aside>`;

    body = `
    <div style="flex:1;min-height:0;padding:20px 32px 40px;display:flex;flex-direction:column;gap:20px;min-width:0;overflow:auto">
      ${onglets}
      ${vue==='emprunts' ? empruntsHtml : `
      ${!peutCreerMission() ? `
      <div class="card" style="max-width:640px;padding:14px 16px;font-size:13px;line-height:1.5;color:var(--muted)">
        Créer une mission est réservé aux <b style="color:var(--ink);font-weight:600">chefs de groupe</b> et aux <b style="color:var(--ink);font-weight:600">administrateurs</b>. Vous restez libre d'emprunter sans mission, et de demander du matériel dans les sacs.
      </div>` : ""}
      <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
        ${!names.length ? `<div style="flex:999 1 560px;padding:40px 16px;text-align:center;font-size:13px;color:var(--muted)">${archivedCount
          ? "Aucune mission active — "+archivedCount+" mission"+(archivedCount>1?"s":"")+" archivée"+(archivedCount>1?"s":"")+"."
          : "Aucune mission pour l'instant. Créez-en une, ou réservez du matériel pour une mission depuis le stock de matériel."}</div>`
          : `<div style="flex:999 1 560px;min-width:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px;align-items:start">${cards}</div>`}
        ${formulaire}
      </div>`}
    </div>`;
    if(S.creationMission && peutCreerMission()) body = pagePreparation(true);
  }

  /* ---------- page : journal ---------- */
  if(S.page==="journal"){
    const kinds = ["Tous","ENTRÉE","RETOUR","SORTIE","CONSOMMÉ","RÉSERV.","ANNUL.","TRANSF.","AJUST.","CRÉATION"];
    const scopes = ["Tous","Téléphones","Matériel"];
    const all = journalRows();
    const lq = S.logQuery.trim().toLowerCase();
    const fj = filtresDe("journal");
    const distincts = cle=>Array.from(new Set(all.map(e=>e[cle]).filter(v=>v && v!=="—"))).sort((a,b)=>a.localeCompare(b, "fr"));
    const ctlJournal = {
      date: {label:"Contient", texte:"Date ou heure, ex. 18/10, 14:30"},
      article: {label:"Contient", texte:"Article, étiquette, série, casier…"},
      qte: {liste:[["avec", "Avec quantité"], ["sans", "Sans quantité"]]},
      personne: {liste:distincts("who").map(v=>[v, v])},
      mission: {liste:distincts("mission").map(v=>[v, v])},
      type: {liste:distincts("kind").map(v=>[v, kindLibelle(v)])},
    };
    const thJ = (col, titre, style, droite, avant)=>thFiltrable("journal", col, titre, ctlJournal[col], style, droite, avant);
    const rows = all.filter(e=>{
      if(fj.date && !(jourMoisAn(e.iso)+" "+heureMinute(e.iso)+" "+dateComplete(e.iso)).toLowerCase().includes(fj.date.trim().toLowerCase())) return false;
      if(fj.article && !(e.item+" "+e.loc+" "+e.identite).toLowerCase().includes(fj.article.trim().toLowerCase())) return false;
      if(fj.qte==="avec" && !e.qty) return false;
      if(fj.qte==="sans" && e.qty) return false;
      if(fj.personne && e.who !== fj.personne) return false;
      if(fj.mission && e.mission !== fj.mission) return false;
      if(fj.type && e.kind !== fj.type) return false;
      if(S.logScope==="Téléphones" && e.source!=="phone") return false;
      if(S.logScope==="Matériel" && e.source!=="mat") return false;
      if(S.logFilter!=="Tous" && !e.kind.startsWith(S.logFilter)) return false;
      if(lq && !(e.item+" "+e.loc+" "+e.identite+" "+e.who+" "+e.mission+" "+e.kind+" "+e.commentaire+" "+dateComplete(e.iso)).toLowerCase().includes(lq)) return false;
      return true;
    });
    const logPageSize = rangsQuiTiennent("journal", LOG_ROW_H, LOG_PAGE_SIZE);
    const pageCount = Math.max(1, Math.ceil(rows.length/logPageSize));
    const logPage = Math.min(Math.max(0, Number(S.logPage)||0), pageCount-1);
    if(logPage !== S.logPage) S.logPage = logPage;
    const pageRows = rows.slice(logPage*logPageSize, (logPage+1)*logPageSize);

    // Un intitulé de jour : « Aujourd'hui · mardi 20 octobre », « Hier · … », puis la date seule.
    const cleJour = iso=>{ const d = quand(iso); return d ? d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()) : ""; };
    const aujourdhuiCle = cleJour(new Date().toISOString());
    const hierCle = cleJour(new Date(Date.now()-86400000).toISOString());
    const libelleJour = iso=>{
      const d = quand(iso); if(!d) return "Date inconnue";
      const memeAnnee = d.getFullYear() === new Date().getFullYear();
      const texte = d.toLocaleDateString("fr-FR", memeAnnee ? {weekday:"long", day:"numeric", month:"long"} : {weekday:"long", day:"numeric", month:"long", year:"numeric"});
      const k = cleJour(iso);
      return (k===aujourdhuiCle ? "Aujourd'hui · " : k===hierCle ? "Hier · " : "") + texte;
    };
    const initiales = nom=>String(nom||"").split(/[\s._-]+/).map(x=>x[0]||"").join("").slice(0,2).toUpperCase();
    const SVG_NOTE = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4 4v-4H5.5A1.5 1.5 0 0 1 4 14.5Z"/></svg>`;

    let jourCourant = null;
    const rowsHtml = pageRows.map(e=>{
      const k = cleJour(e.iso);
      let entete = "";
      if(k !== jourCourant){ jourCourant = k; entete = `<div class="day over" style="color:var(--soft)">${esc(libelleJour(e.iso))}</div>`; }
      const sous = [e.loc, e.identite].filter(Boolean).join(" · ");
      return entete + `
      <div class="row" style="grid-template-columns:${LOG_GRID};min-height:${LOG_ROW_H}px;box-sizing:border-box">
        <span class="mono num" style="color:var(--muted)">${esc(heureMinute(e.iso))}</span>
        <div style="min-width:0;display:flex;align-items:center;gap:8px">
          <div style="min-width:0">
            <div style="font-weight:600;overflow-wrap:anywhere">${esc(e.item)}</div>
            ${sous ? `<div style="font-size:12px;color:var(--muted)">${esc(sous)}</div>` : ""}
          </div>
          ${e.commentaire ? `<button type="button" aria-label="Voir le commentaire : ${esc(e.commentaire)}" title="${esc(e.commentaire)}" style="border:0;background:transparent;color:var(--muted);cursor:help;padding:4px;display:inline-flex">${SVG_NOTE}</button>` : ""}
        </div>
        <span class="num" style="text-align:right;font-weight:600">${e.qty ? e.qty+" u." : "—"}</span>
        <span style="display:flex;align-items:center;gap:8px;font-size:13px;min-width:0">${e.who && e.who!=="—" ? `<span class="av">${esc(initiales(e.who))}</span>` : ""}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.who)}</span></span>
        <span style="font-size:13px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.mission)}</span>
        <span style="text-align:right"><span class="badge ${kindCls(e.kind)}">${esc(kindLibelle(e.kind))}</span></span>
      </div>`;
    }).join("");

    body = `
    <div style="flex:1;min-height:0;padding:20px 32px 40px;display:flex;flex-direction:column;gap:20px;min-width:0;overflow:auto">
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px">
        <div role="tablist" aria-label="Périmètre" class="seg">
          ${scopes.map(sc=>`<button class="tab${S.logScope===sc?" on":""}" role="tab" aria-selected="${S.logScope===sc}" type="button" ${on(()=>set({logScope:sc, logPage:0}))}>${sc}</button>`).join("")}
        </div>
        <div role="group" aria-label="Type de mouvement" style="display:flex;flex-wrap:wrap;gap:8px">
          ${kinds.map(k=>`<button class="chip${S.logFilter===k?" on":""}" type="button" ${on(()=>set({logFilter:k,logPage:0}))}>${k==="Tous" ? "Tous" : `<span class="dot" style="background:${COULEUR_ETAT[kindCls(k)]}"></span>${esc(kindLibelle(k))}`}</button>`).join("")}
        </div>
      </div>

      <section class="card" aria-label="Mouvements" style="overflow:hidden;flex:1;min-height:300px;display:flex;flex-direction:column">
        <div style="overflow-x:auto;flex:1;min-height:0;display:flex;flex-direction:column">
          <div style="min-width:760px;flex:1;min-height:0;display:flex;flex-direction:column">
            <div class="row" style="grid-template-columns:${LOG_GRID};border-top:0;padding-top:0;padding-bottom:0;flex:none">
              ${thJ("date", "Heure", "padding:12px 0", false, boutonToutEffacer("journal"))}
              ${thJ("article", "Article", "padding:12px 0")}
              ${thJ("qte", "Qté", "padding:12px 0", true)}
              ${thJ("personne", "Personne", "padding:12px 0")}
              ${thJ("mission", "Mission", "padding:12px 0")}
              ${thJ("type", "Type", "padding:12px 0", true)}
            </div>
            <div class="serre" style="overflow:auto" data-rangs="journal" data-rangh="${LOG_ROW_H}">${rowsHtml}</div>
            ${!rows.length ? `
            <div style="padding:46px 16px;text-align:center;display:flex;flex-direction:column;gap:7px">
              <span style="font-weight:600">${all.length?"Aucun mouvement ne correspond":"Aucun mouvement enregistré"}</span>
              <span style="font-size:12.5px;color:var(--muted)">${all.length?"Vérifiez l'orthographe ou retirez les filtres":"Les mouvements de téléphones et de matériel s'afficheront ici"}</span>
            </div>`:""}
          </div>
        </div>
        ${rows.length ? `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;flex:none">
          <span style="flex:1">Page ${logPage+1} sur ${pageCount} · ${rows.length} événement${rows.length>1?"s":""}</span>
          <button class="btn btn-sm" ${logPage<=0?"disabled":""} ${on(()=>setT({logPage:logPage-1}))}>Précédent</button>
          <button class="btn btn-sm" ${logPage>=pageCount-1?"disabled":""} ${on(()=>setT({logPage:logPage+1}))}>Suivant</button>
        </div>`:""}
      </section>
    </div>`;
  }

  /* ---------- modales ---------- */
  let modals = "";

  // Réception téléphone
  if(S.form){
    const f = S.form;
    // Sans référence au catalogue, seule la création a un sens : on y force,
    // sinon la bascule « Nouveau modèle » ramènerait à un formulaire qui
    // désigne une référence inexistante.
    if(!S.refs.length) f.newModel = true;
    const ref = S.refs.find(r=>r.id===f.refId) || S.refs[0]
      || { id:"", brand:"", model:"", mpn:"", qty:0, variants:[] };
    const freeSlots = (()=>{
      const occ = {};
      S.refs.forEach(r=>{ if(place[r.id]) (occ[place[r.id].loc]=occ[place[r.id].loc]||[]).push(r); });
      const list = [{value:"",label:"Auto — 1er casier libre"}];
      S.cabinets.forEach(c=>{
        for(let s=1;s<=c.shelves;s++)
          for(let k=1;k<=c.cols;k++){
            const loc = c.id+"·E"+s+"·C"+k;
            const o = occ[loc];
            list.push({value:loc, label:loc+" — "+(o ? o[0].model+(o.length>1?" +"+(o.length-1):"") : "libre")});
          }
      });
      return list;
    })();
    const n = Math.max(1, Number(f.qty)||1);
    const summary = f.newModel
      ? "Nouveau modèle · "+n+" u. à l'entrée"
      : ref.qty+" u. en casier → "+(ref.qty+n)+" u. après réception";
    const newVariantOn = f.newVariant || f.newModel;

    modals += `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true" style="width:480px">
        <div class="modal-head">
          <span class="modal-title">Réception de stock</span>
          <span class="modal-sub">Entrée d'appareils dans l'armoire — le casier suit le modèle</span>
        </div>
        <div class="modal-body">
          <div class="field">
            <div style="display:flex;align-items:center;gap:10px">
              <span class="klabel">MODÈLE</span>
              ${ADMIN && S.refs.length ? `<button class="btn-mini hblue${f.newModel?' tog-on':''}" ${on(()=>{ f.newModel=!f.newModel; f.newVariant=false; render(); })}>${f.newModel?"Modèle existant":"Nouveau modèle"}</button>` : ""}
            </div>
            ${!f.newModel ? `
            <select class="inp" data-k="rmodel-sel" style="width:100%" ${ong(e=>{
              const r2=S.refs.find(x=>x.id===e.target.value);
              f.refId=e.target.value; f.variantIdx="0"; f.newVariant=false;
              if(r2){ f.capa=r2.variants[0].capa; }
              render();
            })}>
              ${S.refs.map(r=>`<option value="${esc(r.id)}"${r.id===f.refId?" selected":""}>${esc(r.brand+" "+r.model+" · "+r.mpn)}</option>`).join("")}
            </select>` : `
            <div style="display:flex;flex-direction:column;gap:8px">
              <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px">
                <input class="inp" data-k="rbrand" placeholder="Marque (ex. Motorola)" value="${esc(f.brand)}" ${oni(e=>{f.brand=e.target.value;})}>
                <input class="inp" data-k="rmodel" placeholder="Nom commercial (ex. Edge 50)" value="${esc(f.modelName)}" ${oni(e=>{f.modelName=e.target.value;})}>
              </div>
              <input class="inp" data-k="rmpn" placeholder="Réf. fabricant (ex. XT2409-1)" value="${esc(f.mpn)}" ${oni(e=>{f.mpn=e.target.value;})}>
              <span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-6d7480)">Un casier libre lui sera attribué automatiquement ; vous pourrez le changer depuis le tableau.</span>
            </div>`}
          </div>

          <div class="field">
            <div style="display:flex;align-items:center;gap:10px">
              <span class="klabel">VARIANTE</span>
              ${ADMIN && !f.newModel?`<button class="btn-mini hblue${f.newVariant?' tog-on':''}" ${on(()=>{ f.newVariant=!f.newVariant; render(); })}>Nouvelle variante</button>`:""}
            </div>
            ${!newVariantOn ? `
            <select class="inp" data-k="rvar" style="width:100%" ${ong(e=>{ f.variantIdx=e.target.value; render(); })}>
              ${ref.variants.map((v,k)=>`<option value="${k}"${String(k)===String(f.variantIdx)?" selected":""}>${esc(v.capa+" · "+v.color+" ("+v.qty+" u.)")}</option>`).join("")}
            </select>` : `
            <div style="display:grid;grid-template-columns:140px 1fr;gap:8px">
              <select class="inp" data-k="rcapa" ${ong(e=>{ f.capa=e.target.value; })}>
                ${CAPAS.map(c=>`<option value="${esc(c)}"${c===f.capa?" selected":""}>${esc(c)}</option>`).join("")}
              </select>
              <input class="inp" data-k="rcolor" placeholder="Couleur (ex. Titane bleu)" value="${esc(f.color)}" ${oni(e=>{f.color=e.target.value;})}>
            </div>`}
          </div>

          <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px">
            <label class="field">
              <span class="klabel">QUANTITÉ</span>
              <input class="inp" data-k="rq" type="number" min="1" value="${esc(f.qty)}" ${oni(e=>{f.qty=e.target.value; render();})}>
            </label>
          </div>

          <div style="background:var(--c-191c22);border:1px solid var(--c-23262d);border-radius:9px;padding:11px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px">
            <div style="display:flex;flex-direction:column;gap:3px">
              <span class="klabel">RANGEMENT</span>
              <span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-9aa2af)">${esc(summary)}</span>
            </div>
            ${!f.newModel ? `
            <span style="font:600 12px/1 Inter,system-ui,sans-serif;color:var(--gold-ink);background:var(--gold);border-radius:7px;padding:7px 10px;letter-spacing:.06em">${esc(place[ref.id]?place[ref.id].loc:"aucun casier libre")}</span>` : `
            <select class="inp" data-k="rslot" style="padding:8px 10px;border:1px solid color-mix(in srgb, var(--gold) 40%, transparent);border-radius:7px;color:var(--c-8fb4ff);font:500 12px Inter,system-ui,sans-serif;max-width:190px" ${ong(e=>{ f.slot=e.target.value; })}>
              ${freeSlots.map(o=>`<option value="${esc(o.value)}"${o.value===f.slot?" selected":""}>${esc(o.label)}</option>`).join("")}
            </select>`}
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({form:null}))}>Annuler</button>
          <button class="btn-pri" style="padding:9px 16px" ${on(confirmReception)}>Valider la réception</button>
        </div>
      </div>
    </div>`;
  }

  // Sortie / réservation téléphone
  if(S.opMode && sel && sel.variants.length){
    const f = S.opForm;
    const v = sel.variants[Number(f.variantIdx)] || sel.variants[0];
    const n = Math.max(1, Number(f.qty)||1);
    const isSortie = S.opMode==="sortie";
    const stockLine = isSortie
      ? v.qty+" u. → "+Math.max(0,v.qty-n)+" u. sur cette variante"
      : sel.reserved+" u. réservées → "+(sel.reserved+n)+" u. sur ce casier";
    modals += `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true" style="width:430px">
        <div class="modal-head">
          <span class="modal-title">${isSortie?"Sortie de stock":"Réservation client"}</span>
        <div class="modal-body">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font:600 13.5px/1.2 Inter,system-ui,sans-serif;color:var(--c-f2f4f8)">${esc(sel.brand+" "+sel.model)}</span>
            <span class="loctag">${esc(locOf(sel))}</span>
          </div>
          <label class="field">
            <span class="klabel">VARIANTE</span>
            <select class="inp" data-k="opvar" ${ong(e=>{ f.variantIdx=e.target.value; render(); })}>
              ${sel.variants.map((vv,k)=>`<option value="${k}"${String(k)===String(f.variantIdx)?" selected":""}>${esc(vv.capa+" · "+vv.color+" ("+vv.qty+" u.)")}</option>`).join("")}
            </select>
          </label>
          <div style="display:grid;grid-template-columns:110px 1fr;gap:10px">
            <label class="field">
              <span class="klabel">QUANTITÉ</span>
              <input class="inp" data-k="opqty" type="number" min="1" value="${esc(f.qty)}" ${oni(e=>{f.qty=e.target.value; render();})}>
            </label>
            <div class="field">
              <span class="klabel">${isSortie?"SORTI PAR":"RÉSERVÉ PAR"}</span>
              <span style="font:500 13px/1.2 Inter,system-ui,sans-serif;color:var(--c-e7e9ee);padding:9px 0">${esc(OPERATOR)}</span>
            </div>
          </div>
          <div style="background:var(--c-191c22);border:1px solid var(--c-23262d);border-radius:9px;padding:11px 12px;display:flex;flex-direction:column;gap:3px">
            <span class="klabel">APRÈS VALIDATION</span>
            <span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-9aa2af)">${esc(stockLine)}</span>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({opMode:null}))}>Annuler</button>
          <button class="btn-pri" style="padding:9px 16px" ${on(()=>confirmOp(sel))}>${isSortie?"Valider la sortie":"Valider la réservation"}</button>
        </div>
      </div>
    </div>`;
  }

  // Entrée matériel
  if(S.matReceptForm){
    const f = S.matReceptForm;
    const cats = Array.from(new Set(CATEGORIES_MATERIEL.concat(S.materiel.map(m=>m.cat))));
    // Un consommable entré en plusieurs unités passe par la saisie des
    // numéros : c'est ce qui permettra plus tard de dire lequel a servi.
    const nbEntre = Math.max(1, Number(f.qty)||1);
    const versSeries = f.newItem && f.newCat===CATEGORIE_CONSOMMABLE && nbEntre>1;
    modals += `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true" style="width:400px">
        <div class="modal-head">
          <span class="modal-title">${f.newItem?"Nouvel article":"Entrée de matériel"}</span>
          <span class="modal-sub">${f.newItem
            ? "Crée l'article et enregistre sa quantité de départ"
            : "Ajoute du stock à un article existant"}</span>
        </div>
        <div class="modal-body">
          <div class="field">
            <div style="display:flex;align-items:center;gap:10px">
              <span class="klabel">ARTICLE</span>
              ${ADMIN && S.materiel.length ? `
              <button class="btn-mini hblue${!f.newItem?' tog-on':''}" ${on(()=>{ f.newItem=!f.newItem; render(); })}>${f.newItem?"Article existant":"Nouvel article"}</button>` : ""}
            </div>
            ${!f.newItem ? `
            <select class="inp" data-k="mrsel" style="width:100%" ${ong(e=>{ f.name=e.target.value; render(); })}>
              ${S.materiel.map(m=>`<option value="${esc(m.id||m.name)}"${(m.id||m.name)===f.name?" selected":""}>${esc(m.name)}${m.etiquette||m.numeroSerie?" · "+esc(m.etiquette||m.numeroSerie):""}</option>`).join("")}
            </select>` : `
            <div style="display:flex;flex-direction:column;gap:8px">
              <input class="inp" data-k="mrname" placeholder="Nom de l'article (ex. Chargeur 45 W)" value="${esc(f.newName)}" ${oni(e=>{f.newName=e.target.value; render();})}>
              ${versSeries ? `
              <input class="inp" data-k="mretq" placeholder="Étiquette (commune aux exemplaires)" value="${esc(f.etiquette||"")}" ${oni(e=>{f.etiquette=e.target.value;})}>` : `
              <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px">
                <input class="inp" data-k="mretq" placeholder="Étiquette" value="${esc(f.etiquette||"")}" ${oni(e=>{f.etiquette=e.target.value;})}>
                <input class="inp" data-k="mrserie" placeholder="Numéro de série" value="${esc(f.numeroSerie||"")}" ${oni(e=>{f.numeroSerie=e.target.value;})}>
              </div>`}
              <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px">
                <select class="inp" data-k="mrcat" ${ong(e=>{ f.newCat=e.target.value; render(); })}>
                  ${cats.map(c=>`<option value="${esc(c)}"${c===f.newCat?" selected":""}>${esc(c)}</option>`).join("")}
                </select>
                <select class="inp" data-k="mraffect" ${ong(e=>{ f.newAffectation=e.target.value; })}>
                  ${AFFECTATIONS.map(a=>`<option value="${esc(a)}"${a===f.newAffectation?" selected":""}>${esc(a)}</option>`).join("")}
                </select>
              </div>
            </div>`}
          </div>
          <label class="field">
            <span class="klabel">QUANTITÉ</span>
            <input class="inp" data-k="mrqty" type="number" min="1" value="${esc(f.qty)}" ${oni(e=>{f.qty=e.target.value; render();})}>
          </label>
          ${(f.newItem ? f.newCat===CATEGORIE_DONGLE : (S.materiel.find(m=>(m.id||m.name)===f.name)||{}).cat===CATEGORIE_DONGLE) ? `
          <label class="field">
            <span class="klabel">FIN DE LICENCE <span style="color:var(--muted);font-weight:400;letter-spacing:0">(facultatif)</span></span>
            <input class="inp" data-k="mrlic" type="date" value="${esc(f.licence||"")}" ${oni(e=>{f.licence=e.target.value;})}>
            ${!f.newItem && (S.materiel.find(m=>(m.id||m.name)===f.name)||{}).licenceFin ? `<span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--muted)">Actuellement : ${esc(libelleLicence(S.materiel.find(m=>(m.id||m.name)===f.name).licenceFin))}. Une nouvelle date la remplace.</span>` : ""}
          </label>` : ""}
          ${versSeries?`<span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-8fb4ff)">${nbEntre} exemplaires : leurs numéros de série seront demandés à l'étape suivante, pour pouvoir tracer lequel a servi.</span>`:""}
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({matReceptForm:null}))}>Annuler</button>
          <button class="btn-pri${f.newItem && !(f.newName||"").trim() ? ' off':''}" style="padding:9px 16px" ${on(confirmMatReception)}>${versSeries?"Saisir les "+nbEntre+" numéros":(f.newItem?"Créer l'article":"Valider")}</button>
        </div>
      </div>
    </div>`;
  }

  // Réservation matériel (unitaire)
  if(S.matResForm){
    const f = S.matResForm;
    const options = missionNamesEmpruntables();
    const available = matAvailable(f.name);
    const wanted = Math.max(1, Number(f.qty)||1);
    const overQty = wanted > available;
    const blocked = overQty;
    const listHtml = (S.matRes[f.name]||[]).map((r,k)=>`
      <div style="padding:9px 11px;display:flex;align-items:center;gap:9px">
        <span style="flex:1;min-width:0;font:400 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-c3c9d3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.mission+" · pris par "+(r.by||"non précisé")+(r.returned?" · rendu":""))}</span>
        <span style="font:600 12px/1 Inter,system-ui,sans-serif;color:var(--c-f0b45a)">${r.qty} u.</span>
        ${peutRendreLigne(r)?`<button class="btn-cell hred" style="padding:4px 8px;font-size:12px" ${on(()=>{
          agir("materiel.emprunt.retour", { nom:f.name, index:k, empreinte:empreinte(r) });
        })}>Restituer</button>`:""}
      </div>`).join("");

    modals += `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true" style="width:420px">
        <div class="modal-head">
          <span class="modal-title">Emprunter du matériel</span>
          <span class="modal-sub">${esc(matLabel(f.name))}</span>
        </div>
        <div class="modal-body">
          ${(S.matRes[f.name]||[]).length?`<div class="stack">${listHtml}</div>`:""}
          <div style="display:grid;grid-template-columns:100px 1fr;gap:10px">
            <label class="field">
              <span class="klabel">QUANTITÉ</span>
              <input class="inp" data-k="resqty" type="number" min="1" max="${available}" style="${overQty?"border-color:var(--c-ef8b83)":""}" value="${esc(f.qty)}" ${oni(e=>{f.qty=e.target.value; render();})}>
            </label>
            <label class="field">
              <span class="klabel">MISSION</span>
              <select class="inp" data-k="resmission" ${ong(e=>{ f.mission=e.target.value; render(); })}>
                ${options.map(nm=>`<option value="${esc(nm)}"${nm===f.mission?" selected":""}>${nm===SANS_MISSION?"Sans mission":esc(nm)}</option>`).join("")}
              </select>
            </label>
          </div>
          <div class="field">
            <span class="klabel">PRIS PAR</span>
            <span style="font:500 13px/1.2 Inter,system-ui,sans-serif;color:var(--c-e7e9ee)">${esc(OPERATOR)}</span>
          </div>
          ${selecteurEquipe((f.mission||"").trim(), f.equipe||"", v=>{f.equipe=v; render();})}
          <label class="field">
            <span class="klabel">COMMENTAIRE <span style="color:var(--c-6d7480);font-weight:400;letter-spacing:0">(facultatif)</span></span>
            <textarea class="inp" data-k="rescomment" maxlength="500" rows="3" placeholder="Pourquoi ce matériel sort-il ?" ${oni(e=>{f.commentaire=e.target.value;})}>${esc(f.commentaire||"")}</textarea>
          </label>
          <span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-6d7480)">${available} unité(s) disponible(s) hors réservations existantes</span>
          ${overQty?`<span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-ef8b83)">Stock insuffisant : ${available===0?"plus aucune unité disponible":"seulement "+available+" unité(s) disponible(s)"} pour cet article.</span>`:""}
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({matResForm:null}))}>Fermer</button>
          <button class="btn-pri${blocked?' off':''}" style="padding:9px 16px" ${on(async ()=>{
            if(blocked) return;
            const n2 = Math.max(1, Number(f.qty)||1);
            if(await agir("materiel.emprunt", { nom:f.name, qty:n2, mission:(f.mission||"").trim(), equipe:f.equipe||"", commentaire:(f.commentaire||"").trim() })){
              setT({ matResForm:null });
            }
          })}>Emprunter</button>
        </div>
      </div>
    </div>`;
  }

  // Réservation groupée
  if(S.matBatch){
    const b = S.matBatch;
    const options = missionNamesEmpruntables();
    b.packs = (b.packs||[]).filter(nom=>{
      const pk = S.packs.find(x=>x.name===nom); return pk && packDisponible(pk);
    });
    const demande = demandePanier(b);
    const overItems = manquesPanier(b);
    const blocked = overItems.length>0 || (!b.packs.length && !Object.keys(b.qtys).length);

    const packsHtml = b.packs.map(nom=>{
      const pk = S.packs.find(x=>x.name===nom);
      const contenu = pk.items.map(i=>i.qty+" × "+i.libelle).join(" · ");
      return `
      <div style="padding:8px 11px;display:flex;align-items:flex-start;gap:10px">
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font:500 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-eef0f4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(pk.name)}</span>
          <span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-6d7480)">${esc(contenu)}</span>
        </span>
        <button class="btn-cell hred" ${on(()=>{ b.packs = b.packs.filter(x=>x!==nom); delete S.packSel[nom]; render(); })}>Retirer</button>
      </div>`;
    }).join("");

    const itemsHtml = Object.keys(b.qtys).map(nm=>{
      const avail = matAvailable(nm);
      // Ce que les malettes du panier réclament déjà du même article : la
      // quantité saisie ici ne dispose que du reste.
      const parPacks = (demande[nm]||0) - Math.max(1, Number(b.qtys[nm])||1);
      const over = overItems.includes(nm);
      return `
      <div style="padding:8px 11px;display:flex;align-items:center;gap:10px">
        <span style="flex:1;min-width:0;font:400 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-c3c9d3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc((S.materiel.find(m=>(m.id||m.name)===nm)||{}).name||nm)}</span>
        <span style="font:400 12px/1 Inter,system-ui,sans-serif;color:${over?"var(--c-ef8b83)":"var(--c-6d7480)"};white-space:nowrap">disp. ${avail}${parPacks?" · "+parPacks+" en malette":""}</span>
        <input class="inp" data-k="bq-${esc(nm)}" type="number" min="1" max="${Math.max(1, avail-parPacks)}" style="width:64px;padding:6px 8px;font-size:12px;border-radius:7px;${over?"border-color:var(--c-ef8b83)":""}" value="${esc(b.qtys[nm])}" ${oni(e=>{b.qtys[nm]=e.target.value; render();})}>
      </div>`;
    }).join("");

    modals += `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true" style="width:470px">
        <div class="modal-head">
          <span class="modal-title">Emprunter la sélection</span>
          <span class="modal-sub">Une seule personne · tout part ensemble ou rien ne part</span>
        </div>
        <div class="modal-body">
          <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px">
            <label class="field">
              <span class="klabel">MISSION</span>
              <select class="inp" data-k="bmission" ${ong(e=>{ b.mission=e.target.value; render(); })}>
                ${options.map(nm=>`<option value="${esc(nm)}"${nm===b.mission?" selected":""}>${nm===SANS_MISSION?"Sans mission":esc(nm)}</option>`).join("")}
              </select>
            </label>
            <div class="field">
              <span class="klabel">PRIS PAR</span>
              <span style="font:500 13px/1.2 Inter,system-ui,sans-serif;color:var(--c-e7e9ee);padding:9px 0">${esc(OPERATOR)}</span>
            </div>
          </div>
          ${b.packs.length ? `
          <div class="field" style="gap:8px">
            <span class="klabel">MALETTES · ${b.packs.length}</span>
            <div class="stack">${packsHtml}</div>
          </div>` : ""}
          ${Object.keys(b.qtys).length ? `
          <div class="field" style="gap:8px">
            <span class="klabel">ARTICLES · ${Object.keys(b.qtys).length}</span>
            <div class="stack">${itemsHtml}</div>
          </div>` : ""}
          ${selecteurEquipe((b.mission||"").trim(), b.equipe||"", v=>{b.equipe=v; render();})}
          <label class="field">
            <span class="klabel">COMMENTAIRE <span style="color:var(--c-6d7480);font-weight:400;letter-spacing:0">(facultatif)</span></span>
            <textarea class="inp" data-k="bcomment" maxlength="500" rows="3" placeholder="Commentaire commun aux sorties" ${oni(e=>{b.commentaire=e.target.value;})}>${esc(b.commentaire||"")}</textarea>
          </label>
          ${overItems.length?`<span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-ef8b83)">Stock insuffisant pour : ${esc(overItems.map(matLabel).join(", "))}. Réduisez la quantité, ou retirez une malette qui réclame le même article.</span>`:""}
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({matBatch:null}))}>Annuler</button>
          <button class="btn-pri${blocked?' off':''}" style="padding:9px 16px" ${on(()=>{ if(!blocked) confirmBatch(); })}>Emprunter</button>
        </div>
      </div>
    </div>`;
  }

  // Restitution
  if(S.releaseForm){
    const f = S.releaseForm;
    const ouvertes = lignesOuvertesMission(f.mission);
    const consommables = ouvertes.filter(l=>estConsommable(l.id));
    const rendus = ouvertes.filter(l=>!estConsommable(l.id));
    f.consommes = f.consommes || {};

    /* Un consommable peut avoir ete utilise en partie. Le reste rentre.
       Seuls les consommables portent la case : un outil revient toujours,
       et s'il est casse c'est une correction d'inventaire, pas une
       consommation. */
    const consoHtml = consommables.map(l=>{
      const saisi = f.consommes[l.id];
      const coche = saisi !== undefined;
      const n = Math.min(l.qty, Math.max(0, Number(saisi)||0));
      // Un exemplaire serie sort a l'unite : la case suffit, demander « combien
      // sur 1 » n'aurait pas de sens.
      const unique = l.qty === 1;
      const detail = matDetail(l.id);
      return `
      <div style="padding:8px 11px;display:flex;align-items:center;gap:10px">
        <button ${on(()=>{ if(coche) delete f.consommes[l.id]; else f.consommes[l.id]=l.qty; render(); })}
          style="width:15px;height:15px;flex:none;border-radius:4px;display:grid;place-items:center;font:600 12px/1 Inter,system-ui,sans-serif;padding:0;${coche?"background:var(--gold);border:1px solid var(--gold);color:var(--gold-ink)":"background:var(--c-191c22);border:1px solid var(--c-343a45);color:transparent"}">${coche?"✓":""}</button>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font:400 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-c3c9d3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(matLabel(l.id))}</span>
          ${detail?`<span style="font:400 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-9aa2af);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(detail)}</span>`:""}
        </span>
        ${unique ? "" : `<span style="font:400 12px/1 Inter,system-ui,sans-serif;color:var(--c-6d7480);white-space:nowrap">sorti ${l.qty}</span>
        <input class="inp" data-k="cons-${esc(l.id)}" type="number" min="0" max="${l.qty}" ${coche?"":"disabled"}
          style="width:64px;padding:6px 8px;font-size:12px;border-radius:7px;${coche?"":"opacity:.4"}"
          value="${coche?esc(saisi):0}" ${oni(e=>{ f.consommes[l.id]=e.target.value; render(); })}>`}
        <span style="width:${unique?"92px":"74px"};text-align:right;font:400 12px/1 Inter,system-ui,sans-serif;color:${coche&&n?"var(--c-7fd1a6)":"var(--c-5b6270)"};white-space:nowrap">${unique?(coche?"utilisé":"rentre"):(coche?(l.qty-n)+" rentrent":"tout rentre")}</span>
      </div>`;
    }).join("");

    const totalConso = Object.keys(f.consommes).reduce((s,id)=>{
      const l = consommables.find(x=>x.id===id);
      return s + (l ? Math.min(l.qty, Math.max(0, Number(f.consommes[id])||0)) : 0);
    }, 0);

    modals += `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true" style="width:${consommables.length?"500px":"400px"};max-height:86vh">
        <div class="modal-head">
          <span class="modal-title">Restitution du matériel</span>
          <span class="modal-sub">${esc(f.mission)}${f.equipe?" · équipe "+esc(f.equipe):""}</span>
        </div>
        <div class="modal-body" style="gap:12px;overflow:auto">
          <div class="field">
            <span class="klabel">RENDU PAR</span>
            <span style="font:500 13px/1.2 Inter,system-ui,sans-serif;color:var(--c-e7e9ee)">${esc(OPERATOR)}</span>
          </div>
          ${consommables.length ? `
          <div class="field" style="gap:8px">
            <span class="klabel">CONSOMMABLES · CE QUI A ÉTÉ UTILISÉ</span>
            <div class="stack">${consoHtml}</div>
            <span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-6d7480)">Ce qui est déclaré utilisé ne revient pas au stock. Le reste rentre normalement.</span>
          </div>` : ""}
          ${rendus.length ? `
          <div class="field" style="gap:6px">
            <span class="klabel">REVIENT AU STOCK · ${rendus.length}</span>
            <span style="font:400 12px/1.4 Inter,system-ui,sans-serif;color:var(--c-aeb5c1)">${esc(rendus.map(l=>l.qty+" × "+matLabel(l.id)).join(" · "))}</span>
          </div>` : ""}
          ${totalConso ? `
          <label class="field">
            <span class="klabel">COMMENTAIRE <span style="color:var(--c-6d7480);font-weight:400;letter-spacing:0">(facultatif)</span></span>
            <textarea class="inp" data-k="relcomment" maxlength="500" rows="2" placeholder="Pourquoi ces consommables ont été utilisés" ${oni(e=>{f.commentaire=e.target.value;})}>${esc(f.commentaire||"")}</textarea>
          </label>` : ""}
          <span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-6d7480)">Les lignes de matériel restent visibles avec la mention « Rendu le » et la date du jour.</span>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({releaseForm:null}))}>Annuler</button>
          <button class="btn-pri" style="padding:9px 16px" ${on(()=>confirmRelease())}>${totalConso?"Restituer et décompter "+totalConso:"Confirmer la restitution"}</button>
        </div>
      </div>
    </div>`;
  }

  // Modifier la mission
  if(S.editMission){
    const f = S.editMission;
    // Ce que la mission détient encore : chaque ligne peut en être détachée, tant
    // que la mission est prévue.
    const gestion = gestionnairesDe(f.name);
    const effectifMission = membresMission(f.name);
    const statutEdition = statutMission(f.name);
    const desassignable = statutEdition === "PRÉVUE";
    const affectes = [];
    Object.keys(S.matRes).forEach(id=>(S.matRes[id]||[]).forEach((r,index)=>{
      if(r.mission===f.name && !r.returned) affectes.push({id, index, r});
    }));
    modals += `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true" style="width:1240px;max-width:100%;max-height:92vh;zoom:1.05">
        <div class="modal-head">
          <span class="modal-title">Modifier la mission</span>
          <span class="modal-sub">${esc(f.name)}</span>
        </div>
        <div class="modal-body" style="gap:32px;padding:28px 32px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));align-items:start">

          <div class="field">
            <span class="klabel">RESPONSABLE</span>

            <span class="klabel">DATE PRÉVUE</span>
            <input class="inp" data-k="eddate" type="date" value="${esc(f.date)}" ${peutGererMission(f.name)?"":"disabled title=\"Réservé aux gestionnaires de la mission et aux administrateurs\""} ${ong(e=>{f.date=e.target.value;})}>
          </label>
          <div class="field">
            <span class="klabel">GESTION ET EFFECTIF</span>
            <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
              <span style="font:600 12px Inter,system-ui,sans-serif;color:var(--c-9aa2af);width:78px">Gestion</span>
              ${peutGererMission(f.name)
                ? S.annuaire.map(c=>{
                    const gere = gestion.includes(c);
                    const dernier = gere && gestion.length === 1;
                    return `<button class="chip${gere?" on":""}" ${dernier?'disabled title="Une mission a besoin d\'au moins un gestionnaire"':'title="'+(gere?"Retirer de la gestion":"Nommer gestionnaire")+'"'} ${on(()=>agir("mission.gestion",{mission:f.name, gestionnaires: gere ? gestion.filter(x=>x!==c) : gestion.concat([c])}))}>${esc(c)}</button>`;
                  }).join("")
                : gestion.map(c=>`<span class="badge info">${esc(c)}</span>`).join("")}
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
              <span style="font:600 12px Inter,system-ui,sans-serif;color:var(--c-9aa2af);width:78px">Effectif</span>
              ${effectifMission.size ? Array.from(effectifMission).sort().map(c=>`<span class="badge mut">${esc(c)}</span>`).join("")
                : `<span style="font:400 12px Inter,system-ui,sans-serif;color:var(--c-6d7480)">Personne : l'effectif se compose avec « + Équipe » puis « Membres ».</span>`}
            </div>
            <span style="font:400 12px/1.4 Inter,system-ui,sans-serif;color:var(--c-6d7480)">Les gestionnaires (et les administrateurs) composent l'effectif, forcent des prêts et peuvent revenir en arrière sur les statuts. Un gestionnaire peut aussi faire partie d'une équipe.</span>
          </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:18px;min-width:0">
          <div class="field">
            <span class="klabel">MATÉRIEL AFFECTÉ · ${affectes.length}</span>
            ${affectes.length ? `<div class="stack" style="border-radius:8px;max-height:460px;overflow:auto">${affectes.map(({id,index,r})=>`
              <div style="background:var(--c-191c22);padding:8px 11px;display:flex;align-items:center;gap:10px">
                <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
                  <span style="font:500 12px/1.25 Inter,system-ui,sans-serif;color:var(--c-eef0f4)">${esc(matLabel(id))} <span style="color:var(--c-f0b45a);font-weight:600">× ${r.qty}</span></span>
                  <span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-9aa2af);overflow-wrap:anywhere">${[matDetail(id), "pris par "+(r.by||"non précisé"), r.equipe?"équipe "+r.equipe:"", r.sacDe?"prêté par "+r.sacDe:""].filter(Boolean).map(esc).join(" · ")}</span>
                </span>
                ${desassignable
                  ? (!peutGererMission(f.name) ? "" : `<button class="btn-mini hred" title="Retire le matériel de la mission et le rend : il regagne le stock${r.sacDe?" (ici, le sac de "+r.sacDe+")":""}." ${on(()=>agir("materiel.mission.desassigner",{nom:id, index, empreinte:empreinte(r)}))}>Désassigner</button>`)
                  : (!peutRendreLigne({by:r.by, sacDe:r.sacDe, mission:f.name}) ? "" : `<button class="btn-mini hblue" title="Rend ce matériel : il regagne le stock${r.sacDe?" (ici, le sac de "+r.sacDe+")":""}, et la ligne se ferme dans la mission." ${on(()=>agir("materiel.mission.restituer_ligne",{nom:id, index, empreinte:empreinte(r)}))}>Restituer</button>`)}
              </div>`).join("")}</div>
            ${desassignable
              ? `<span style="font:400 12px/1.4 Inter,system-ui,sans-serif;color:var(--c-6d7480)">La mission est prévue : « Désassigner » retire la ligne de la mission et rend le matériel, qui regagne le stock. Une fois la mission en cours, on restitue.</span>`
              : `<span style="font:400 12px/1.4 Inter,system-ui,sans-serif;color:var(--c-6d7480)">La mission est ${statutEdition.toLowerCase()} : le matériel ne se désassigne plus, il se rend. « Restituer » le remet en stock et ferme la ligne dans la mission. Pour déclarer des consommables utilisés, utilisez « Restituer tout ».</span>`}`
            : `<span style="font:400 12px/1.4 Inter,system-ui,sans-serif;color:var(--c-6d7480)">Aucun matériel n'est affecté à cette mission.</span>`}
          </div>
          <div class="field">
            <span class="klabel">ACTIONS</span>
            <span style="display:flex;gap:6px;flex-wrap:wrap">
              <button class="btn-mini hblue" ${on(()=>copierLien(lienMission(f.name), f.name))}>Copier le lien</button>
              <button class="btn-mini hblue" ${on(()=>{ setT({editMission:null}); ouvrirDemandePret("direct", f.name); })}>Demander du matériel personnel</button>
              ${peutGererMission(f.name)?`<button class="btn-mini hwhite" ${on(()=>{ setT({editMission:null}); ouvrirEquipe(f.name, null); })}>+ Équipe</button>`:""}
              ${f.ouvertes && peutGererMission(f.name)?`<button class="btn-mini hblue" ${on(()=>setT({editMission:null, releaseForm:{mission:f.name, by:"", consommes:{}, commentaire:""}}))}>Restituer tout</button>`:""}
              ${f.archivable && peutGererMission(f.name)?`<button class="btn-mini hblue" ${on(()=>{ setT({editMission:null}); setMissionArchived(f.name, {}, true); })}>Archiver</button>`:""}
              ${f.archived && peutGererMission(f.name)?`<button class="btn-mini hblue" ${on(()=>{ setT({editMission:null}); setMissionArchived(f.name, {}, false); })}>Désarchiver</button>`:""}
              ${f.vide && ADMIN?`<button class="btn-mini hred" ${on(()=>{ setT({editMission:null}); agir("mission.supprimer",{nom:f.name}); })}>Supprimer</button>`:""}
            </span>
          </div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn-sec" style="padding:9px 14px" ${on(()=>setT({editMission:null}))}>Annuler</button>
          ${peutGererMission(f.name)?`<button class="btn-pri" style="padding:9px 16px" ${on(async ()=>{
            // Le responsable n'est pas modifié : c'est celui qui a créé la
            // mission, pas celui qui en corrige la date aujourd'hui.
            if(await agir("mission.date", { nom:f.name, date:f.date||"" })){
              setT({ editMission:null });
            }
          })}>Enregistrer</button>`:""}
        </div>
      </div>
    </div>`;
  }

  /* Mon matériel — ce qui est sorti au nom du compte connecté.
     La liste se vide d'elle-même : chaque restitution renvoie une différence
     que le rendu suivant prend en compte, la modale reste ouverte. */
  if(S.possessions){
    const dotations = S.dotations[auteurEffectif()]||[];
    const emprunts = mesEmprunts();
    const sorties  = mesSorties();
    const reserves = mesReservations();
    const ongletDotation = S.possessionsTab === "dotation";
    const nbEmprunts = emprunts.length + sorties.length + reserves.length;

    const empruntsHtml = emprunts.map(({nom, index, r})=>`
      <div style="padding:9px 11px;display:flex;align-items:center;gap:9px">
        <span style="width:6px;height:6px;flex:none;border-radius:50%;background:var(--c-f0b45a);display:block"></span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
          <span style="font:500 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-eef0f4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(matLabel(nom))}</span>
          <span style="font:400 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-6d7480)">${esc("Mission : "+(r.mission||"—"))}</span>
        </span>
        <span style="font:600 12px/1 Inter,system-ui,sans-serif;color:var(--c-f0b45a);font-variant-numeric:tabular-nums">${r.qty} u.</span>
        <button class="btn-cell hgreen" ${on(()=>{
          agir("materiel.emprunt.retour", { nom, index, empreinte:empreinte(r) });
        })}>Rendre</button>
      </div>`).join("");

    const sortiesHtml = sorties.map(({ref, index, o})=>`
      <div style="padding:9px 11px;display:flex;align-items:center;gap:9px">
        <span style="width:6px;height:6px;flex:none;border-radius:50%;background:var(--c-ef8b83);display:block"></span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
          <span style="font:500 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-eef0f4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ref.brand+" "+ref.model)}</span>
          <span style="font:400 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-6d7480)">${esc(o.variant+" · sorti le "+dateComplete(o.iso)+" à "+heureMinute(o.iso))}</span>
        </span>
        <span style="font:600 12px/1 Inter,system-ui,sans-serif;color:var(--c-ef8b83);font-variant-numeric:tabular-nums">${o.qty} u.</span>
        <button class="btn-cell hgreen" ${on(()=>returnOut(ref, index))}>Retourner</button>
      </div>`).join("");

    const dotationsHtml = dotations.map(d=>`
      <div style="padding:9px 11px;display:flex;align-items:center;gap:9px">
        <span style="width:6px;height:6px;flex:none;border-radius:50%;background:var(--c-5fc79a);display:block"></span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
          <span style="font:500 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-eef0f4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.article)}</span>
          <span style="font:400 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-6d7480)">${esc(d.detail||"Dotation personnelle")}</span>
        </span>
        <span style="font:600 12px/1 Inter,system-ui,sans-serif;color:var(--c-5fc79a);font-variant-numeric:tabular-nums">${d.quantite} u.</span>
      </div>`).join("");

    const reservesHtml = reserves.map(({ref, index, r})=>`
      <div style="padding:9px 11px;display:flex;align-items:center;gap:9px">
        <span style="width:6px;height:6px;flex:none;border-radius:50%;background:var(--c-f0b45a);display:block"></span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
          <span style="font:500 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-eef0f4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ref.brand+" "+ref.model)}</span>
          <span style="font:400 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-6d7480)">${esc(r.variant+" · réservé le "+dateComplete(r.iso))}</span>
        </span>
        <span style="font:600 12px/1 Inter,system-ui,sans-serif;color:var(--c-f0b45a);font-variant-numeric:tabular-nums">${r.qty} u.</span>
        <span style="display:flex;align-items:center;gap:5px">
          <button class="btn-cell hblue" ${on(()=>resolveReservation(ref, index, "sell"))}>Sortir</button>
          <button class="btn-cell hred" ${on(()=>resolveReservation(ref, index, "cancel"))}>Annuler</button>
        </span>
      </div>`).join("");

    modals += `
    <div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true" style="width:520px;max-height:82vh">
        <div class="modal-head">
          <span class="modal-title">Mon matériel</span>
          <span class="modal-sub">${esc("Matériel du compte "+auteurEffectif())}</span>
        </div>
        <div class="modal-body" style="gap:16px;overflow:auto">
          <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1px;background:var(--c-2b2f37);border:1px solid var(--c-2b2f37);border-radius:8px;overflow:hidden">
            <button class="chip${ongletDotation?' on':''}" style="border:0;border-radius:0;text-align:center" ${on(()=>setT({possessionsTab:"dotation"}))}>Sac de dotation <span style="opacity:.7">· ${dotations.length}</span></button>
            <button class="chip${!ongletDotation?' on':''}" style="border:0;border-radius:0;text-align:center" ${on(()=>setT({possessionsTab:"emprunts"}))}>Emprunts et sorties <span style="opacity:.7">· ${nbEmprunts}</span></button>
          </div>

          ${(ongletDotation && !dotations.length) || (!ongletDotation && !nbEmprunts) ? `
          <div style="padding:34px 16px;text-align:center;display:flex;flex-direction:column;gap:7px">
            <span style="font:500 13px Inter,system-ui,sans-serif;color:var(--c-c3c9d3)">Vous ne détenez rien</span>
            <span style="font:400 12px Inter,system-ui,sans-serif;color:var(--c-6d7480)">${ongletDotation ? "Aucun matériel ne vous est attribué dans votre sac" : "Aucun matériel emprunté, téléphone sorti ou réservation à votre nom"}</span>
          </div>` : ""}

          ${ongletDotation && dotations.length ? `
          <div class="field">
            <span class="klabel">SAC ATTRIBUÉ · ${dotations.length}</span>
            <div class="stack">${dotationsHtml}</div>
          </div>` : ""}

          ${!ongletDotation && emprunts.length ? `
          <div class="field">
            <span class="klabel">MATÉRIEL EMPRUNTÉ · ${emprunts.length}</span>
            <div class="stack">${empruntsHtml}</div>
          </div>` : ""}

          ${!ongletDotation && sorties.length ? `
          <div class="field">
            <span class="klabel">TÉLÉPHONES SORTIS · ${sorties.length}</span>
