async function confirmerAttribution(){
  const f = S.attributionEdit; if(!f) return;
  const quantite = Number(f.quantite);
  if(!Number.isInteger(quantite) || quantite < 1){
    syncNote("La quantité doit être un entier positif."); return;
  }
  const lignes = (S.dotations[f.compte]||[]).map(d=>({
    article:d.article, quantite:Number(d.quantite)||0, detail:d.detail||""}));
  const ligne = lignes.find(d=>d.article===f.article);
  if(ligne){
    ligne.quantite += quantite;
    if(f.detail.trim()) ligne.detail = f.detail.trim();
  }else{
    lignes.push({article:f.article, quantite, detail:f.detail.trim()});
  }
  const materiel = lignes.map(d=>[d.article,d.quantite,d.detail]);
  if(await agir("compte.dotations", {compte:f.compte, materiel}))
    setT({attributionEdit:null});
}

/* Modifie une ligne du sac en cours d'edition, sans redessiner.

   Le redessin etait ici, et il faisait sortir le curseur du champ a chaque
   caractere tape : `render()` remplace tout le contenu de la page, et le
   moteur ne remet le curseur que sur un element portant `data-k` — ce que ces
   deux champs n'avaient pas.

   Les deux corrections sont necessaires, et pour des raisons differentes :

   - ne plus redessiner a chaque frappe, parce que rien a l'ecran ne depend de
     ce qu'on tape ici. C'est le meme parti pris que les autres champs texte du
     fichier (`f.etiquette=e.target.value`, sans render) ;
   - donner quand meme un `data-k` a chaque champ, parce que la boucle de
     synchronisation redessine toutes les 2,5 secondes des que quelqu'un
     d'autre modifie quelque chose. Sans lui, le curseur sauterait encore,
     juste moins souvent — et de façon d'autant plus deroutante. */
function modifierLigneDotation(article, champ, valeur){
  const f = S.dotationEdit; if(!f) return;
  let ligne = f.lignes.find(l=>l.article===article);
  if(!ligne){ ligne={article, quantite:0, detail:""}; f.lignes.push(ligne); }
  ligne[champ] = champ==="quantite" ? Math.max(0, Number(valeur)||0) : valeur;
}

/* Édition du sac en deux colonnes : le catalogue à gauche, le contenu du sac à
   droite. Ces gestes passent par des boutons, donc par un redessin sans risque
   pour le curseur ; seuls les champs texte (détail, quantité saisie) évitent
   `render()`, pour la raison expliquée plus haut. */
function sacAjouter(article){
  const f = S.dotationEdit; if(!f) return;
  const ligne = f.lignes.find(l=>l.article===article);
  if(ligne) ligne.quantite = (Number(ligne.quantite)||0) + 1;
  else f.lignes.push({article, quantite:1, detail:""});
  render();
}
function sacPas(article, delta){
  const f = S.dotationEdit; if(!f) return;
  const ligne = f.lignes.find(l=>l.article===article); if(!ligne) return;
  ligne.quantite = Math.max(1, (Number(ligne.quantite)||0) + delta);
  render();
}
function sacRetirer(article){
  const f = S.dotationEdit; if(!f) return;
  f.lignes = f.lignes.filter(l=>l.article!==article);
  render();
}

/* ---------- prêts de matériel personnel ----------

   Le sac d'une personne lui appartient : on le lui demande. Ces fonctions pilotent
   la fenêtre de demande ; la décision (accepter, refuser) se prend dans la
   notification du profil de la personne sollicitée. */
function membresMission(nom){
  const m = new Set();
  S.equipes.filter(e=>e.mission===nom).forEach(e=>(e.membres||[]).forEach(x=>m.add(x)));
  return m;
}
/* Les demandes de prêt en attente qui visent cette mission, telles que la
   personne qui regarde a le droit de les voir : les siennes (émises ou reçues),
   et celles faites sur une mission dont elle est responsable. */
function demandesDeMission(nom){
  const moi = auteurEffectif();
  return [
    ...S.pret.emises.filter(d=>d.mission===nom && d.statut==="EN ATTENTE")
      .map(d=>Object.assign({}, d, {de:moi, role:"emise"})),
    ...S.pret.recues.filter(d=>d.mission===nom)
      .map(d=>Object.assign({}, d, {a:moi, role:"recue"})),
    ...(S.pret.missions||[]).filter(d=>d.mission===nom)
      .map(d=>Object.assign({}, d, {role:"autre"})),
  ].sort((x,y)=>String(x.iso||"").localeCompare(String(y.iso||"")));
}
/* Prêt à quelqu'un qui n'a pas de compte : déclaré, avec une échéance. Passée celle-ci, une
   alerte s'affiche sur le profil du prêteur, de son chef, de son adjoint et des administrateurs. */
function ouvrirPretExterne(){

function joursDeRetard(echeance){

}

function ligneDeSac(proprietaire, article){
  return (S.pret.sacs[proprietaire]||[]).find(l=>l.article===article);
}
async function envoyerDemandePret(){
  const f = S.demandePret; if(!f || !f.choix) return;
  const qty = Number(f.qty);
  if(!Number.isInteger(qty) || qty < 1){ syncNote("La quantité doit être un entier positif."); return; }
  const ligne = ligneDeSac(f.choix.proprietaire, f.choix.article);
  if(!ligne){ syncNote("Cet article n'est plus dans ce sac."); return; }
  if(qty > ligne.disponible){
    syncNote("Le sac de "+f.choix.proprietaire+" ne peut prêter que "+ligne.disponible+"."); return;
  }
  const forcer = !!f.forcer && (peutForcerPour(f.mode==="file" ? "" : f.mission, f.choix.proprietaire)
    || (f.mode==="file" && (ADMIN || (S._mGestion || [OPERATOR]).includes(OPERATOR))));
  if(f.mode === "file"){
    // Mission pas encore créée : la demande part avec elle (voir « Créer »).
    setT({_mDemandes:[...S._mDemandes, {proprietaire:f.choix.proprietaire, article:f.choix.article,
          libelle:ligne.libelle, detail:ligne.detail, qty, motif:(f.motif||"").trim(), forcer}], demandePret:null});
    return;
  }
  if(await agir(forcer ? "pret.forcer" : "pret.demander",
                {proprietaire:f.choix.proprietaire, article:f.choix.article,
                 qty, mission:f.mission, motif:(f.motif||"").trim()}))
    setT({demandePret:null});
}

const classeDemande = st => st==="ACCEPTÉE" ? "ok" : st==="REFUSÉE" ? "bad" : st==="ANNULÉE" ? "mut" : "warn";
function quandCourt(iso){ return iso ? dateComplete(iso) : ""; }

/* Statut d'une mission : un statut imposé l'emporte ; sinon la date prévue fait
   passer la mission en cours et les emprunts la terminent — sans jamais descendre
   sous le plus haut statut déjà atteint, que le serveur retient (`plancherMissions`).
   Même règle que `Mission.statut` côté serveur. */
const ORDRE_STATUT = ["PRÉVUE","EN COURS","TERMINÉE"];
function statutMission(nom){
  if(S.missionStatus[nom]) return S.missionStatus[nom];
  const date = (S.missions.find(m=>m.name===nom)||{}).date || "";
  let calcule;
  if(date && date > aujourdhui()) calcule = "PRÉVUE";
  else {
    const lignes = [];
    Object.keys(S.matRes).forEach(id=>(S.matRes[id]||[]).forEach(r=>{ if(r.mission===nom) lignes.push(r); }));
    if(lignes.length) calcule = lignes.every(r=>r.returned) ? "TERMINÉE" : "EN COURS";
    else calcule = date ? "EN COURS" : "PRÉVUE";
  }
  const plancher = (S.plancherMissions||{})[nom];
  return (plancher && ORDRE_STATUT.indexOf(plancher) > ORDRE_STATUT.indexOf(calcule)) ? plancher : calcule;
}

/* L'ordre : prévue → en cours → terminée, « annulée » à part. On avance et on
   annule librement ; reculer, rouvrir une annulée ou annuler une terminée revient
   au gestionnaire de la mission (celui qui l'a créée) et aux administrateurs.
   Doit rester identique à `changement_permis()` de stock/services/statuts.py. */
/* Gestion et effectif d'une mission. On est l'un ou l'autre, jamais les deux :
   le gestionnaire a la charge de la mission (équipes, prêts forcés, retour en
   arrière sur les statuts), l'effectif y travaille et emporte son sac. Un
   administrateur a les droits de gestion partout. Même règle que
   `stock/services/gestion.py`. */
function gestionnairesDe(nom){
  const g = (S.gestionMissions||{})[nom];
  if(g && g.length) return g;
  const m = S.missions.find(x=>x.name===nom);
  return m && m.owner ? [m.owner] : [];
}
/* Les rôles : effectif < chef de groupe < admin, et gestionnaire d'une mission,
   propre à chaque mission. Même règles que `stock/services/droits.py` — qui est
   le seul à faire foi : ici on grise les boutons, le serveur refuse. Les droits se
   jugent sur la personne connectée (`OPERATOR`), pas sur le compte au nom duquel
   elle agit. */
const LIBELLE_ROLE = {"admin":"Administrateur", "chef de groupe":"Chef de groupe", "effectif":"Effectif"};
function roleMoi(){ return (S.moi && S.moi.role) || (ADMIN ? "admin" : "effectif"); }
function estChefDeGroupe(){ return roleMoi() === "chef de groupe"; }
function effectifsDuGroupe(){ return (S.moi && S.moi.effectifs) || []; }
function peutCreerMission(){ return !!(ADMIN || estChefDeGroupe()); }
function peutGererMission(nom){
  return !!(ADMIN || gestionnairesDe(nom).includes(OPERATOR));
}
function peutReculerMission(nom){ return peutGererMission(nom); }
/* Emprunter pour une mission : en faire partie, la gérer, ou être chef d'un groupe
   dont un effectif en fait partie. Sans mission, c'est libre. */
function peutEmprunterPour(nom){
  if(!nom || nom === SANS_MISSION) return true;
  if(peutGererMission(nom)) return true;
  const equipiers = membresMission(nom);
  if(equipiers.has(OPERATOR) || equipiers.has(auteurEffectif())) return true;
  return estChefDeGroupe() && effectifsDuGroupe().some(c=>equipiers.has(c));
}
function missionNamesEmpruntables(){ return missionNames().filter(n=>peutEmprunterPour(n)); }
/* Rendre une ligne : son emprunteur, le gestionnaire de sa mission, celui dont le
   sac l'a prêtée, le chef de l'emprunteur, ou un administrateur. */
function peutRendreLigne(r){
  if(ADMIN || r.by === OPERATOR || r.sacDe === OPERATOR) return true;
  if(r.mission && r.mission !== SANS_MISSION && gestionnairesDe(r.mission).includes(OPERATOR)) return true;
  return estChefDeGroupe() && effectifsDuGroupe().includes(r.by);
}
/* Forcer un prêt : le gestionnaire de la mission, ou un chef de groupe pour le sac
   d'un effectif de son groupe. */
function peutForcerPour(mission, proprietaire){
  if(mission && mission !== SANS_MISSION && peutGererMission(mission)) return true;
  return estChefDeGroupe() && effectifsDuGroupe().includes(proprietaire);
}
function changementStatutPermis(actuel, voulu, reculer){
  if(voulu === actuel) return true;
  if(actuel === "ANNULÉE") return reculer;
  if(voulu === "ANNULÉE") return actuel !== "TERMINÉE" || reculer;
  return ORDRE_STATUT.indexOf(voulu) >= ORDRE_STATUT.indexOf(actuel) || reculer;
}
const classeStatut = st => st==="EN COURS" ? "ok" : st==="PRÉVUE" ? "info" : st==="ANNULÉE" ? "bad" : "mut";

/* Les widgets du profil. Chaque carte de la page en est un : la personne choisit
   lesquelles elle affiche, dans quel ordre, et si elles sont étroites ou larges.
   La disposition est un réglage du compte (`profilWidgets`) — elle la suit d'un
   poste à l'autre. La liste des identifiants est aussi connue du serveur
   (`WIDGETS_PROFIL`, stock/api.py), qui refuse les autres. */
const WIDGETS = {
  compteurs:     {titre:"Compteurs", taille:"l", desc:"Unités détenues, lignes du sac, sorties en cours, missions actives."},
  a_recommander: {titre:"À recommander", taille:"l", admin:true, desc:"Les consommables passés sous leur seuil, avec accès à leur gestion."},
  sac:           {titre:"Sac de dotation", taille:"s", desc:"Le matériel qui vous est attribué en permanence."},
  sorties:       {titre:"Sorties en cours", taille:"s", desc:"Matériel et téléphones sortis ou réservés à votre nom."},
  missions:      {titre:"Missions", taille:"s", desc:"Vos missions : en gestion, en effectif (membre d'une équipe), ou porteur d'un emprunt."},
  activite:      {titre:"Activité récente", taille:"s", desc:"Vos 10 derniers mouvements de matériel et de téléphones."},
  missions_jour: {titre:"Aujourd'hui", taille:"s", desc:"Vos missions en cours, ou prévues aujourd'hui."},
  retard:        {titre:"Détenu depuis longtemps", taille:"s", desc:"Ce qui est sorti à votre nom depuis plus de 7 jours."},
  stock_bas:     {titre:"Stock bas", taille:"s", desc:"Les consommables sous leur seuil d'alerte, visibles de tous."},
  equipes:       {titre:"Mes équipes", taille:"s", desc:"Les équipes dont vous êtes membre, et vos coéquipiers."},
  etat_stock:    {titre:"État du stock", taille:"l", desc:"Appareils en armoire, références, articles de matériel."},
  acces_rapides: {titre:"Accès rapides", taille:"s", desc:"Des raccourcis vers les pages de l'application."},
  prets:         {titre:"Mes prêts", taille:"s", perso:true, desc:"Le matériel de votre sac que d'autres ont emprunté, et à qui."},
  groupe:        {titre:"Mon groupe", taille:"s", perso:true, chef:true, desc:"Vos effectifs : ce qu'ils détiennent, leurs demandes en attente, leurs sacs."},
  demandes:      {titre:"Mes demandes", taille:"s", perso:true, desc:"Vos demandes de matériel personnel, et la réponse qu'elles ont reçue."},
};
// « À recommander » n'y figure plus : un bandeau en haut du profil des administrateurs le remplace
// (le widget reste disponible, et le bandeau s'efface quand on l'ajoute).
const DISPOSITION_DEFAUT = ["compteurs","prets","demandes","sac","sorties","missions","activite"];

function dispositionDefaut(){
  // Un chef de groupe trouve d'emblée son groupe, juste après les compteurs.
  const ids = estChefDeGroupe()
    ? [...DISPOSITION_DEFAUT.slice(0, 1), "groupe", ...DISPOSITION_DEFAUT.slice(1)]
    : DISPOSITION_DEFAUT;
  return ids.map(id=>({id, taille:WIDGETS[id].taille}));
}
function widgetDisponible(id){
  const w = WIDGETS[id];
  return !!w && (!w.admin || ADMIN) && (!w.chef || estChefDeGroupe());
}
/* La disposition du compte, ou celle par défaut. Un widget réservé aux
   administrateurs n'apparaît pas aux autres, même s'il figurait dans une
   disposition enregistrée. */
function dispositionProfil(){
  const brut = Array.isArray(S.profilWidgets) ? S.profilWidgets : dispositionDefaut();
  return brut.filter(w=>w && widgetDisponible(w.id))
             .map(w=>({id:w.id, taille:w.taille==="l" ? "l" : "s"}));
}
function enregistrerDisposition(liste){ set({profilWidgets:liste}); }
function widgetDeplacer(id, delta){
  const l = dispositionProfil();
  const i = l.findIndex(w=>w.id===id), j = i + delta;
  if(i < 0 || j < 0 || j >= l.length) return;
  [l[i], l[j]] = [l[j], l[i]];
  enregistrerDisposition(l);
}
function widgetPlacerA(id, cibleId){
  const l = dispositionProfil();
  const de = l.findIndex(w=>w.id===id), vers = l.findIndex(w=>w.id===cibleId);
  if(de < 0 || vers < 0 || de === vers) return;
  const [w] = l.splice(de, 1);
  l.splice(vers, 0, w);
  enregistrerDisposition(l);
}
function widgetTaille(id){
  const l = dispositionProfil();
  const w = l.find(x=>x.id===id);
  if(!w) return;
  w.taille = w.taille === "l" ? "s" : "l";
  enregistrerDisposition(l);
}
function widgetMasquer(id){
  enregistrerDisposition(dispositionProfil().filter(w=>w.id!==id));
}
function widgetAjouter(id){
  const l = dispositionProfil();
  if(!l.some(w=>w.id===id)) l.push({id, taille:WIDGETS[id].taille});
  enregistrerDisposition(l);
}

/* « Mon groupe » : les membres du groupe de la personne connectée, ce que chacun
   détient, et le matériel que le stock affecte au groupe. Ouvert à tous les membres,
   en lecture : le serveur n'envoie que les sacs du groupe, et seuls le chef et les
   administrateurs peuvent les modifier. */
function groupeMoi(){ return (S.moi && S.moi.groupe) || null; }

function pageGroupe(){
  const g = groupeMoi();
  if(!g) return `<div style="padding:22px 26px"><div class="card" style="padding:34px 16px;text-align:center;color:var(--c-6d7480);font:400 12px Inter,system-ui,sans-serif">Vous ne faites partie d'aucun groupe. Un administrateur vous rattache à un chef de groupe.</div></div>`;

  const membres = g.membres.map(c=>{
    const lignes = possessionsDe(c);
    return {compte:c, lignes, unites:lignes.reduce((n,l)=>n+l.qty, 0), chef:c===g.chef, adjoint:c===g.adjoint};
  }).sort((a,b)=>(b.chef - a.chef) || (b.adjoint - a.adjoint) || a.compte.localeCompare(b.compte, "fr"));

  // Les membres : des vignettes, comme dans l'administration des comptes. Le contenu du
  // sac s'ouvre au clic.
  const carte = m=>`
    <button class="card" title="Voir le contenu du sac de ${esc(m.compte)}" ${on(()=>setT({sacMembre:m.compte}))}
      style="padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;position:relative">
      ${m.unites?`<span class="badge warn" style="position:absolute;top:9px;right:9px" title="Unités détenues">${m.unites}</span>`:""}
      ${avatar(m.compte, 54)}
      <span style="font:600 12.5px/1.2 Inter,system-ui,sans-serif;color:var(--c-f2f4f8);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.compte)}${m.compte===OPERATOR?'<span style="color:var(--c-6d7480);font-weight:400"> · vous</span>':""}</span>
      ${m.chef ? '<span class="badge violet">CHEF DE GROUPE</span>' : m.adjoint ? '<span class="badge violet">ADJOINT</span>' : '<span class="badge mut">EFFECTIF</span>'}
    </button>`;

  /* Les missions en cours qui impliquent au moins un membre du groupe : il la gère,
     fait partie d'une de ses équipes, ou porte du matériel emprunté pour elle. */
  const impliques = new Map();                       // mission -> { compte -> rôles }
  g.membres.forEach(c=>missionsDeCompte(c).forEach(m=>{
    if(m.st !== "EN COURS") return;
    const parMembre = impliques.get(m.nom) || new Map();
    parMembre.set(c, m.roles);
    impliques.set(m.nom, parMembre);
  }));
  const missionsEnCours = Array.from(impliques.entries())
    .map(([nom, parMembre])=>({nom, parMembre, date:(S.missions.find(x=>x.name===nom)||{}).date||""}))
    .sort((a,b)=>a.nom.localeCompare(b.nom, "fr"));
  const carteMission = m=>`
    <div class="card" style="padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
          <a href="${esc(adresseMission(m.nom))}" target="_blank" rel="noopener" title="Ouvrir le tableau de la mission"
             style="font:600 13px/1.25 Inter,system-ui,sans-serif;color:var(--c-f2f4f8);overflow-wrap:anywhere;text-decoration:none;border-bottom:1px dashed var(--c-6d7480);align-self:flex-start">${esc(m.nom)}</a>
          <span style="font:400 12px Inter,system-ui,sans-serif;color:var(--c-6d7480)">${m.date?"Depuis le "+esc(dateCourte(m.date)):"Sans date"} · ${m.parMembre.size} membre${m.parMembre.size>1?"s":""} du groupe</span>
        </span>
        <span class="badge ok">EN COURS</span>
      </div>
      <div class="stack" style="border-radius:8px">${Array.from(m.parMembre.entries()).map(([c, roles])=>`
        <div style="padding:7px 11px;display:flex;align-items:center;gap:9px">
          ${avatar(c, 24)}
          <span style="font:500 12px Inter,system-ui,sans-serif;color:var(--c-eef0f4)">${esc(c)}${c===OPERATOR?'<span style="color:var(--c-6d7480);font-weight:400"> · vous</span>':""}</span>
          <span style="margin-left:auto;font:400 12px Inter,system-ui,sans-serif;color:var(--c-9aa2af);text-align:right">${esc(roles.join(" · "))}</span>
        </div>`).join("")}</div>
    </div>`;

  /* Ce qui traîne : sorti ou prêté à un membre depuis plus de 7 jours (même seuil que le
     widget « Détenu depuis longtemps » du profil). Le plus ancien en tête : c'est
     l'ordre dans lequel on relance. */
  const longtemps = [];
  membres.forEach(m=>m.lignes.forEach(l=>{
    if(l.genre==="dotation" || l.genre==="réservation") return;
    const d = quand(l.iso);
    if(d && (Date.now() - d.getTime()) >= 7*86400000) longtemps.push(Object.assign({compte:m.compte}, l));
  }));
  longtemps.sort((a,b)=>String(a.iso).localeCompare(String(b.iso)));
  const ligneLongtemps = l=>`
    <div style="padding:9px 14px;display:flex;align-items:center;gap:11px">
      ${avatar(l.compte, 28)}
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
        <span style="font:500 12px/1.25 Inter,system-ui,sans-serif;color:var(--c-eef0f4);overflow-wrap:anywhere">${esc(l.libelle)}${l.detail?`<span style="color:var(--c-9aa2af);font-weight:400"> · ${esc(l.detail)}</span>`:""}</span>
        <span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-6d7480);overflow-wrap:anywhere">${esc(l.compte)}${l.contexte?" · "+esc(l.contexte):""}</span>
      </span>
      <span class="badge bad" title="Sorti le ${esc(dateCourte(l.iso))}">${esc(depuisQuand(l.iso).replace(/^depuis /, "").toUpperCase())}</span>
      <span style="flex:none;font:600 12px Inter,system-ui,sans-serif;color:var(--c-f0b45a);font-variant-numeric:tabular-nums">${l.qty} u.</span>
    </div>`;

  // Le matériel du groupe : les articles que le stock affecte à « Groupe n ».
  const etiquette = g.affectation;
  const articles = etiquette ? S.materiel.filter(m=>m.affectation===etiquette)
    .sort((a,b)=>a.name.localeCompare(b.name, "fr")) : [];
  const colonnes = "grid-template-columns:minmax(0,1.4fr) minmax(90px,.7fr) 64px minmax(0,1.6fr);column-gap:20px";
  const ligneArticle = m=>{
    const id = m.id || m.name;
    const sortis = (S.matRes[id]||[]).filter(r=>!r.returned);
    const identite = exemplaireDetail(m);
    return `
    <div style="padding:9px 14px;display:grid;${colonnes};gap:12px;align-items:center;border-bottom:1px solid var(--c-1f232a)">
      <span style="display:flex;flex-direction:column;gap:2px;min-width:0">
        <span style="font:600 12.5px/1.25 Inter,system-ui,sans-serif;color:var(--c-eef0f4);overflow-wrap:anywhere">${esc(m.name)}</span>
        ${identite?`<span style="font:400 12px/1.2 Inter,system-ui,sans-serif;color:var(--c-6d7480)">${esc(identite)}</span>`:""}
      </span>
      <span style="font:400 12px Inter,system-ui,sans-serif;color:var(--c-aeb5c1)">${esc(m.cat)}</span>
      <span style="font:600 13px Inter,system-ui,sans-serif;color:var(--c-f2f4f8);text-align:right;font-variant-numeric:tabular-nums" title="En stock">${m.qty}</span>
      <span style="font:400 12px/1.35 Inter,system-ui,sans-serif;color:var(--c-9aa2af)">${sortis.length
        ? sortis.map(r=>esc(r.by)+" × "+r.qty+(r.mission&&r.mission!==SANS_MISSION?" · "+esc(r.mission):"")).join("<br>")
        : '<span style="color:var(--c-6d7480)">—</span>'}</span>
    </div>`;
  };
  const vide = t=>`<div style="padding:22px 16px;color:var(--c-6d7480);font:400 12px/1.5 Inter,system-ui,sans-serif">${t}</div>`;
  const materiel = !etiquette
    ? vide("Aucune affectation de matériel n'est définie pour ce groupe : un administrateur la règle sur la fiche du chef de groupe (Administration → Comptes).")
    : articles.length
      ? `<div style="display:grid;${colonnes};gap:12px;padding:8px 14px;border-bottom:1px solid var(--c-23262d)">
          <span class="klabel">ARTICLE</span><span class="klabel">CATÉGORIE</span><span class="klabel" style="text-align:right">STOCK</span><span class="klabel">SORTI PAR</span></div>${articles.map(ligneArticle).join("")}`
      : vide("Aucun article du stock n'est affecté à « "+esc(etiquette)+" ».");

  return `
  <div style="flex:1;min-height:0;padding:20px 32px 40px;display:flex;flex-direction:column;gap:18px;min-width:0;overflow:auto">
    ${g.chef ? "" : `<div class="card" style="padding:11px 14px;font:400 12px/1.4 Inter,system-ui,sans-serif;color:var(--c-9aa2af)">Ce groupe n'a pas de chef pour l'instant : un administrateur le gère.</div>`}
    <div class="field" style="gap:8px"><span class="klabel">MEMBRES · ${membres.length}</span>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-items:start">${membres.map(carte).join("")}</div>
    </div>
    <div class="field" style="gap:8px"><span class="klabel">MISSIONS EN COURS · ${missionsEnCours.length}</span>
      ${missionsEnCours.length
        ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;align-items:start">${missionsEnCours.map(carteMission).join("")}</div>`
        : `<div class="card" style="padding:18px 16px;color:var(--c-6d7480);font:400 12px Inter,system-ui,sans-serif">Aucune mission en cours n'implique le groupe.</div>`}
    </div>
    <div class="field" style="gap:8px"><span class="klabel">DÉTENU OU PRÊTÉ DEPUIS PLUS DE 7 JOURS · ${longtemps.length}</span>
      <div class="card" style="overflow:hidden">${longtemps.length
        ? `<div class="stack">${longtemps.map(ligneLongtemps).join("")}</div>`
        : vide("Rien ne traîne : tout ce qui est sorti l'est depuis moins de 7 jours.")}</div>
    </div>
    <div class="field" style="gap:8px"><span class="klabel">MATÉRIEL DU GROUPE${etiquette ? " · "+esc(etiquette.toUpperCase()) : ""}</span>
      <div class="card" style="overflow:hidden">${materiel}</div>
    </div>
  </div>`;
}

/* Le contenu du sac d'un membre du groupe, en lecture : sa dotation, puis ce qu'il a
   emprunté ou sorti. */
function fenetreSacMembre(compte){
  const g = groupeMoi();
  if(!g || !g.membres.includes(compte)) return "";
  const lignes = possessionsDe(compte);
  const dotations = lignes.filter(l=>l.genre==="dotation");
  // Les plus récents d'abord : ce qui vient de sortir est ce qu'on cherche à voir.
  const autres = lignes.filter(l=>l.genre!=="dotation")
    .sort((a,b)=>String(b.iso||"").localeCompare(String(a.iso||"")));
  // Ce que la personne a rendu récemment : le journal du matériel, les cinq derniers retours.
  const retours = S.matLog.filter(e=>e.who===compte && e.kind==="RETOUR")
    .sort((a,b)=>String(b.iso||"").localeCompare(String(a.iso||""))).slice(0, 5);
  const chef = compte === g.chef;
  const fermer = ()=>setT({sacMembre:null});
  const colonne = (titre, liste, vide, bord, suite)=>`
    <div style="display:flex;flex-direction:column;gap:9px;min-width:0;padding:20px 24px;overflow:auto${bord?";border-left:1px solid var(--c-23262d)":""}">
      <span class="klabel">${titre} · ${liste.length}</span>
      ${liste.length ? listeLignes(liste) : '<span style="font:400 12px Inter,system-ui,sans-serif;color:var(--c-6d7480)">'+vide+'</span>'}
      ${suite||""}
    </div>`;
  const blocRetours = `
    <span class="klabel" style="margin-top:10px">DERNIERS RETOURS · ${retours.length}</span>
    ${retours.length ? `<div class="stack" style="border-radius:8px">${retours.map(e=>`
      <div style="padding:8px 11px;display:flex;align-items:center;gap:9px">
        <span class="badge ok" style="flex:none">RETOUR</span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font:500 12px/1.25 Inter,system-ui,sans-serif;color:var(--c-eef0f4);overflow-wrap:anywhere">${esc(e.item)}</span>
          <span style="font:400 12px/1.3 Inter,system-ui,sans-serif;color:var(--c-6d7480)">${e.mission&&e.mission!==SANS_MISSION?esc(e.mission)+" · ":""}${esc(depuisQuand(e.iso).replace(/^depuis /, "il y a "))}</span>
        </span>
        <span style="flex:none;font:600 12px Inter,system-ui,sans-serif;color:var(--c-9aa2af)">${e.qty} u.</span>
      </div>`).join("")}</div>`
    : '<span style="font:400 12px Inter,system-ui,sans-serif;color:var(--c-6d7480)">Aucun retour enregistré.</span>'}`;
  return `
  <div class="modal-back" ${on(e=>{ if(e.target.classList.contains("modal-back")) fermer(); })}>
    <div class="modal" role="dialog" aria-modal="true" style="width:980px;max-height:90vh">
      <div class="modal-head" style="flex-direction:row;align-items:center;gap:14px">
        ${avatar(compte, 52)}
        <span style="display:flex;flex-direction:column;gap:5px;flex:1;min-width:0">
          <span class="modal-title">${esc(compte)}${compte===OPERATOR?" · vous":""}</span>
          <span>${chef ? '<span class="badge violet">CHEF DE GROUPE</span>' : compte === g.adjoint ? '<span class="badge violet">ADJOINT</span>' : '<span class="badge mut">EFFECTIF</span>'}</span>
        </span>
      </div>
      <div class="modal-body" style="padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:hidden;min-height:0">
        ${colonne("SAC DE DOTATION", dotations, "Aucun matériel attribué.", false)}
        ${colonne("EMPRUNTS ET SORTIES EN COURS", autres, "Aucun emprunt ni sortie en cours.", true, blocRetours)}
      </div>
      <div class="modal-foot"><button class="btn-sec" ${on(fermer)}>Fermer</button></div>
    </div>
  </div>`;
}

/* La page de profil : le tableau de bord d'un compte. Chacun y retrouve ce qui
   le concerne — ce qu'il détient, ses missions, ce qu'il a fait récemment.
   Un administrateur peut ouvrir celui d'un autre compte depuis
   Administration > Comptes ; la page ne propose alors que la lecture. */
function pageProfil(){
  const compte = S.profilDe || auteurEffectif();
  const moi = compte === auteurEffectif();
  const lignes = possessionsDe(compte);
  const dotations = lignes.filter(l=>l.genre==="dotation");
  const emprunts = lignes.filter(l=>l.genre==="matériel");
  const telephones = lignes.filter(l=>l.genre==="téléphone" || l.genre==="réservation");
  const unites = lignes.reduce((n,l)=>n+l.qty, 0);

  // Missions du compte : responsable, membre d'une équipe, ou porteur d'un emprunt.
  const missions = new Map();
  const note = (nom, role)=>{
    if(!nom || nom===SANS_MISSION) return;
    const m = missions.get(nom) || new Set();
    m.add(role); missions.set(nom, m);
  };
  S.missions.forEach(m=>{ if(gestionnairesDe(m.name).includes(compte)) note(m.name, "Gestion"); });
  S.equipes.forEach(e=>{ if((e.membres||[]).includes(compte)) note(e.mission, "Effectif · "+e.nom); });
  Object.keys(S.matRes).forEach(id=>(S.matRes[id]||[]).forEach(r=>{
    if(!r.returned && r.by===compte) note(r.mission, "Emprunts");
  }));
  const mesMissions = Array.from(missions.keys())
    .filter(n=>!missionArchived(n))
    .map(n=>({nom:n, st:statutMission(n), roles:Array.from(missions.get(n)),
              date:(S.missions.find(m=>m.name===n)||{}).date||""}))
    .sort((a,b)=>{
      const rang = st => st==="EN COURS" ? 0 : st==="PRÉVUE" ? 1 : 2;
      return rang(a.st)-rang(b.st) || a.nom.localeCompare(b.nom);
    });
  const actives = mesMissions.filter(m=>m.st==="EN COURS" || m.st==="PRÉVUE").length;

  // Activité récente : matériel et téléphones, du plus récent au plus ancien.
  const activite = [
    ...S.matLog.filter(e=>e.who===compte).map(e=>({iso:e.iso, texte:e.kind+" · "+e.qty+" × "+e.item, ctx:e.mission&&e.mission!==SANS_MISSION?e.mission:""})),
    ...S.movements.filter(m=>m.user===compte).map(m=>({iso:m.iso, texte:m.kind+" · "+m.label, ctx:m.loc||""})),
  ].sort((a,b)=>String(b.iso||"").localeCompare(String(a.iso||""))).slice(0, 10);

  const tuile = (valeur, libelle, couleur)=>`
    <div class="card" style="padding:16px 18px">
      <div class="over">${libelle}</div>
      <div class="num" style="font-size:28px;font-weight:700;margin-top:4px${couleur?";color:"+couleur:""}">${valeur}</div>
    </div>`;
  // « SAC DE DOTATION · 3 » devient un titre « Sac de dotation » et un compte « 3 ».
  const section = (titre, contenu, action)=>{
    const m = /^(.*) · (\d+)$/.exec(titre);
    const nom = m ? m[1] : titre;
    const t = nom.charAt(0) + nom.slice(1).toLowerCase();
    return `
    <section class="card" aria-label="${esc(t)}" style="min-width:0;overflow:hidden">
      <div class="chead"><h2>${esc(t)}</h2>${m?`<span class="count">${m[2]}</span>`:""}${action||""}</div>
      ${contenu}
    </section>`;
  };
  const vide = texte=>`<div class="item" style="color:var(--muted);font-size:13px">${texte}</div>`;
  const ligneStock = l=>`
    <div class="item">
      <div style="display:flex;gap:8px;align-items:baseline">
        <div style="flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere">${esc(l.libelle)}</div>
        <span class="num" style="font-weight:600">${l.qty} u.</span>
      </div>
      <div style="font-size:12px;color:${l.manquant?"var(--danger)":"var(--muted)"};margin-top:3px;overflow-wrap:anywhere">${l.detail?esc(l.detail)+" · ":""}${esc(l.contexte)}${l.iso?" · "+esc(depuisQuand(l.iso)):""}</div>
    </div>`;
  const pile = liste=>liste.map(ligneStock).join("");

  const aRecommander = consommablesARecommander();
  const aujourdhuiJ = aujourdhui();
  const missionsDuJour = mesMissions.filter(m=>m.st==="EN COURS" || m.date===aujourdhuiJ);
  const enRetard = lignes.filter(l=>{
    if(l.genre==="dotation" || l.genre==="réservation") return false;
    const d = quand(l.iso);
    return d && (Date.now() - d.getTime()) >= 7*86400000;
  }).sort((a,b)=>String(a.iso).localeCompare(String(b.iso)));
  const mesEquipes = S.equipes.filter(e=>(e.membres||[]).includes(compte));
  const appareils = S.refs.reduce((n,r)=>n+r.qty, 0);

  const liste = (elements, rendu)=>elements.map(rendu).join("");
  const rangee = (principal, secondaire, droite)=>`
    <div class="item" style="display:flex;align-items:center;gap:10px">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;overflow-wrap:anywhere">${principal}</div>
        ${secondaire?`<div style="font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere">${secondaire}</div>`:""}
      </div>${droite||""}
    </div>`;

  const contenus = {
    compteurs: ()=>`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px">
      ${tuile(unites, "Unités détenues")}
      ${tuile(dotations.length, "Lignes dans le sac")}
      ${tuile(emprunts.length + telephones.length, "Sorties en cours")}
      ${tuile(actives, "Missions actives")}
    </div>`,
    etat_stock: ()=>`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px">
      ${tuile(appareils, "Appareils en armoire")}
      ${tuile(S.refs.length, "Références actives")}
      ${tuile(S.materiel.length, "Articles de matériel")}
      ${tuile(aRecommander.length, "À recommander", aRecommander.length?"var(--warn)":"")}
    </div>`,
    a_recommander: ()=>section("À RECOMMANDER · "+aRecommander.length,
      aRecommander.length ? liste(aRecommander, g=>rangee(esc(g.nom), "", `
          <span class="num" style="font-size:12px;color:var(--muted)">${g.stock} en stock · seuil ${g.seuil}</span>
          <span class="badge b-warn">À recommander</span>`)) : vide("Rien à recommander pour le moment."),
      `<button class="btn btn-sm" ${on(()=>set({page:"admin", adminTab:"consommables"}))}>Ouvrir les consommables</button>`),
    stock_bas: ()=>section("STOCK BAS · "+aRecommander.length,
      aRecommander.length ? liste(aRecommander, g=>rangee(esc(g.nom), g.stock+" en stock · seuil "+g.seuil,
          `<span class="badge b-warn">Bas</span>`)) : vide("Aucun consommable sous son seuil.")),
    sac: ()=>section("SAC DE DOTATION · "+dotations.length,
      dotations.length ? pile(dotations) : vide("Aucun matériel attribué dans le sac.")),
    sorties: ()=>section("SORTIES EN COURS · "+(emprunts.length+telephones.length),
      (emprunts.length+telephones.length) ? pile([...emprunts, ...telephones]) : vide("Rien n'est sorti à ce nom.")),
    retard: ()=>section("DÉTENU DEPUIS PLUS DE 7 JOURS · "+enRetard.length,
      enRetard.length ? pile(enRetard) : `<div class="item" style="display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--ok);flex-shrink:0"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Rien ne traîne : tout ce qui est sorti l'est depuis moins de 7 jours.</div>`),
    missions: ()=>section("MISSIONS · "+mesMissions.length,
      mesMissions.length ? liste(mesMissions, m=>`
          <div class="item" style="display:flex;align-items:center;gap:10px">
            <div style="flex:1;min-width:0">
              <div style="font-weight:600;overflow-wrap:anywhere">${esc(m.nom)}</div>
              <div style="font-size:12px;color:var(--muted)">${esc(m.roles.join(" · "))}${m.date?" · prévue le "+esc(m.date.split("-").reverse().join("/")):""}</div>
            </div>
            <span class="badge ${classeStatut(m.st)}">${m.st}</span>
            <a class="btn btn-sm" href="${esc(adresseMission(m.nom))}" target="_blank" rel="noopener">Tableau</a>
          </div>`) : vide("Aucune mission pour ce compte."),
      `<a href="#" style="font-size:12.5px;font-weight:600" ${on(e=>{ e.preventDefault(); set({page:"missions"}); })}>Tout voir</a>`),
    missions_jour: ()=>section("AUJOURD'HUI · "+missionsDuJour.length,
      missionsDuJour.length ? liste(missionsDuJour, m=>rangee(esc(m.nom), esc(m.roles.join(" · ")),
          `<span class="badge ${classeStatut(m.st)}">${m.st}</span>
           <a class="btn-mini hblue" href="${esc(adresseMission(m.nom))}" target="_blank" rel="noopener">Tableau</a>`))
        : vide("Aucune mission en cours ni prévue aujourd'hui.")),
    equipes: ()=>section("MES ÉQUIPES · "+mesEquipes.length,
      mesEquipes.length ? liste(mesEquipes, e=>rangee(esc(e.nom)+" <span style=\"color:var(--muted);font-weight:400\">· "+esc(e.mission)+"</span>",
          esc((e.membres||[]).filter(m=>m!==compte).join(", ") || "Vous êtes seul(e) dans cette équipe")))
        : vide("Vous n'êtes membre d'aucune équipe.")),
    activite: ()=>section("ACTIVITÉ RÉCENTE",
      activite.length ? liste(activite, a=>{
          // « SORTIE · 1 × T9 » : le type en badge, puis ce qui a bougé.
          const [type, ...reste] = String(a.texte).split(" · ");
          return `<div class="item" style="display:flex;align-items:center;gap:10px;padding-top:9px;padding-bottom:9px">
            <span class="badge ${kindCls(type)}" style="min-width:74px;justify-content:center">${esc(kindLibelle(type))}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;overflow-wrap:anywhere">${esc(reste.join(" · "))}</div>
              ${a.ctx?`<div style="font-size:12px;color:var(--muted)">${esc(a.ctx)}</div>`:""}
            </div>
            <span class="num" style="font-size:12px;color:var(--muted)">${esc(jourMois(a.iso))}</span>
          </div>`; })
        : vide("Aucune activité enregistrée.")),
    prets: ()=>section("MES PRÊTS · "+S.pret.prets.length,
      S.pret.prets.length ? liste(S.pret.prets, p=>rangee(
          esc(p.libelle)+" × "+p.quantite+(p.detail?` <span style="color:var(--c-6d7480);font-weight:400">· ${esc(p.detail)}</span>`:""),
          "à "+esc(p.a)+(p.mission&&p.mission!==SANS_MISSION?" · "+esc(p.mission):"")+(p.iso?" · "+esc(depuisQuand(p.iso)):"")
            +(p.forcePar?" · <b style=\"font-weight:600;color:var(--warn)\">prêt forcé par "+esc(p.forcePar)+"</b>":""),
          `<button class="btn btn-sm" title="Le matériel est revenu dans mon sac" ${on(()=>agir("pret.rendu",{id:p.id}))}>Marquer rendu</button>`))
        : vide("Rien n'est prêté en ce moment.")),
    demandes: ()=>section("MES DEMANDES · "+S.pret.emises.length,
      S.pret.emises.length ? liste(S.pret.emises, d=>rangee(
          esc(d.libelle)+" × "+d.quantite+" <span style=\"color:var(--c-6d7480);font-weight:400\">→ "+esc(d.a)+"</span>",
          (d.mission&&d.mission!==SANS_MISSION?esc(d.mission):"sans mission")+(d.motif?" · « "+esc(d.motif)+" »":"")
            +(d.statut==="REFUSÉE"&&d.raison?" · <b style=\"font-weight:600\">Raison : "+esc(d.raison)+"</b>":""),
          `<span class="badge ${classeDemande(d.statut)}">${d.statut}</span>`
            +(d.statut==="EN ATTENTE"?` <button class="btn btn-sm" ${on(()=>agir("pret.annuler",{id:d.id}))}>Annuler</button>`:"")))
        : vide("Aucune demande récente."),
      `<button class="btn btn-sm btn-ghost" style="color:var(--gold)" ${on(()=>ouvrirDemandePret("direct"))}>+ Nouvelle</button>`),
    groupe: ()=>{
      const eff = effectifsDuGroupe();
      return section("MON GROUPE · "+eff.length,
        eff.length ? liste(eff, c=>{
          const lignesC = possessionsDe(c);
          const unites = lignesC.reduce((n,l)=>n+l.qty, 0);
          const attente = (S.pret.recuesGroupe||[]).filter(d=>d.pour===c).length;
          return rangee(esc(c)+(attente?` <span class="badge warn" title="Demandes de prêt en attente pour ${esc(c)}">${attente}</span>`:""),
            unites+" unité"+(unites>1?"s":"")+" détenue"+(unites>1?"s":"")+" · "+lignesC.length+" ligne"+(lignesC.length>1?"s":""),
            `<button class="btn btn-sm" ${on(()=>set({page:"profil", profilDe:c}))}>Profil</button>
             <button class="btn btn-sm" ${on(()=>ouvrirDotation(c))}>Sac</button>`);
        }) : vide("Aucun effectif n'est rattaché à votre groupe : un administrateur les rattache à votre compte."));
    },
    acces_rapides: ()=>section("ACCÈS RAPIDES", `<div class="item" style="display:flex;flex-wrap:wrap;gap:8px">
      ${[["stock","Stock de téléphone"],["armoire","Plan de l'armoire"],["materiel","Stock de matériel"],["missions","Missions"],["journal","Journal"],
         ...(ADMIN ? [["admin","Administration"]] : [])]
        .map(([page,nom])=>`<button class="btn" ${on(()=>set({page}))}>${nom}</button>`).join("")}
    </div>`),
  };

  /* Disposition : la sienne pour soi, celle par défaut pour le profil d'un autre
     (on n'a de lui que les données, pas ses réglages). */
  const edition = moi && !!S.profilEdition;
  const disposition = moi ? dispositionProfil()
    : dispositionDefaut().filter(w=>!WIDGETS[w.id].admin && !WIDGETS[w.id].perso);
  const cartes = disposition.map((w, i)=>{
    const def = WIDGETS[w.id];
    const barre = edition ? `
      <div class="barre-widget">
        <span class="poignee" title="Glisser pour déplacer">⠿</span>
        <span class="over" style="flex:1;min-width:80px">${esc(def.titre)}</span>
        <button class="btn btn-sm" aria-label="Monter" ${i===0?"disabled":""} ${on(()=>widgetDeplacer(w.id,-1))}>↑</button>
        <button class="btn btn-sm" aria-label="Descendre" ${i===disposition.length-1?"disabled":""} ${on(()=>widgetDeplacer(w.id,1))}>↓</button>
        <button class="btn btn-sm" ${on(()=>widgetTaille(w.id))}>${w.taille==="l"?"Réduire":"Élargir"}</button>
        <button class="btn btn-sm btn-danger" ${on(()=>widgetMasquer(w.id))}>Masquer</button>
      </div>` : "";
    return `<div data-widget="${w.id}" ${edition?'draggable="true"':""}
      style="min-width:0;${w.taille==="l"?"grid-column:1/-1;":""}${edition?"border:1px dashed var(--muted);border-radius:12px;padding:8px;cursor:grab;display:flex;flex-direction:column;gap:8px":""}">
      ${barre}${contenus[w.id]()}</div>`;
  }).join("");

  // Les widgets que la personne n'affiche pas, proposés à l'ajout en mode édition.
  const presents = new Set(disposition.map(w=>w.id));
  const absents = Object.keys(WIDGETS).filter(id=>!presents.has(id) && widgetDisponible(id));
  const palette = edition ? `
    <section class="card" aria-label="Widgets disponibles" style="padding:16px 18px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <h2 style="margin:0;font-size:13.5px;font-weight:700;flex:1">Widgets disponibles <span class="count">${absents.length}</span></h2>
        <button class="btn btn-sm" ${on(()=>{ if(confirm("Revenir à la disposition par défaut ?")) enregistrerDisposition(dispositionDefaut().filter(w=>!WIDGETS[w.id].admin || ADMIN)); })}>Disposition par défaut</button>
        <button class="btn btn-sm btn-primary" ${on(()=>setT({profilEdition:false}))}>Terminer</button>
      </div>
      ${absents.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px">
        ${absents.map(id=>`
          <div style="border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;background:var(--raised)">
            <span style="flex:1;min-width:0">
              <span style="display:block;font-weight:600;font-size:13px">${esc(WIDGETS[id].titre)}</span>
              <span style="display:block;font-size:12px;color:var(--muted);margin-top:2px">${esc(WIDGETS[id].desc)}</span>
            </span>
            <button class="btn btn-sm" ${on(()=>widgetAjouter(id))}>+ Ajouter</button>
          </div>`).join("")}
      </div>` : `<span style="font-size:13px;color:var(--muted)">Tous les widgets sont affichés.</span>`}
    </section>` : "";

  /* Les demandes de prêt qui attendent une réponse : dans mon sac, ou dans ceux de mon groupe. */
  const carteDemandes = (demandes, titre, pourGroupe)=>`
    <section class="card" aria-label="${esc(titre)}" style="padding:16px 18px;display:flex;flex-direction:column;gap:12px;border-color:var(--warn);background:var(--warn-bg)">
      <div style="display:flex;align-items:center;gap:10px">
        <span class="badge b-warn" style="background:transparent;padding:0;font-size:14px">${demandes.length}</span>
        <h2 style="margin:0;font-size:14px;font-weight:700">${esc(titre)}</h2>
      </div>
      ${demandes.map(d=>`
        <div style="display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)">
          <div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">
            <span style="flex:1;min-width:220px">
              <span style="display:block;font-weight:600"><b>${esc(d.de)}</b> ${pourGroupe?"demande":"vous demande"} ${d.quantite} × ${esc(d.libelle)}${pourGroupe?` à <b style="color:var(--warn)">${esc(d.pour)}</b>`:""}</span>
              ${d.detail?`<span style="display:block;font-size:12px;color:var(--muted)">${esc(d.detail)}</span>`:""}
              <span style="display:block;font-size:12px;color:var(--muted)">${d.mission&&d.mission!==SANS_MISSION?"Pour la mission « "+esc(d.mission)+" »":"Hors mission"} · ${esc(depuisQuand(d.iso))}${d.disponible<d.quantite?` · <b style="color:var(--danger);font-weight:600">il ne reste que ${d.disponible} de disponible</b>`:""}${pourGroupe?` · vous répondez à la place de ${esc(d.pour)}`:""}</span>
              ${d.motif?`<span style="display:block;font-size:13px;color:var(--soft)">« ${esc(d.motif)} »</span>`:""}
            </span>
            ${(S.refusPret && S.refusPret.id===d.id) ? "" : `
            <span style="display:flex;gap:7px;flex:none">
              <button class="btn btn-sm btn-primary" ${d.disponible<d.quantite?"disabled":""} ${on(()=>agir("pret.accepter",{id:d.id}))}>Accepter</button>
              <button class="btn btn-sm" ${on(()=>setT({refusPret:{id:d.id, raison:""}}))}>Refuser</button>
            </span>`}
          </div>
          ${(S.refusPret && S.refusPret.id===d.id) ? `
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <input class="inp" data-k="refus-${d.id}" style="flex:1;min-width:200px" maxlength="300" placeholder="Raison du refus (facultatif)" value="${esc(S.refusPret.raison)}" ${oni(e=>{S.refusPret.raison=e.target.value;})}>
            <button class="btn btn-sm" ${on(confirmerRefusPret)}>Confirmer le refus</button>
            <button class="btn btn-sm btn-ghost" ${on(()=>setT({refusPret:null}))}>Annuler</button>
          </div>` : ""}
        </div>`).join("")}
    </section>`;

  /* Les prêts à des personnes sans compte : les miens, et ceux dont je suis alerté (mon
     groupe, ou tous pour un administrateur). Un prêt en retard colore la carte. */
  const carteExterne = ()=>{
    const tous = S.pretsExternes||[];
    const ouverts = tous.filter(x=>!x.rendu), rendus = tous.filter(x=>x.rendu);
    const retards = ouverts.filter(x=>x.enRetard);
    const peutRendre = x=>ADMIN || x.preteur===OPERATOR || effectifsDuGroupe().includes(x.preteur);
    const ligne = x=>`
      <div class="item" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap${x.enRetard?";background:var(--danger-bg)":""}">
        <div style="flex:1 1 240px;min-width:0">
          <div style="font-weight:600;overflow-wrap:anywhere">${x.quantite} × ${esc(x.article)} <span style="color:var(--muted);font-weight:400">→ ${esc(x.emprunteur)}</span></div>
          <div style="font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere">${x.preteur!==OPERATOR?"Prêté par <b style=\"font-weight:600\">"+esc(x.preteur)+"</b> · ":""}${x.mission&&x.mission!==SANS_MISSION?"mission « "+esc(x.mission)+" »":"hors mission"}${x.commentaire?" · « "+esc(x.commentaire)+" »":""}</div>
        </div>
        <span style="flex:none;width:250px;display:flex;align-items:center;justify-content:flex-end;gap:8px">
        ${x.rendu ? `<span class="badge b-ok">Rendu</span>`
          : x.enRetard ? `<span class="num" style="font-size:12px;color:var(--muted)">à rendre le ${esc(dateCourte(x.echeance))}</span><span class="badge b-danger">En retard · ${joursDeRetard(x.echeance)} j</span>`
          : x.echeance ? `<span class="badge b-neutral">Avant le ${esc(dateCourte(x.echeance))}</span>` : `<span class="badge b-neutral">Sans échéance</span>`}
        </span>
        <span style="flex:none;width:158px;display:flex;align-items:center;justify-content:flex-start;gap:6px">
        ${!x.rendu && peutRendre(x) ? `<button class="btn btn-sm" ${on(()=>agir("pret.externe.rendre",{id:x.id}))}>Marquer rendu</button>` : ""}
        ${x.preteur===OPERATOR && !x.rendu ? `<button class="btn btn-sm btn-ghost" title="Retirer cette déclaration (faite par erreur)" aria-label="Retirer la déclaration" ${on(()=>{ if(confirm("Retirer cette déclaration de prêt ?")) agir("pret.externe.supprimer",{id:x.id}); })}>✕</button>` : ""}
        </span>
      </div>`;
    return `
    <section class="card" aria-label="Prêts à des personnes sans compte" style="flex:none;min-width:0;overflow:hidden${retards.length?";border-color:var(--danger)":""}">
      <div class="chead"><h2>Prêts à l'extérieur</h2><span class="count">${ouverts.length}</span>
        ${retards.length ? `<span class="badge b-danger">${retards.length} en retard</span>` : ""}
        <button class="btn btn-sm btn-ghost" style="color:var(--gold);margin-left:auto" ${on(ouvrirPretExterne)}>+ Déclarer un prêt</button></div>
      ${retards.length ? `<div class="item" style="color:var(--danger);font-size:13px;font-weight:600">${retards.length>1?retards.length+" prêts n'ont pas été rendus à temps.":"Un prêt n'a pas été rendu à temps."}</div>` : ""}
      ${ouverts.length ? ouverts.map(ligne).join("") : `<div class="item" style="color:var(--muted);font-size:13px">Aucun prêt à une personne sans compte en cours.</div>`}
      ${rendus.length ? `<div class="item" style="font-size:12px;color:var(--muted)">Rendus récemment</div>${rendus.map(ligne).join("")}` : ""}
    </section>`;

function carteComptesAdmin(){
  const q = (S.adminCompteQuery||"").trim().toLowerCase();
  const detenu = new Map(COMPTES.map(c=>[c, possessionsDe(c)]));

  // Un emprunt peut porter un nom qui n'est plus dans la liste des comptes —
  // compte supprimé, ou donnée reprise de GestiStock_v0. L'omettre ferait
  // disparaître du matériel bel et bien sorti : on lui fait sa carte.
  Object.keys(S.matRes).forEach(id=>(S.matRes[id]||[]).forEach(r=>{
    if(!r.returned && r.by && !detenu.has(r.by)) detenu.set(r.by, possessionsDe(r.by));
  }));
  S.refs.forEach(ref=>{
    [...(ref.outs||[]), ...(ref.reservations||[])].forEach(x=>{
      if(x.who && !detenu.has(x.who)) detenu.set(x.who, possessionsDe(x.who));
    });
  });

  // Les comptes désactivés ne sont pas dans COMPTES : on les prend dans les rôles.
  Object.keys(S.comptesRoles||{}).forEach(c=>{ if(!detenu.has(c)) detenu.set(c, possessionsDe(c)); });
  const inactif = c => !!(S.comptesRoles||{})[c] && !S.comptesRoles[c].actif;

  let comptes = Array.from(detenu.entries());
  if(!S.adminComptesInactifs) comptes = comptes.filter(([c])=>!inactif(c));
  if(S.adminComptesRole) comptes = comptes.filter(([c])=>((S.comptesRoles||{})[c]||{}).role===S.adminComptesRole);
  if(S.adminComptesActifs) comptes = comptes.filter(([, l])=>l.length);
  if(q) comptes = comptes.filter(([c, l])=> c.toLowerCase().includes(q)
    || l.some(x=>(x.libelle+" "+x.detail+" "+x.contexte).toLowerCase().includes(q)));

  // Ceux qui détiennent quelque chose d'abord, le plus ancien emprunt en tête :
  // c'est l'ordre dans lequel on relance.
  comptes.sort((a,b)=>{
    if(!a[1].length !== !b[1].length) return a[1].length ? -1 : 1;
    if(a[1].length && b[1].length)
      return String(a[1][0].iso||"").localeCompare(String(b[1][0].iso||""));
    return a[0].localeCompare(b[0], "fr");
  });

  const avec = Array.from(detenu.values()).filter(l=>l.length).length;
  const unites = Array.from(detenu.values())
    .reduce((n,l)=>n + l.reduce((s,x)=>s+x.qty, 0), 0);

  return `
  <div class="card" style="overflow:hidden;display:${S.adminTab==="comptes"?"block":"none"}">
    <div style="padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:3px">
        <h2 style="margin:0;font-size:15px;font-weight:700">Comptes</h2><p style="margin:2px 0 0;font-size:12.5px;color:var(--muted)">${detenu.size} compte${detenu.size>1?"s":""} · ${avec} ${avec>1?"détiennent":"détient"} quelque chose · ${unites} unité${unites>1?"s":""} en circulation</p>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-sm btn-primary" type="button" ${on(()=>setT({compteNouveau:{identifiant:"", groupe:""}}))}>+ Nouveau compte</button>
        ${chip("Tous", !S.adminComptesRole, ()=>setT({adminComptesRole:""}))}
        ${chip("Admins", S.adminComptesRole==="admin", ()=>setT({adminComptesRole:"admin"}))}
        ${chip("Chefs", S.adminComptesRole==="chef de groupe", ()=>setT({adminComptesRole:"chef de groupe"}))}
        ${chip("Effectifs", S.adminComptesRole==="effectif", ()=>setT({adminComptesRole:"effectif"}))}
        ${chip(S.adminComptesActifs?"Seulement ceux qui détiennent":"Même sans possession", S.adminComptesActifs, ()=>setT({adminComptesActifs:!S.adminComptesActifs}))}
        ${chip("Afficher les désactivés", S.adminComptesInactifs, ()=>setT({adminComptesInactifs:!S.adminComptesInactifs}))}
      </div>
    </div>
    <div style="padding:12px 16px;border-bottom:1px solid var(--c-23262d);display:flex;flex-direction:column;gap:9px">
      <div style="display:flex;align-items:center;gap:9px">
        <span class="klabel">GROUPES · ${(S.groupes||[]).length}</span>
        <button class="btn-mini hblue" style="margin-left:auto" ${on(()=>setT({groupeEdit:{id:null, nom:"", materiel:""}}))}>+ Nouveau groupe</button>
      </div>
      ${(S.groupes||[]).length ? `<div style="display:flex;flex-wrap:wrap;gap:8px">${S.groupes.map(g=>`
        <button class="btn-sec" style="display:flex;align-items:center;gap:8px;padding:7px 11px" ${on(()=>setT({groupeEdit:{id:g.id}}))}>
          <b style="font:600 12px Inter,system-ui,sans-serif">${esc(g.nom)}</b>
          <span style="font:400 12px Inter,system-ui,sans-serif;color:var(--c-6d7480)">${g.membres.length} membre${g.membres.length>1?"s":""} · ${g.chef?"chef "+esc(g.chef):"sans chef"}${g.adjoint?" · adjoint "+esc(g.adjoint):""}${g.materiel?" · matériel "+g.materiel:""}</span>

    ${comptes.length

      : `<div style="padding:34px 16px;text-align:center;color:var(--c-6d7480);font:400 12px Inter,system-ui,sans-serif">${COMPTES.length?"Aucun compte correspondant.":"Le serveur n'a transmis aucun compte."}</div>`}
  </div>`;
}

/* Aperçu d'un template sur la page « Missions ».

   Il annonce ce que la création va sortir du stock — le refus du serveur ne
   doit pas être la première nouvelle — et, sur les lignes que le template a
   laissées ouvertes, il laisse désigner l'exemplaire réellement emporté. Le

  const lignes = t.items.map(ligne=>{
    const candidats = candidatsLigneTemplate(ligne);
    const dispo = candidats.length
      ? candidats.reduce((n,m)=>n+matAvailable(m.id||m.name), 0) : null;

    const deplie = !!S._mDeplie[ligne.ligne];
    const etat = designesLigne(ligne);
    const manque = dispo===null || dispo < ligne.qty;

    const exemplaires = !(choisissable && deplie) ? "" : candidats.map(m=>{
      const id = m.id||m.name;
      const libre = matAvailable(id);
      const pose = Number(etat.par[id]||0);
      const detail = exemplaireDetail(m) || "Sans identifiant";
      const champ = libre<=1
        ? `<input type="checkbox" aria-label="J'ai pris ${esc(detail)}" ${pose?"checked":""} ${libre?"":"disabled"} ${ong(()=>poserChoixLigne(ligne, id, pose?0:1))} style="width:15px;height:15px;flex:none;accent-color:var(--gold);cursor:pointer">`
        : `<input class="inp" data-k="mchoix-${esc(ligne.ligne)}-${esc(id)}" type="number" min="0" max="${Math.min(libre, ligne.qty)}" style="width:68px;padding:5px 7px;flex:none" value="${esc(pose||"")}" placeholder="0" ${oni(e=>poserChoixLigne(ligne, id, e.target.value))}>`;
      return `
      <div style="display:flex;align-items:center;gap:10px;padding:5px 0 5px 14px">
        <span style="flex:1;min-width:0;font:400 12px Inter,system-ui,sans-serif;color:${libre?"var(--c-9aa2af)":"var(--c-5f6672)"};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(detail)}</span>
        <span style="flex:none;font:400 12px Inter,system-ui,sans-serif;color:var(--c-6d7480)">${libre} / ${m.qty} dispo.</span>
        ${champ}
      </div>`;
    }).join("");

    const pied = !(choisissable && deplie) ? "" : (
      etat.trop
        ? `<span style="font:400 12px/1.4 Inter,system-ui,sans-serif;color:var(--c-ef8b83);padding-left:14px">Vous avez désigné ${etat.total} exemplaire(s) pour une ligne qui n'en demande que ${ligne.qty}.</span>`
        : etat.reste > 0
          ? `<span style="font:400 12px/1.4 Inter,system-ui,sans-serif;color:var(--c-6d7480);padding-left:14px">${etat.reste} restant(s) servi(s) automatiquement.</span>`
          : `<span style="font:400 12px/1.4 Inter,system-ui,sans-serif;color:var(--c-8fb4ff);padding-left:14px">Les ${ligne.qty} exemplaire(s) sont désignés.</span>`);

    return `
    <div style="display:flex;flex-direction:column;gap:2px">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="flex:1;min-width:0;font:400 12px Inter,system-ui,sans-serif;color:${manque||etat.trop?"var(--c-ef8b83)":"var(--c-c3c9d3)"};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(libelleLigneTemplate(ligne))}</span>

      </div>
      ${exemplaires}

  }).join("");

  const bloquant = t.items.some(ligne=>{
    const dispo = dispoLigneTemplate(ligne);
    return dispo===null || dispo < ligne.qty || designesLigne(ligne).trop;
  });
  const choisissables = t.items.filter(ligne=>
    ligne.genre==="type" && candidatsLigneTemplate(ligne).length > 1).length;

  return `

function templateCreable(t){

/* ---------- packs ----------

   Un pack est une malette : plusieurs articles rangés ensemble, qu'on
   emporte d'un seul geste. Miroir de la section « Packs » de
   coeur/regles.py — le serveur reste seul juge, ces fonctions ne servent
   qu'à ne pas proposer ce qu'il refuserait.

   Un pack ne réserve rien : composer une malette ne retire aucun article du
   stock. Ce qui est « dehors » se lit dans les emprunts, qui portent le nom
   du pack d'où ils viennent. */

/* Ce qu'un panier réclame par article, malettes dépliées. Sans ce cumul,
   l'écran laisserait valider ce que le serveur refusera : deux lignes visant
   le même article paraissent tenir chacune dans le stock. */
function demandePanier(b){
  const total = {};
  (b.packs||[]).forEach(nom=>{
    const pk = S.packs.find(x=>x.name===nom);
    if(pk) pk.items.forEach(i=>{ if(!i.manquant) total[i.id] = (total[i.id]||0) + i.qty; });
  });
  Object.keys(b.qtys||{}).forEach(nm=>{
    total[nm] = (total[nm]||0) + Math.max(1, Number(b.qtys[nm])||1);
  });
  return total;
}

/* Les articles que le panier réclame au-delà du disponible. */
function manquesPanier(b){
  const demande = demandePanier(b);
  return Object.keys(demande).filter(nm=>demande[nm] > matAvailable(nm));
}

function packSorties(nom){
  const lignes = [];
  Object.keys(S.matRes).forEach(id=>(S.matRes[id]||[]).forEach(r=>{
    if(r.pack===nom && !r.returned) lignes.push({id, qty:r.qty, mission:r.mission, by:r.by});
  }));
  return lignes;
}

/* Trois états, et pas deux : une malette dont il manque une pièce n'est ni
   rangée ni partie, et c'est précisément le cas qu'il faut voir. */
function packEtat(pack){
  const dehors = packSorties(pack.name);
  if(!dehors.length) return "range";
  const attendus = pack.items.filter(i=>!i.manquant).length;
  return dehors.length >= attendus ? "sorti" : "partiel";
}

/* Ce qui manquerait pour sortir la malette entière, telle qu'elle est. */
function packManquants(pack){
  return pack.items.filter(i=>i.manquant || matAvailable(i.id) < i.qty);
}

function packDisponible(pack){
  return pack.items.length>0 && packEtat(pack)==="range" && !packManquants(pack).length;
}

/* Suivi des consommables, dans l'onglet d'administration.

   Deux choses a voir, et elles ne se deduisent pas l'une de l'autre : ou en
   est le stock — avec son seuil d'alerte, la seule valeur que cet ecran
   laisse regler —, et ce qui a ete consomme, par quelle mission. Le journal
   ci-dessous est la vue dediee du journal du materiel, filtree sur le genre
   CONSOMME : une seule source de verite, deux lectures. */
function carteConsommables(){
  const q = (S.adminConsoQuery||"").trim().toLowerCase();
  const articles = S.materiel
    .filter(m=>m.cat===CATEGORIE_CONSOMMABLE)
    .filter(m=>!q || (m.name+" "+(m.etiquette||"")+" "+(m.numeroSerie||"")).toLowerCase().includes(q));
  // Les exemplaires de même nom se regroupent sous une seule ligne : le détail
  // par numéro de série n'apparaît qu'une fois le groupe déplié.
  const groupes = [];
  articles.forEach(m=>{
    let g = groupes.find(x=>x.nom===m.name);
    if(!g){ g = {nom:m.name, membres:[]}; groupes.push(g); }
    g.membres.push(m);
  });
  // Le seuil se règle par groupe, et l'alerte compare le stock cumulé du
  // groupe : les exemplaires d'un même nom partagent la même valeur.
  const seuilDe = g=>Math.max(0, ...g.membres.map(m=>m.seuil||0));
  const stockDe = g=>g.membres.reduce((t,m)=>t+m.qty, 0);
  const basGroupe = g=>seuilDe(g)>0 && stockDe(g)<=seuilDe(g);
  const alertes = groupes.filter(basGroupe);
  const consoSize = tailleAdmin("adminConsoSize", groupes.length);
  const consoPages = Math.max(1, Math.ceil(groupes.length/consoSize));
  const consoPage = Math.min(Math.max(0, Number(S.adminConsoPage)||0), consoPages-1);
  S.adminConsoPage = consoPage;

  const champSeuil = g=>`<input class="inp" data-k="seuil-${esc(g.nom)}" type="number" min="0" style="width:64px;padding:5px 7px;font-size:12px;border-radius:6px;text-align:right"
      aria-label="Seuil d'alerte de ${esc(g.nom)}" value="${seuilDe(g)}" ${ong(e=>agir("materiel.seuil",{libelle:g.nom, seuil:Math.max(0, Number(e.target.value)||0)}))}>`;

  const ligne = (m, enfant, dernier)=>{
    const g = {nom:m.name, membres:[m]};
    const id = m.id||m.name;
    const sorti = (S.matRes[id]||[]).filter(r=>!r.returned).reduce((s,r)=>s+r.qty,0);
    // Dans un groupe, la consommation se lit par exemplaire : l'identité est
    // recopiée au journal, c'est elle qui permet de les distinguer.
    const consomme = enfant

/* ---------- equipes d'une mission ----------

   Une mission se divise souvent en groupes qui partent chacun de leur cote.
   Une equipe porte deux choses distinctes : ses membres, qui sont un etat
   courant, et son materiel, qui est attribue ligne par ligne sur les emprunts.

   Le nom d'une equipe n'est unique qu'a l'interieur de sa mission : deux
   missions peuvent chacune avoir leur « Equipe A ». Toutes les recherches se
   font donc sur le couple. */

function equipesDe(mission){
  if(!mission || mission===SANS_MISSION) return [];
  return S.equipes.filter(e=>e.mission===mission)
                  .sort((a,b)=>(a.ordre-b.ordre) || a.nom.localeCompare(b.nom));
}

function equipeExiste(mission, nom){
  return equipesDe(mission).some(e=>e.nom===nom);
}

/* Le selecteur d'equipe des modales d'emprunt. Vide quand la mission n'a pas
   d'equipes : proposer un choix a une seule option serait du bruit. */
function selecteurEquipe(mission, choisie, poser){
  const equipes = equipesDe(mission);
  if(!equipes.length) return "";
  return `
  <label class="field">
    <span class="klabel">ÉQUIPE <span style="color:var(--c-6d7480);font-weight:400;letter-spacing:0">(facultatif)</span></span>
    <select class="inp" ${ong(e=>poser(e.target.value))}>
      <option value=""${!choisie?" selected":""}>Toute la mission</option>
      ${equipes.map(e=>`<option value="${esc(e.nom)}"${e.nom===choisie?" selected":""}>${esc(e.nom)}${e.membres.length?" · "+e.membres.length+" membre(s)":""}</option>`).join("")}
    </select>
  </label>`;
}

function ouvrirEquipe(mission, nom){
  setT({equipeEdit:{mission, original:nom||null, valeur:nom||""}});
}

async function confirmerEquipe(){
  const f = S.equipeEdit; if(!f) return;
  const nom = (f.valeur||"").trim();
  if(!nom) return;
  const ok = f.original
    ? await agir("mission.equipe.renommer",
                 {mission:f.mission, nom:f.original, nouveauNom:nom})
    : await agir("mission.equipe.creer", {mission:f.mission, nom});
  if(ok) setT({equipeEdit:null});
}

function ouvrirMembres(mission, nom){
  const equipe = equipesDe(mission).find(e=>e.nom===nom);
  setT({membresEdit:{mission, nom, choisis:(equipe?equipe.membres:[]).slice()}});
}

async function confirmerMembres(){
  const f = S.membresEdit; if(!f) return;
  if(await agir("mission.equipe.membres",
                {mission:f.mission, nom:f.nom, membres:f.choisis}))
    setT({membresEdit:null});
}

function supprimerEquipe(mission, nom){
  if(!confirm("Supprimer l'équipe « "+nom+" » de « "+mission+" » ?\n\n"
    + "Son matériel déjà rendu garde son nom dans le journal. Ce qui est "
    + "encore dehors doit d'abord être rendu ou déplacé.")) return;
  agir("mission.equipe.supprimer", {mission, nom});
}

function chip(label,active,fn){
  return '<button class="chip'+(active?' on':'')+'" '+on(fn)+'>'+esc(label)+'</button>';
}

/* ---------- ce que le compte connecté détient ----------

   Deux sources, parce qu'il y a deux stocks : le matériel emprunté pour une
   mission, et les téléphones sortis de l'armoire. Les réservations ne comptent
   pas — l'appareil réservé n'a pas quitté son casier.

   Le rang renvoyé est celui de la ligne dans la liste complète, jamais dans la
   liste filtrée : c'est lui que le serveur reçoit, accompagné de l'empreinte
   qui lui permet de vérifier qu'il rend bien cette ligne-là. */
function mesEmprunts(){
  const liste = [];
  Object.keys(S.matRes).forEach(nom=>{
    (S.matRes[nom]||[]).forEach((r,index)=>{
      if(!r.returned && r.by===auteurEffectif()) liste.push({nom, index, r});
    });
  });
  return liste.sort((a,b)=>(a.r.mission+matLabel(a.nom)).localeCompare(b.r.mission+matLabel(b.nom)));
}
function mesSorties(){
  const liste = [];
  S.refs.forEach(ref=>{
    (ref.outs||[]).forEach((o,index)=>{
      if(o.who===auteurEffectif()) liste.push({ref, index, o});
    });
  });
  return liste.sort((a,b)=>String(a.o.iso||"").localeCompare(String(b.o.iso||"")));
}
function mesReservations(){
  const liste = [];
  S.refs.forEach(ref=>{
    (ref.reservations||[]).forEach((r,index)=>{
      if(r.who===auteurEffectif()) liste.push({ref, index, r});
    });
  });
  return liste.sort((a,b)=>String(a.r.iso||"").localeCompare(String(b.r.iso||"")));
}
/* Consommables à recommander : le stock cumulé d'une catégorie (les exemplaires
   de même nom) est passé sous le seuil que l'on a réglé pour elle. Même règle
   que l'onglet Consommables de l'administration, d'où l'on peut agir. */
function consommablesARecommander(){
  const groupes = new Map();
  S.materiel.filter(m=>m.cat===CATEGORIE_CONSOMMABLE).forEach(m=>{
    const g = groupes.get(m.name) || {nom:m.name, stock:0, seuil:0};
    g.stock += m.qty; g.seuil = Math.max(g.seuil, m.seuil||0);
    groupes.set(m.name, g);
  });
  return Array.from(groupes.values()).filter(g=>g.seuil>0 && g.stock<=g.seuil);
}
function nbPossessions(){
  return (S.dotations[auteurEffectif()]||[]).length
    + mesEmprunts().length + mesSorties().length + mesReservations().length;
}

   RENDU
   ============================================================ */
/* ---------- ce qui tient dans la fenetre ----------

   Une table paginee a 20 lignes fixes defilait sur un petit ecran et laissait
   du vide sur un grand. Elle demande desormais combien de lignes tiennent
   reellement dans la place disponible.

   La mesure est stable, et c'est ce qui permet de la faire apres le rendu sans
   boucler : la zone mesuree est en `overflow:hidden` et tient sa hauteur du
   flex parent, donc elle ne depend pas du nombre de lignes qu'on y met.
   Mesurer, ajuster, redessiner une fois, et c'est fige. */
/* En mode « All » la zone n'est plus mesurée : toutes les lignes y sont, et
   c'est elle qui défile (`overflow:auto` en ligne) au lieu de les rogner. */
const RANGS = {};
let enMesure = false;

function rangsQuiTiennent(cle, hauteurLigne, defaut){
  return RANGS[cle] || defaut || Math.max(1, Math.floor(520 / hauteurLigne));
}

function mesurerRangs(){
  let change = false;
  app.querySelectorAll("[data-rangs]").forEach(el=>{
    const cle = el.getAttribute("data-rangs");
    const h = Number(el.getAttribute("data-rangh")) || 40;
    const dispo = el.clientHeight;
    if(!dispo) return;                     // zone masquee : rien a mesurer
    // +1 : une derniere ligne dont il ne manque qu'un pixel de bordure tient
    // en pratique, et l'ecarter laisserait un trou visible.
    const n = Math.max(1, Math.floor((dispo + 1) / h));
    if(RANGS[cle] !== n){ RANGS[cle] = n; change = true; }
  });
  return change;
}

function render(){
  if(S.page==="admin" && !ADMIN) S.page="stock";
  if(OPERATOR !== "hors ligne") memoriserPage();
  // Les packs ont eu leur propre onglet ; la préférence enregistrée sur un
  // poste qui l'a connu désignerait une page qui n'existe plus.
  if(S.page==="packs") S.page="materiel";
  H = [];
  const place = placement();
  /* Armoire de repli sur une base neuve, qui n'en contient encore aucune.
     Sans elle, `activeCab` valait `undefined` et la page « Plan de l'armoire »
     levait une exception — laquelle, remontant jusqu'à la boucle de
     synchronisation, faisait aussi apparaître à tort « connexion au serveur
     perdue ». Un objet inerte plutôt qu'un test à chacun des quinze endroits
     qui le consultent. */
  const activeCab = S.cabinets.find(c=>c.id===S.cabinet) || S.cabinets[0]
    || { id:"—", shelves:0, cols:0 };
  const sansArmoire = !S.cabinets.length;
  const capacity = S.cabinets.reduce((s,c)=>s+c.shelves*c.cols,0);
  const unplaced = S.refs.filter(r=>!place[r.id]).length;
  const casiersOccupes = new Set(S.refs.map(r=>place[r.id]).filter(pl=>pl && pl.cab===activeCab.id).map(pl=>pl.loc)).size;
  const locOf = r => place[r.id] ? place[r.id].loc : "NON PLACÉ";
  const sel = S.refs.find(r=>r.id===S.selId) || null;
  const assigning = S.refs.find(r=>r.id===S.assigning) || null;
  const searching = !!S.q.trim();
  const matchIds = searching ? S.refs.filter(r=>matches(r,S.q)).map(r=>r.id) : [];
  const matchCells = new Set(matchIds.map(id=>place[id]).filter(Boolean).map(p=>p.loc)).size;

  /* ---------- sidebar ---------- */
  // Les icônes sont les SVG de la refonte (heimdall-refonte/icones/inline), écrits en ligne :
  // le trait suit la couleur du texte (currentColor) et l'accent est le doré du thème.
  const ICONES_SVG = {
    "administration": `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18.90 10.31 L20.90 10.66 L20.90 13.34 L18.90 13.69 L18.07 15.68 L19.24 17.34 L17.34 19.24 L15.68 18.07 L13.69 18.90 L13.34 20.90 L10.66 20.90 L10.31 18.90 L8.32 18.07 L6.66 19.24 L4.76 17.34 L5.93 15.68 L5.10 13.69 L3.10 13.34 L3.10 10.66 L5.10 10.31 L5.93 8.32 L4.76 6.66 L6.66 4.76 L8.32 5.93 L10.31 5.10 L10.66 3.10 L13.34 3.10 L13.69 5.10 L15.68 5.93 L17.34 4.76 L19.24 6.66 L18.07 8.32Z"/><circle style="stroke:var(--gold)" cx="12" cy="12" r="3"/></svg>`,
    "consommables-a-recommander": `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.1 10.3a1.5 1.5 0 0 0 1.5 1.2h8.5a1.5 1.5 0 0 0 1.5-1.2L20.5 8H5.8"/><circle cx="9" cy="19.5" r="1.25"/><circle cx="17" cy="19.5" r="1.25"/><path style="stroke:var(--gold)" d="M13 9.5v3.5M11.25 11.25h3.5"/></svg>`,
    "demandes-de-pret": `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-7l-4.5 3.5V17H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path style="stroke:var(--gold)" d="M8 8.5h7.5M13.5 6.5l2 2-2 2M16 12.5H8.5M10.5 10.5l-2 2 2 2"/></svg>`,
    "journal": `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8.5 3v18"/><path style="stroke:var(--gold)" d="M11.5 8h4.5M11.5 11.5h4.5"/><path d="M11.5 15h3"/></svg>`,
    "missions-en-cours": `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2"/><path d="M8 18h6.5a3 3 0 0 0 0-6h-5a3 3 0 0 1 0-6H13"/><path style="stroke:var(--gold)" d="M18 10.5S15 7.8 15 5.5a3 3 0 0 1 6 0c0 2.3-3 5-3 5Z"/><circle style="fill:var(--gold)" stroke="none" cx="18" cy="5.5" r="1"/></svg>`,
    "mon-groupe": `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle style="stroke:var(--gold)" cx="12" cy="8" r="3"/><path style="stroke:var(--gold)" d="M6.5 19.5a5.5 5.5 0 0 1 11 0"/><circle cx="5.5" cy="9.5" r="2.25"/><path d="M2.5 18a3.5 3.5 0 0 1 3.75-3.5"/><circle cx="18.5" cy="9.5" r="2.25"/><path d="M21.5 18a3.5 3.5 0 0 0-3.75-3.5"/></svg>`,
    "mon-materiel": `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6V4.5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1V6"/><rect x="5" y="6" width="14" height="15" rx="3"/><path d="M5 11h14"/><rect style="stroke:var(--gold)" x="8.5" y="14" width="7" height="4" rx="1"/></svg>`,
    "mon-profil": `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle style="stroke:var(--gold)" cx="12" cy="10" r="3"/><path style="stroke:var(--gold)" d="M6.6 18.2a6 6 0 0 1 10.8 0"/></svg>`,
    "plan-armoire": `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="16.5" rx="2"/><path d="M12 3v16.5M4 9h16M4 14h16M6.5 19.5V21M17.5 19.5V21"/><rect style="stroke:var(--gold)" style="fill:var(--gold)" x="14.25" y="10.75" width="3.5" height="1.5" rx=".5"/></svg>`,
    "se-deconnecter": `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5H6.5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2H10"/><path style="stroke:var(--gold)" d="M15 8l4 4-4 4M19 12H9.5"/></svg>`,
    "stock-materiel": `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3v18M20 3v18M4 12h16M4 20h16"/><rect x="6.5" y="6" width="5" height="6" rx=".75"/><rect style="stroke:var(--gold)" x="13" y="15" width="5" height="5" rx=".75"/><rect x="6.5" y="15.5" width="4.5" height="4.5" rx=".75"/></svg>`,
    "stock-telephone": `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3.5H6.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2H9"/><rect x="10" y="5.5" width="9.5" height="15" rx="2"/><path style="stroke:var(--gold)" d="M13.5 17.5h2.5"/></svg>`
  };
  const iconeNav = nom => `<span class="nav-ico" aria-hidden="true">${ICONES_SVG[nom]||""}</span>`;

  const nbTenu = nbPossessions();
  // Seuls les administrateurs règlent les seuils et réapprovisionnent : ce sont
  // eux que l'alerte concerne.
  const aRecommander = ADMIN ? consommablesARecommander() : [];
  const nbDemandes = S.pret.recues.length;
  const nbNotifs = aRecommander.length + nbDemandes;

  /* Les rubriques, par section. Un élément est une page, ou une action (préfixe __) qui
     ouvre autre chose : le compteur en pastille signale ce qui est à traiter. */
  const surAdminConso = S.page==="admin" && S.adminTab==="consommables";
  const sectionsNav = [
    ["Inventaire", [
      ["stock", "Stock de téléphone", "stock-telephone"],
      ["armoire", "Plan de l'armoire", "plan-armoire"],
      ["materiel", "Stock de matériel", "stock-materiel"],
      ...(ADMIN ? [["__recommander", "À recommander", "consommables-a-recommander", aRecommander.length]] : []),
    ]],
    ["Activité", [
      ["missions", "Missions en cours", "missions-en-cours"],
      ...(groupeMoi() ? [["groupe", "Mon groupe", "mon-groupe"]] : []),
      ["journal", "Journal", "journal"],
    ]],
    ["Moi", [
      ["profil", "Mon profil", "mon-profil"],
      ["__materiel", "Mon matériel", "mon-materiel"],
      ...(nbDemandes ? [["__demandes", "Demandes de prêt", "demandes-de-pret", nbDemandes]] : []),
    ]],
    ...(ADMIN ? [["Gestion", [["admin", "Administration", "administration"]]]] : []),
  ];
  const estActif = p=>p==="__recommander" ? surAdminConso
    : p==="admin" ? (S.page==="admin" && !surAdminConso)
    : p==="profil" ? (S.page==="profil" && (!S.profilDe || S.profilDe===auteurEffectif()))
    : p.startsWith("__") ? false : S.page===p;
  const allerA = p=>{
    if(p==="__recommander") return set({page:"admin", adminTab:"consommables", sbOuvert:false});
    if(p==="__materiel") return setT({possessions:true, sbOuvert:false});
    if(p==="__demandes" || p==="profil") return set({page:"profil", profilDe:null, sbOuvert:false});
    set({page:p, sbOuvert:false});
  };
  const roleLibelle = LIBELLE_ROLE[roleMoi()] || roleMoi();

  /* Le menu du compte : ce qui n'a pas sa place dans la navigation — le rôle, les
     réglages, et l'emprunt d'identité. Il s'ouvre vers le haut, au-dessus du bloc du
     compte : en dessous, il n'y a plus de place. */
  const menuCompte = !S.userMenu ? "" : `
    <div class="user-menu" role="menu">
      <div style="padding:7px 9px 8px;border-bottom:1px solid var(--line);margin-bottom:3px;display:flex;align-items:center;gap:8px">
        <span class="klabel">Rôle</span>
        <span class="badge ${ADMIN?"b-gold":estChefDeGroupe()?"b-info":"b-neutral"}">${esc(roleLibelle)}</span>
      </div>
      <button class="user-item" role="menuitem" ${on(()=>setT({userMenu:false, reglagesOuverts:true, sbOuvert:false}))}>
        <span>Réglages</span>
      </button>
      ${COMPTES.filter(c=>c!==OPERATOR).length ? `
      <div style="border-top:1px solid var(--line);margin:3px 0 0;padding:9px 9px 6px;display:flex;flex-direction:column;gap:6px">
        <span class="klabel">Agir au nom de${ADMIN?"":" · mon groupe"}</span>
        <select class="inp" data-k="auteur" style="padding:6px 8px;font-size:13px" ${ong(e=>{
          AUTEUR = e.target.value || null;
          setT({ userMenu:false });
        })}>
          <option value=""${AUTEUR?"":" selected"}>Moi — ${esc(OPERATOR)}</option>
