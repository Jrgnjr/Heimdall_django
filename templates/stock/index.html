{% load static %}<!DOCTYPE html>
<html lang="fr" data-theme="{{ theme|default:'dark' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<script>(function(){var h=document.documentElement;if(h.dataset.theme==="auto"){h.dataset.theme=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";}})();</script>
<title>Heimdall — Gestion de stock</title>
<link rel="icon" href="{% static 'stock/heimdall.ico' %}" sizes="any">
<link rel="apple-touch-icon" href="{% static 'stock/heimdall-icone.png' %}">
<link rel="stylesheet" href="{% static 'stock/fonts/polices.css' %}">
<link rel="stylesheet" href="{% static 'stock/charte.css' %}">
<style>
/* Les jetons (couleurs, thèmes) sont dans static/stock/charte.css, partagé avec les pages de
   connexion et le tableau d'une mission. */
/* Anciens noms de couleurs : ils pointent maintenant vers les jetons, par rôle. Tout
   ce qui les emploie encore prend la palette de la refonte, dans les deux thèmes, sans
   être réécrit d'un coup ; on les retire au fil des écrans. Définis une fois : ils se
   résolvent selon le thème de <html>. */
:root{
  /* fonds */
  --c-0b0d11:var(--bg); --c-111318:var(--bg); --c-101318:var(--bg); --c-10141b:var(--bg);
  --c-0c0e12:var(--surface); --c-0e1014:var(--surface); --c-15181d:var(--surface);
  --c-131720:var(--surface); --c-14171c:var(--surface);
  --c-13161b:var(--raised); --c-171b24:var(--raised); --c-191c22:var(--raised);
  --c-1a1f28:var(--raised); --c-1b1f26:var(--raised); --c-1c1f26:var(--raised);
  --c-1d2129:var(--raised); --c-1f242c:var(--raised); --c-1f2732:var(--raised);
  --c-232a35:var(--raised);
  /* traits */
  --c-1f232a:var(--line); --c-23262d:var(--line); --c-23272f:var(--line);
  --c-2b2f37:var(--line); --c-2b3038:var(--line); --c-2b3444:var(--line);
  --c-2f343d:color-mix(in srgb, var(--muted) 35%, transparent);
  --c-343a45:color-mix(in srgb, var(--line) 60%, var(--muted));
  --c-3a404a:color-mix(in srgb, var(--line) 60%, var(--muted));
  --c-3f4550:color-mix(in srgb, var(--line) 60%, var(--muted));
  --c-4a5058:color-mix(in srgb, var(--muted) 65%, var(--bg));
  --c-5a3a38:color-mix(in srgb, var(--danger) 45%, var(--line));
  /* textes */
  --c-fort:var(--ink); --c-f2f4f8:var(--ink); --c-eef0f4:var(--ink); --c-e7e9ee:var(--ink);
  --c-dde1e8:var(--soft); --c-dfe3ea:var(--soft); --c-c3c9d3:var(--soft); --c-aeb5c1:var(--soft);
  --c-9aa2af:var(--muted); --c-868d99:var(--muted); --c-7b8290:var(--muted);
  --c-767d8a:var(--muted); --c-6d7480:var(--muted); --c-5f6672:var(--muted); --c-5b6270:var(--muted);
  /* accent et états */
  --c-8fb4ff:var(--gold); --c-6f9dff:var(--gold); --c-a8c3ff:var(--gold); --c-dde6ff:var(--ink);
  --c-5fc79a:var(--ok); --c-7fd1a6:var(--ok);
  --c-ef8b83:var(--danger); --c-f0b45a:var(--warn);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
/* Le document ne defile jamais : c'est la coque qui tient la hauteur de la
   fenetre, et chaque page designe a l'interieur la zone qui absorbe le
   trop-plein. Sans `overflow:hidden` ici, un enfant trop grand ferait
   reapparaitre la barre de defilement du navigateur. */
body{background:var(--bg);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45;color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--gold);text-decoration:none}a:hover{color:var(--ink)}
input,button,select{font-family:inherit}
button{cursor:pointer}
@keyframes halo{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--gold) 55%, transparent),0 0 22px 2px color-mix(in srgb, var(--gold) 45%, transparent)}70%{box-shadow:0 0 0 9px color-mix(in srgb, var(--gold) 0%, transparent),0 0 30px 6px color-mix(in srgb, var(--gold) 30%, transparent)}100%{box-shadow:0 0 0 0 color-mix(in srgb, var(--gold) 0%, transparent),0 0 22px 2px color-mix(in srgb, var(--gold) 45%, transparent)}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--c-2f343d);border-radius:6px;border:3px solid transparent;background-clip:content-box}

/* `dvh` plutot que `vh` : sur mobile, la barre d'adresse se retracte et
   `100vh` depasse alors la hauteur reellement visible. La regle `vh` reste en
   premier comme repli pour les navigateurs qui ignorent `dvh`. */
/* #app empile le bandeau d'emprunt d'identité (quand il y en a un) puis la coque :
   le bandeau prend sa place dans la page, au lieu de la recouvrir. */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.shell{display:flex;flex:1;min-height:0;overflow:hidden;background:var(--c-111318)}

/* La zone mesuree d'une table : elle prend la place restante et ne defile pas,
   parce que le nombre de lignes affichees est calcule pour y tenir.

   `min-height:0` est indispensable : sans lui, un enfant flex refuse de
   descendre sous sa hauteur de contenu et pousse la page au lieu de la laisser
   repartir l'espace. C'est aussi ce qui rend la mesure stable — la hauteur
   vient du parent, pas du contenu. */
.serre{flex:1;min-height:0;overflow:hidden}
.admin-stock-card{display:flex;flex:1;flex-direction:column;min-height:0}
.admin-stock-list{flex:1;min-height:0;overflow:auto}
.template-editor-card{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}

/* ---------- composants de base (maquettes de la refonte) ----------
   Les noms de la maquette (.btn, .btn-primary, .btn-sm, .chip, .badge .b-*, .tab, .row…)
   et les anciens (.btn-pri, .btn-sec, .btn-mini, .btn-cell, .badge.ok…) coexistent : les
   deux familles ont exactement le même rendu, on migre les écrans de l'un à l'autre. */
.klabel,.over{font:600 11px/1 Inter,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.th{padding:12px 8px;font:600 11px/1 Inter,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px}
.num{font-variant-numeric:tabular-nums}

/* badges : 22 px, capitales ; la couleur dit l'état, jamais autre chose */
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font:600 11px/1 Inter,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;box-sizing:border-box;border:0}
.badge.ok,.b-ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn,.b-warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad,.b-danger{background:var(--danger-bg);color:var(--danger)}
.badge.info,.badge.violet,.b-info{background:var(--info-bg);color:var(--info)}
.badge.mut,.b-neutral{background:var(--raised);color:var(--soft)}
.b-gold{background:var(--gold-soft);color:var(--gold)}
.b-tag{text-transform:none;letter-spacing:0;font-weight:500;font-size:12px}
.b-loc,.loctag{font-family:'JetBrains Mono',ui-monospace,monospace;text-transform:none;letter-spacing:0;font-weight:500;font-size:12px;color:var(--soft);background:var(--raised)}
.loctag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;white-space:nowrap;box-sizing:border-box}

/* Sélecteur d'affectation : présenté comme une étiquette, pas comme un champ
   de formulaire — c'est une information qu'on lit bien plus souvent qu'on ne
   la change. « Commun » est neutre, un groupe est une information (--info). */
.affect{font:500 12px/1 Inter,system-ui,sans-serif;border-radius:6px;padding:5px 22px 5px 8px;white-space:nowrap;
  max-width:100%;cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5'><path d='M0 0h8L4 5z' fill='%23788093'/></svg>");
  background-repeat:no-repeat;background-position:right 7px center}
.affect.groupe{color:var(--gold);background-color:var(--gold-soft);border:1px solid transparent}
.affect.commun{color:var(--soft);background-color:var(--raised);border:1px solid transparent}
.affect:hover{border-color:var(--gold)}
.affect option{background:var(--surface);color:var(--ink)}
/* Menus déroulants aux couleurs de Heimdall. Le menu natif prend le bleu du système pour
   l'option survolée ou choisie ; les navigateurs récents laissent le dessiner soi-même
   (appearance:base-select). Les autres gardent le menu natif, sans changement. */
select.badge{-webkit-appearance:none;appearance:none}
select.badge option{background:var(--surface);color:var(--ink)}
@supports (appearance:base-select){
  select.inp,select.input,select.affect,select.badge{appearance:base-select}
  select.badge::picker-icon{display:none}
  select.inp::picker(select),select.input::picker(select),select.affect::picker(select),select.badge::picker(select){
    appearance:base-select;background:var(--surface);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;padding:4px;box-shadow:0 14px 34px rgba(0,0,0,.4);margin-top:4px;
    max-height:min(360px,60vh)}
  select.inp::picker-icon,select.input::picker-icon{color:var(--muted);transition:rotate .15s}
  select.affect::picker-icon{display:none}
  select.inp:open::picker-icon,select.input:open::picker-icon{rotate:180deg}
  select.inp:open,select.input:open{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
  select.inp option,select.input option,select.affect option,select.badge option{
    padding:8px 10px;border-radius:6px;font:400 13px Inter,system-ui,sans-serif;color:var(--ink);
    background:transparent;display:flex;align-items:center;gap:8px}
  select.inp option:hover,select.input option:hover,select.affect option:hover,select.badge option:hover,
  select.inp option:focus-visible,select.input option:focus-visible,select.affect option:focus-visible,select.badge option:focus-visible{
    background:var(--raised);outline:0}
  select.inp option:checked,select.input option:checked,select.affect option:checked,select.badge option:checked{
    background:var(--gold-soft);color:var(--ink)}
  select.inp option::checkmark,select.input option::checkmark,select.affect option::checkmark,select.badge option::checkmark{color:var(--gold)}
  select.inp option:disabled,select.input option:disabled{color:var(--muted)}
}

/* pastilles de filtre */
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--soft);font:400 13px/1 Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--ink);background:var(--raised)}
.chip.on{background:var(--gold-soft);color:var(--ink);border-color:var(--gold);font-weight:600}
.chip .n{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}

/* boutons : secondaire (par défaut), primaire doré, petit, fantôme, icône */
.btn,.btn-sec,.btn-pri,.btn-mini,.btn-cell{display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;border:1px solid var(--line);background:var(--surface);color:var(--soft);font:500 13px/1 Inter,system-ui,sans-serif;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn,.btn-sec,.btn-pri{height:36px;padding:0 14px;border-radius:8px}
.btn:hover,.btn-sec:hover,.btn-mini:hover,.btn-cell:hover{background:var(--raised);color:var(--ink)}
.btn-primary,.btn-pri{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:600}
.btn-primary:hover,.btn-pri:hover{background:var(--gold);color:var(--gold-ink);filter:brightness(1.08)}
.btn-pri:disabled,.btn-pri.off{border-color:var(--line);background:var(--raised);color:var(--muted);filter:none;cursor:not-allowed}
.btn-sm,.btn-mini,.btn-cell{height:30px;padding:0 10px;border-radius:8px;font-size:12.5px}
.btn:disabled,.btn-sec:disabled,.btn-mini:disabled,.btn-cell:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-icon{width:32px;height:32px;padding:0}
.btn-danger:hover,.btn-mini.hred:hover,.btn-cell.hred:hover{color:var(--danger);background:var(--danger-bg);border-color:transparent}
.btn-sec.blue:hover,.btn-mini.hblue:hover,.btn-cell.hblue:hover{border-color:var(--gold);color:var(--ink)}
.btn-mini.hwhite:hover{color:var(--ink)}
.btn-cell.hgreen:hover{border-color:var(--ok);color:var(--ok)}
.btn-mini.tog-on,.btn-mini.fixed{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.barre-widget{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.poignee{cursor:grab;color:var(--muted);font-size:15px;line-height:1;padding:0 4px;user-select:none}

/* onglets : l'actif est souligné en doré (rubriques d'une page) */
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tab{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;color:var(--muted);font:500 13.5px/1 Inter,system-ui,sans-serif;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--gold)}
.tab .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* onglets segmentés (changement de vue) */
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:10px;background:var(--raised)}
.seg .tab{height:34px;border:0;margin:0;border-radius:8px;padding:0 14px}
.seg .tab.on{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--soft);margin-bottom:6px}
.help{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.5}
/* champs : le champ de recherche porte sa loupe ; .inp reste le champ de formulaire */
.inp,.input{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:400 13.5px Inter,system-ui,sans-serif;outline:none}
.inp{padding:9px 10px;min-width:0;box-sizing:border-box}
.inp::placeholder,.input::placeholder{color:var(--muted)}
.inp:focus,.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.champ-recherche{position:relative;display:flex;align-items:center}
.champ-recherche svg{position:absolute;left:12px;color:var(--muted);pointer-events:none}
.input{height:38px;width:100%;box-sizing:border-box;padding:0 12px}
.champ-recherche .input{padding-left:38px}
.field{display:flex;flex-direction:column;gap:6px}

/* lignes de tableau : les actions n'apparaissent qu'au survol ou au clavier
   (toujours visibles sur écran tactile, qui n'a pas de survol) */
.row{display:grid;align-items:center;column-gap:16px;padding:10px 20px;border-top:1px solid var(--line)}
.row:hover,.rowhov:hover{background:var(--raised)}
/* cartes du profil : un en-tête (titre, compte, action) puis des lignes séparées d'un filet */
.chead{display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.chead h2{margin:0;font-size:13.5px;font-weight:700;flex:1}
.count{font-size:12px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.item{padding:12px 16px;border-top:1px solid var(--line)}
.item:hover{background:var(--raised)}
/* états : chargement, démarrage, survol, désactivé */
.chargement{position:fixed;top:0;left:0;right:0;height:3px;z-index:120;pointer-events:none;background:linear-gradient(90deg,transparent,var(--gold),transparent) no-repeat;background-size:40% 100%;animation:glisse 1.1s linear infinite}
@keyframes glisse{from{background-position:-40% 0}to{background-position:140% 0}}
.demarrage{min-height:100vh;display:grid;place-items:center;align-content:center;gap:14px;color:var(--muted);font-size:14px}
.rotation{width:22px;height:22px;border-radius:999px;border:2px solid var(--line);border-top-color:var(--gold);animation:tourne .8s linear infinite}
@keyframes tourne{to{transform:rotate(360deg)}}
button.card{text-align:inherit;color:inherit;font:inherit}
button.card:hover{border-color:var(--muted)}
.inp:disabled,.input:disabled{opacity:.5;cursor:not-allowed}
.dot{width:8px;height:8px;border-radius:999px;flex-shrink:0}
.day{padding:12px 20px 8px;border-top:1px solid var(--line);background:var(--bg)}
.av{width:24px;height:24px;border-radius:999px;background:var(--raised);color:var(--soft);font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ghead{display:flex;align-items:center;gap:10px;padding:14px 20px 8px;border-top:1px solid var(--line);background:var(--bg)}
.acts{opacity:0;transition:opacity .12s}
.row:hover .acts,.row:focus-within .acts,.rowhov:hover .acts,.rowhov:focus-within .acts,.acts:focus-within,.acts.ouvert{opacity:1}
@media (hover:none){.acts{opacity:1}}

/* menu « ⋯ » d'une ligne */
.menu-ligne{position:relative;display:inline-flex}
.pop{position:fixed;z-index:61;min-width:180px;padding:5px;display:flex;flex-direction:column;gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.pop-item{display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--soft);font:500 13px/1 Inter,system-ui,sans-serif;text-align:left;cursor:pointer}
.pop-item:hover{background:var(--raised);color:var(--ink)}
.pop-item.danger:hover{background:var(--danger-bg);color:var(--danger)}
.pop-item:disabled{opacity:.45;cursor:not-allowed}
.pop-item:disabled:hover{background:transparent;color:var(--soft)}

.barre-widget{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.poignee{cursor:grab;color:var(--c-6d7480);font-size:15px;line-height:1;padding:0 4px;user-select:none}


.nic{width:14px;height:14px;flex:none;border:1.5px solid currentColor;border-radius:3px;display:block;opacity:.85}

/* casiers du plan (maquette Plan) */
.cell{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:92px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--ink);font:inherit;text-align:left;cursor:pointer;box-sizing:border-box;transition:opacity .15s,border-color .15s}
.cell:hover{border-color:var(--muted)}
.cell.empty{background:transparent;border-style:dashed;color:var(--muted)}
.cell.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.cell.hit{border-color:var(--gold);background:var(--gold-soft)}
.cell.dim{opacity:.32}
/* bulle d'aide au survol : indispensable quand plusieurs modèles partagent un casier */
.cell .tip{display:none;position:absolute;width:210px;flex-direction:column;gap:6px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.35);z-index:20;pointer-events:none;text-align:left}
.cell:hover .tip,.cell:focus-visible .tip{display:flex}
.cell.assign{border:1px dashed var(--gold)}
.cell.assign.empty{background:var(--gold-soft)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step span{min-width:28px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.stepbtn{width:30px;height:30px;border:0;background:transparent;color:var(--soft);font:500 15px/1 Inter,system-ui,sans-serif}
.stepbtn:hover{background:var(--raised);color:var(--ink)}

.modal-back{position:fixed;inset:0;background:rgba(8,9,12,.6);display:flex;align-items:center;justify-content:center;padding:32px;z-index:60}
.modal{max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 64px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden}
.modal-head{padding:20px 24px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.modal-title{font:700 15px/1.25 Inter,system-ui,sans-serif;color:var(--ink);letter-spacing:-.01em}
.modal-sub{font:400 12.5px/1.4 Inter,system-ui,sans-serif;color:var(--muted)}
.modal-body{padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.modal-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px;justify-content:flex-end}
@media (max-width:640px){.modal-back{padding:12px}.modal{width:100% !important}}

.stack{display:flex;flex-direction:column;gap:1px;background:var(--c-23262d);border:1px solid var(--c-23262d);border-radius:9px;overflow:hidden}
.stack>div{background:var(--c-191c22)}

/* ---------- barre latérale (maquette Sidebar) ---------- */
.sb{width:232px;flex:none;box-sizing:border-box;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px 16px;min-height:0;overflow:auto}
.sb-marque{display:flex;align-items:center;gap:12px;padding:0 8px 8px}
.sb .grp{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:18px 12px 6px}

/* ---------- coque, en-tête de page et mobile ---------- */

<body>
<div id="app"></div>
<script>
"use strict";

/* ============================================================
   Heimdall — application autonome (aucun serveur requis)
   Recréation du design handoff · persistance localStorage
   ============================================================ */

const ROW_H = 58;            // une ligne de la maquette : deux lignes de texte et 10 px de marge
/* La colonne d'action s'élargit pour l'administrateur, qui y trouve un bouton
   de plus. En-tête et lignes sont deux grilles distinctes : toute largeur qui
   se résoudrait différemment dans l'une et dans l'autre — `auto`, par exemple —
   les désalignerait. */
const PH_GRID  = () => "minmax(0,1fr) 150px 76px " + (ADMIN ? "150px" : "120px");
const MAT_GRID = () => "minmax(0,1fr) 128px 76px 180px 150px " + (ADMIN ? "150px" : "110px");

/* ---------- filtres par colonne ----------

   Chaque tableau (matériel, téléphones, journal) a un jeu de filtres, un par colonne.
   Un entonnoir à côté du titre d'une colonne ouvre le sien juste dessous ; un
   entonnoir barré, en tête du tableau, les retire tous. Les filtres sont des réglages
   du compte : ils se retrouvent d'une visite à l'autre. */
const FILTRES_VIDES = {
  materiel:{article:"", cat:"", affectation:"", qte:"", mission:"", reservation:""},
  stock:{reference:"", emplacement:"", qte:""},
  journal:{date:"", article:"", qte:"", personne:"", mission:"", type:""},
};
const PAGE_DU_TABLEAU = {materiel:"stockMaterialPage", stock:"stockPhonePage", journal:"logPage"};
/* Ce qui vient du serveur est relu contre les colonnes connues : une colonne retirée
   ou un réglage abîmé ne doit pas laisser un filtre invisible qui masque des lignes. */
function normaliserFiltres(){
  const n = {};
  Object.keys(FILTRES_VIDES).forEach(t=>{
    n[t] = Object.assign({}, FILTRES_VIDES[t]);
    const lu = (S.colFiltres||{})[t] || {};
    Object.keys(n[t]).forEach(c=>{ if(typeof lu[c] === "string") n[t][c] = lu[c]; });
  });
  S.colFiltres = n;
  S.colOuverts = S.colOuverts || {};
}
const filtresDe = t=>S.colFiltres[t];
const colonnesFiltrees = t=>Object.keys(S.colFiltres[t]).filter(c=>S.colFiltres[t][c] !== "");
function poserFiltre(t, col, valeur, fermer){
  const ouverts = Object.assign({}, S.colOuverts[t] || {});
  if(fermer) ouverts[col] = false;
  set({
    colFiltres:Object.assign({}, S.colFiltres, {[t]:Object.assign({}, S.colFiltres[t], {[col]:valeur})}),
    colOuverts:Object.assign({}, S.colOuverts, {[t]:ouverts}),
    [PAGE_DU_TABLEAU[t]]:0});
}
function effacerFiltres(t){
  set({
    colFiltres:Object.assign({}, S.colFiltres, {[t]:Object.assign({}, FILTRES_VIDES[t])}),
    colOuverts:Object.assign({}, S.colOuverts, {[t]:{}}),
    [PAGE_DU_TABLEAU[t]]:0});
}
const SVG_ENTONNOIR = `<svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h18l-7 8.5V20l-4-2v-5.5z"/></svg>`;
const SVG_ENTONNOIR_BARRE = `<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h18l-7 8.5V20l-4-2v-5.5z" opacity=".85"/><path d="M3 21 21 3" stroke="var(--c-15181d)" stroke-width="5" stroke-linecap="round"/><path d="M3 21 21 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;

/* Le bouton qui retire tous les filtres d'un tableau : grisé quand il n'y en a pas. */
function boutonToutEffacer(t){
  const n = colonnesFiltrees(t).length;
  return `<button title="${n?"Retirer tous les filtres ("+n+")":"Aucun filtre actif"}" ${n?"":"disabled"} ${on(()=>effacerFiltres(t))}
    style="width:15px;height:15px;flex:none;margin-right:4px;padding:0;border:0;border-radius:4px;display:grid;place-items:center;background:${n?"color-mix(in srgb, var(--gold) 20%, transparent)":"transparent"};color:${n?"var(--c-8fb4ff)":"var(--c-4a5058)"};cursor:${n?"pointer":"default"}">${SVG_ENTONNOIR_BARRE}</button>`;
}

/* Un titre de colonne filtrable. `ctl` décrit le filtre :
     { label, texte:"indication" }            un champ de saisie,
     { label, liste:[[valeur, libellé]…], tous:"Toutes" }   une liste déjà déroulée.
   `avant` s'insère devant le titre (le bouton « tout effacer » de certains tableaux). */
function thFiltrable(t, col, titre, ctl, style, droite, avant){
  const valeur = S.colFiltres[t][col];
  const actif = valeur !== "";
  const ouvert = !!(S.colOuverts[t] || {})[col];
  const cle = "col-"+t+"-"+col;
  const fermer = ()=>setT({colOuverts:Object.assign({}, S.colOuverts, {[t]:Object.assign({}, S.colOuverts[t]||{}, {[col]:false})})});
  let contenu;
  if(ctl.liste){
    contenu = `<div data-k="${cle}" style="display:flex;flex-direction:column;gap:1px;max-height:260px;overflow:auto">
      ${[["", ctl.tous || "Toutes"], ...ctl.liste].map(([v, l])=>`
        <button ${on(()=>poserFiltre(t, col, v, true))}
          style="display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border:0;border-radius:6px;text-align:left;font:500 12px Inter,system-ui,sans-serif;background:${valeur===v?"color-mix(in srgb, var(--gold) 16%, transparent)":"transparent"};color:${valeur===v?"var(--c-8fb4ff)":"var(--c-c3c9d3)"}">
          <span style="width:12px;flex:none">${valeur===v?"✓":""}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l)}</span>
        </button>`).join("")}
    </div>`;
  }else{
    contenu = `<span class="klabel">${esc(ctl.label.toUpperCase())}</span>
      <input class="inp" data-k="${cle}" style="padding:6px 8px;font-size:12px;width:100%" placeholder="${esc(ctl.texte)}" value="${esc(valeur)}" ${oni(e=>poserFiltre(t, col, e.target.value, false))}>
      ${actif ? `<button class="btn-mini hwhite" style="align-self:flex-start" ${on(()=>poserFiltre(t, col, "", true))}>Effacer ce filtre</button>` : ""}`;
  }
  const panneau = !ouvert ? "" : `
    <div style="position:fixed;inset:0;z-index:40" ${on(fermer)}></div>
    <div style="position:absolute;top:calc(100% + 2px);${droite?"right":"left"}:0;z-index:41;width:${ctl.liste?"210px":"230px"};padding:${ctl.liste?"5px":"11px 12px"};display:flex;flex-direction:column;gap:8px;background:var(--c-15181d);border:1px solid var(--c-2b2f37);border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.5);font-weight:400;letter-spacing:normal;text-transform:none">${contenu}</div>`;
  return `<div class="th" style="position:relative;display:flex;align-items:center;gap:5px;min-width:0;${droite?"justify-content:flex-end;":""}${style||""}">
    ${avant||""}
    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${titre}</span>
    <button title="Filtrer cette colonne" ${on(()=>{
        setT({colOuverts:Object.assign({}, S.colOuverts, {[t]:Object.assign({}, S.colOuverts[t]||{}, {[col]:!ouvert})})});
        if(!ouvert) setTimeout(()=>{ const el = document.querySelector('[data-k="'+cle+'"]'); if(el && el.focus) el.focus(); }, 0);
      })}
      style="flex:none;padding:3px;border-radius:4px;border:0;background:${actif?"color-mix(in srgb, var(--gold) 20%, transparent)":ouvert?"var(--c-232a35)":"transparent"};color:${actif?"var(--c-8fb4ff)":"var(--c-6d7480)"};display:grid;place-items:center">${SVG_ENTONNOIR}</button>
    ${panneau}
  </div>`;
}

/* ---------- composants d'affichage de la refonte ---------- */

const SVG_LOUPE = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`;
const SVG_PLUS_DE = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>`;

/* Champ de recherche avec sa loupe. `cle` sert à rendre le focus après le redessin ;
   `fn(valeur)` est appelé à chaque frappe. */
function champRecherche(cle, indication, valeur, fn, style){
  return `<label class="champ-recherche" style="${style||""}">
    <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Rechercher</span>
    ${SVG_LOUPE}
    <input class="input" type="search" data-k="${esc(cle)}" placeholder="${esc(indication)}" value="${esc(valeur)}" ${oni(e=>fn(e.target.value))}>
  </label>`;
}

/* Menu « ⋯ » d'une ligne : les actions secondaires et destructrices y sont rangées.
   `items` : [{libelle, fn, danger?}]. Un clic à côté ferme le menu ; une action
   destructrice passe en rouge au survol, et sa fonction demande confirmation. */
function menuPlus(id, items){
  const ouvert = S.menuLigne === id;
  /* Le menu est en position fixe, calé sur le bouton à l'ouverture : une carte ou un tableau qui
     rogne son contenu (overflow) ne peut ni le couper ni le cacher. Il s'ouvre vers le haut quand
     il n'y a pas la place dessous. */
  const pos = ouvert && S.menuPos ? S.menuPos : null;
  const hauteur = items.length * 36 + 14;
  const style = pos ? (pos.bas ? "top:"+(pos.bas + 4)+"px" : "bottom:"+(window.innerHeight - pos.haut + 4)+"px")+";right:"+Math.max(8, window.innerWidth - pos.droite)+"px" : "";
  return `<span class="menu-ligne">
    <button class="btn btn-icon btn-ghost" type="button" aria-label="Plus d'actions" aria-haspopup="menu" aria-expanded="${ouvert}"
      ${on(e=>{
        e.stopPropagation();
        if(ouvert) return setT({menuLigne:null});
        const bouton = e.target.closest("button"), r = bouton.getBoundingClientRect();
        const placeDessous = window.innerHeight - r.bottom >= hauteur + 12;
        setT({menuLigne:id, menuPos:{droite:r.right, haut:r.top, bas:placeDessous ? r.bottom : 0}});
      })}>${SVG_PLUS_DE}</button>
    ${ouvert ? `<div style="position:fixed;inset:0;z-index:60" ${on(e=>{ e.stopPropagation(); setT({menuLigne:null}); })}></div>
      <div class="pop" role="menu" style="${style}">${items.map(it=>`
        <button class="pop-item${it.danger?" danger":""}" role="menuitem" type="button"${it.desactive?' disabled aria-disabled="true"':""}${it.titre?' title="'+esc(it.titre)+'"':""} ${on(e=>{ e.stopPropagation(); if(it.desactive) return; setT({menuLigne:null}); it.fn(); })}>${esc(it.libelle)}</button>`).join("")}
      </div>` : ""}
  </span>`;
}

/* Affectations du matériel : liste fermée, qui doit rester identique à
   AFFECTATIONS dans stock/models.py. Le serveur refuse toute autre valeur. */
const AFFECTATIONS = ["Groupe 1","Groupe 2","Groupe 3","Commun"];
const affectCls = a => a==="Commun" ? "commun" : "groupe";

/* Catégories toujours proposées à la création d'un article. Sans elles, la
   liste serait vide sur une base neuve — impossible d'en choisir une. Les
   catégories déjà utilisées viennent s'y ajouter. */
const CATEGORIES_MATERIEL = ["Stockage", "Dongle", "Outil", "Ordinateur", "Consommable", "Autre"];
const CATEGORIE_DONGLE = "Dongle";
/* La fin de licence d'un dongle, dite en clair : sert d'infobulle à l'icône de licence. */
function libelleLicence(iso){
  if(!iso) return "";
  const j = joursDeRetard(iso);
  const date = jourMoisAn(iso+"T00:00:00");
  return j > 0 ? "Licence expirée le "+date+" ("+j+" jour"+(j>1?"s":"")+")"
       : j === 0 ? "La licence expire aujourd'hui ("+date+")"
       : "Licence valable jusqu'au "+date;
}
/* Ce qui se consomme. Un article de cette categorie peut etre declare
   utilise au retour de mission, et ne rentre alors pas au stock. Doit rester
   identique a CATEGORIE_CONSOMMABLE dans coeur/base.py. */
const CATEGORIE_CONSOMMABLE = "Consommable";
const LOG_GRID = "124px minmax(0,1fr) 72px 170px 130px 130px";
const LOG_PAGE_SIZE = 20;      // repli si la mesure n'a pas encore eu lieu
const LOG_ROW_H = 56;
const STOCK_PAGE_SIZE = 20;
/* Capacités proposées à la réception. « Indéterminé » est une valeur à part
   entière, pas une absence de réponse : elle s'enregistre et s'affiche telle
   quelle, pour un appareil dont on ne connaît pas encore le stockage. Une
   entrée vide, elle, serait refusée par le serveur — la capacité est un champ
   obligatoire. */
const CAPA_INDETERMINEE = "Indéterminé";
const CAPAS = [CAPA_INDETERMINEE, "64 Go","128 Go","256 Go","512 Go","1 To"];
const SANS_MISSION = "—";
/* Numéro du compte connecté. Renseigné par le serveur à chaque réponse de
   l'API : toute action est signée par la personne réellement identifiée, et
   plus par un nom saisi à la main. En mode solo (fichier ouvert sans serveur)
   il n'y a personne à identifier, d'où le repli. */
let OPERATOR = "hors ligne";
/* Le compte connecté peut-il modifier la structure des armoires ? Renseigné
   par le serveur à chaque réponse. Ce drapeau ne fait que masquer des
   commandes : la vraie décision appartient au serveur, qui refuse ces actions
   à quiconque n'est pas administrateur (regles.ACTIONS_ADMINISTRATEUR). */
let ADMIN = false;
/* Comptes proposables comme auteur (administrateurs seulement), et compte au
   nom duquel on agit. `null` signifie « en mon nom ». */
let COMPTES = [];
let AUTEUR = null;
/* Le compte auquel s'imputent les actions et sur lequel « Mon matériel »
   filtre. Un seul point de vérité : tout le reste passe par ici. */
function auteurEffectif(){ return AUTEUR || OPERATOR; }


/* ---------- utilitaires ---------- */
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const pad = x => String(x).padStart(2,"0");

/* ---------- horodatages ----------

   Le serveur n'envoie qu'une seule forme : l'ISO 8601 avec année et fuseau
   ("2026-08-16T00:45:00+02:00"). Les dates ne sont plus fabriquées ici — le
   serveur horodate au moment où il applique la modification, et l'heure d'un
   poste peut être fausse. Ces fonctions ne servent qu'à l'affichage.

   Un tri alphabétique sur l'ISO est un tri chronologique, ce qui n'était vrai
   d'aucun des formats précédents. */
const quand = s => { const d = s ? new Date(s) : null; return d && !isNaN(d) ? d : null; };
const jourMois     = s => { const d=quand(s); return d ? pad(d.getDate())+"/"+pad(d.getMonth()+1) : "—"; };
const jourMoisAn   = s => { const d=quand(s); return d ? jourMois(s)+"/"+String(d.getFullYear()).slice(2) : "—"; };
const heureMinute  = s => { const d=quand(s); return d ? pad(d.getHours())+":"+pad(d.getMinutes()) : ""; };
const dateComplete = s => { const d=quand(s); return d ? pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear() : "—"; };

/* Affichage compact : l'année n'apparaît que si ce n'est pas l'année en cours.
   Une réservation qui traîne depuis un an cesse ainsi de ressembler à une
   réservation d'hier — ce que l'ancien format « 16/08 » rendait impossible. */
function dateCourte(s){
  const d = quand(s);
  if(!d) return "—";
  return d.getFullYear()===new Date().getFullYear() ? jourMois(s) : jourMoisAn(s);
}

/* un modèle = un casier : dérive les champs agrégés d'une référence */
function derive(g){
  g.reservations = g.reservations || [];
  g.outs = g.outs || [];
  g.qty = g.variants.reduce((s,v)=>s+v.qty,0);
  g.reserved = g.reservations.reduce((s,r)=>s+r.qty,0);
  g.variantSummary = g.variants.length + (g.variants.length>1?" variantes":" variante")
    + " · " + Array.from(new Set(g.variants.map(v=>v.capa))).join(" / ");
  return g;
}

/* État de départ, avant la première réponse du serveur : vide.

   La v0 pré-remplissait ici un catalogue de démonstration, parce qu'elle
   pouvait fonctionner sans serveur. Ce n'est plus le cas : les données
   viennent du serveur, et afficher un faux catalogue en attendant sa réponse
   ferait apparaître des références qui disparaîtraient au premier
   rafraîchissement. */
function seed(){
  return {
    page:"stock", theme:"sombre", q:"", brand:"Toutes", selId:null, assigning:null,
    refs:[],
    cabinets:[], cabinet:null,
    assignments:{},
    movements:[],
    materiel:[],
    dotations:{},
    matCat:"Toutes", matQuery:"", colFiltres:JSON.parse(JSON.stringify(FILTRES_VIDES)), colOuverts:{}, menuLigne:null, menuPos:null, matSel:{}, matGroups:{}, matRes:{}, matLog:[], logFilter:"Tous", logScope:"Tous", logQuery:"", logPage:0,
    missions:[], missionStatus:{}, templates:[], showArchived:false, missionsVue:"missions",
    equipes:[], equipeEdit:null, membresEdit:null,
    packs:[], packOuverts:{}, packsReplies:false, packSel:{},
    // état transitoire des modales
    form:null, opMode:null, opForm:null,
    matReceptForm:null, matResForm:null, matBatch:null, releaseForm:null, editMission:null,
    packEdit:null, packBorrow:null,

/* données partagées entre tous les utilisateurs (serveur) vs préférences locales du poste */
const SHARED = ["refs","cabinets","assignments","movements","materiel","matRes","matLog","missions","missionStatus","templates","packs","equipes","dotations","pieces"];
const PREFS  = ["theme","profilWidgets","colFiltres","brand","cabinet","matCat","logFilter","logScope","showArchived","stockPhonePageSize","stockMaterialPageSize","adminPhoneSize","adminMaterialSize","adminConsoSize"];
const SERVER = location.protocol === "http:" || location.protocol === "https:";

let version = 0, online = true, enCours = false;

/* ---------- session ---------- */

function cookie(nom){
  const m = document.cookie.match("(^|;)\\s*"+nom+"\\s*=\\s*([^;]+)");
  return m ? m.pop() : "";
}

/* Chaque onglet a sa propre session : il vit sous `/u/<compte>/` (ou `/s-…/`
   avant la connexion), et ses cookies
   portent ce nom (voir comptes/onglets.py). Le jeton CSRF se lit donc sous le
   nom de l'onglet. */
const ONGLET = (()=>{
  const anonyme = location.pathname.match(/^\/(s-[0-9a-f]{12})\//);
  if(anonyme) return anonyme[1];
  const compte = location.pathname.match(/^\/u\/([^/]+)\//);
  if(!compte) return "";
  let nom;
  try{ nom = decodeURIComponent(compte[1]); }catch(e){ return ""; }
  // Même écriture que `suffixe()` côté serveur : un nom de cookie n'accepte pas
  // n'importe quel caractère, l'identifiant y figure donc en hexadécimal.
  return "u-" + Array.from(new TextEncoder().encode(nom))
    .map(o=>o.toString(16).padStart(2, "0")).join("");
})();
const jetonCsrf = ()=>cookie(ONGLET ? "csrftoken_"+ONGLET : "csrftoken");

/* Django refuse une déconnexion en GET depuis la version 5 : il faut un POST
   accompagné du jeton anti-CSRF, d'où ce formulaire construit à la volée. */
function deconnexion(){
  oublierPage();
  const f = document.createElement("form");
  f.method = "POST";
  f.action = "deconnexion/";
  const jeton = document.createElement("input");
  jeton.type = "hidden";
  jeton.name = "csrfmiddlewaretoken";
  jeton.value = jetonCsrf();
  f.appendChild(jeton);
  document.body.appendChild(f);
  f.submit();
}

/* Session expirée, ou mot de passe à renouveler : le serveur répond 401 ou 403.
   Inutile d'insister, on renvoie la personne là où elle doit aller. */
function sessionPerdue(res){
  if(res.status !== 401 && res.status !== 403) return false;
  if(res.status === 401) oublierPage();
  location.href = res.status === 401 ? "connexion/" : "mot-de-passe/";
  return true;
}

/* Les réglages d'affichage (filtres, lignes par page…) appartiennent au
   **compte** : ils sont enregistrés sur le serveur, et chacun retrouve les siens
   en se connectant, sur n'importe quel poste.

   Ils ne regardent que la personne, pas l'équipe : rien ici n'est partagé. */
/* Thème : « sombre », « clair », ou « auto » qui suit le système. Il s'applique
   à l'élément racine ; toutes les couleurs de la page sont des variables. */
const SYSTEME_CLAIR = window.matchMedia ? matchMedia("(prefers-color-scheme: light)") : null;
function appliquerTheme(){
  const choix = S && (S.theme==="clair" || S.theme==="auto") ? S.theme : "sombre";
  const clair = choix==="clair" || (choix==="auto" && SYSTEME_CLAIR && SYSTEME_CLAIR.matches);
  document.documentElement.dataset.theme = clair ? "light" : "dark";
}
if(SYSTEME_CLAIR && SYSTEME_CLAIR.addEventListener)
  SYSTEME_CLAIR.addEventListener("change", ()=>{ if(S && S.theme==="auto") appliquerTheme(); });

let dernierEnvoi = "";
let minuterieReglages = null;
function reglagesCourants(){
  const o = {};
  PREFS.forEach(k=>{
    const v = S[k];
    // Le serveur n'accepte que des valeurs bien typées : on n'envoie que celles-là.
    if(typeof v === "string" || typeof v === "number" || typeof v === "boolean") o[k] = v;
    else if(k === "profilWidgets" && Array.isArray(v)) o[k] = v;
  });
  return o;
}
function savePrefs(){
  if(!SERVER) return;
  clearTimeout(minuterieReglages);
  minuterieReglages = setTimeout(async ()=>{
    const o = reglagesCourants();
    const brut = JSON.stringify(o);
    if(brut === dernierEnvoi) return;
    try{
      const res = await fetch("api/reglages", {
        method:"POST",
        headers:{"Content-Type":"application/json", "X-CSRFToken":jetonCsrf()},
        body: JSON.stringify({reglages:o})});
      if(sessionPerdue(res)) return;
      if(res.ok) dernierEnvoi = brut;
    }catch(e){}
  }, 600);
}
function appliquerReglages(r){
  if(r) PREFS.forEach(k=>{ if(r[k]!==undefined) S[k]=r[k]; });
  normaliserFiltres();
  // Avant la refonte, « Téléphones » et « Matériel » étaient des valeurs du filtre de type.
  if(S.logFilter==="Téléphones" || S.logFilter==="Matériel"){ S.logScope = S.logFilter; S.logFilter = "Tous"; }
  appliquerTheme();
  dernierEnvoi = JSON.stringify(reglagesCourants());
}

/* La page ouverte, elle, est propre à l'onglet : on la retrouve en rechargeant,
   mais une session qui s'ouvre commence toujours par le profil. Elle est
   rattachée au compte, pour qu'un autre compte ne reprenne pas la page du
   précédent. */
const CLE_PAGE = "heimdall_page";
const PAGES = ["profil","groupe","stock","armoire","materiel","missions","journal","admin"];
function pageDeLOnglet(compte){
  try{
    const [qui, page] = (sessionStorage.getItem(CLE_PAGE) || "").split("|");
    if(qui === compte && PAGES.includes(page)) return page;
  }catch(e){}
  return "profil";
}
function memoriserPage(){
  try{ sessionStorage.setItem(CLE_PAGE, OPERATOR+"|"+S.page); }catch(e){}
}
function oublierPage(){
  try{ sessionStorage.removeItem(CLE_PAGE); }catch(e){}
}

/* ---------- actions ----------

   Le navigateur ne calcule plus le résultat des opérations et n'envoie plus
   l'état entier : il décrit son intention, le serveur décide. Trois issues
   possibles, toutes traitées ici :

   - acceptée : le serveur renvoie la différence, qu'on applique ;
   - refusée (422) : son message est affiché tel quel, rien n'a changé ;
   - injoignable : on le signale et on laisse le sondage rétablir l'affichage.
*/
/* Les données propres au compte, jointes à chaque réponse du serveur. Renvoie vrai si
   l'une d'elles a changé, pour que l'appelant redessine. */
function appliquerEnveloppe(d){
  const avant = JSON.stringify([S.dotations, S.pret, S.plancherMissions, S.gestionMissions,
                                S.annuaire, S.moi, S.comptesRoles, S.groupes, S.pretsExternes]);
  if(d.dotations) S.dotations = d.dotations;
  if(d.pretsExternes) S.pretsExternes = d.pretsExternes;
  if(d.pret) S.pret = d.pret;
  if(d.plancherMissions) S.plancherMissions = d.plancherMissions;
  if(d.gestionMissions) S.gestionMissions = d.gestionMissions;
  if(d.annuaire) S.annuaire = d.annuaire;
  if(d.moi) S.moi = d.moi;
  if(d.comptesRoles) S.comptesRoles = d.comptesRoles;
  if(d.groupes) S.groupes = d.groupes;
  return avant !== JSON.stringify([S.dotations, S.pret, S.plancherMissions, S.gestionMissions,
                                   S.annuaire, S.moi, S.comptesRoles, S.groupes, S.pretsExternes]);
}

async function agir(nom, params){
  if(enCours) return false;                 // évite le double-clic
  enCours = true;
  render();
  try{
    const res = await fetch("api/action",{
      method:"POST",
      headers:{"Content-Type":"application/json", "X-CSRFToken":jetonCsrf()},
      // Le nom emprunté voyage avec l'action : le serveur vérifie qu'on a le
      // droit de l'employer, et l'inscrit dans son historique.
      body: JSON.stringify({action:nom, params: AUTEUR
        ? Object.assign({}, params||{}, {auteur:AUTEUR})
        : (params||{})})
    });
    if(sessionPerdue(res)){ return false; }
    const d = await res.json().catch(()=>({}));
    if(res.status===422){
      syncNote(d.error || "Action impossible.");
      return false;
    }
    if(!res.ok) throw new Error("HTTP "+res.status);
    version = d.version;
    if(d.secret) S.motDePasseProvisoire = {compte:(params||{}).compte, valeur:d.secret};
    if(d.user) OPERATOR = d.user;
    if(d.admin!==undefined) ADMIN = !!d.admin;
    if(d.comptes) COMPTES = d.comptes;
    appliquerEnveloppe(d);
    if(d.delta) appliquerDelta(d.delta); else await rechargerTout();
    online = true;
    return true;
  }catch(e){
    console.warn("[action] "+nom+" a échoué :", e);
    online = false;
    syncNote("Le serveur n'a pas répondu. Vérifiez que rien n'a été enregistré avant de recommencer.");
    return false;
  }finally{
    enCours = false;
    render();
  }
}

/* Applique une différence reçue du serveur.
   Miroir exact de `appliquer_delta()` dans stock/tests_actions.py : si les deux
   divergent, l'affichage se met à mentir. */
function appliquerDelta(delta){
  const fusionner = (liste, nouveaux, cle)=>{
    nouveaux.forEach(n=>{
      const i = liste.findIndex(x=>x[cle]===n[cle]);
      if(i>=0) liste[i] = n; else liste.push(n);
    });
  };
  if(delta.refs) fusionner(S.refs, delta.refs, "id");
  (delta.refsSupprimes||[]).forEach(id=>{ S.refs = S.refs.filter(r=>r.id!==id); });
  if(delta.materiel) fusionner(S.materiel, delta.materiel, "id");
  (delta.materielSupprimes||[]).forEach(id=>{
    S.materiel = S.materiel.filter(m=>(m.id||m.name)!==id);
    delete S.matRes[id];
  });
  Object.keys(delta.matRes||{}).forEach(nom=>{
    // Une liste vide signifie « plus aucun emprunt » : on retire la clé, pour
    // rester identique à ce que renverrait un rechargement complet.
    if(delta.matRes[nom].length) S.matRes[nom] = delta.matRes[nom];
    else delete S.matRes[nom];
  });
  ["missions","missionStatus","templates","packs","equipes","cabinets","assignments","pieces"].forEach(k=>{
    if(delta[k]!==undefined) S[k] = delta[k];
  });
  if(delta.movementsNouveaux) S.movements = delta.movementsNouveaux.concat(S.movements);
  if(delta.matLogNouveaux)    S.matLog    = delta.matLogNouveaux.concat(S.matLog);
  if(delta.dotations) S.dotations = delta.dotations;
  S.refs.forEach(derive);
  recadrer();
}

function adopt(d){
  version = d.version;
  if(d.delta){ appliquerDelta(d.delta); render(); return; }
  const st = d.state || {};
  SHARED.forEach(k=>{ if(st[k]!==undefined) S[k]=st[k]; });
  S.refs.forEach(derive);
  recadrer();
  render();
}

/* Après un changement venu d'ailleurs, la sélection courante peut désigner
   quelque chose qui n'existe plus. */
function recadrer(){
  if(!S.cabinets.length) return;
  if(!S.cabinets.some(c=>c.id===S.cabinet)) S.cabinet = S.cabinets[0].id;
  if(S.selId && !S.refs.some(r=>r.id===S.selId)) S.selId = null;
  if(S.assigning && !S.refs.some(r=>r.id===S.assigning)) S.assigning = null;
}

async function rechargerTout(){
  const res = await fetch("api/state");
  if(sessionPerdue(res)) return;
  if(!res.ok) throw new Error("HTTP "+res.status);
  adopt(await res.json());
}

function syncNote(msg){
  S.syncMsg = msg; render();
  setTimeout(()=>{ if(S.syncMsg===msg){ S.syncMsg = null; render(); } }, 7000);
}

async function pull(){
  if(enCours) return;                       // une action est en vol
  try{
    const res = await fetch("api/state?since="+version);
    if(sessionPerdue(res)) return;
    if(!res.ok) throw new Error("HTTP "+res.status);
    const d = await res.json();
    if(!online){ online = true; render(); }
    if(d.user && d.user !== OPERATOR){ OPERATOR = d.user; render(); }
    if(d.admin!==undefined && !!d.admin !== ADMIN){ ADMIN = !!d.admin; render(); }
    if(d.comptes) COMPTES = d.comptes;
    // Ce qui est propre au compte (rôle, groupe, sacs, prêts…) change sans que le
    // stock change : sans ce redessin, « Mon groupe » n'apparaissait qu'au prochain clic.
    if(appliquerEnveloppe(d) && !d.changed) render();
    if(d.changed) adopt(d);
  }catch(e){
    console.warn("[sync] lecture échouée :", e);
    if(online){ online = false; render(); }
  }
}

let S;

/* ---------- moteur de rendu minimal ---------- */
let H = [];
const h   = fn => (H.push(fn), H.length-1);
const on  = fn => 'data-c="'+h(fn)+'"';   // click
const oni = fn => 'data-i="'+h(fn)+'"';   // input
const ong = fn => 'data-g="'+h(fn)+'"';   // change

/* `set` mémorise une préférence d'affichage, `setT` ne fait que redessiner.
   Les données métier, elles, ne se modifient plus qu'à travers `agir()`. */
function set(patch){ Object.assign(S,patch); if("theme" in patch) appliquerTheme(); savePrefs(); render(); }
function setT(patch){ Object.assign(S,patch); render(); }

/* ---------- affectation des casiers (2 passes, aucun casier perdu) ---------- */
function placement(extra){
  const slots = [];
  S.cabinets.forEach(c=>{
    for(let s=1;s<=c.shelves;s++)
      for(let k=1;k<=c.cols;k++)
        slots.push({cab:c.id, shelf:"E"+s, col:"C"+k, key:c.id+"E"+s, loc:c.id+"·E"+s+"·C"+k});
  });
  const map = {}, used = slots.map(()=>false), pending = [];

  // casiers choisis manuellement : priorité absolue.
  // Plusieurs modèles peuvent pointer vers le même casier (casier partagé).
  const manual = Object.assign({}, S.assignments, extra||{});
  Object.keys(manual).forEach(refId=>{
    const i = slots.findIndex(s=>s.loc===manual[refId]);
    if(i>=0 && S.refs.some(r=>r.id===refId)){ used[i]=true; map[refId]=slots[i]; }
  });

  const order = [];
  S.refs.forEach(r=>{ if(order.indexOf(r.brand)<0) order.push(r.brand); });

  order.forEach(b=>{
    const block = S.refs.filter(r=>r.brand===b && !map[r.id]);
    if(!block.length) return;
    let at = -1;
    for(let i=0;i<slots.length;i++){
      if(used[i]) continue;
      let free = true;
      for(let j=0;j<block.length;j++) if(i+j>=slots.length || used[i+j]){ free=false; break; }
      if(!free) continue;
      const startsShelf = slots[i].col==="C1";
      const sameShelf = slots[i+block.length-1].key===slots[i].key;
      if(startsShelf || sameShelf){ at=i; break; }
    }
    if(at>=0) block.forEach((r,j)=>{ map[r.id]=slots[at+j]; used[at+j]=true; });
    else block.forEach(r=>pending.push(r));
  });

  let p = 0;
  for(let i=0;i<slots.length && p<pending.length;i++){
    if(!used[i]){ used[i]=true; map[pending[p++].id]=slots[i]; }
  }
  for(;p<pending.length;p++) map[pending[p].id]=null;
  S.refs.forEach(r=>{ if(!(r.id in map)) map[r.id]=null; });
  return map;
}

/* recherche limitée au nom commercial, à la marque et à la réf. fabricant */
function matches(r,q){
  if(!q) return false;
  const t = q.toLowerCase().trim();
  return (r.brand+" "+r.model+" "+r.mpn).toLowerCase().includes(t)
    || r.mpn.toLowerCase().replace(/-/g,"").includes(t.replace(/-/g,""));
}

/* La couleur d'un type de mouvement dit son état, jamais autre chose : vert pour ce qui
   rentre (entrée, retour), ambre pour ce qui est à suivre (sortie, consommé, réservé),
   rouge pour ce qui détruit, neutre sinon (ajustement, transfert, annulation). */
const LIBELLE_TYPE = {"RÉSERV.":"Réservation", "ANNUL.":"Annulation", "TRANSF.":"Transfert", "AJUST.":"Ajustement"};
const kindLibelle = k=>LIBELLE_TYPE[k] || (k ? k.charAt(0)+k.slice(1).toLowerCase() : "");
/* La pastille d'un type de mouvement reprend la couleur de son état. */
const COULEUR_ETAT = {ok:"var(--ok)", warn:"var(--warn)", bad:"var(--danger)", info:"var(--info)", mut:"var(--muted)"};
function kindCls(kind){
  if(kind==="ENTRÉE"||kind==="RETOUR") return "ok";
  if(kind==="SORTIE"||kind==="CONSOMMÉ"||kind==="RÉSERV."||kind==="CRÉATION") return "warn";
  if(kind && kind.startsWith("SUPPR")) return "bad";
  return "mut";
}

/* Journal unifié : mouvements de téléphones + mouvements de matériel.
   Les mouvements téléphone sont stockés sous forme « Action — n × Modèle » :
   on en extrait l'article et la quantité pour les afficher en colonnes. */
/* L'ISO se trie alphabétiquement dans l'ordre chronologique : plus besoin de
   recomposer une clé à partir d'un jour, d'un mois et d'une année séparés. */
function logSortKey(e){ return String(e.iso||""); }
function journalRows(){
  const phone = S.movements.map(m=>{
    const parts = String(m.label||"").split(" — ");
    let item = parts.length>1 ? parts.slice(1).join(" — ") : String(m.label||"");
    const q = item.match(/^(\d+)\s*×\s*/);
    if(q) item = item.slice(q[0].length);
    return { source:"phone", iso:m.iso, kind:m.kind, item,
             loc:m.loc||"", identite:"", qty:q?Number(q[1]):null,
             who:m.user||"—", mission:"—" };
  });
  const mat = S.matLog.map(e=>({
    source:"mat", iso:e.iso, kind:e.kind, item:e.item,
    loc:"", identite:e.identite||"", qty:e.qty, who:e.who||"—",
    mission:e.mission||"—", commentaire:e.commentaire||""
  }));
  return phone.concat(mat).sort((a,b)=>logSortKey(b).localeCompare(logSortKey(a)));
}
/* Lien vers le tableau de bord d'une mission. Relatif à la page courante, donc
   valable sous n'importe quel préfixe, et à l'adresse que l'utilisateur emploie
   déjà (IP du serveur sur le LAN). */
function lienMission(name){
  // Sans la partie de l'onglet : le lien se partage, et ouvert ailleurs il
  // reçoit l'onglet de celui qui l'ouvre.
  return location.origin + "/missions/" + encodeURIComponent(name) + "/";
}
/* Pour OUVRIR la fiche d'une mission depuis l'application : l'adresse reste dans
   l'onglet courant, dont le cookie de session authentifie la demande. L'adresse
   de `lienMission`, elle, est faite pour être partagée et ne porte pas l'onglet :
   ouverte telle quelle, elle redemanderait une connexion. */
function adresseMission(name){
  return new URL("missions/"+encodeURIComponent(name)+"/", location.href).href;
}
/* `navigator.clipboard` n'existe qu'en HTTPS ou sur localhost : sur le LAN en
   HTTP simple il est absent, d'où le repli par un champ temporaire. */
async function copierLien(url, nom){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(url); }
    else{
      const t=document.createElement("textarea");
      t.value=url; t.style.position="fixed"; t.style.opacity="0";
      document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove();
    }
    syncNote("Lien de « "+nom+" » copié");
  }catch(e){ window.prompt("Copiez ce lien :", url); }
}
/* Date du jour du poste, au format des dates prévues (AAAA-MM-JJ). */
function aujourdhui(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function missionArchived(name){
  return !!(S.missions.find(m=>m.name===name)||{}).archived;
}
/* missions proposées pour une nouvelle réservation : les archivées sont exclues */
function missionNames(){
  const derived = new Set();
  Object.keys(S.matRes).forEach(k=>(S.matRes[k]||[]).forEach(r=>derived.add(r.mission)));
  return [SANS_MISSION, ...Array.from(new Set([...S.missions.map(m=>m.name), ...derived]))
    .filter(n=>n!==SANS_MISSION && !missionArchived(n))];
}
/* ---------- suppression d'un article du stock ----------

   L'action est réservée aux administrateurs, et le serveur la refuse à tout
   autre : le bouton n'est qu'une commodité, pas le contrôle. Il refuse en
   revanche de proposer une suppression que le serveur rejetterait — un
   article encore sorti ou réservé —, parce qu'un bouton qui ne mène qu'à un
   refus ne rend service à personne.

   Ces deux fonctions doivent rester d'accord avec `telephone.supprimer` et
   `materiel.supprimer` dans coeur/regles.py. */

function telephoneBloque(r){
  return (r.reservations||[]).length + (r.outs||[]).length;
}
function materielBloque(m){
  return (S.matRes[m.id||m.name]||[]).filter(r=>!r.returned)
    .reduce((s,r)=>s+r.qty, 0);
}
/* ---------- pièces détachées de téléphones ---------- */
const TYPES_PIECES = ["Écran", "Batterie", "Connecteur de charge", "Caméra", "Haut-parleur", "Nappe", "Coque", "Autre"];

    ? {id:piece.id, nom:piece.name, type:piece.type, mpn:piece.mpn, notes:piece.notes, qty:0, modeles:piece.modeles.slice(), recherche:""}
    : {id:null, nom:"", type:TYPES_PIECES[0], mpn:"", notes:"", qty:0, modeles:[], recherche:""}});
}
async function enregistrerPiece(){
  const f = S.pieceForm; if(!f || !(f.nom||"").trim()) return;
  const base = {nom:f.nom.trim(), type:(f.type||"").trim()||"Autre", mpn:(f.mpn||"").trim(), notes:(f.notes||"").trim(), modeles:f.modeles};
  const ok = f.id ? await agir("piece.modifier", Object.assign({id:f.id}, base))
                  : await agir("piece.creer", Object.assign({qty:Math.max(0, Number(f.qty)||0)}, base));
  if(ok) setT({pieceForm:null});
}
function ouvrirMouvementPiece(piece, genre){ setT({pieceMvt:{id:piece.id, genre, qty:1, motif:""}}); }
async function enregistrerMouvementPiece(){
  const f = S.pieceMvt; if(!f) return;
  const qty = Number(f.qty);
  if(!Number.isInteger(qty) || qty < 1){ syncNote("La quantité doit être un entier positif."); return; }
  const ok = f.genre==="entree" ? await agir("piece.entree", {id:f.id, qty})
                                : await agir("piece.sortie", {id:f.id, qty, motif:(f.motif||"").trim()});
  if(ok) setT({pieceMvt:null});
}

  agir("piece.supprimer", {id:piece.id});
}

function setMissionArchived(name, meta, val){
  agir("mission.archiver", { nom:name, archive:val });
}
/* disponible = quantité en stock − réservations non rendues */
function matAvailable(name){
  const it = S.materiel.find(m=>(m.id||m.name)===name);
  const already = (S.matRes[name]||[]).filter(r=>!r.returned).reduce((s,r)=>s+r.qty,0);
  return Math.max(0, (it?it.qty:0) - already);
}
/* La categorie d'un article, ou rien s'il a ete supprime. */
function matCategorie(id){
  const m = S.materiel.find(x=>(x.id||x.name)===id);
  return m ? m.cat : "";
}
function estConsommable(id){ return matCategorie(id)===CATEGORIE_CONSOMMABLE; }

/* Ce qu'une mission detient encore, regroupe par article : une mission peut
   avoir sorti le meme article en deux fois, et la restitution ne demande
   qu'une quantite par article. */
function lignesOuvertesMission(nom){
  const par = {};
  Object.keys(S.matRes).forEach(id=>(S.matRes[id]||[]).forEach(r=>{
    if(r.mission===nom && !r.returned) par[id] = (par[id]||0) + r.qty;
  }));
  return Object.keys(par).map(id=>({ id, qty:par[id] }));
}

/* Total consomme par article, lu dans le journal. Le stock dit ce qui reste,
   pas ce qui est parti : sans ce cumul, l'administration ne saurait pas a
   quel rythme un consommable se vide. */
function totalConsomme(id){
  const nom = matLabel(id);
  return S.matLog.filter(e=>e.kind==="CONSOMMÉ" && e.item===nom)
                 .reduce((s,e)=>s+e.qty, 0);
}

function matLabel(id){
  const m = S.materiel.find(x=>(x.id||x.name)===id);
  return m ? m.name : id;
}
/* Ce qui distingue un exemplaire de ses jumeaux. Depuis que le template
   laisse designer lequel on emporte, le libelle seul ne suffit plus a dire
   ce qui est sorti : trois perceuses portent le meme nom, et c'est
   l'etiquette qui dit laquelle est partie. Vide quand rien ne les distingue,
   ou quand l'article a ete supprime. */
function matDetail(id){
  const m = S.materiel.find(x=>(x.id||x.name)===id);
  return m ? exemplaireDetail(m) : "";
}
/* ---------- templates de mission ----------

   Un template dit ce qu'il faut emporter, pas ce qui est réservé. Chaque
   ligne vise soit un type d'article — n'importe quelle perceuse fera
   l'affaire —, soit un exemplaire nommément désigné, et c'est `genre` qui le
   dit. Les fonctions qui suivent sont le miroir de `_servir_template()` dans
   coeur/regles.py : si les deux divergent, l'écran promet ce que le serveur
   refusera. */

/* Le catalogue vu par les templates : un article par libellé, ses exemplaires
   regroupés dessous. C'est exactement la distinction que l'écran donne à
   choisir. */
function catalogueMateriel(){
  const groupes = new Map();
  S.materiel.forEach(m=>{
    const cle = (m.name||"").toLowerCase();
    let g = groupes.get(cle);
    if(!g) groupes.set(cle, g = { libelle:m.name, cat:m.cat, exemplaires:[] });
    g.exemplaires.push(m);
  });
  return Array.from(groupes.values())
    .sort((a,b)=>a.libelle.localeCompare(b.libelle,"fr"));
}

/* Ce qui distingue deux exemplaires du même article. Vide quand rien ne les
   distingue : mieux vaut ne rien afficher qu'un « sans identifiant » répété. */
function exemplaireDetail(m){
  const bits = [];
  if(m.etiquette) bits.push("étiquette "+m.etiquette);
  if(m.numeroSerie) bits.push("série "+m.numeroSerie);
  return bits.join(" · ");
}


function libelleLigneTemplate(ligne){
  if(ligne.genre!=="exemplaire") return ligne.libelle;
  const m = S.materiel.find(x=>(x.id||x.name)===ligne.id);
  const detail = m ? exemplaireDetail(m) : "";
  return ligne.libelle + (detail ? " · "+detail : "");
}

/* Le pastillage d'une ligne : son genre, puis son état vis-à-vis du stock. */
function badgesLigneTemplate(ligne){
  const dispo = dispoLigneTemplate(ligne);
  const genre = ligne.genre==="exemplaire"
    ? '<span class="badge info">EXEMPLAIRE</span>'
    : '<span class="badge mut">TYPE</span>';
  if(dispo===null) return genre+'<span class="badge bad">ARTICLE SUPPRIMÉ</span>';
  if(dispo < ligne.qty) return genre+'<span class="badge bad">'+dispo+' DISPO.</span>';
  return genre;
}

function ouvrirTemplate(t){
  setT({ templateEdit:{
    origine: t ? t.name : null,
    nom: t ? t.name : "",
    lignes: t ? t.items.map(i=>({ genre:i.genre, libelle:i.libelle, id:i.id, qty:i.qty })) : [],
    q:"", page:0, deplie:{}
  }});
}

/* Ajouter deux fois la même chose incrémente la quantité plutôt que de créer
   un doublon — que le serveur refuserait, et à juste titre. */
function ajouterLigneTemplate(ligne){
  const f = S.templateEdit; if(!f) return;
  const existante = f.lignes.find(x=> x.genre===ligne.genre && (ligne.genre==="exemplaire"
    ? x.id===ligne.id
    : (x.libelle||"").toLowerCase()===(ligne.libelle||"").toLowerCase()));
  if(existante) existante.qty = Number(existante.qty||0) + 1;
  else f.lignes.push(ligne);
  render();
}

async function enregistrerTemplate(){
  const f = S.templateEdit; if(!f) return;
  const nom = (f.nom||"").trim();
  const lignes = f.lignes.map(l=>({
    genre:l.genre, libelle:l.libelle, id:l.id, qty:Math.max(1, Number(l.qty)||1)
  }));
  if(!nom || !lignes.length) return;
  const ok = f.origine
    ? await agir("mission.template.modifier", { nom:f.origine, nouveauNom:nom, lignes })
    : await agir("mission.template.creer", { nom, lignes });
  if(ok) setT({ templateEdit:null });
}

const TEMPLATES_PAR_PAGE = 6;
const ARTICLES_PAR_PAGE = 6;

  return `

    ${lignes || `<div style="padding:24px 16px;color:var(--c-6d7480);font:400 12px Inter,system-ui,sans-serif">${q?"Aucun template correspondant.":"Aucun template. Créez-en un pour préparer une mission en un clic."}</div>`}

function editeurTemplate(f){
  const composition = f.lignes.map((ligne,i)=>`
    <div style="display:flex;align-items:center;gap:10px;padding:9px 11px">
      <span style="display:flex;gap:5px;flex:none">${badgesLigneTemplate(ligne)}</span>
      <span style="flex:1;min-width:0;font:400 12px Inter,system-ui,sans-serif;color:var(--c-c3c9d3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(libelleLigneTemplate(ligne))}</span>
      <input class="inp" data-k="tplqty-${i}" type="number" min="1" max="100000" style="width:78px;padding:6px 8px;flex:none" value="${esc(ligne.qty)}" ${oni(e=>{ligne.qty=e.target.value;})}>
      <button class="btn-mini hred" style="flex:none" ${on(()=>{ f.lignes.splice(i,1); render(); })}>Retirer</button>
    </div>`).join("");

  const q = (f.q||"").trim().toLowerCase();
  const groupes = catalogueMateriel().filter(g=> !q
    || g.libelle.toLowerCase().includes(q)
    || (g.cat||"").toLowerCase().includes(q)
    || g.exemplaires.some(m=>exemplaireDetail(m).toLowerCase().includes(q)));
  const pages = Math.max(1, Math.ceil(groupes.length/ARTICLES_PAR_PAGE));
  const page = Math.min(f.page, pages-1);
  const visibles = groupes.slice(page*ARTICLES_PAR_PAGE, (page+1)*ARTICLES_PAR_PAGE);

  const catalogue = visibles.map(g=>{
    const cle = g.libelle.toLowerCase();
    const deplie = !!f.deplie[cle];
    const dispo = g.exemplaires.reduce((n,m)=>n+matAvailable(m.id||m.name), 0);
    const total = g.exemplaires.reduce((n,m)=>n+m.qty, 0);
    const exemplaires = !deplie ? "" : g.exemplaires.map(m=>{
      const id = m.id||m.name, detail = exemplaireDetail(m);
      return `
      <div style="display:flex;align-items:center;gap:10px;padding:7px 11px 7px 26px;border-top:1px solid var(--c-1f232a)">
        <span style="flex:1;min-width:0;font:400 12px Inter,system-ui,sans-serif;color:var(--c-9aa2af);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(detail||"Exemplaire sans identifiant")}</span>
        <span style="font:400 12px Inter,system-ui,sans-serif;color:var(--c-6d7480);flex:none">${matAvailable(id)} / ${m.qty} dispo.</span>
        <button class="btn-mini hblue" style="flex:none" ${on(()=>ajouterLigneTemplate({genre:"exemplaire", libelle:g.libelle, id, qty:1}))}>+ Celui-ci</button>
      </div>`;
    }).join("");
    return `
    <div style="border-bottom:1px solid var(--c-1f232a)">
      <div style="display:flex;align-items:center;gap:10px;padding:9px 11px">
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font:500 12px Inter,system-ui,sans-serif;color:var(--c-eef0f4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(g.libelle)}</span>
          <span style="font:400 12px Inter,system-ui,sans-serif;color:var(--c-6d7480)">${esc(g.cat||"—")} · ${g.exemplaires.length} exemplaire${g.exemplaires.length>1?"s":""} · ${dispo} / ${total} dispo.</span>
        </span>
        <button class="btn-mini hblue" style="flex:none" ${on(()=>ajouterLigneTemplate({genre:"type", libelle:g.libelle, id:null, qty:1}))}>+ Ce type</button>
        <button class="btn-mini hwhite" style="flex:none" ${on(()=>{ f.deplie[cle] = !deplie; render(); })}>${deplie?"Masquer":"Un précis"}</button>
      </div>
      ${exemplaires}
    </div>`;
  }).join("");

  const nom = (f.nom||"").trim();
  const pret = !!nom && !!f.lignes.length;
  return `
  <div class="card template-editor-card" style="display:${S.adminTab==="templates"?"block":"none"}">
    <div style="padding:14px 16px;border-bottom:1px solid var(--c-23262d);display:flex;align-items:center;gap:12px">

/* Les exemplaires qui peuvent servir une ligne : celui qu'elle nomme, ou
   tous ceux qui portent son libellé. */
function candidatsLigneTemplate(ligne){
  return ligne.genre==="exemplaire"
    ? S.materiel.filter(m=>(m.id||m.name)===ligne.id)
    : S.materiel.filter(m=>(m.name||"").toLowerCase()===(ligne.libelle||"").toLowerCase());
}

/* Ce que le stock peut servir pour une ligne, ou `null` si l'article qu'elle
   nomme a disparu — auquel cas la ligne est cassée, pas insuffisante. */
function dispoLigneTemplate(ligne){
  const cibles = candidatsLigneTemplate(ligne);
  if(!cibles.length) return null;
  return cibles.reduce((n,m)=>n+matAvailable(m.id||m.name), 0);
}

/* Ce que la personne a désigné pour une ligne, et ce qu'il reste à servir
   automatiquement. Miroir de `_servir_template()` dans coeur/regles.py. */
function designesLigne(ligne){
  const par = S._mChoix[ligne.ligne] || {};
  const total = Object.values(par).reduce((n,q)=>n+(Number(q)||0), 0);
  return { par, total, reste: ligne.qty - total, trop: total > ligne.qty };
}

function poserChoixLigne(ligne, id, quantite){
  const par = Object.assign({}, S._mChoix[ligne.ligne] || {});
  const n = Math.max(0, Number(quantite)||0);
  if(n) par[id] = n; else delete par[id];
  setT({ _mChoix: Object.assign({}, S._mChoix, {[ligne.ligne]: par}) });
}

/* ---------- ce que chaque compte détient ----------

   L'onglet « Comptes » de l'administration. Il ne demande rien de plus au
   serveur : tout est déjà dans l'état synchronisé, et la boucle de
   synchronisation le rafraîchit comme le reste. Une carte cesse donc d'être à
   jour au plus deux secondes et demie après un emprunt, sans qu'on ait à la
   rouvrir.

   `COMPTES` n'est rempli que pour un administrateur — le serveur n'envoie la
   liste des comptes à personne d'autre. */

/* Depuis combien de temps, dit en une expression.

   La date absolue reste affichée à côté : « depuis 3 jours » répond à la
   question qu'on se pose, « 10/09 » à celle qu'on posera ensuite. Un emprunt
   antérieur à l'enregistrement des dates de départ n'en a pas ; l'inventer
   serait pire que l'admettre. */
function depuisQuand(iso){
  const d = quand(iso);
  if(!d) return "depuis une date inconnue";
  const minutes = Math.floor((Date.now() - d.getTime()) / 60000);
  if(minutes < 1)  return "à l'instant";
  if(minutes < 60) return "depuis " + minutes + " min";
  const heures = Math.floor(minutes / 60);
  if(heures < 24)  return "depuis " + heures + " h";
  const jours = Math.floor(heures / 24);
  if(jours < 31)   return "depuis " + jours + " jour" + (jours > 1 ? "s" : "");
  const mois = Math.floor(jours / 30);
  return "depuis " + mois + " mois";
}

/* Tout ce qu'un compte détient, des trois sources qui existent : le matériel
   emprunté pour une mission, les téléphones sortis de l'armoire, et les
   téléphones réservés. La réservation compte : l'appareil n'a pas quitté son
   casier, mais personne d'autre ne peut le prendre. */
function possessionsDe(compte){
  const lignes = [];
  (S.dotations[compte]||[]).forEach(d=>{
    // Une ligne de sac designe un exemplaire precis : son etiquette et son
    // numero de serie sont ce qui distingue le portable de Compte-001 des deux
    // autres identiques. Sans eux, « Dell Latitude 5450 » ne dit pas lequel.
    const marques = [];
    if(d.etiquette) marques.push("étiquette "+d.etiquette);
    if(d.numeroSerie) marques.push("série "+d.numeroSerie);
    if(d.manquant) marques.push("article supprimé du catalogue");
    else if(!marques.length) marques.push("sans identifiant");
    // Le detail saisi a la main vient apres l'identite, qui est la donnee sure.
    if(d.detail) marques.push(d.detail);
    // Ce que ce sac a prêté et qui n'est pas revenu.
    if(compte === auteurEffectif()){
      S.pret.prets.filter(x=>x.article===d.article).forEach(x=>
        marques.push("prêté à "+x.a+" ("+x.quantite+")"));
    }
    lignes.push({ genre:"dotation", libelle:d.libelle||d.article,
                  detail:marques.join(" · "), qty:d.quantite,
                  contexte:"Sac attribué à l'arrivée", iso:null,
                  manquant:!!d.manquant });
  });
  Object.keys(S.matRes).forEach(id=>{
    (S.matRes[id]||[]).forEach(r=>{
      if(r.returned || r.by !== compte) return;
      lignes.push({ genre:"matériel", libelle:matLabel(id), detail:matDetail(id),
                    qty:r.qty, contexte:(r.mission || "—") + (r.sacDe ? " · prêté par "+r.sacDe+(r.forcePar?" (forcé par "+r.forcePar+")":"") : ""), iso:r.iso || null });
    });
  });
  S.refs.forEach(ref=>{
    (ref.outs||[]).forEach(o=>{
      if(o.who !== compte) return;
      lignes.push({ genre:"téléphone", libelle:ref.brand+" "+ref.model,
                    detail:o.variant || "", qty:o.qty, contexte:"Sorti de l'armoire",
                    iso:o.iso || null });
    });
    (ref.reservations||[]).forEach(r=>{
      if(r.who !== compte) return;
      lignes.push({ genre:"réservation", libelle:ref.brand+" "+ref.model,
                    detail:r.variant || "", qty:r.qty, contexte:"Réservé, encore en casier",
                    iso:r.iso || null });
    });
  });
  // Le plus ancien en tête : c'est ce qui traîne qui appelle une relance.
  // Une ligne sans date passe en premier — elle traîne depuis plus longtemps
  // encore que la plus ancienne datée, puisqu'elle précède l'enregistrement
  // des dates.
  return lignes.sort((a,b)=>String(a.iso||"").localeCompare(String(b.iso||"")));
}

const GENRE_BADGE = { "dotation":"ok", "matériel":"warn", "téléphone":"info", "réservation":"mut" };

/* Un compte vu par l'administrateur : une vignette dans la grille, et — au clic —
   une fiche qui rassemble tout ce qu'on peut faire concernant cette personne.
   Le serveur reste seul juge : la fiche ne fait que proposer les actions, et
   chacune est réservée aux administrateurs côté serveur. */
function initialesDe(compte){
  return compte.split(/[\s._-]+/).map(p=>p[0]||"").join("").slice(0,2).toUpperCase();
}
/* Une couleur stable par compte : la même personne garde la même vignette. */
function couleurDe(compte){
  let h = 0;
  for(const ch of compte) h = (h*31 + ch.charCodeAt(0)) % 360;
  return h;
}
/* Une seule couleur d'accent : l'avatar est doré pour tout le monde, comme sur la maquette. */
function avatar(compte, taille){
  const t = taille || 54;
  return `<span aria-hidden="true" style="width:${t}px;height:${t}px;flex:none;border-radius:${t>=40?Math.round(t*.26):"50%"}px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font:700 ${Math.round(t*.34)}px/1 Inter,system-ui,sans-serif;letter-spacing:.02em">${esc(initialesDe(compte))}</span>`;
}
function badgeRole(r){
  if(!r) return `<span class="badge mut">SANS COMPTE</span>`;
  if(r.role==="admin") return `<span class="badge info">ADMIN</span>`;
  if(r.role==="chef de groupe") return r.adjoint ? `<span class="badge violet">ADJOINT</span>` : `<span class="badge violet">CHEF DE GROUPE</span>`;
  return `<span class="badge mut">EFFECTIF</span>`;
}

/* Les missions d'un compte : celles qu'il gère, celles où il est équipier, celles
   dont il porte du matériel. */
function missionsDeCompte(compte){
  const missions = new Map();
  const note = (nom, role)=>{
    if(!nom || nom===SANS_MISSION) return;
    const m = missions.get(nom) || new Set();
    m.add(role); missions.set(nom, m);
  };
  S.missions.forEach(m=>{ if(gestionnairesDe(m.name).includes(compte)) note(m.name, "Gestion"); });
  S.equipes.forEach(e=>{ if((e.membres||[]).includes(compte)) note(e.mission, "Effectif · "+e.nom); });
  Object.keys(S.matRes).forEach(id=>(S.matRes[id]||[]).forEach(r=>{
    if(!r.returned && r.by===compte) note(r.mission, "Emprunts");
  }));
  return Array.from(missions.keys()).filter(n=>!missionArchived(n))
    .map(n=>({nom:n, st:statutMission(n), roles:Array.from(missions.get(n))}))
    .sort((a,b)=>a.nom.localeCompare(b.nom));
}

async function basculerEtat(compte, actif){

  await agir("compte.etat", {compte, actif});
}

  if(!confirm("Réinitialiser le mot de passe de « "+compte+" » ?\nUn mot de passe provisoire sera affiché une seule fois, et ses sessions ouvertes se fermeront.")) return;
  await agir("compte.mot_de_passe", {compte});

/* Créer un compte : l'identifiant, et un groupe si on le souhaite. Le serveur tire un mot de passe
   provisoire, que la fiche du nouveau compte affiche une seule fois. */
function ficheNouveauCompte(f){
  const fermer = ()=>setT({compteNouveau:null});
  const valide = /^[\w.@+-]+$/.test((f.identifiant||"").trim());
  const creer = async ()=>{
    const id = (f.identifiant||"").trim();
    if(!valide){ syncNote("Identifiant : lettres, chiffres et . _ - @ + seulement."); return; }
    if(await agir("compte.creer", {compte:id, groupe:f.groupe||""}))
      setT({compteNouveau:null, fiche:{compte:id, rattacher:""}});
  };
  return `
  <div class="modal-back" ${on(e=>{ if(e.target.classList.contains("modal-back")) fermer(); })}>
    <div class="modal" role="dialog" aria-modal="true" style="width:480px">

        <label class="field"><span class="klabel">GROUPE <span style="color:var(--muted);font-weight:400;letter-spacing:0">(facultatif)</span></span>
          <select class="inp" data-k="nc-groupe" ${ong(e=>{ f.groupe = e.target.value; })}>
            <option value=""${f.groupe?"":" selected"}>— aucun groupe</option>

  return `
